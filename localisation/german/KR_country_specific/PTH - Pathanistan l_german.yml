### Ideen

 PTH_development_of_islamic_socialism: "Entwicklung des Islamischen Sozialismus"
 PTH_development_of_islamic_socialism_desc: "Popalzai hat damit begonnen, eine Vielzahl sozialistischer Reformen umzusetzen, die darauf abzielen, die junge Republik zu modernisieren und eine erfolgreiche islamisch-sozialistische Regierung zu etablieren. Dies wird ein schwieriger Prozess sein, und daher könnte es einige Zeit dauern, bis seine Politik Früchte trägt."
 PTH_model_of_islamic_socialism_idea: "Modell des Islamischen Sozialismus"
 PTH_model_of_islamic_socialism_idea_desc: "Popalzais Politik hat Pathanistan von einem feudalen Hinterland zu einem Vorbild für islamische Sozialisten weltweit gemacht!"
 PTH_state_controlled_media: "Staatlich kontrollierte Medien"
 PTH_state_controlled_media_desc: "Naujawan Sarfarosh, die private Publikation von Abdur Rahim Popalzai, ist zur einzigen legalen Nachrichtenquelle in ganz Pathanistan geworden. Dies hat es für Menschen mit abweichenden politischen Ansichten unglaublich schwierig gemacht, ihre Überzeugungen zu verbreiten, wodurch die Regierung ein Monopol auf die Wahrheit erlangt hat."
 PTH_building_the_islamic_progressive_ideal: "Die Verwirklichung des progressiven islamischen Ideals"
 PTH_building_the_islamic_progressive_ideal_desc: "Abdul Ghaffar Khans Vision eines fortschrittlichen Nationalstaates, der auf islamischen Idealen basiert, ist kein einfaches Unterfangen. Trotz der bestehenden Herausforderungen werden Anstrengungen unternommen, um seine Vision zu verwirklichen."
 PTH_beacon_of_islamic_progressivism: "Leuchtturm des Islamischen Progressivismus"
 PTH_beacon_of_islamic_progressivism_desc: "Die Erfolgsgeschichte Pathanistans findet von Zentralasien bis zur Sahara großen Anklang und inspiriert fortschrittliche islamische Philosophen und Politiker gleichermaßen!"
 PTH_surge_of_pathan_nationalism: "Aufschwung des paschtunischen Nationalismus"
 PTH_surge_of_pathan_nationalism_desc: "Trotz der existenziellen Herausforderungen haben die Bemühungen von [FROM.GetLeader] für die junge Republik Pathanistan ein neues Zeitalter des Nationalismus eingeläutet."
 PTH_a_new_national_party_1: "Eine Neue Nationale Partei"
 PTH_a_new_national_party_1_desc: "Obwohl die Vereinigte Muslimische Nationalistische Partei lange Zeit im Schatten der politischen Maschinerien des Marxisten Maulana und von Bacha Khan stand,hat sie nun endlich eine führende Rolle übernommen. [FROM.GetLeader] macht große Fortschritte beim Ausbau der Partei und gewinnt das Vertrauen und die Loyalität vieler Menschen in Pathanistan."
 PTH_a_new_national_party_2: "Dawn of the Party State"
 PTH_a_new_national_party_2_desc: "[FROM.GetLeader]'s ambitious party bureaucracy expansion project has paid off. The Vereinigte Muslimische Nationalistische Partei has become the pre-eminent political force in Pathanistan, credibly challenged by few others."
 PTH_tribal_autonomy: "Stammesautonomien"
 PTH_tribal_autonomy_desc: "In Pathanistan lebt ein buntes Sammelsurium von Stämmen und sogar einige Fürsten, die ihre Herrschaftsgebiete seit den Tagen des British Raj bewahrt haben. Um die Stabilität des Landes zu gewährleisten, hat die Regierung ihnen Autonomie bei der Regelung ihrer inneren Angelegenheiten eingeräumt."
 PTH_loy_waziristan_idea: "Loy Waziristan"
 PTH_loy_waziristan_idea_desc: "Pathanistan steht unter der Herrschaft des Faqir von Ipi, eines Stammesführers aus dem Torikhel-Zweig des Utmanzai-Wazir-Stammes. Während er behauptet, das gesamte Volk der Pathan zu vertreten, sind viele der Ansicht, dass sein Aufstieg weniger ein Sieg für das Volk der Pathan als vielmehr für Waziristan selbst ist."
 PTH_puppet_pathan_jirga: "Marionetten-Pathan-Jirga"
 PTH_puppet_pathan_jirga_desc: "Das formelle Gesetzgebungssystem Pathanistans wird vollständig von der Pathan-Jirga kontrolliert, einem Stammesrat, der in der Praxis dem Fakir von Ipi vollkommen treu ergeben ist."
 PTH_self_sufficiency: "Selbstversorgung"
 PTH_self_sufficiency_desc: "Da die Bevölkerung von Pathanistan über keine nennenswerten eigenen Ressourcen verfügt und kaum Möglichkeiten hat, sich diese von außen zu beschaffen, ist sie im Umgang mit Ressourcen sehr kreativ geworden, was zu einem deutlich gestärkten Gefühl der Selbstversorgung geführt hat."
 PTH_swat_gemstone_trade: "Swat-Edelsteinhandel"
 PTH_swat_gemstone_trade_desc: "In der nördlichen Region von Swat gibt es einen florierenden Edelsteinabbau, der den Großteil der Exporte und der Deviseneinnahmen von Pathanistan ausmacht."
 PTH_pathan_army_1: "Die Armee von Pathanistan"
 PTH_pathan_army_1_desc: "Die Armee von Pathanistan ist zwar zahlenmäßig vielleicht kleiner als die der Nachbarländer, aber dennoch kampfstark und äußerst diszipliniert. Wer versucht, die Souveränität Pathanistans zu verletzen, wird es mit einer Streitmacht zu tun bekommen, die entschlossen ist, ihr Existenzrecht zu verteidigen!"
 PTH_insurrectionary_movement: "Aufstandsbewegung"
 PTH_insurrectionary_movement_desc: "Die Menschen an der Grenze glaubten, dass die Loslösung von Großbritannien und der Zusammenschluss mit Afghanistan sie von der Unterdrückung durch weit entfernte Regierungen befreien würde, doch offenbar haben sie sich getäuscht. Wütende Stammesangehörige, von Indien unterstützte Militante und Deserteure der Armee versammeln sich nun alle unter dem rot-schwarz-weißen Banner des paschtunischen Staates. Sie sind nun bereit, für die Freiheit ihrer Heimat zu kämpfen, lehnen es jedoch ab, dafür das Blut ihrer paschtunischen Brüder vergießen zu müssen."
 PTH_afghan_deserters: "Afghanische Deserteure"
 PTH_afghan_deserters_desc: "Aufgrund von Unzufriedenheit in den Reihen der afghanischen Armee sind mehrere afghanische Soldaten desertiert und kämpfen nun unter unserer Flagge, wo sie weniger streng beaufsichtigt werden (und in manchen Fällen besser bezahlt werden)."
 PTH_neither_afghan_nor_indian: "Weder Afghanisch noch Indisch"
 PTH_neither_afghan_nor_indian_desc: "Da Pathanistan international nicht anerkannt wird und von beiden Nachbarstaaten lediglich als von Rebellen besetzte Provinz betrachtet wird, ist der Handel mit der Außenwelt für das Land praktisch unmöglich. Auch wenn sie mit denjenigen im Konflikt stehen, die Anspruch auf ihr Land erheben, muss vielleicht mit der Zeit ein Kompromiss mit mindestens einem von ihnen gefunden werden, um sicherzustellen, dass die Herrschaft der Pathanen über ihre Heimat in irgendeiner Form erhalten bleibt."
 PTH_confused_national_ambitions: "Verwirrte Nationale Ambitionen"
 PTH_confused_national_ambitions_desc: "Die Idee eines unabhängigen paschtunischen Staates wird von denjenigen, die dafür kämpfen, eher als ein Thema betrachtet, das ihnen aufgezwungen wurde, als als etwas, das sie sich aktiv gewünscht hätten. Die meisten sehen sich untrennbar mit ihren paschtunischen Brüdern jenseits des Khyber-Passes verbunden, doch die Tyrannei der Regierung hat sie erneut gewaltsam voneinander getrennt. Andere sind der Ansicht, dass die Integration in ein vielschichtiges Indien die Sicherheit der Region gewährleisten würde, obwohl es vielen in dieser Gruppe schwerfällt, sich vorzustellen, dass eine indische Regierung einem Abkommen dieser Art zustimmen und es tatsächlich einhalten würde. Vielleicht wird man sich mit der Zeit endlich auf eine Position einigen, oder vielleicht wird eine starke Kraft auftauchen, die die Angelegenheit für sie erzwingt..."

 PTH_blockade_tt: "§tSolange unser einziger verlässlicher Handelsweg über Land verläuft, sind wir einer Blockade sowohl seitens Indiens als auch seitens Afghanistans schutzlos ausgeliefert!§!"

 PTH_haji_sahab: "Haji Sahab"

