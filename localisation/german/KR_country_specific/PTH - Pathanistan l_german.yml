### Charaktere ###

 PTH_abdur_rahim_popalzai: "Abdur Rahim Popalzai"
 PTH_abdur_rahim_popalzai_desc_body: "Popalzai, der wohl zu den idealistischsten Persönlichkeiten der internationalen sozialistischen Gemeinschaft zählt, ist möglicherweise der am besten geeignete Mann, um den Sozialismus in die Bergregionen des paschtunischen Volkes zu tragen. Als Sohn eines Imams wurde Popalzai während der britischen Kolonialherrschaft über die Nordwestgrenzprovinz zu einem glühenden Antiimperialisten und erließ mehrere Fatwas zur Unterstützung der Bauernunruhen gegen den britischen Kolonialismus.\n\nSpäter erließ er während des indischen Bürgerkriegs Fatwas zur Unterstützung seiner indischen sozialistischen Mitstreiter in Kalkutta – ein Engagement, das ihm beinahe die Verhaftung eingebracht hätte, wäre da nicht die Intervention und Besetzung der NWFP durch Afghanistan gewesen, die bald als Region \"Pashtunistan\" bekannt werden sollte. Trotz seiner marxistischen Überzeugungen war Popalzai ein entschiedener Befürworter von Amanullahs Reformagenda und sollte in den 1920er Jahren zu einem der wichtigsten Organisatoren der Unterstützung für den König in Paschtunistan werden.\n\nIn den 1930er Jahren richtete er seinen Fokus neu aus und agitierte gegen die Fürstenstaaten von Paschtunistan. In dieser Zeit erließ er zahlreiche Fatwas zur Unterstützung der Bergleute in Swat und rief diese dazu auf, sich gegen die elenden Bedingungen zu organisieren, denen sie unter den Minenbesitzern ausgesetzt waren. Nach dem Tod seines Vaters erbte er dessen Amt als Imam der Qasim-Ali-Khan-Moschee in Peshawar, trotz heftigen Widerstands seitens konservativer Kreise. Obwohl er durch seine anhaltende Doppelrolle als linker Politiker und Imam für Unmut sorgte, gründete Popalzai die Sozialistische Frontpartei, gab eine Zeitung namens Naujawan Sarfarosh heraus und wurde zum vielleicht mächtigsten Sozialisten nicht nur in Paschtunistan, sondern in ganz Afghanistan. \n\nAls Mann, der fest davon überzeugt ist, dass die Lehren des Islam den politischen Bestrebungen der sozialistischen Emanzipation zugeneigt sind, ist seine Sichtweise auf den Sozialismus fest im Islam verwurzelt. Popalzai verurteilt die imperialistische Instrumentalisierung des Islam und dient keinem König, sondern allein den Lehren Allahs und seiner Mission, die Kolonialisierung der muslimischen Völker zu beenden."
 PTH_abdur_rahim_popalzai_leader_desc: "§YGeboren:§! §L1890 in Peshawar, Provinz Punjab, Britisch-Indien§!\n§YHintergrund:§! §L$PTH_abdur_rahim_popalzai_desc_body$§!"
 PTH_abdur_rahim_popalzai_army_chief_desc: "§YGeboren:§! §L1890 in Peshawar, Provinz Punjab, Britisch-Indien§!\n§YZugehörigkeit:§! §SPaschtunistan§!\n§YHintergrund:§! §L$PTH_abdur_rahim_popalzai_desc_body$§!"
 PTH_abdul_ghaffar_khan: "Abdul Ghaffar Khan"
 PTH_abdul_ghaffar_khan_leader_desc: "§YGeboren:§! §L6. Februar 1890 in Ultmazai, Provinz Punjab, Britisch-Indien§!\n§YHintergrund:§! §LGhaffar Khan, auch bekannt als  \"Bacha Khan\", der König der Khans, genießt nicht nur in der Umgebung von Peshawar, sondern auch in Afghanistan und sogar auf dem indischen Subkontinent hohes Ansehen. Als Sohn einer muslimischen Adelsfamilie wurde er von britischen Missionaren unterrichtet und erhielt in seinem letzten Schuljahr ein lukratives Militärangebot, das er jedoch aus Prinzip ablehnte, da er nichts mit dem Dienst für das britische Raj zu tun haben wollte. Wie Mohandas Gandhi, ein späterer enger Verbündeter von Bacha Khan, gelangte er bald zu der Überzeugung, dass Freiheit nur durch Gewaltlosigkeit erreicht werden könne. In dieser Zeit setzte er sich mit ganzer Kraft für die Eröffnung von Schulen für arme und analphabetische paschtunische Kinder ein und gründete die Anjuman-e-Islah-e Afghania, um dieses Engagement besser zu koordinieren.\n\nWie das Leben vieler anderer sollte auch seines bald durch den indischen Unabhängigkeitskrieg dramatisch verändert werden. Ghaffar Khan verurteilte die Gewalt und das brüderliche Blutvergießen und hielt weiterhin an seinem gewaltfreien Weg zur Freiheit fest; dennoch musste er miterleben, wie die afghanische Armee in Peshawar einmarschierte und anschließend die gesamte Grenzregion von den Briten annektierte. Als klar wurde, dass Afghanistan Schwierigkeiten haben würde, das spätere \"Paschtunistan\" allein zu regieren, trat Ghaffar Khan als einer der einflussreichsten Politiker der Region in Aktion und baute gemeinsam mit seinem Bruder Abdul Jabbar Khan eine effektive lokale Regierung auf. Seine Führungsrolle in Peshawar und de facto in weiten Teilen Paschtunistans machte ihn dadurch zum wichtigsten Machtvermittler der Region.\n\nAnstelle der rosigen Zeiten, die sich viele von der Unabhängigkeit von Großbritannien erhofft hatten, waren die letzten Jahre nichts als Chaos, und Ghaffar Khan ist nun der Führer einer Nation, die dringend Frieden und Harmonie braucht. Er bekennt sich zu den Prinzipien der Demokratie und zur Förderung der paschtunischen Bauernschaft, und sein leidenschaftlicher Pazifismus verspricht eine äußerst friedliche Zukunft für alle Menschen innerhalb der Grenzen, über die er herrscht.§!"
 PTH_aurangzeb_khan_gandapur: "Aurangzeb Khan Gandapur"
 PTH_aurangzeb_khan_gandapur_leader_desc: "§YGeboren:§! §L1899 in Kulachi, Provinz Punjab, Britisch-Indien§!\n§YHintergrund:§! §LStark beeinflusst vom Bildungsaktivisten und Politiker Sir Abdul Qayyam Khan Lodi schaffte es Aurangzeb, seine Schulzeit zu absolvieren und an der Aligarh Muslim University zu studieren, wo er sein Jurastudium abschloss und anschließend nach Peshawar zurückkehrte. Seine Tätigkeit als Anwalt wurde jedoch schon kurz nach ihrem Beginn unterbrochen, nachdem die afghanische Armee während des indischen Bürgerkriegs die Macht übernommen hatte. Nachdem er sich eine Zeit lang aus der Politik zurückgezogen hatte, schloss er sich später Lodis „Vereinigter Muslimischer Nationalistischer Partei“ als Alternative zu Ghaffar Khans Gesellschaft für die Reformation der Afghanen an. Nach Lodis Rückzug aus der Politik und seinem Tod galt Aurangzeb als sein natürlicher Nachfolger und steht seitdem an der Spitze der Partei.\n\nAls nuniger Führer eines unabhängigen Pathanistans muss Aurangzeb die fest verwurzelten progressiven Kräfte überwinden, die die demokratischen Systeme in Peshawar dominierten, und einen Weg in die Zukunft für sich selbst, seine Partei und sein Land ebnen. Die Kaufmannsschicht hat bereits begonnen, ihm gegenüber aufgeschlossener zu werden, und seine Annäherungsversuche an die Stämme und Fürstenstaaten haben für den aufstrebenden Politiker vielversprechende Ergebnisse gebracht.§!"
 PTH_aurangzeb_khan_gandapur_sic_desc: "§YGeboren:§! §L1899 in Kulachi, Provinz Punjab, Britisch-Indien§!\n§YHintergrund:§! §LStark beeinflusst vom Bildungsaktivisten und Politiker Sir Abdul Qayyam Khan Lodi schaffte es Aurangzeb, seine Schulausbildung abzuschließen und an der Aligarh Muslim University zu studieren, wo er sein Jurastudium abschloss und anschließend nach Peshawar zurückkehrte. Seine Tätigkeit als Anwalt wurde jedoch schon kurz nach ihrem Beginn unterbrochen, nachdem die afghanische Armee während des indischen Bürgerkriegs die Macht übernommen hatte. Nachdem er sich eine Zeit lang aus der Politik zurückgezogen hatte, schloss er sich später Lodis Vereinigte Muslimische Nationalistische Partei als Alternative zu Ghaffar Khans Gesellschaft zur Reformation der Afghanen an. Nach Lodis Rückzug galt Aurangzeb als sein natürlicher Nachfolger und steht seitdem an der Spitze der Partei.§!"
 PTH_mirzali_khan_wazir: "Mirzali Khan Wazir"
 PTH_mirzali_khan_wazir_desc_body: "Mirzali Khan Wazir, der vor allem als \"FaKir von Ipi\" bekannt ist, widmete sein Leben nicht nur dem Propheten, sondern auch seiner Heimat Waziristan. Er gehörte einem Unterstamm der Utmanzai Wazir an, der als Madikhel Torikhel bekannt ist. Er wuchs in einer tiefgläubigen Familie auf und verbrachte seine Kindheit damit, sich mit dem Koran auseinanderzusetzen; später wurde er Imam in seiner Heimatstadt.\n\nWährend des Einmarsches der afghanischen Armee im Zuge des indischen Bürgerkriegs führte Mirzali eine Gruppe von Kriegern gegen die örtlichen britisch-indischen Garnisonen an und trug maßgeblich dazu bei, dass Amanullahs Vertreibung der Briten reibungslos verlief. Seine Bemühungen und seine anschließende unerschütterliche Unterstützung brachten ihm das Lob des afghanischen Königs ein, und so wurde er zu Amanullahs zurückhaltendem und unabhängigem (aber dennoch loyalem) oberstem militärischen Vertreter in Paschtunistan."
 PTH_mirzali_khan_wazir_leader_desc: "§YGeboren:§! §L1897 in Kirta Khajuri, Provinz Punjab, Britisch-Indien§!\n§YHintergrund:§! §L$PTH_mirzali_khan_wazir_desc_body$\n\nDoch das Schicksal ist eine seltsame Sache. Mirzalis ehrgeiziges und erfolgreiches Streben nach Macht hatte großen Einfluss auf die Entscheidung seines Gönners, ihn als Führer eines unabhängigen Pathanistans zu etablieren. Fromm, rebellisch, konservativ und gerissen – die Zukunft Pathanistans unter dem Faqir von Ipi wird äußerst reaktionär und sehr militaristisch sein.§!"
 PTH_mirzali_khan_wazir_high_command_desc: "§YGeboren:§! §L1897 in Kirta Khajuri, Provinz Punjab, Britisch-Indien§!\n§YZugehörigkeit:§! §fAmanite§!\n§YHintergrund:§! §L$PTH_mirzali_khan_wazir_desc_body$§!"

