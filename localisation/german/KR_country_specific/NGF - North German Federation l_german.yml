### Characters
NGF_minna_fasshauer: "Minna Faßhauer"
NGF_minna_fasshauer_leader_desc: "§YGeboren:§! §L10. Oktober 1875 in Bleckendorf, Provinz Sachsen, Königreich Preußen, Deutsches Reich§!\n§YHintergrund:§! §LAls Minna Nikolai in einer bescheidenen Arbeiterfamilie geboren, starb ihr Vater, als sie erst drei Jahre alt war, und sie war schon als Kind gezwungen, in Teilzeit zu arbeiten – eine prägende Erfahrung, die ihr half, die \"Ursachen des weit verbreiteten Elends\" zu erkennen und sich für die Gleichberechtigung der Frauen einzusetzen. Als Erwachsene brachte sie sich zudem selbst das Lesen und Schreiben bei. Dabei stieß sie auf sozialistische Publikationen und lernte auch ihren Ehemann, Johannes Georg Faßhauer, kennen. Trotz ihrer bescheidenen Herkunft spielte sie eine wichtige Rolle im lokalen Kampf um die politische Teilhabe von Frauen – und brachte dieses Anliegen auf nationaler Ebene ein, nachdem sie 1903 der SPD beigetreten war.\n\nWährend des Ersten Weltkriegs spaltete sich die Partei, und sie verlor das Vertrauen in die \"Burgfrieden\"-Politik der SPD und der Gewerkschaften; stattdessen schloss sie sich der kriegsfeindlichen und sozialistischen Rhetorik von Rosa Luxemburg und Karl Liebknecht an. Sie trat 1916 dem Braunschweiger Spartakusbund bei und beteiligte sich 1917 an Streiks.\n\nNach dem Krieg schloss sie sich der Sozialistischen Partei Deutschlands (SP) an und beteiligte sich aktiv an deren lokalen Aktivitäten – insbesondere in Braunschweig. Sie soll Mitglied der von Karl Schröder angeführten Gruppe \"Rote Kämpfer\" (GRK) gewesen sein, einem wichtigen Bestandteil des aktionistischen linken Flügels der SP. Obwohl sie häufig Ziel von staatlicher Überwachung und Schikanen war, hielt sie dennoch durch und half bei der Neuorganisation der Linken nach dem letzten Krieg. Infolgedessen wurde sie zur Vorsitzenden der provisorischen Regierung berufen, die von den sozialistischen Besatzungsmächten in der Region gebildet worden war.§!"

NGF_gustav_noske: "Gustav Noske"
NGF_gustav_noske_leader_desc: "§YGeboren:§! §L9. Juli 1868 in Brandenburg an der Havel, Provinz Brandenburg, Königreich Preußen, Norddeutscher Bund§!\n§YHintergrund:§! §LGustav Noske, Sohn eines Webers aus Russisch-Polen, war in seiner Jugend Korbmacher und erlebte als Geselle die harten Lebensbedingungen in Sachsen, Hessen, den Niederlanden und anderen Städten, in denen er arbeitete. Dies veranlasste ihn, Journalist zu werden, und mit 17 Jahren half er bei der Gründung eines örtlichen Korbmacherverbandes, der kurz darauf in die Deutsche Holzarbeitervereinigung aufging. Er war an der Führung eines Streiks in der Fabrik beteiligt, in der er arbeitete, und trat einige Jahre später, im Jahr 1884, der SPD bei. Außerdem wurde er Redakteur der Brandenburger Zeitung und später der Königsberger Volkstribüne.\n\nSeine Arbeit verschaffte ihm eine Anhängerschaft, und 1906 wurde er im Alter von 37 Jahren als Abgeordneter des Wahlkreises Chemnitz in den Reichstag gewählt. Als Experte für Kolonial- und Militärangelegenheiten (trotz seiner fehlenden militärischen Erfahrung) kam es zu Spannungen aufgrund seiner stillschweigenden Billigung der deutschen Kolonial- und Verteidigungspolitik. Dies mag ihm jedoch zum Aufstieg verholfen haben, als seine Gegenargumente gegen die Angriffe von Kriegsminister Karl von Einem auf die SPD ihm Aufmerksamkeit einbrachten (und Kritik seitens des linken Flügels). Da er innerhalb der SPD auf der rechten Seite saß, nahm sein Einfluss in der Partei allmählich ab, und er geriet weiterhin mit seinen Parteikollegen aneinander. Das Ende des jüngsten Krieges hat den betagten Noske aus seinem faktischen Exil geholt, und er steht nun an der Spitze einer norddeutschen Regierung.§!"

NGF_heinrich_langwost: "Heinrich Langwost"
NGF_heinrich_langwost_leader_desc: "§YGeboren:§! §L15. April 1874 in Pattensen, Provinz Hannover, Königreich Preußen, Deutsches Reich§!\n§YHintergrund:§! §LAls Sohn eines Wagnermeisters wurde Langwost von Privatlehrern unterrichtet und arbeitete später als Zeitungsredakteur sowie als Angestellter bei einer Wollwasch- und -kämmerei in Hannover. Im Jahr 1903 wurde er zu einer führenden Persönlichkeit der Deutsch-Hannoverschen Partei (DHP), im Volksmund auch als Guelphen bekannt. Er galt als demokratischer als seine Parteikollegen und kandidierte 1912 erstmals für den Reichstag, unterlag jedoch. Außerdem diente er im Ersten Weltkrieg.\n\nNach Kriegsende wurde er 1919 als Unabhängiger in den Reichstag gewählt. 1925 wurde er aus der DHP ausgeschlossen, später jedoch wieder aufgenommen. Später war er auch Mitglied des Hannoveraner Stadtrats. Außerhalb der Politik umfassten seine literarischen Beiträge unter anderem \"Unter gelb-weißer Fahne\" sowie zahlreiche Werke mit guelfischen und germanischen Themen. Langwost gründete und leitete den Großdeutschen Orden \"Heinrich der Löwe\", der sich für die Selbstbestimmung Niedersachsens auf demokratischer und fortschrittlicher Grundlage einsetzte. Da es kaum Alternativen gab, gelang es den Besatzungsbehörden, ihn davon zu überzeugen, die neue Regierung in Norddeutschland zu übernehmen.§!"

NGF_ernst_august_von_braunschweig: "Ernst August von Braunschweig"
NGF_ernst_august_von_braunschweig_leader_desc: "§YGeboren:§! §L17. November 1887 in Penzing, Wien, Erzherzogtum Österreich unter der Enns, Österreich-Ungarn§!\n§YHintergrund:§! §LAls jüngstes Kind des ehemaligen Kronprinzen von Hannover, Ernst August, geriet der jüngere Ernst August in eine komplizierte dynastische Situation. Sein Urgroßvater, König Ernst August, hatte das Königreich Hannover geerbt, da das Salische Gesetz Königin Victoria des Vereinigten Königreichs daran hinderte, doch sein Großvater Georg V. wurde nach dem Österreichisch-Preußischen Krieg abgesetzt, als Preußen das Königreich annektierte. Sein Vater, damals Kronprinz, weigerte sich, auf den Thron zu verzichten, und als der regierende Herzog von Braunschweig starb, verhinderte Reichskanzler Otto von Bismarck erfolgreich seine Thronbesteigung. Braunschweig wurde in den folgenden Jahrzehnten von einer Reihe von Regenten regiert.\n\nIm Jahr 1912 kam Ernst Augusts älterer Bruder bei einem Autounfall ums Leben, und als er seine Familie bei Kaiser Wilhelm II. vertrat, lernte er Prinzessin Victoria Louise kennen und verliebte sich in sie. Sie heirateten 1913 in einer prächtigen Zeremonie, an der zahlreiche europäische Herrscher teilnahmen – das letzte große Treffen vor Ausbruch des Ersten Weltkriegs. Auch sein Vater verzichtete offiziell zugunsten von Ernst August auf seine Ansprüche auf das Herzogtum Braunschweig, wodurch dieser den Thron besteigen konnte.\n\nWährend des Ersten Weltkriegs diente er als Kavalleriekommandant. Danach hielt er sich weitgehend aus der Politik heraus, soll sich jedoch privat mit konservativen und manchmal reaktionären Persönlichkeiten getroffen haben. Als ehemaliger britischer Prinz bemühten er und seine Frau sich um eine Annäherung zwischen Deutschland und dem Vereinigten Königreich, was jedoch vor der britischen Revolution kaum Früchte trug.§!"

