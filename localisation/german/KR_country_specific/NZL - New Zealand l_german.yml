### Events ###
new_zealand_events.10.t: "Ein Ruf nach Frieden?"
new_zealand_events.10.d: "Es ist viele Monate her, dass der Krieg mit den Australiern begann, und sie sind dem Sieg nicht näher gekommen. Dies ist ein Krieg, der nirgendwo hinführen wird, und so wurde der Vorschlag gemacht, dass wir einen weißen Frieden suchen sollten. Unsere Präferenz wäre die Wiederherstellung der Demokratie in [AST.GetNameDef], aber wenn es sein muss, geben wir uns mit Demokratie und Sicherheit hier zu Hause zufrieden."
new_zealand_events.10.a: "Es ist an der Zeit, einen Waffenstillstand zu fordern"
new_zealand_events.10.b: "Nein! Wir werden diesen Krieg fortsetzen, bis er beendet ist!"

new_zealand_events.11.t: "Frieden mit Neuseeland?"
new_zealand_events.11.d: "Ein Friedensgesandter der [From.GetAdjective] Regierung ist eingetroffen und bietet ein Ende der Feindseligkeiten an. Wenn wir sie in Ruhe lassen, werden sie auf ihre Versuche verzichten, unsere Regierung zu stürzen, und dieser Konflikt kann zu einem Ende kommen... ein Konflikt, der, wie es scheint, seit Monaten ins Leere läuft. Das bedeutet jedoch, dass wir alle Bemühungen aufgeben, Neuseeland zurückzuerobern, zumindest vorläufig."
new_zealand_events.11.a: "Ja, lasst uns das jetzt beenden"
new_zealand_events.11.b: "Nein! Wir werden diesen Krieg fortsetzen, bis er beendet ist!"

new_zealand_events.12.t: "Kein Frieden mit [From.GetNameDef]"
new_zealand_events.12.d: "Unsere Gesandten sind von [From.GetNameDef] mit einer eindeutigen Antwort zurückgekehrt: Es wird keinen Frieden geben."
new_zealand_events.12.a: "Nun gut."

new_zealand_events.14.t: "Hilfe von der Entente?"
new_zealand_events.14.d: "Nun, da der Krieg mit [AST.GetNameDef] gekommen ist, müssen wir überlegen, ob es an der Zeit ist, die Entente um Hilfe zu bitten. Wenn wir uns dem Imperium wieder anschließen, bedeutet das, dass wir wieder Teil all ihrer zukünftigen Kriege über den Ozean werden... aber haben wir wirklich eine andere Wahl?"
new_zealand_events.14.a: "Wir brauchen dringend ihre Hilfe!"
new_zealand_events.14.b: "Nein, wir schaffen das schon alleine."

new_zealand_events.15.t: "Neuseeland bittet um Hilfe"
new_zealand_events.15.d: "Unterstützt von den Rebellen der Neuen Garde hat sich Neuseeland von [AST.GetNameDef] getrennt und die Krone um Hilfe gebeten. Sollen wir sie in die Allianz aufnehmen und zu ihrer Verteidigung beitragen, auch wenn das bedeutet, einen Krieg über den Pazifik zu führen?"
new_zealand_events.15.a: "Ja, natürlich werden wir ihnen helfen!"
new_zealand_events.15.b: "Nein, wir können es uns nicht leisten, in einen weiteren Krieg verwickelt zu werden."

new_zealand_events.16.t: "[From.GetNameDefCap] verweigert uns die Hilfe"
new_zealand_events.16.d: "Zu unserer großen Überraschung haben uns Vertreter von [From.GetNameDef] mitgeteilt, dass [Root.GetNameDef] auf sich allein gestellt ist. Sie können sich, wie es scheint, nicht auf einen Krieg über den Pazifik einlassen, auch nicht, um Australien zurückzuerobern."
new_zealand_events.16.a: "So viel zu dieser Idee."

new_zealand_events.20.t: "Ein Generalgouverneur für Neuseeland?"
new_zealand_events.20.d: "Nun, da wir dem Empire wieder beigetreten sind, überlegt die neuseeländische Regierung, ob sie die Ernennung eines Generalgouverneurs beantragen soll - wie es sich für ein ordentliches Mitglied des britischen Empire gehört."
new_zealand_events.20.a: "Cyril Newall, 1st Baron Newall, ist genau der richtige Mann für diese Aufgabe."
new_zealand_events.20.b: "Bernard Freyberg ist ein Mann des Militärs und wird für den Posten gebraucht."
new_zealand_events.20.c: "Nein, wir haben keinen Bedarf an solchem Firlefanz."

new_zealand_events.21.t: "Eine Rückkehr zur Demokratie?"
new_zealand_events.21.d: "Mit dem Ende des Krieges hat sich die Frage an Militärgouverneur Freyberg gewandt, ob die Regierung wieder unter die Kontrolle des neuseeländischen Volkes gestellt werden soll. Einige Mitglieder der Regierung sagen, dass die Krise noch lange nicht vorbei ist, obwohl die meisten zustimmen, dass die Zeit für den Rücktritt des Militärs gekommen ist. Neuseeland ist schließlich eine demokratische Nation und wird eine autoritäre Herrschaft nicht lange akzeptieren."
new_zealand_events.21.a: "Ja, planen Sie sofortige Wahlen ein."
new_zealand_events.21.b: "Nein, das Militär wird die Kontrolle behalten."

new_zealand_events.22.t: "Die ersten freien Wahlen"
new_zealand_events.22.d: "Militärgouverneur Bernard Freyberg hat sich dafür entschieden, freie Wahlen in Neuseeland zuzulassen, die ersten, die die Nation seit einiger Zeit gesehen hat. Die Labour Party scheint am wahrscheinlichsten eine Mehrheit zu erhalten, obwohl die Möglichkeit besteht, dass die antisyndikalistische Stimmung die Nationalist Party an die Macht bringen wird. Es besteht immer noch die Chance, dass die Kampagne der New Zealand Legion, die nationalistische Unterstützung zu schüren, Erfolg hat."
new_zealand_events.22.a: "Die Labour Party gewinnt die Wahl deutlich."
new_zealand_events.22.b: "Die Nationale Partei schafft es, eine Minderheitsregierung zu bilden."
new_zealand_events.22.c: "Die Menschen wenden sich an die Legion, um sie zu beschützen."

