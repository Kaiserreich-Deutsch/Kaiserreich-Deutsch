### Characters ###
PRE_werner_scholem: "Werner Scholem"
PRE_werner_scholem_leader_desc: "§YGeboren:§! §L29. Dezember 1895 in Berlin, Provinz Brandenburg, Königreich Preußen, Deutsches Reich§!\n§YHintergrund:§! §LEr trat 1921 der Sozialistischen Partei (SP) bei und entwickelte sich zu einem zunehmend kompromisslosen Organisator und Redakteur der Roten Fahne. Scholem war erheblichen Schikanen seitens der Regierung ausgesetzt, nicht nur wegen seiner politischen Ansichten, sondern auch aufgrund von Antisemitismus – was ihn zur Zielscheibe verschiedener rechtsextremer Gruppen machte. Dennoch machten die Entschlossenheit von Scholem und anderen SP-Aktivisten sie zu einer beliebten Wahl für die sozialistischen Besatzungsbehörden, um sie an die Spitze einer neuen Regierung in Preußen zu setzen.§!"

PRE_albert_grzesinski: "Albert Grzesinski"
PRE_albert_grzesinski_leader_desc: "§YGeboren:§! §L28. Juli 1879 in Treptow an der Tollense, Großherzogtum Mecklenburg-Schwerin, Deutsches Reich§!\n§YHintergrund:§! §LAls unehelicher Sohn einer Dienstmagd und eines Metzgerlehrlings, der von einem Radmacher aufgezogen wurde, arbeitete Grzesinski als Metalldreher in Berlin. 1897 trat er der Deutschen Metallarbeiter-Gewerkschaft (DMV) bei, einer Gewerkschaft innerhalb des Allgemeinen Deutschen Gewerkschaftsbundes (ADGB). Ein Jahr später trat er der Sozialdemokratischen Partei (SPD) bei und stieg innerhalb weniger Jahre zum hochrangigen Gewerkschaftsfunktionär und Vorsitzenden des örtlichen SPD-Ortsverbands auf.\n\nAls angesehenes Mitglied des rechten Flügels der SPD gewann Grzesinski in verschiedenen gewählten Ämtern zunehmend an politischem Einfluss. Er zeigte besonderes Interesse an den Ressorts für Strafverfolgung und Inneres, war von 1921 bis 1922 als Rechtsreferendar tätig und übernahm verschiedene Aufgaben im Polizeidienst. Außerdem war er 1928 Passagier auf der Graf Zeppelin. Die Besatzungsbehörden wählten ihn zum Leiter der neuen Regierung aus, da sie davon ausgingen, dass er über die notwendigen Verbindungen in Politik, Gewerkschaftsbewegung und Sicherheitsbehörden verfügte, um die Ordnung durchzusetzen.§!"

PRE_otto_hoetzsch: "Otto Hoetzsch"
PRE_otto_hoetzsch_leader_desc: "§YGeboren:§! §L14. Februar 1876 in Leipzig, Kreis Leipzig, Königreich Sachsen, Deutsches Reich§!\n§YHintergrund:§! §LAls Sohn eines Klempners und Enkel eines Hofdirektors studierte Hoetzsch an der Universität Leipzig und der Ludwig-Maximilians-Universität München Geschichte, Kunstgeschichte und Wirtschaftswissenschaften und promovierte 1900 bei Karl Lamprecht. Anschließend wurde er Redakteur der \"Akademischen Aufzeichnungen\" des Verbandes deutscher Studentenvereine und arbeitete zudem als Bibliothekar am Historischen Institut in Leipzig. Er interessierte sich besonders für osteuropäische und russische Geschichte. Als Student war er zudem Mitglied des antisemitischen Deutschen Studentenvereins in Leipzig.\n\nAb 1906 übernahm er Lehraufträge, unter anderem an der Preußischen Kriegsakademie und der Universität Berlin. Kurz vor dem Ersten Weltkrieg leistete er ein Jahr lang Freiwilligendienst in der sächsischen Armee und verbrachte den Krieg in der Auslandspressestelle des stellvertretenden Generalstabs. Nach dem Krieg stieg er weiter in der akademischen Hierarchie auf und stieg zudem in die Politik ein – er trat der Deutschen Vaterlandspartei (DVLP) bei und war Abgeordneter im Reichstag. Als Polyglott (er hatte neben dem Studium weiterer Sprachen die Prüfung zum Militärdolmetscher für Polnisch und Russisch abgelegt), der zuvor von der deutschen Regierung bei Verhandlungen mit Russland herangezogen worden war, und als Gründer der Deutschen Gesellschaft für Osteuropastudien forderte er – obwohl er ein deutscher Nationalist war – eine Annäherung an die östlichen Staaten, sehr zum Spott anderer Mitglieder der extremen Rechten. Dies trug wahrscheinlich dazu bei, dass er sich die höchste Position in der neuen Ordnung sichern konnte.§!"

PRE_eitel_friedrich: "Eitel Friedrich von Preußen"
PRE_eitel_friedrich_leader_desc: "§YGeboren:§! §L7. Juli 1883 im Marmorpalais in Potsdam, Provinz Brandenburg, Königreich Preußen, Deutsches Reich§!\n§YHintergrund:§! §LEitel Friedrich, der zweite Sohn Wilhelms II., wurde im Fürstenhaus in Plön erzogen. Während des Ersten Weltkriegs diente er mit Auszeichnung als Kommandeur des 1. Lebensmittel-Garde-Regiments und später der 1. Gardedivision sowohl an der West- als auch an der Ostfront. Darüber hinaus war der Prinz Großmeister des (protestantischen) Johanniterordens.\n\nSein Leben nach dem Krieg verlief weitaus weniger glücklich. Es hieß, er habe Verbindungen zu verschiedenen rechtsextremen Gruppen gehabt, doch dann kam ein großer Korruptionsskandal ans Licht, der dazu führte, dass er aus allen offiziellen Ämtern verdrängt wurde. Seine Ehe mit Sophie Charlotte von Oldenburg erwies sich als schwierig; Boulevardzeitungen berichteten über die außerehelichen Affären seiner Frau, und mehrere Gerichtsverfahren gegen das Paar führten dazu, dass Liebesbriefe vor Gericht vorgelesen wurden – was von der ausländischen Presse aufgegriffen wurde und ihn zwang, sein Amt als Großmeister zugunsten seines jüngeren Bruders niederzulegen. Zur Lachnummer und zum schwarzen Schaf seiner Familie geworden, zog er sich in den Hintergrund zurück.\n\nDer Zusammenbruch Deutschlands führte dazu, dass die ranghöheren Mitglieder seiner Familie abgesetzt wurden. Da sie nicht in der Lage oder nicht willens waren, diese davon zu überzeugen, eine (untergeordnete) Rolle in der neuen Regierung in Ostdeutschland anzunehmen, haben die Besatzungsbehörden den geächteten und kinderlosen Prinzen davon überzeugt, diese Rolle zu übernehmen – wahrscheinlich als Platzhalter. Diese Entscheidung wurde von vielen seiner Familienmitglieder als Verrat angeprangert, doch er hat sie als notwendiges Übel gerechtfertigt, um den preußischen Thron in seiner Familie zu erhalten.§!"

