### Characters ###
 RHI_georg_kunz: "George Kunz"
 RHI_georg_kunz_leader_desc: "§YGeboren:§! §L1888, in der Pfalz, Königreich Bayern, Deutsches Reich§!\n§YHintergrund:§! §LGeorg Kunz, ein unbekannter pfälzischer Gewerkschaftsführer und Separatist, gründete zusammen mit Franz Josef Heinz um den März 1930 in Speyer die Rheinische Arbeiterpartei. Diese sozialistische Randgruppe erlangte während des Ruhrkampfs eine gewisse Bekanntheit, als der deutsche Geheimdienst ihre Bedrohung übertrieben darstellte, um die allgemeinen Unruhen zu diskreditieren. Tatsächlich zählte sie höchstens einige Tausend Mitglieder – und selbst unter diesen war die Aktivität begrenzt. Als jedoch die sozialistischen Besatzungsmächte versuchten, das Rheinland als unabhängige Republik abzuspalten, und prominentere Gruppen Angebote zur Führung des neuen Staates angewidert ablehnten, wurde Kunz schließlich mit dieser Aufgabe betraut, obwohl einige der Ansicht waren, er sei zu unbeliebt und in seiner Politik möglicherweise zu moderat.§!"

 RHI_josef_smeets: "Josef Smeets"
 RHI_josef_smeets_leader_desc: "§YGeboren:§! §L29. September 1893 in Aachen, Provinz Rhein, Königreich Preußen, Deutsches Reich§!\n§YHintergrund:§! §LFranz Joseph Hubert Smeets war vor dem Ersten Weltkrieg Zahnarztlehrling und diente während des Krieges als Sanitäter beim Roten Kreuz. Er trat in Köln der SPD bei, wechselte jedoch bald zur USPD und wurde dort Ortsparteisekretär. Er wurde Redakteur bei der sozialistisch orientierten Zeitung „Der Ventilator“ und avancierte zum Gesicht der Zeitung, da deren Geldgeber und Autoren anonym bleiben wollten.\n\nNachdem sie nach den jüngsten militärischen Niederlagen bei der USPD in Ungnade gefallen waren, verließen Smeets und seine Freunde die Partei und gründeten den Rheinischen Bund, um für eine autonome Rheinische Republik einzutreten, die als Staat für sozialistische Arbeiter dienen sollte. Da die Kapitulation Deutschlands unmittelbar bevorstand, benannten sie sich in Rheinische Republikanische Volkspartei um und begannen mit der Herausgabe der Zeitschrift  \"Rheinische Republik\" – darin forderten sie ein \"freies Rheinland\", das als völlig unabhängiger Pufferstaat zwischen dem von Preußen dominierten Deutschland und Frankreich dienen sollte. Provokativ erklärte er: \"Wir protestieren dagegen, dass die Einnahmen aus dem Rheinland in Berlin für ein Leben in Luxus verschleudert werden. Wir sind keine Preußen und wollen es auch nicht sein.\"\n\nDiese Haltung stieß bei den meisten Deutschen auf heftige Kritik, weckte jedoch das Interesse der Besatzungsbehörden, die die schwerwiegende Entscheidung getroffen hatten, einen eigenständigen rheinischen Staat zu gründen. Da es kaum andere legitime Optionen gab, wurde Smeets zum Chef der neuen Regierung ernannt.§!"

 RHI_josef_friedrich_matthes: "Josef Friedrich Matthes"
 RHI_josef_friedrich_matthes_leader_desc: "§YGeboren:§! §L10. Februar 1886 in Würzburg, Unterfranken, Königreich Bayern, Deutsches Reich§!\n§YHintergrund:§! §LAls Sohn einer Theatersekretärin besuchte Josef Friedrich Matthes zwei Jahre lang das Gymnasium, schloss die Schule jedoch nicht ab. Er arbeitete als Redakteur für verschiedene lokale liberale Zeitungen und verbrachte zudem ein Jahr im Ausland in der Schweiz, in Frankreich und in Belgien, wo er eine Familie gründete. Er half beim Aufbau fortschrittlicher Jugendvereine in Aschaffenburg und Passau und geriet dabei mit den örtlichen Bürgermeistern aneinander – wobei er damit prahlte, dass seine Arbeit dazu beigetragen habe, einen von ihnen (Bürgermeister Otto Wippermann aus Oberhausen) zum Rücktritt zu zwingen. Außerdem schrieb er während des Ersten Weltkriegs zugunsten einer nationalistischen Kriegspolitik.\n\nEine eher unbedeutende Persönlichkeit in der Region, die durch ihre schriftstellerische Tätigkeit und ihren investigativen Journalismus (unter anderem durch die Aufdeckung einiger Korruptionsskandale) einen gewissen Ruhm bzw. eine gewisse Berühmtheit erlangte – er engagierte sich in der liberalen und der SPD-Politik, passte jedoch aufgrund seiner kämpferischen Art nie lange wirklich zu einer der beiden Richtungen. Als die ausländischen Besatzungsmächte eintrafen, ergriff er die Gelegenheit beim Schopf, um eine \"Rheinische Unabhängigkeitsliga\" zu gründen. Da sich prominentere Politiker im Rheinland weigerten, sich an dem von den ausländischen Besatzern vorangetriebenen Separatistenprojekt zu beteiligen, fiel die Wahl schließlich auf Matthes.§!"

 RHI_hans_adam_dorten: "Hans Adam Dorten"
 RHI_hans_adam_dorten_leader_desc: "§YGeboren:§! §L10. Februar 1880 in Bonn, Provinz Rhein, Königreich Preußen, Deutsches Reich§!\n§YHintergrund:§! §LHans Adam Dorten, Sohn eines wohlhabenden Porzellanfabrikanten, studierte Rechtswissenschaften und schloss sein Studium 1907 an der Universität Leipzig ab. Er arbeitete kurzzeitig bei einer Staatsanwaltschaft und später an einem Landgericht, bevor er 1914 zum Militärdienst einberufen wurde, um im Ersten Weltkrieg zu kämpfen. Er diente im 54. \"Kommando\"-Korps als Unteroffizier und wurde mit dem Eisernen Kreuz ausgezeichnet.\n\nNach dem Krieg heiratete er eine wohlhabende Frau und engagierte sich in der Politik, wobei er eine strikte antisozialistische Haltung einnahm und darüber hinaus nur vage politische Ziele verfolgte. Es scheint, als habe er begonnen, sich mit regionalistischer Politik zu beschäftigen – misstrauisch gegenüber dem \"protestantischen\" Preußen. Als politischer Dilettant ermöglichten ihm sein Reichtum und seine Beziehungen, Kontakte zu verschiedenen lokalen Politikern, darunter Konrad Adenauer, zu pflegen, doch blieb er größtenteils als unbedeutender Anwalt und Jurist am Rande des Geschehens.\n\nDurch die Strafverfolgung von Sozialisten im Ruhrkampf erlangte er kurzzeitig Bekanntheit, wäre jedoch in der Geschichte in Vergessenheit geraten, hätte Deutschland die Kriege nicht verloren. Inmitten von Instabilität und Besatzung gründete er die \"Rheinische Volksunion\", um die Unabhängigkeit von Deutschland anzustreben. Trotz der Vorbehalte einiger ausländischer Behörden wurde ihm sein Wunsch schließlich erfüllt und er wurde zum neuen Führer eines freien Rheinlandes ernannt.§!"

### National Spirits ###
RHI_rhenish_reparations: "Rheinische Reparationen"
RHI_rhenish_reparations_desc: "Als Teil ihrer Nachkriegsforderungen hat die [ROOT.overlord.GetAdjective] Regierung den größten Teil der Industrie im Rheinland beschlagnahmt, um der siegreichen Seite Reparationen zu zahlen. Die meisten arbeitsfähigen Männer werden in den Fabriken erwartet, nur ein kleiner Teil wird für die Polizei und die örtlichen Verteidigungskräfte eingesetzt."

