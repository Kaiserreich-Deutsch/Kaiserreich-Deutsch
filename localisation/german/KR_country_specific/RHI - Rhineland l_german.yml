germany_puppet_events.7.t: "[RHI.GetName] schlägt Freihandelszone vor"
germany_puppet_events.7.d: "Die Regierung von [RHI.GetNameDef] hat sich an uns gewandt und eine Freihandelszone und eine wirtschaftliche Kooperationszone zwischen den drei gleichgesinnten Nationen südlich der Nordsee vorgeschlagen. Dies würde über unsere bereits bestehenden militärischen Verpflichtungen im Rahmen unseres Bündnisses hinausgehen - und allen drei unserer Volkswirtschaften Vorteile bringen, sofern sie angenommen werden."
germany_puppet_events.7.a: "Natürlich."
germany_puppet_events.7.b: "Wir würden lieber nicht."

germany_puppet_events.8.t: "[RHI.GetName] beantragt Neuverhandlung"
germany_puppet_events.8.d: "Die Regierung von [RHI.GetNameDef] hat sich an uns gewandt und um eine Anpassung der derzeitigen harten Reparationszahlungen für ihren Staat gebeten. Sie argumentiert, dass diese Zahlungen die Entwicklung der lokalen Wirtschaft gehemmt und das Land gegenüber ausländischen Bedrohungen hilflos gemacht haben. Die Neuverhandlung würde es dem Land auch ermöglichen, seine Selbstverteidigungskräfte auszubauen. Schließlich argumentieren sie, dass es ungerecht sei, so hohe Reparationszahlungen zu leisten, wo es doch Preußen war, das die Schuld am Weltkriegsgeschehen trug..."
germany_puppet_events.8.a: "Dies erscheint vernünftig."
germany_puppet_events.8.b: "Wir sind anderer Meinung."
