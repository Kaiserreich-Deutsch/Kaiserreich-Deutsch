### Characters ###
 BAY_ernst_toller: "Ernst Toller"
 BAY_ernst_toller_leader_desc: "§YGeboren:§! §L1. Dezember 1893 in Samotschin, Provinz Posen, Königreich Preußen, Deutsches Reich§!\n§YHintergrund:§! §LErnst Toller wurde in eine jüdische Familie geboren, die einen Gemischtwarenladen betrieb. Als Freiwilliger im Ersten Weltkrieg kämpfte er in Verdun und wurde für seine Tapferkeit ausgezeichnet, verlor jedoch zunehmend die Illusionen über den Krieg. Im Jahr 1916 erlitt er eine psychische und physische Krise und wurde schließlich 1917 für dienstuntauglich erklärt, was ihm ermöglichte, an der Ludwig-Maximilians-Universität München Jura und Philosophie zu studieren.\n\nEr schloss sich dem literarischen Kreis um Artur Kutscher an und begann, mit dem Anarchismus zu sympathisieren. Dank seiner Kontakte zu Max Weber gelang es ihm, sich an der Universität Heidelberg einzuschreiben, wo er sich der friedensorientierten Kulturpolitischen Liga der Jugend anschloss. Die Veröffentlichung einer Friedenspetition durch diese Gruppe, in der Sozialismus und ein Ende der Kämpfe gefordert wurden, zog schwere Repressalien nach sich.\n\nDanach wandte sich Toller dem Pazifismus und dem revolutionären Sozialismus zu. Er erwies sich als äußerst produktiver Schriftsteller und Dichter, dessen Werke von Themen wie Revolution und Expressionismus geprägt waren. Er erregte die Aufmerksamkeit ausländischer sozialistischer Geheimdienste, als er 1934 Paris besuchte und später 1935 an einem Schriftstellerkongress in Paris teilnahm. Er leidet unter depressiven Phasen, scheint jedoch durch den Sieg des Sozialismus und den Aufruf, seinem Heimatland beim Wiederaufbau zu dienen, neue Kraft geschöpft zu haben.§!"

 BAY_eugen_bolz: "Eugen Bolz"
 BAY_eugen_bolz_leader_desc: "§YGeboren:§! §L15. Dezember 1881 in Rottenburg, Kreis Schwarzwald, Königreich Württemberg, Deutsches Reich§!\n§YHintergrund:§! §LEugen Bolz, Sohn eines Kolonialwarenhändlers, trat bereits in jungen Jahren der Zentrumspartei bei. Er studierte Rechtswissenschaften und war einige Jahre als Staatsanwalt tätig, bevor er im Ersten Weltkrieg als Leutnant diente.\n\nNach dem Krieg stieg er in die Politik ein, arbeitete sich innerhalb der Zentrumspartei nach oben und bekleidete verschiedene Ämter. Er war der erste Katholik, der Ministerpräsident des überwiegend protestantischen Württembergs wurde. Nach der Niederlage Deutschlands im jüngsten Krieg erklärte er sich widerstrebend bereit, die Führung des Süddeutschen Bundes zu übernehmen.§!"

 BAY_franz_von_epp: "Franz von Epp"
 BAY_franz_von_epp_leader_desc: "§YGeboren:§! §L16. Oktober 1868 in München, Oberbayern, Königreich Bayern§!\n§YHintergrund:§! §LFranz Epp, Sohn eines Malers aus München, besuchte eine Militärakademie und kämpfte von 1900 bis 1901 während des Boxeraufstands in China, bevor er nach Deutsch-Südwestafrika entsandt wurde, wo er an kolonialen Gräueltaten beteiligt war. Während des Ersten Weltkriegs befehligte er das Königlich-Bayerische Infanterie-Leibgarde-Regiment in Frankreich, Serbien, Rumänien und Italien mit Auszeichnung – 1918 wurde er zum Ritter von Epp geschlagen.\n\nAls Mitglied der Bayerischen Volkspartei war er zudem für seine rechtsextreme Politik und seine Verbindungen zur Bewegung \"Die Fronde\" von General Max Bauer bekannt. Außerdem war er aktives Mitglied der Kolonialgesellschaft. In einer ironischen Wendung der Ereignisse wurde Deutschland selbst erobert. Da er kaum eine Alternative sah und vielleicht Berlin die Schuld für die Katastrophe gab, hat er widerwillig eine Führungsrolle im neuen südeuropäischen Regime übernommen.§!"

