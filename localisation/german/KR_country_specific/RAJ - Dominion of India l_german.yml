### Ideen ###
 RAJ_bombay_pact_idea: "Der Bombay-Pakt"
 RAJ_bombay_pact_idea_desc: "Im Zuge der indischen Revolution beschlossen die Fürsten des Südens aus Angst vor dem vollständigen Zusammenbruch der alten Ordnung durch die Flutwelle des Sozialismus, als vereinte Föderation die Unabhängigkeit von Britisch-Indien zu erklären. [HND.GetNameDefCap] weigerte sich jedoch, diese Erklärung anzuerkennen, und setzte ungeachtet dessen seine Versuche fort, den Süden einzunehmen. Diese Überdehnung ermöglichte es den britisch-indischen Truppen, sich im Westen neu zu formieren, wodurch die Befürchtungen vor ihrem Zusammenbruch gemildert wurden und der Krieg schließlich in eine Pattsituation und einen anschließenden unsicheren Waffenstillstand mündete. Trotz der Unabhängigkeitserklärung von [PRF.GetNameDef] wurde beiden Seiten schnell klar, dass sie im Falle einer Wiederaufnahme des Krieges zusammenarbeiten müssten.\n\nWährend in den dazwischenliegenden Jahren die informelle Zusammenarbeit fortgesetzt wurde, führte die zunehmende Militanz der Sozialisten 1933 zur Unterzeichnung eines formellen Verteidigungsbündnisses, das als Bombay-Pakt bekannt wurde. Im Rahmen dieses Bündnisses vereinbarten beide Parteien, die bestehende militärische Zusammenarbeit erheblich auszuweiten, und verpflichteten sich, sich im Falle erneuter sozialistischer Übergriffe gegenseitig Beistand zu leisten.\n\nWichtig ist jedoch, dass keine offizielle Anerkennung der Unabhängigkeit der Föderation vereinbart wurde und auch keine Pläne darüber, wie Indien neu organisiert werden sollte, falls [HND.GetNameDef] eine Niederlage erleiden sollte.\n§RDaher wird allgemein angenommen, dass der Bombay-Pakt nach der Niederlage der Sozialisten in Kalkutta lediglich zu weiteren Konflikten zwischen seinen beiden Unterzeichnern führen wird.§!."
 RAJ_rural_poverty: "Weit verbreitete Armut auf dem Land"
 RAJ_rural_poverty_desc: "Schon vor der Revolution und dem darauf folgenden Bürgerkrieg war Indien ein Land, in dem große Armut herrschte, wobei die überwiegend landwirtschaftlich tätige Bevölkerung deutlich ärmer war als die der anderen Länder unter britischer Herrschaft. In Verbindung mit den Verwüstungen des Bürgerkriegs befindet sich Indien heute im Vergleich zu vielen seiner Zeitgenossen in einem erschreckend rückständigen Zustand."
 RAJ_princely_power: "Macht der Fürsten"
 RAJ_princely_power_desc: "Das Dominion von Indien konnte sich nur dank der Loyalität der Fürsten aus dem Norden an der Macht halten. Sie teilen sich die Macht mit der Regierung, doch es handelt sich dabei um einen schwierigen und veralteten Prozess, der mit großem Aufwand verbunden ist."
 RAJ_indian_expeditionary_force: "Indische Expeditionsstreitkräfte"
 RAJ_indian_expeditionary_force_desc: "Obwohl die Führung der Entente-Allianz nicht in der Lage ist, ihre gesamten Streitkräfte vollständig in den Krieg einzubringen, hat sie eine große Expeditionsstreitmacht aufgestellt, um dem Dominion Indien im wiederaufgeflammten indischen Bürgerkrieg beizustehen."
 RAJ_black_monday: "Auswirkungen des Schwarzen Montags"
 RAJ_black_monday_desc: "Der Zusammenbruch der Berliner Börse hat unsere Wirtschaft nun offiziell getroffen. Dies hat zu einem Rückgang der Exporte in unserer Landwirtschaft und Industrie geführt und die Integrität der Regierung erschüttert."
 RAJ_agricultural_tariffs_idea: "Einführung von Agrarzöllen"
 RAJ_agricultural_tariffs_idea_desc: "Um unsere heimische Landwirtschaft besser zu schützen, wurden pauschale Zölle auf alle importierten Agrarprodukte eingeführt."
 RAJ_improved_wage_standards: "Verbesserte Lohnstandards"
 RAJ_improved_wage_standards_desc: "In dem Bestreben, sowohl die Wirtschaft als auch die politische Lage zu stabilisieren, hat das Dominion Indien das Gesetz über die Lohnzahlung verabschiedet, um Arbeitnehmer vor unlauteren Lohnpraktiken zu schützen."
 RAJ_industrialisation_drive_idea: "Industrialisierungsbestrebungen"
 RAJ_industrialisation_drive_idea_desc: "In dem Bestreben, unsere industrielle Basis auf einen modernen Stand zu bringen, hat die Regierung angekündigt, der Industrialisierung besondere Aufmerksamkeit zu widmen. Dies dürfte jedoch dazu führen, dass sich die Wählerbasis der Indischen Liberalen Partei und der Allindischen Selbstverwaltungspartei allmählich verstärkt."

 RAJ_karachi_strike: "Streik in Karachi"
 RAJ_karachi_strike_desc: "Als Reaktion auf ausstehende Löhne und drohende Entlassungen haben die Hafenarbeiter im wichtigsten Hafen des Dominions, Karachi, groß angelegte Streiks begonnen. In der Hoffnung, die Regierung zu Zugeständnissen beim Arbeitsschutz zu zwingen, ist der Handel über den Hafen fast vollständig zum Erliegen gekommen, sodass Fischereihäfen wie Damb hastig umfunktioniert wurden, um die dringendsten Lieferungen abzuwickeln."

 RAJ_increased_mobilisation_efforts: "Verstärkte Mobilisierungsbemühungen"
 RAJ_increased_mobilisation_efforts_desc: "Obwohl es sich um die kleinste der rivalisierenden Regierungen handelt, die infolge des Indischen Bürgerkriegs entstanden sind, ist die Armee des Dominions nach wie vor in der Lage, mit den Armeen ihrer Feinde mitzuhalten, und sie hat groß angelegte Feldzüge gestartet, um sicherzustellen, dass sie auch weiterhin genauso groß bleiben kann wie diese."
 RAJ_expanded_gurkha_rifles: "Ausbau der Gurkha-Schützenregimenter"
 RAJ_expanded_gurkha_rifles_desc: "In die Gurkha-Schützenregimenter werden derzeit erhebliche Mittel investiert, um noch elitärere und professionellere Einheiten für die Armee aufzubauen."
 RAJ_empowered_young_guard: "Gestärkte Junge Garde"
 RAJ_empowered_young_guard_desc: "Mit dem Ausscheiden des ehemaligen Oberbefehlshabers Philip Walhouse Chetwode hat die reformorientierte Junge Garde der Armee des Dominions die Diskussionen über die Doktrin dominiert. Sie setzt sich für eine auf Mobilität ausgerichtete Armee ein und stützt sich dabei auf die Unterstützung ihrer Verbündeten in der Entente, um sich einen Vorteil gegenüber ihren Rivalen zu verschaffen."
 RAJ_nascent_motor_industry: "Aufstrebende Automobilindustrie"
 RAJ_nascent_motor_industry_desc: "In Indien gab es schon immer keine eigene Automobilindustrie, zumal die verheerenden Auswirkungen des Bürgerkriegs jegliche ausländischen Investitionen in diesen Sektor abgeschreckt hatten. Nun jedoch haben Automobilhersteller dank direkter Militärverträge mit den Streitkräften des Dominions begonnen, Niederlassungen in Lahore zu errichten, um den Bedarf des Dominions an Militärfahrzeugen zu decken."
 RAJ_immovable_objects_idea: "Unbewegliche Objekte"
 RAJ_immovable_objects_idea_desc: "Im Rahmen ihrer Bemühungen, eine vollwertige Panzermacht aufzubauen, hat sich die Armee des Dominion dafür entschieden, den Schwerpunkt auf schwer gepanzerte Fahrzeuge zu legen, da sie davon überzeugt ist, dass diese schwerfälligen Kolosse ihr den nötigen Vorteil verschaffen werden."
 RAJ_immortal_bulwarks_idea: "Unsterbliche Bollwerke"
 RAJ_immortal_bulwarks_idea_desc: "$RAJ_immovable_objects_idea_desc$"
 RAJ_unstoppable_forces_idea: "Unaufhaltsame Kräfte"
 RAJ_unstoppable_forces_idea_desc: "Im Rahmen ihrer Bemühungen, eine vollwertige Panzerstreitmacht aufzubauen, hat sich die Armee des Dominion dafür entschieden, den Schwerpunkt auf leichte und schnelle Panzer zu legen, da sie davon ausgeht, dass diese Geschwindigkeit ihnen einen entscheidenden Vorteil gegenüber schwerer gepanzerten Fahrzeugen verschafft."
 RAJ_steel_dragoons_idea: "Stahl-Dragoner"
 RAJ_steel_dragoons_idea_desc: "$RAJ_unstoppable_forces_idea_desc$"
 RAJ_the_pragmatic_approach: "Der Pragmatische Ansatz"
 RAJ_the_pragmatic_approach_desc: "Anstatt der Jungen Garde Platz zu machen, hat der Generalgouverneur sein Vertrauen in die Führung der Armee des Dominions durch Oberbefehlshaber Philip Walhouse Chetwode bekräftigt. Es besteht die Hoffnung, dass dieselben Taktiken, die vor so vielen Jahren die vollständige Zerstörung des Raj verhindert haben, nun dessen Nachfolger dazu führen werden, sich aus der Asche zu erheben."
 RAJ_indian_martial_culture: "Indische Kampfkunstkultur"
 RAJ_indian_martial_culture_desc: "In dem Bestreben, an die Erfolge der Gurkhas in der Indischen Armee anzuknüpfen, haben die Streitkräfte des Dominions eine groß angelegte Initiative gestartet, um die Brigaden der sogenannten \"Kriegerischen Völker\" weiter zu reformieren und sie hoffentlich auf das gleiche Niveau wie die Gurkhas zu bringen."
 RAJ_streamlined_small_arms_production_idea: "Optimierte Produktion von Kleinwaffen"
 RAJ_streamlined_small_arms_production_idea_desc: "Der Verlust von Ishapore während der indischen Revolution war ein schwerer Schlag für die britischen Streitkräfte, und in der Zwischenkriegszeit wurden zahlreiche kleinere Anlagen als Ersatz für das verlorene Werk errichtet. Diese notdürftig zusammengeschusterten Fabriken galten schon lange als ineffizient und baufällig, weshalb sie im Rahmen von Reformbemühungen verstaatlicht wurden, um die Produktion von Handfeuerwaffen zu rationalisieren und zu optimieren."
 RAJ_the_chetwode_motto_idea: "Das Chetwode-Motto"
 RAJ_the_chetwode_motto_idea_desc: "$RAJ_the_pragmatic_approach_desc$"
 RAJ_the_most_feared_army_of_the_entente_idea: "Die Gefürchtetste Armee der Entente"
 RAJ_the_most_feared_army_of_the_entente_idea_desc: "$RAJ_the_pragmatic_approach_desc$"

 RAJ_subsidised_domestic_air_industry_idea: "Subventionierte Heimische Luftfahrtindustrie"
 RAJ_subsidised_domestic_air_industry_idea_desc: "Im Rahmen der Bemühungen, die Luftwaffe des Dominions zu einer bedeutenden und einflussreichen Streitkraft auszubauen, wurden den Flugzeugherstellern im gesamten Commonwealth erhebliche Subventionen gewährt, damit diese Fabriken in Indien errichten können, in der Hoffnung, dass sich so eine einheimische Luftfahrtindustrie angemessen entwickeln kann."
 RAJ_deconceptualise_their_logistics_idea: "Ihre Logistik dekonzeptualisieren"
 RAJ_deconceptualise_their_logistics_idea_desc: "Da die meisten ihrer Rivalen in Asien nicht in der Lage sind, sich gegen Angriffe von Bombern zu verteidigen, hat die Luftwaffe des Dominions ihre Bombardierungsfähigkeiten weiter verfeinert und ausgebaut, um die Versorgungslinien des Feindes zu unterbrechen und dessen logistische Netzwerke zu zerstören."
 RAJ_improved_interservice_coordination: "Verbesserte Dienststellenübergreifende Koordination"
 RAJ_improved_interservice_coordination_desc: "Im Rahmen des Ausbaus seiner Luftstreitkräfte hat das Dominion spezielle Koordinatoren eingesetzt, die als Bindeglied zwischen der Armee und der Luftwaffe fungieren sollen, um Luftangriffe besser mit den Angriffen der Bodentruppen abzustimmen."
 RAJ_domination_of_the_skies: "Herrschaft über die Lüfte"
 RAJ_domination_of_the_skies_desc: "Die Luftwaffe des Dominion hat die entscheidende Rolle der Lufthoheit in der modernen Kriegsführung erkannt und umfangreiche Ausbildungsprogramme ins Leben gerufen, um hoffentlich die fähigsten Kampfpiloten hervorzubringen, die sie einsetzen kann, sowie technische Projekte, um die Kampffähigkeiten ihrer Flugzeuge weiter zu verbessern."
 RAJ_continental_airforce_idea: "Die Indische Kontinentale Luftwaffe"
 RAJ_continental_airforce_idea_desc: "Die umfangreichen Investitionen in die Luftwaffe des Dominion haben endlich Früchte getragen, sodass diese nun zu den besten der Welt zählt. Nur wenige können damit rechnen, sich ihr zu stellen und noch aufrecht davonzukommen, geschweige denn als Sieger hervorzugehen."

 RAJ_navy_entente_trade: "Die Lebensader der Entente"
 RAJ_navy_entente_trade_desc: "Die Hilfe ihrer Verbündeten in Übersee ist für das Dominion seit über einem Jahrzehnt von entscheidender Bedeutung, und angesichts der sich abzeichnenden Unsicherheit wurden erhebliche Anstrengungen unternommen, diese Hilfe auszuweiten, um sicherzustellen, dass das Dominion nicht in die Hände seiner Gegner fällt."
 RAJ_navy_marines: "Indische Spezialboot-Einheit"
 RAJ_navy_marines_desc: "Die Marineinfanterie gilt seit langem als einer der wichtigsten Bestandteile einer Armee und erweist sich insbesondere in weiten Teilen des Geländes in Indien und den umliegenden Ländern als äußerst nützlich. Zu diesem Zweck hat das Dominion die Aufstellung einer eigenständigen, ständigen Marineinfanterieeinheit angeordnet, in der Hoffnung, dass diese Spezialeinheiten jeden Feind, der ihnen entgegengeworfen wird, besiegen werden."
 RAJ_navy_intense_docks: "Beschleunigung des Flottenausbaus"
 RAJ_navy_intense_docks_desc: "Da das Dominion dringend neue Schiffe benötigt, um den Anforderungen der Marine gerecht zu werden, wurden als vorübergehende Maßnahme erhebliche Ressourcen von den regulären Produktionslinien abgezogen, um stattdessen Teile für neue Schiffe herzustellen."
 RAJ_navy_battleships: "Die Indische Armada"
 RAJ_navy_battleships_desc: "Im Rahmen seiner Bemühungen, die Vorherrschaft im gesamten Indischen Ozean zu behaupten, hat sich das Dominion dafür entschieden, den Schwerpunkt auf Schlachtschiffe und andere große Schiffe zu legen, um seine Gegner mit überlegener Feuerkraft zu überwältigen."
 RAJ_navy_carriers: "Luftherrschaft über die Meere"
 RAJ_navy_carriers_desc: "Im Rahmen seiner Bemühungen, die Vorherrschaft im gesamten Indischen Ozean zu behaupten, hat sich das Dominion dafür entschieden, den Schwerpunkt auf Flugzeugträger zu legen, da es davon ausgeht, dass die Dominanz der Marinefliegerei für die Sicherung der maritimen Kontrolle von entscheidender Bedeutung sein wird."

 RAJ_unitedindia: "Indien wiederhergestellt!"
 RAJ_unitedindia_desc: "Nach Jahren und Jahren voller Tod und Zerstörung sehen die Menschen in Indien endlich Licht am Ende des Tunnels. Auf den Straßen, die einst mit Trümmern übersät waren, herrscht nun reges Treiben, auf den mit Kratern übersäten Feldern sprießen nun wieder Pflanzen, und in den Fabriken, die einst kaum mehr als Schrott waren, laufen die Produktionslinien nun wieder auf Hochtouren."

 RAJ_the_new_dawn: "Der neue Aufbruch"
 RAJ_the_new_dawn_desc: "Trotz der großen Verwüstungen, die Indien erlitten hat, hat sich die Bevölkerung geweigert, aufzugeben und in ihrer Not zu versinken. Es wurden große Anstrengungen unternommen, um nicht nur das Verlorene wiederherzustellen, sondern auf den Trümmern aufzubauen und so einen neuen Aufbruch für die indische Nation einzuleiten."

## Liberal Federation Ideas
 RAJ_growing_middle_class: "Wachsende Mittelschicht"
 RAJ_growing_middle_class_desc: "Dank unseres Wirtschaftsprogramms ist die Mittelschicht in Indien langsam, aber sicher gewachsen."
 RAJ_flourishing_middle_class: "Florierende Mittelschicht"
 RAJ_flourishing_middle_class_desc: "Dank unseres Wirtschaftsprogramms hat die Mittelschicht in Indien einen enormen Aufschwung erlebt!"
 RAJ_uniform_civil_code_idea: "Einheitliches Bürgerliches Gesetzbuch"
 RAJ_uniform_civil_code_idea_desc: "In ganz Indien wurde ein einheitliches Bürgerliches Gesetzbuch eingeführt, das sicherstellt, dass für Inder aller Gesellschaftsschichten dieselben Gesetze gelten."
 RAJ_secularised_administration: "Säkularisierte Verwaltung"
 RAJ_secularised_administration_desc: "Die Religion wurde vollständig aus dem staatlichen Geschehen ausgeklammert, wodurch der Pluralismus der vorherigen Regierung der Vergangenheit angehört."
 RAJ_illiberal_democracy: "Illiberale Demokratie"
 RAJ_illiberal_democracy_desc: "Obwohl es sich nominell um eine Demokratie handelt, gibt es kein allgemeines Wahlrecht, und die Aussichten auf dessen Ausweitung sind sehr, sehr düster."
 RAJ_torch_of_liberalism: "Fackel des Liberalismus"
 RAJ_torch_of_liberalism_desc: "Das Dominion ist das Leuchtfeuer des Liberalismus in ganz Asien und dient anderen demokratischen Nationen und Bewegungen auf dem gesamten Kontinent als Vorbild!"

## Ideen zur Selbstverwaltung in ganz Indien
 RAJ_social_justice_idea: "Auf dem Weg zu sozialer Gerechtigkeit"
 RAJ_social_justice_idea_desc: "Die Regierung hat ein Programm zur sozialen Gerechtigkeit verabschiedet, das sicherstellt, dass Fairness und die Förderung der Bevölkerung bei der Führung des Landes oberste Priorität haben."
 RAJ_princely_support: "Unterstützung durch die Fürsten"
 RAJ_princely_support_desc: "Die Fürsten unterstützen unsere Regierung mit Begeisterung, denn unsere Politik kommt ihnen in hohem Maße zugute."
 RAJ_female_suffrage: "Gewährung des Frauenwahlrechts"
 RAJ_female_suffrage_desc: "Den Frauen des Dominion wurde das Wahlrecht gewährt; sie haben das Stimmrecht erhalten und wurden offiziell dazu eingeladen, sich am politischen Leben zu beteiligen. Zwar ist die überwiegende Mehrheit der Frauen aufgrund der geltenden Gesetzgebung zum Wahlrecht für alle Inder de facto nach wie vor nicht wahlberechtigt, doch diejenigen, die aus wohlhabenden Familien stammen oder Land besitzen, erhalten nun eine faire Chance, sich Gehör zu verschaffen."
 RAJ_confederalised_provinces: "Das Konföderale Dominion"
 RAJ_confederalised_provinces_desc: "Den Provinzen und Bundesstaaten Indiens wurde mehr Autonomie eingeräumt, um sicherzustellen, dass muslimische Provinzen von einer möglichen hinduistischen Bundesregierung möglichst wenig beeinträchtigt werden und umgekehrt."
 RAJ_mixed_economy: "Eine Gemischte Wirtschaft"
 RAJ_mixed_economy_desc: "Da die westliche Wirtschaftsweise, die sich kaum auf das Leben in Indien übertragen lässt, abgelehnt wurde, wurde eine gemischte Wirtschaft eingeführt, um landesweit mehr Gerechtigkeit zu gewährleisten."
 RAJ_the_dominion_reborn: "Die Wiedergeburt des Dominion"
 RAJ_the_dominion_reborn_desc: "Das Dominion von heute unterscheidet sich erheblich vom Dominion von gestern. Indien ist wie neu geboren und voller Tatendrang für die Herausforderungen, die vor ihm liegen."

## Unionistische Ideen
 RAJ_support_from_the_elites: "Unterstützung durch die Eliten"
 RAJ_support_from_the_elites_desc: "Die Eliten Indiens sind entscheidende Einflussnehmer, die in der Wahlpolitik und bei der Umsetzung politischer Maßnahmen die wichtigste Rolle spielen. Mit ihrer Unterstützung wird unsere Regierungsfähigkeit erheblich gestärkt."
 RAJ_sikh_autonomy_modifier: "Sikhistan-Autonomie"
 RAJ_sikh_autonomy_modifier_desc: "Die Sikhistan-Autonomie ist eine speziell ausgewiesene Verwaltungseinheit in Indien, die der Sikh-Mehrheit mehr Mitspracherecht bei der Gestaltung ihres Alltags einräumt."
 RAJ_pronounced_loyalty_to_the_commonwealth: "Treue gegenüber dem Commonwealth"
 RAJ_pronounced_loyalty_to_the_commonwealth_desc: "Es war das Commonwealth, das Indien die Demokratie bescherte und dazu beitrug, das Land aus den Fängen des fürstlichen Absolutismus und des sozialistischen Dogmatismus zu befreien. Unsere Loyalität gegenüber der Entente ist nicht nur eine Gegenleistung, sondern unsere moralische Pflicht."
 RAJ_entrenched_pluralism: "Tief Verankerter Pluralismus"
 RAJ_entrenched_pluralism_desc: "Für künftige Regierungen wird es nun eine äußerst schwierige Aufgabe sein, die Bemühungen der Unionisten rückgängig zu machen, die darauf abzielten, sicherzustellen, dass die Regierungsführung und die Gesetzgebung in Indien auf der Grundlage pluralistischer Werte erfolgen."
 RAJ_economy_at_the_rural_level: "Wirtschaft auf ländlicher Ebene"
 RAJ_economy_at_the_rural_level_desc: "Bei der Wirtschaftspolitik stehen die Bedürfnisse der ländlichen Landwirtschaft im Vordergrund. Die Landwirte dürfen niemals zugunsten der Industriestädte ins Hintertreffen geraten."
 RAJ_the_masters_of_india: "Die Meister Indiens"
 RAJ_the_masters_of_india_desc: "An vorderster Front in den Parlamenten und im Bürgerkrieg waren wir es, die das vielfältige politische Spektrum Indiens gemeistert und die Nation nach unserer Vision reformiert haben."

## Weitere Ideen
 RAJ_exotic_exports: "Exotische Exporte"
 RAJ_exotic_exports_desc: "Dank unserer Investitionen in lokale Industriezweige sind die Exporte exotischer Waren gestiegen, was unserer großartigen Nation Einnahmen beschert hat."
 RAJ_exotic_exports_2: "Exotische Exporte"
 RAJ_exotic_exports_2_desc: "Dank unserer Investitionen in lokale Industriezweige sind die Exporte exotischer Waren gestiegen, was unserer großartigen Nation Einnahmen beschert hat."

### Entscheidungen ###
 RAJ_modernise_maduras_roads: "Modernisierung von Maduras Straßen"
 RAJ_modernise_maduras_roads_desc: "Die Straßen in der Provinz Madura sind, gelinde gesagt, in einem desolaten Zustand. Die Dörfer in den Bergen sind durch zusammengewürfelte Pfade miteinander verbunden, und die wenigen asphaltierten Straßen, die es gibt, sind bereits baufällig. Es ist, gelinde gesagt, absolut notwendig, alles auf einen modernen Standard zu bringen."
 RAJ_resume_the_bristow_plan: "Wiederaufnahme des Bristow-Plans"
 RAJ_resume_the_bristow_plan_desc: "Robert Bristow ist ein Hafeningenieur, der Anfang der 1920er Jahre einen äußerst ehrgeizigen Plan zum Ausbau des Hafens von Cochin entwickelte, der jedoch aufgrund finanzieller Engpässe und der darauf folgenden Katastrophe der Indischen Revolution nie verwirklicht wurde. Nun, da Travancore wieder in den Verbund aufgenommen wurde, können wir mit der Umstrukturierung des Hafens gemäß Bristows Vorstellungen beginnen."
 RAJ_sawai_man_singh_ii_buildup_plan: "Man Singhs Ausbauplan"
 RAJ_sawai_man_singh_ii_buildup_plan_desc: "Der Maharaja von Jaipur, Sawai Man Singh II., hat einen groß angelegten Stadtentwicklungsplan für sein nun zurückerobertes Fürstentum ausgearbeitet. Da er die Kosten nicht aus eigener Kraft decken kann, hat er die Regierung um finanzielle Unterstützung gebeten."
 RAJ_rebuild_the_manchester_of_india: "Das Manchester Indiens neu aufbauen"
 RAJ_rebuild_the_manchester_of_india_desc: "Ahmadabad, das aufgrund seiner bedeutenden Textilindustrie den Spitznamen \"Manchester Indiens\" trägt, wurde sowohl während des Bürgerkriegs als auch unter der sozialistischen Herrschaft schwer beschädigt. Wir sollten seine industrielle Stärke wieder auf das frühere Niveau bringen und gleichzeitig in die noch in den Kinderschuhen steckende chemische Industrie der Stadt investieren."
 RAJ_expand_the_singareni_collieries: "Ausbau der Singareni-Kohlebergwerke"
 RAJ_expand_the_singareni_collieries_desc: "Die Singareni Collieries Company ist ein bedeutendes Kohlebergbauunternehmen im Bundesstaat und in den umliegenden Regionen von Hyderabad. Es ist ratsam, dafür zu sorgen, dass diese wichtige Branche nicht nur überlebt, sondern auch floriert."
 RAJ_chota_nagpur_plateau_electrification: "Elektrifizierung des Chota-Nagpur-Plateaus"
 RAJ_chota_nagpur_plateau_electrification_desc: "Das Chota-Nagpur-Plateau ist eine bedeutende Region in Zentralindien, die in den letzten Jahrzehnten bei der Elektrifizierung ins Hintertreffen geraten ist. Durch einen umfassenden Bau- und Anschlussplan soll diese Region auf den neuesten Stand gebracht werden."
 RAJ_bringing_power_to_baluchistan: "Stromversorgung für Belutschistan"
 RAJ_bringing_power_to_baluchistan_desc: "Belutschistan ist eine der rückständigsten Provinzen im gesamten Dominion, wenn nicht sogar die am stärksten dezentralisierte und vernachlässigte. Durch eine umfassende Elektrifizierungskampagne werden wir erleben, wie diese Provinz nach Jahrzehnten des Stillstands endlich ins 20. Jahrhundert geführt wird."
 RAJ_expand_the_sharda_canal_system: "Ausbau des Sharda-Kanalsystems"
 RAJ_expand_the_sharda_canal_system_desc: "Das Sharda-Kanalnetz ist ein bedeutendes Bewässerungsnetz in Oudh, das der Verbesserung der landwirtschaftlichen Lebensfähigkeit in der Region dienen soll, wenngleich das Netz noch erhebliche Mängel aufweist. Durch umfangreiche Ausbauarbeiten sollen diese Mängel behoben werden, sodass die Subsistenz- und Marktbauernhöfe in der Region dann wirklich aufblühen können."
 RAJ_unleash_andhras_fishing_industry: "Andhras Fischereiwirtschaft beflügeln"
 RAJ_unleash_andhras_fishing_industry_desc: "Andhra ist die Heimat einer der produktivsten Fischereiindustrien weltweit. Dies zu nutzen, wird sich äußerst positiv auf unsere Wirtschaftsleistung auswirken."
 RAJ_support_berars_oilseed_export: "Unterstützen Sie den Export von Ölsaaten aus Berar"
 RAJ_support_berars_oilseed_export_desc: "Der Anbau von Marktfrüchten in Berar konzentriert sich auf Ölsaaten, vor allem Sesam. Der Bürgerkrieg hat den Bauern in der Region schweren Schaden zugefügt, doch durch die Unterstützung ihrer Wiederaufbaubemühungen werden wir große Fortschritte bei der Wiederbelebung dieses Agrarsektors erzielen."

 RAJ_impending_election: "Bevorstehende Wahl"
 RAJ_impending_election_desc: "Die erste Wahl seit der Wiedervereinigung Indiens steht bevor – eine Wahl, die zweifellos die Zukunft des Dominions für den Rest des Jahrhunderts prägen wird."

### Schwerpunkte ###
## Wirtschafts-/BM-Baum der Vorkriegszeit
 RAJ_infrastructure_act: "Das Infrastrukturgesetz von 1936"
 RAJ_infrastructure_act_desc: "Der Zustand der Straßen in den Bergen Kaschmirs und in der Thar-Wüste ist, gelinde gesagt, unzureichend. Das Infrastrukturgesetz sieht die Bereitstellung von Unterstützung und Mitteln zur Verbesserung wichtiger Straßen in diesen Gebieten vor."
 RAJ_relief_indebtedness_act: "Das Gesetz über den Schuldenerlass"
 RAJ_relief_indebtedness_act_desc: "Die rechtlichen Rahmenbedingungen für die Begleichung von Schulden sind unklar und werden von vielen Banken und Kreditgebern missbraucht. Schlimmer noch: Seit dem „Schwarzen Montag“ wird das System missbraucht, und vielen Menschen werden aufgrund angeblicher oder tatsächlicher Schulden ihr Land und ihre Ernte beschlagnahmt. Das Gesetz zur Entschuldung (Relief of Indebtedness Act) wird ordnungsgemäße Schuldenvermittlungsstellen einrichten und Schuldnern besseren Schutz bieten, was unserer angeschlagenen Wirtschaft mehr Stabilität verleihen wird."
 RAJ_state_aid_to_industries_act: "Das Gesetz über staatliche Beihilfen für die Industrie"
 RAJ_state_aid_to_industries_act_desc: "ausreichende Möglichkeiten, unseren angeschlagenen Industriezweigen und der Landwirtschaft direkte Unterstützung zu gewähren. Das Gesetz über staatliche Beihilfen für die Industrie wird uns einen angemessenen rechtlichen Rahmen bieten, um einzelnen Industriezweigen Hilfe in Form von Darlehen zukommen zu lassen und so die Wunden des Schwarzen Montags weiter zu heilen."
 RAJ_reinforce_the_western_coal_industry: "Die Westliche Kohleindustrie stärken"
 RAJ_reinforce_the_western_coal_industry_desc: "Die westlichsten Gebiete von Belutschistan und Quetta verfügen über reichhaltige Kohlevorkommen, die wir bislang noch nicht vollständig erschlossen haben. Wir werden dafür sorgen, dass diese Bergwerke über die notwendigen finanziellen Mittel und die erforderliche Sicherheit verfügen, um ihren Betrieb zum Wohle unserer Rohstoffindustrie fortzusetzen."
 RAJ_promote_the_kashmir_silk_industry: "Förderung der Seidenraupenzucht in Kaschmir"
 RAJ_promote_the_kashmir_silk_industry_desc: "Unter Seidenraupenzucht versteht man die Aufzucht von Seidenraupen zur Gewinnung von Rohseide sowie den Anbau von Maulbeerbäumen als Futter für diese. Im späten 19. Jahrhundert übertraf die Seidenindustrie die Kaschmir-Schal-Industrie hinsichtlich des Exportwerts und wurde damit zum wichtigsten Wirtschaftszweig der Region. Ihre Förderung wird den wirtschaftlichen Wert des Bundeslandes erheblich steigern."
 RAJ_incentivise_kangra_tea_cultivation: "Anreize für den Teeanbau in Kangra schaffen"
 RAJ_incentivise_kangra_tea_cultivation_desc: "Kangra-Tee war einst eine bedeutende Kulturpflanze, die im Kangra-Tal angebaut wurde und sowohl als schwarzer als auch als grüner Tee erhältlich war. Das Kangra-Erdbeben von 1905 verwüstete die Region und führte dazu, dass die Briten die Plantagen verkauften. Seitdem ist die Teeproduktion nur noch ein Schatten dessen, was sie einst war. Wir müssen Anreize für den Anbau schaffen, um den wirtschaftlichen Wert der Region zu steigern."
 RAJ_incorporate_the_liberal_economic_platform: "Liberale Wirtschaftsprogramm umsetzen"
 RAJ_incorporate_the_liberal_economic_platform_desc: "Die Nationalliberale Föderation Indiens setzt sich seit langem dafür ein, unsere Wirtschaft für internationale Interessen zu öffnen, anstatt die protektionistische Wirtschaftspolitik zu verfolgen, für die sich das Programm der Unionistischen Partei ausspricht. Angesichts unseres angeschlagenen Handelsraums sollten wir vielleicht ihrem Plädoyer Beachtung schenken und versuchen, Investitionen aus der internationalen Gemeinschaft anzuziehen."
 RAJ_champion_the_unionist_tariff_policy: "Sich für die Zollpolitik der Unionisten einsetzen"
 RAJ_champion_the_unionist_tariff_policy_desc: "Die landwirtschaftlichen Betriebe auf dem Land haben unter den Folgen des Schwarzen Montags enorm gelitten. Um unsere heimische Lebensmittelwirtschaft angesichts rückläufiger Exporte zu stärken, müssen wir uns für die unionistische Politik des Protektionismus einsetzen und dabei mehr Mittel in unsere Staatskasse lenken."
 RAJ_crush_the_karachi_dockworker_strike: "Zwangsarbeit und Nötigung genehmigen"
 RAJ_crush_the_karachi_dockworker_strike_desc: "Der Streik im Hafen von Karachi verschärft die ohnehin schon schreckliche Wirtschaftskrise noch weiter. Wir müssen diesen syndikalistischen Unruhestiftern klar machen, dass solcher Unsinn nicht toleriert wird, und den Einsatz von Gewalt genehmigen, um Streiks zu beenden und die Ordnung in unseren lebenswichtigen Industriezentren wiederherzustellen."
 RAJ_payment_of_wages_act: "Das Gesetz über die Lohnzahlung"
 RAJ_payment_of_wages_act_desc: "Wir müssen die Wut der erwerbstätigen unteren Bevölkerungsschicht dämpfen, indem wir die Stabilität ihrer Löhne besser absichern. Das Lohnzahlungsgesetz wird klar festlegen, wann ein Arbeitgeber den Lohn eines Arbeitnehmers einbehalten darf und wann nicht, und darüber hinaus den Prozentsatz begrenzen, den er einbehalten darf."
 RAJ_prepare_industrial_machine: "Die Industrie ausrüsten"
 RAJ_prepare_industrial_machine_desc: "Unsere Industrie befindet sich in einem wahrhaft beklagenswerten Zustand, sodass unsere Streitkräfte nicht ausreichend gerüstet sind, um einen erneuten Krieg mit unseren Gegnern auf dem indischen Subkontinent zu bewältigen. Wir müssen uns beeilen und ein umfangreiches Industrialisierungsprogramm vorantreiben, um sicherzustellen, dass wir jeden Gegner in puncto Produktionskapazität und Feuerkraft übertreffen können!"

 ## Pre-Split Army Tree
 RAJ_modernise_the_indian_army: "Modernisierung der Indischen Armee"
 RAJ_modernise_the_indian_army_desc: "Die Armee des Dominion ist zwar sicherlich nichts, worüber man staunen müsste, zeigt jedoch ihre Alterserscheinungen und bedarf einer eingehenden Überprüfung sowie einer Modernisierung. Wenn wir die Angriffe der Bharatiya-Volksrepublik und vielleicht sogar der perfiden Afghanen überstehen wollen, müssen wir sicherstellen, dass die Armee nicht unvorbereitet ist."
 RAJ_the_rails_of_the_frontline: "Die Schienen an der Front"
 RAJ_the_rails_of_the_frontline_desc: "Kriege werden durch überlegene Versorgungswege gewonnen. Es ist von größter Bedeutung, dass wir sicherstellen, dass unsere Truppen an der Front ausreichend Ausrüstung erhalten, um unsere militärischen Einsätze aufrechtzuerhalten. Außerdem werden wir einen gepanzerten Waggon umrüsten und eine Railgun entwickeln, um unsere unmittelbaren Gegner, die über Eisenbahnverbindungen zu uns verfügen, zu überraschen und zu schockieren."
 RAJ_update_aging_equipment: "Modernisierung veralteter Ausrüstung"
 RAJ_update_aging_equipment_desc: "Ein Großteil der Ausrüstung unserer Armee ist alt und stammt noch aus der Zeit des Weltkriegs oder sogar noch früher. Wir werden uns bemühen, die Forschung im Bereich neuer, moderner Ausrüstung zu optimieren."
 RAJ_expand_the_gurkha_rifles: "Ausbau der Gurkha-Rifles"
 RAJ_expand_the_gurkha_rifles_desc: "Die kampfstärksten und weltweit am meisten geachteten Regimenter stammen von den Gurkhas, professionellen Kämpfern, die seit Generationen im Dienst der Indischen Armee stehen. Wir müssen ihre Stärke nutzen, ihre Rekrutierung ausweiten und sie stärker in unsere Armee einbinden, denn sie werden unsere geschicktesten Figuren auf dem Schachbrett des Schlachtfeldes sein!"

 RAJ_quetta_command_and_staff_college: "Kommando- und Stabsakademie Quetta erweitern"
 RAJ_quetta_command_and_staff_college_desc: "Das Command and Staff College Quetta ist eine renommierte Militärhochschule, die zweifellos die nächste Generation von Offizieren ausbilden wird. Durch die Bereitstellung zusätzlicher Mittel werden wir den Bau eines neuen Forschungsflügels ermöglichen und damit eine bessere Zukunft für das Militär des Dominions sichern."
 RAJ_advanced_land_warfare_innovations: "Innovationen im Bereich der modernen Landkriegsführung"
 RAJ_advanced_land_warfare_innovations_desc: "Uns ist bekannt geworden, dass es in der Kunst der Landkriegsführung zahlreiche Durchbrüche gegeben hat, die nur noch auf die notwendigen finanziellen Mittel und Kapazitäten warten, um sie in vollem Umfang umzusetzen. Wir werden uns einen Vorteil gegenüber dem Feind verschaffen, indem wir die Bemühungen unserer Taktiker und Forscher unterstützen."

 ## Ideen des Jungen Garde Baums
 RAJ_ideas_of_the_young_guard: "Ideen der Jungen Garde"
 RAJ_ideas_of_the_young_guard_desc: "Die \"Junge Garde\" ist zutiefst desillusioniert von Philip Walhouse Chetwodes unerschütterlichem Widerstand gegen die Motorisierung und Mechanisierung der Armee und behauptet, dass unsere Truppen, wenn sie die Vorteile der modernen Kriegsführung nicht nutzen, lediglich zu Bremsschwellen für die Lastwagen und Panzer des Feindes werden. Wir sollten ihn zum Rücktritt auffordern, damit ihre Ideen und Visionen umgesetzt werden können."
 RAJ_rectify_disorderly_communications: "Mangelhafte Kommunikation beheben"
 RAJ_rectify_disorderly_communications_desc: "Die Kommunikation zwischen unseren Einheiten ist mangelhaft und durch unzureichende Methoden sowie einen Mangel an geeigneter Ausrüstung gekennzeichnet. Wir sollten dies beheben, damit dieser Aspekt unserer Armee auf professionellen Standard gebracht wird."
 RAJ_elevated_engineering_methods: "Fortgeschrittene Ingenieurtechnische Methoden"
 RAJ_elevated_engineering_methods_desc: "Die Rolle des Ingenieurkorps wird unterschätzt und nicht ausreichend genutzt. Wir werden seine Rolle in unseren Divisionen ausbauen und unüberwindbare Verteidigungslinien gegen unsere Feinde errichten."
 RAJ_new_training_initiatives: "Neue Ausbildungsinitiativen"
 RAJ_new_training_initiatives_desc: "Die Ausbildungsstandards in der Armee sind mangelhaft und stark veraltet. Wir werden unsere Übungen überarbeiten und völlig neue Methoden und Initiativen einführen, damit unsere Truppen für den Kampfeinsatz bestmöglich gerüstet sind."
 RAJ_motorise_the_sowars: "Motorisierung der Sowars"
 RAJ_motorise_the_sowars_desc: "Die Kavallerie ist eine längst überholte Form der Kriegsführung, da Mechanisierung und Panzerkriegsführung in den westlichen Nationen mittlerweile unbestreitbar im Trend liegen. Wir werden unsere Kavallerieeinheiten motorisieren und den Einsatz von Lastkraftwagen für Kriegszwecke fördern."
 RAJ_military_industry_buildup: "Ausbau der Rüstungsindustrie des Dominions"
 RAJ_military_industry_buildup_desc: "Indiens Rüstungsindustrie mag zwar noch nicht ganz die enorme Stärke von Nationen wie Deutschland oder Russland erreichen, doch können wir sicherlich den Grundstein für eine Industrie legen, die eines Tages zu einem ernstzunehmenden ebenbürtigen Partner werden wird. Die Automobilindustrie ist ein guter Anfang, und wir werden gegebenenfalls Subventionen gewähren, um eine solide einheimische Industrie zu fördern."
 RAJ_immovable_objects: "Unbewegliche Objekte"
 RAJ_immovable_objects_desc: "Die wirkungsvollsten Panzer auf dem Schlachtfeld sind Monolithen, die jedem Soldaten Angst einflößen, sobald er sie am Horizont erblickt. Starke, schwere Panzer sollen das Rückgrat unseres Panzerkorps bilden."
 RAJ_immortal_bulwarks: "Unsterbliche Bollwerke"
 RAJ_immortal_bulwarks_desc: "Das indische Panzerkorps soll sich auf dem Schlachtfeld als Kolosse des Krieges präsentieren, als Mammuts aus Stahl, die weltweit als das bevorzugte Gefährt des Sensenmanns bekannt sein werden. Ein indischer Panzer muss so beschaffen sein, dass man sich ihm niemals entziehen kann."
 RAJ_unstoppable_forces: "Unaufhaltsame Kräfte
 RAJ_unstoppable_forces_desc: "Leichte Panzer sind sowohl hinsichtlich der Kosten als auch der Geschwindigkeit am effizientesten, bieten hervorragende Möglichkeiten zur Einkreisung und können feindliche Linien mühelos überwältigen. Sie werden das Rückgrat unseres Panzerkorps bilden."
 RAJ_steel_dragoons: "Stahl-Dragoner"
 RAJ_steel_dragoons_desc: "Die Stahl-Dragoner Indiens werden unsere Feinde durchschneiden wie Messer die Butter und sie verwirrt und in Panik zurücklassen. Unsere Panzerkommandanten werden mit erhobenem Kopf gehen können, denn sie werden sich ehrenhaft verhalten und als legendäre Helden nach Hause zurückkehren.

 ## Maintain Chetwode's Primacy Tree
 RAJ_maintain_chetwodes_primacy: "Chetwodes Vorrangstellung bewahren"
 RAJ_maintain_chetwodes_primacy_desc: "Philip Walhouse Chetwodes pragmatischer Ansatz zur Kriegsführung auf dem indischen Kontinent ist der einzige, den das Dominion vernünftigerweise aufrechterhalten kann. Die unrealistischen Vorstellungen junger Emporkömmlinge müssen genau das bleiben, bloße Vorstellungen."
 RAJ_the_honourable_sowars: "Die Ehrenwerten Sowars"
 RAJ_the_honourable_sowars_desc: "Die Sowars sind die besten Kavalleristen auf dem gesamten asiatischen Kontinent. Wir werden den Veteranen dieser Regimenter hohe Ehren erweisen und ihre Rolle in unserer Armee als kosteneffiziente Manövrierkräfte ausbauen."
 RAJ_the_indelible_role_of_artillery: "Die unersetzliche Rolle der Artillerie"
 RAJ_the_indelible_role_of_artillery_desc: "Die Rolle der Artillerie in der Kriegsführung ist unbestreitbar enorm, da sie in der Lage ist, Flugzeuge, Panzer, Festungen und feindliche Stellungen relativ mühelos auszuschalten. Wir müssen sie bestmöglich einsetzen."
 RAJ_streamlined_small_arms_production: "Optimierte Produktion von Handfeuerwaffen"
 RAJ_streamlined_small_arms_production_desc: "Die Produktion von Handfeuerwaffen im Dominion reicht derzeit nicht aus, um den Bedarf eines kontinentweiten Krieges zu decken. Wir werden die Produktion rationalisieren, damit uns niemals ein Gewehr fehlt."
 RAJ_the_chetwode_motto: "Das Chetwode-Motto"
 RAJ_the_chetwode_motto_desc: "\"Die Sicherheit, die Ehre und das Wohl Ihres Landes stehen an erster Stelle – immer und unter allen Umständen. Die Ehre, das Wohl und das Wohlergehen der Männer, die Sie befehligen, kommen an zweiter Stelle. Ihre eigene Bequemlichkeit, Ihr Komfort und Ihre Sicherheit stehen an letzter Stelle – immer und unter allen Umständen.\""
 RAJ_promote_a_martial_culture: "Eine Kampfkultur fördern"
 RAJ_promote_a_martial_culture_desc: "Um das Ansehen des Militärs zu steigern und die Bereitschaft der Bevölkerung zu stärken, gegen Feinde an unseren Grenzen und darüber hinaus zu kämpfen, sollten wir eine kriegerische Kultur fördern, die der der Gurkhas sehr ähnlich ist. Eine einfache Propagandakampagne wäre ein guter Anfang, um dieses Ziel zu erreichen."
 RAJ_improve_our_support_companies: "Verbesserung unserer Unterstützungs-Kompanien"
 RAJ_improve_our_support_companies_desc: "Unsere Unterstützungs-Kompanien spielen eine entscheidende Rolle bei der Verstärkung unserer Divisionen und verschaffen ihnen einen Vorteil gegenüber dem Feind. Wir werden dort, wo es notwendig ist, Verbesserungen einleiten und dafür sorgen, dass sie den anderen um Längen voraus sind!"
 RAJ_the_most_feared_army_of_the_entente: "Die Gefürchtetste Armee der Entente"
 RAJ_the_most_feared_army_of_the_entente_desc: "Die Indische Armee ist jene, die man über die Hügel marschieren sieht, deren Kugeln die Sonne verdunkeln und all jene, die es wagen, sich ihr zu widersetzen oder ihren Weg zu kreuzen, dazu bringen, sich zu wünschen, sie hätten dies niemals getan. Die Indische Armee soll die größte Waffe der Entente und der Königsmacher auf dem Schlachtfeld sein!"

 ## Luftwaffenbaum
 RAJ_refurbish_the_indian_air_force: "Modernisierung der Indischen Luftwaffe"
 RAJ_refurbish_the_indian_air_force_desc: "Angesichts der Gefahr, dass der Luftraum über Indien im Kriegsfall von einem rivalisierenden Gegner kontrolliert wird, sollte es für uns oberste Priorität sein, sicherzustellen, dass die Luftwaffe in bester Verfassung ist."
 RAJ_india_rules_the_radio_waves: "Indien beherrscht die Radiowellen"
 RAJ_india_rules_the_radio_waves_desc: "Es ist die moderne Technologie, die die Sieger der Zukunft bestimmen wird! Wenn Britannien die Meere beherrscht, dann wird Indien die Radiowellen beherrschen!"
 RAJ_aerial_transports: "Lufttransporte"
 RAJ_aerial_transports_desc: "Dank ihrer überlegenen Logistik und der Möglichkeit, ganze Divisionen hinter den feindlichen Linien abzusetzen, sind Transportflugzeuge wohl die lohnendste Investition in unsere Luftstreitkräfte."
 RAJ_indian_paratroopers: "Die Geflügelten Pegasusse Indiens"
 RAJ_indian_paratroopers_desc: "Fallschirmbrigaden sind in der Lage, Versorgungslinien zu unterbrechen, ganze Städte einzunehmen und den Zusammenhalt der feindlichen Linien zu stören. Ein solcher Schachzug wird die Organisation des Feindes zweifellos schwächen."
 RAJ_improved_air_defenses: "Verbesserung Unserer Luftverteidigung"
 RAJ_improved_air_defenses_desc: "Die Gefahr, dass Bomberflotten unsere wertvollen Industriezweige terrorisieren, ist wahrlich erschreckend. Der Aufbau von Luftabwehrsystemen in unserer Hauptstadt und an anderen wichtigen Standorten wird mögliche Katastrophen abmildern, die vom Himmel herabregnen könnten."
 RAJ_subsidised_domestic_air: "Die inländische Luftfahrtindustrie subventionieren"
 RAJ_subsidised_domestic_air_desc: "Industrielle wie Jehangir Dadabhoy Tata und Nevill Vintcent haben mit der Gründung von Tata Airlines einen großen Beitrag zum Aufbau einer indischen Luftfahrtindustrie geleistet. Ihre Bemühungen zu unterstützen, wäre ein äußerst unternehmerisches Vorhaben."
 RAJ_deconceptualise_their_logistics: "Die Logistik des Feindes zunichte machen"
 RAJ_deconceptualise_their_logistics_desc: "Die Logistik ist der entscheidende Faktor für die Stärke einer Armee. Daher ist es notwendig, dem Feind diese Mittel so weit zu entziehen, dass es so gut wie so wäre, als hätte er diese Fähigkeiten von vornherein nie besessen."
 RAJ_interservice_coordination: "Streben nach Dienststellenübergreifender Koordination"
 RAJ_interservice_coordination_desc: "Durch die Vereinheitlichung der Koordinierungsmaßnahmen zwischen den Streitkräften am Boden und in der Luft wird unser Vormarsch auf die feindlichen Linien ebenso imposant wie furchteinflößend sein."
 RAJ_dominate_the_skies: "Den Himmel beherrschen"
 RAJ_dominate_the_skies_desc: "Kluge Nationen üben nicht nur die uneingeschränkte Herrschaft über Land und Meer aus, sondern erkennen auch, wie wichtig es ist, den Himmel zu beherrschen. Die Kontrolle über den Luftraum deckt eine dreidimensionale Flanke ab und verschafft einen enormen Vorteil."
 RAJ_birds_of_prey: "Raubvögel"
 RAJ_birds_of_prey_desc: "Das Auftreten unserer Soldaten in der Luft soll ebenso elegant wie gnadenlos sein. Wir werden uns auf unsere Gegner stürzen, wie ein Falke sich auf seine schwache Beute stürzt!"
 RAJ_continental_airforce: "Indische Kontinental-Luftwaffe"
 RAJ_continental_airforce_desc: "Unsere Luftwaffe übt nicht nur Macht über einzelne Regionen und Gebiete aus, sondern beherrscht einen ganzen Kontinent. Inder im ganzen Land können zum Himmel blicken und vor Stolz eine Träne vergießen, da sie wissen, dass keine andere Nation mit unserer Machtprojektion mithalten kann."

 ## Marinebaum
 RAJ_from_the_indus_to_the_sea: "Vom Indus bis zum Meer"
 RAJ_from_the_indus_to_the_sea_desc: "Heißt diese riesige Wasserfläche jenseits unserer Küsten nicht \"Indischer Ozean\"? Es ist ganz offensichtlich unser Schicksal, eine Marine aufzubauen, die so mächtig ist, dass diejenigen, die unsere Gewässer durchqueren, ihren Namen nicht kennen müssen, um zu wissen, dass sie uns gehört."
 RAJ_the_ganga_strategy: "Die Ganga-Strategie"
 RAJ_the_ganga_strategy_desc: "Wir dürfen nicht zulassen, dass die vielen reißenden Flüsse Indiens unseren Vormarsch behindern. Durch sorgfältige Vorausplanung und innovative Strategien wird das Überqueren eines Flusses nicht schwieriger sein als das Übersteigen eines Kiesels."
 RAJ_prioritise_naval_assaults: "Marineangriffe priorisieren"
 RAJ_prioritise_naval_assaults_desc: "Unsere Seestreitkräfte gehören zu unseren Eliteeinheiten. Wir werden ihre Fähigkeiten voll ausschöpfen und ihre Stärke in vollem Umfang nutzen!"
 RAJ_acquire_bombers_from_fairey: "Bomber von Fairey erwerben"
 RAJ_acquire_bombers_from_fairey_desc: "Die Fairey Swordfish, hergestellt von unseren Freunden jenseits des Ozeans, ist ein bewährtes Torpedobomber-Modell, das sich dort bereits seit vielen Jahren bewährt hat. Warum sollten wir uns die Mühe machen, ein eigenes Modell zu entwickeln, wenn unsere Verbündeten mehr als bereit sind, uns die Baupläne zur Verfügung zu stellen, damit wir die Produktion stattdessen direkt in Indien aufnehmen können?"
 RAJ_protecting_the_entente_lifeline: "Schutz der Lebensader der Entente"
 RAJ_protecting_the_entente_lifeline_desc: "Die Versorgung durch die Mitglieder der Entente und des Commonwealth ist für unser Überleben von entscheidender Bedeutung. Unsere Feinde werden versuchen, unsere Seewege zu unterbrechen; doch das werden wir nicht zulassen."
 RAJ_increase_convoy_production: "Konvoi-Produktion steigern"
 RAJ_increase_convoy_production_desc: "Durch neue Verträge und Quoten werden wir dafür sorgen, dass unser geplanter Ausbau der indischen Handelsflotte zügig und reibungslos vonstattengeht!"
 RAJ_new_navy: "Eine Neue Marine"
 RAJ_new_navy_desc: "Nun, da wir den Kontinent wiedervereinigt haben, müssen wir unseren Blick auf die Zukunft richten und eine Marine ins Auge fassen, die die Macht der Nation, der sie dient, angemessen widerspiegelt!"
 RAJ_accelerate_naval_buildup: "Den Ausbau der Marine beschleunigen"
 RAJ_accelerate_naval_buildup_desc: "Die Zeit drängt, denn die Seemächte auf der ganzen Welt beschäftigen sich schon viel länger als wir mit dem Ausbau ihrer Macht. Wir müssen mehr als nur unser Bestes geben, wenn wir zu den Besten der Welt aufschließen wollen!"
 RAJ_an_indian_armada: "Eine Indische Armada"
 RAJ_an_indian_armada_desc: "Dank einer Flotte aus Schlachtschiffen und schweren Kreuzern wird jede Seeschlacht, in die wir verwickelt werden, nur einen möglichen Ausgang haben: unseren entscheidenden Sieg."
 RAJ_aerial_conquest_of_the_sea: "Luftherrschaft über das Meer"
 RAJ_aerial_conquest_of_the_sea_desc: "Die Zukunft der Seekriegsführung beschränkt sich nicht nur auf die Wellen, sondern zielt auch darauf ab, die Winde zu nutzen. Indem wir in Flugzeugträger investieren und unsere neue Flotte um diese herum aufbauen, werden wir den veralteten Marinen der Vergangenheit immer einen Schritt voraus sein."
 RAJ_warriors_of_the_sea: "Krieger der Meere"
 RAJ_warriors_of_the_sea_desc: "Die tapferen indischen Soldaten, die sich entschließen, Flüsse zu durchwaten und Strände zu stürmen, verkörpern einen Kampfgeist, der von keinem anderen Krieger auf der Welt übertroffen wird. Unsere Marines sind Krieger der Meere, deren Silhouette am Horizont nur von einer weißen Flagge empfangen werden sollte."

 ## Wiederaufbau Baum
 RAJ_indian_nightmare: "Ende des Indischen Albtraums"
 RAJ_indian_nightmare_desc: "Der Albtraum, der begann, als die INC die \"Purna Swaraj\" ausrief und damit die vielleicht traumatischste Ära der indischen Geschichte einläutete, ist nun endlich zu Ende gegangen. Nun gilt es für uns, die Trümmer aufzuräumen und das Dominion zum Wohle unseres leidenden Volkes wieder aufzubauen."
 RAJ_reintegration: "Wiedervereinigung des Kontinents"
 RAJ_reintegration_desc: "Es ist an der Zeit, die Trennlinien zwischen unserer ursprünglichen Basis im Nordwesten und dem Rest des Kontinents endgültig zu überwinden. Auch wenn es nach wie vor Widerstand gegen unsere erneute Herrschaft gibt, werden wir dafür sorgen, dass dieser nicht von Dauer ist."
 RAJ_rebel_prince_debacle: "Das Debakel um die Rebellenprinzen lösen"
 RAJ_rebel_prince_debacle_desc: "Die Rebellenprinzen stellen ein ziemliches Dilemma dar, da sie schon seit geraumer Zeit Herrscher über ihre Heimatländer sind. Es war jedoch das britische Raj, das ihr Überleben gesichert hat, und nun liegt es an uns zu entscheiden, was mit denen geschehen soll, die uns verraten haben."
 RAJ_rebel_soldiers: "Der Umgang mit den Rebellensoldaten"
 RAJ_rebel_soldiers_desc: "Die Rebellensoldaten der ehemaligen Bharatiya-Volksrepublik haben Indien verraten, indem sie für die sozialistische Bedrohung gekämpft haben; dennoch gibt es in der Regierung viele, die ihre Ehre verteidigen und behaupten, sie hätten sich nichts zuschulden kommen lassen, außer dass sie eingezogen wurden und für ihr Land gekämpft haben. Wir müssen endgültig festlegen, wie unsere Politik ihnen gegenüber aussehen soll."
 RAJ_damaged_dominion: "Die Heilung des geschädigten Reiches"
 RAJ_damaged_dominion_desc: "In ganz Indien herrscht großes Leid aufgrund von Hungersnot und Zerstörung, die auf den brutalen Bürgerkrieg zurückzuführen sind, der erst kürzlich beendet wurde. Es ist unsere Pflicht, das Leid unseres Volkes zu lindern, indem wir die entstandenen Schäden beheben."
 RAJ_redouble_infrastructure: "Den Ausbau der Infrastruktur vorantreiben"
 RAJ_redouble_infrastructure_desc: "Die Infrastruktur Indiens war historisch gesehen noch nie besonders gut. Wir haben nun die Chance, dafür zu sorgen, dass dank der Straßen und Autobahnen kein Inder mehr von der Außenwelt abgeschnitten ist. Hatten wir schließlich nicht einst einen so bedeutenden Teil der Seidenstraße in unserer Hand?"
 RAJ_mass_electrification: "Großangelegte Elektrifizierungskampagnen"
 RAJ_mass_electrification_desc: "Um das Dominion in die Moderne zu katapultieren, werden wir jedes einzelne Dorf mit Strom versorgen, ganz gleich, wie abgelegen es auch sein mag. Strom und Licht sollen jedes Dorf erhellen!"
 RAJ_auction_industries: "Versteigerung verstaatlichter Industriezweige"
 RAJ_auction_industries_desc: "Die verstaatlichten Industriezweige Ostindiens wurden infolge des Sturzes der Regierung des Indischen Nationalkongresses (INC) sich selbst überlassen und sind nun fast völlig verfallen. Dank der Wunder der Privatwirtschaft werden wir diese wertvollen Wirtschaftssektoren nicht länger dem Untergang überlassen!"
 RAJ_maintain_momentum: "Den Schwung beibehalten"
 RAJ_maintain_momentum_desc: "Der Wiederaufbau Indiens hat ein Wirtschaftswunder ausgelöst, das auf die enorme Zahl an Arbeitsplätzen zurückzuführen ist, die durch neue Industriezweige geschaffen wurden, sowie auf die Vielzahl staatlich in Auftrag gegebener öffentlicher Bauprojekte. Wir werden diese Dynamik nicht nachlassen lassen!"
 RAJ_indian_granary: "Blossom, die Kornkammer Indiens!"
 RAJ_indian_granary_desc: "Der Kontinent Indien, der geografisch so vielfältig und so stark von der Landwirtschaft geprägt ist, hat das Potenzial, zu einem der größten Nahrungsmittelexporteure der Welt zu werden. Nun, da Indien wieder auf eigenen Beinen steht, wird die Kornkammer Indiens ihre rechtmäßige Wohltätigkeit wahrnehmen und Millionen Menschen mit Nahrungsmitteln versorgen!"
 RAJ_servants_of_india: "Gründung der Servants of India Society"
 RAJ_servants_of_india_desc: "Die Servants of India sind eine zivilgesellschaftliche Freiwilligenorganisation, die lokale Initiativen und gemeinnütziges Engagement fördert. Zudem bestehen zahlreiche Berührungspunkte mit der Nationalliberalen Föderation Indiens. So oder so werden sie einen großen Beitrag zum Wiederaufbau Indiens leisten."

 ## Politischer Baum
 ## Liberaler Baum
 RAJ_ascendance_of_the_liberals: "Aufstieg der Liberalen Föderation"
 RAJ_ascendance_of_the_liberals_desc: "Die Nationalliberale Föderation Indiens wurde als Reaktion auf den zunehmenden Extremismus der INC gegründet; viele gemäßigte Nationalisten zogen Verfassungsreformen und friedliche Verhandlungen den revolutionären Methoden der INC vor. Da es Jinnah nicht gelang, die an die Sozialisierung der Bharatiya-Volksrepublik gewöhnten Inder für sich zu gewinnen, und die Unionisten ihre Glaubwürdigkeit zunichte gemacht hatten, war es nur natürlich, dass sich die Liberalen durchsetzen würden!"
 RAJ_support_middle_class: "Unterstützung der Mittelschicht"
 RAJ_support_middle_class_desc: "Der Großteil unserer Wählerschaft besteht aus Hindus der Elite und der Mittelschicht. Um unserer Verantwortung gegenüber unseren Wählern gerecht zu werden und das neue Indien zu fördern, müssen wir unsere Ressourcen darauf konzentrieren, die Mittelschicht zu unterstützen und zu stärken!"
 RAJ_prioritise_urban_centres: "Städte als Schwerpunkt setzen"
 RAJ_prioritise_urban_centres_desc: "Das Engagement für den Ausbau städtischer Gebiete wird maßgeblich zur Entwicklung Indiens als moderne Nation beitragen, ganz zu schweigen von dem politischen Kapital, das wir dadurch gewinnen werden."
 RAJ_growth_of_indian_capitalism: "Der sich massenhaft vermehrende Kapitalismus in Bombay"
 RAJ_growth_of_indian_capitalism_desc: "Der industrielle Kapitalismus in Indien zeigt sich am deutlichsten in den Straßen von Bombay, wo die aufblühende Textilindustrie der Entwicklung der Stadt einen enormen Aufschwung bescherte und die Arbeiterklasse stark anwachsen ließ. Wir müssen diesem Erfolg nacheifern und dafür sorgen, dass alle städtischen Zentren im Glanz des wirtschaftlichen Erfolgs nach westlichem Vorbild erstrahlen!"
 RAJ_indian_leap_forward: "Indiens Sprung nach vorn"
 RAJ_indian_leap_forward_desc: "Infolge des beispiellosen wirtschaftlichen Erfolgs, den der indische Kontinent nach dem Bürgerkrieg verzeichnet hat, ist eine neue Generation von Genies und Intellektuellen herangewachsen, die die Entwicklung des indischen Volkes vorantreibt. Wir begrüßen ihre Innovationen und müssen sie finanziell tatkräftig unterstützen, denn ihre Bemühungen werden Indien in die Riege der internationalen Supermächte katapultieren!"
 RAJ_unified_civil_code: "Einführung eines einheitlichen Zivilgesetzbuchs"
 RAJ_unified_civil_code_desc: "Das Bürgerliche Gesetzbuch regelt derzeit das Personenrecht auf der Grundlage der heiligen Schriften der jeweiligen Religion jedes einzelnen Inders. Dies ist natürlich ein unsinniges System, das lediglich dazu dient, die konfessionelle Spaltung eines eigentlich unteilbaren indischen Volkes zu legitimieren. Wir müssen das Bürgerliche Gesetzbuch vereinheitlichen und sicherstellen, dass diese Gesetze gleichberechtigt angewendet werden – ganz gleich, ob man Hindu, Muslim, Sikh, Jain oder sogar Buddhist ist."
 RAJ_maintain_limited_suffrage: "Das eingeschränkte Wahlrecht beibehalten"
 RAJ_maintain_limited_suffrage_desc: "Die bedauerliche Realität ist: Würde das Wahlrecht auf die gesamte Bevölkerung Indiens ausgeweitet, würden wir in unseren städtischen Wahlkreisen weitgehend untergehen. Der Grund dafür ist, dass die Grundbesitzer und die oligarchischen Politiker von Parteien wie den Unionisten das System manipulieren und ihre Pächter dazu zwingen würden, entgegen ihren eigenen Interessen für sie zu stimmen. Wir werden die Debatte über das allgemeine Wahlrecht im Keim ersticken und das derzeitige System aufrechterhalten."
 RAJ_integrate_the_mahasabha: "Die Hindu Mahasabha integrieren"
 RAJ_integrate_the_mahasabha_desc: "Aufgrund ihrer vielfältigen Mitgliederzusammensetzung erlitt die Hindu Mahasabha einen enormen Ansehensverlust, nachdem sie sich auf der falschen Seite der Waffenstillstandslinie wiederfand, obwohl sie vom INC stark an den Rand gedrängt worden war. Die engen Verbindungen von M.R. Jayakar zu dieser Organisation haben zu ihrem Wiederaufleben geführt, und es erscheint sinnvoll, dass wir eine formelle Koalition mit ihren Mitgliedern eingehen und sie wieder in das politische Leben integrieren."
 RAJ_abolish_reserved_seats: "Die Reservierungsplätze abschaffen"
 RAJ_abolish_reserved_seats_desc: "Reservierte Sitze machen einen beträchtlichen Teil des Parlaments aus und sind speziell an die Religionszugehörigkeit geknüpft. Wir müssen dieses Überbleibsel illiberaler politischer Aufblähung beseitigen und Sitze für fair gewählte Politiker freimachen."
 RAJ_enshrine_secularism: "Verankerung einer säkularen Regierungsführung"
 RAJ_enshrine_secularism_desc: "Eine säkulare Regierungsführung ist der einzige Weg nach vorn für Indien, wenn es ebenso respektiert werden will wie die anderen modernen Nationalstaaten. Das derzeitige System räumt Sikhs und Muslimen einen unverhältnismäßig großen Einfluss auf die Politik ein und wird zwangsläufig dazu führen, dass die Minderheit über die Mehrheit herrscht."
 RAJ_the_fundamental_rights_of_indians: "Die Grundrechte aller Inder"
 RAJ_the_fundamental_rights_of_indians_desc: "Kastensystem, Illiberalismus und Unberührbarkeit sind allesamt Faktoren, die die uralte Last nähren, die auf dem indischen Volk lastet. Wir werden Grundrechte gesetzlich verankern und den Weg für eine künftige Abschaffung des Kastensystems ebnen, sobald die Gesellschaft stabil genug ist, um solche Veränderungen zu verkraften."
 RAJ_the_torch_of_liberalism_burns_bright: "Die Fackel des Liberalismus brennt hell"
 RAJ_the_torch_of_liberalism_burns_bright_desc: "Nach Abschluss unserer Reformen hat die Fackel des Liberalismus ihre reinigende Flamme über ganz Indien lodern lassen und den autoritären Fürstenherrschaft sowie den syndikalistischen Extremismus des INC beseitigt. Das heutige Indien ist frei, demokratisch und bereit, die kommenden Jahrhunderte zu meistern!"
 ## Shared between Liberale and AIHRP
 RAJ_exploit_unionist_divisions: "Die Spaltungen der Unionisten ausnutzen"
 RAJ_exploit_unionist_divisions_desc: "Die Unionisten weisen innerhalb ihrer eigenen Partei zahlreiche konfessionelle Spaltungen und Cliquen auf. Durch geschicktes Manövrieren werden wir diese Spaltungen ausnutzen und ihre Macht schwächen, damit sie die Gedanken der Inder nie wieder vergiften können!"
 RAJ_absorb_minor_parties: "Kleine Parteien einbinden"
 RAJ_absorb_minor_parties_desc: "Wir müssen das sich ständig wandelnde politische Feld für uns nutzen und unseren Einfluss ausbauen, um dem Ideal einer ultimativen Avantgarde des indischen Volkes näherzukommen. Auf diese Weise werden wir sicherstellen, dass unser Programm und unsere Vision voranschreiten, ohne dass wir dabei durch eigennützige Regionalisten und diejenigen, denen die Bedürfnisse ganz Indiens gleichgültig sind, nennenswert behindert werden."
 RAJ_encourage_minor_parties: "Kleine Parteien fördern"
 RAJ_encourage_minor_parties_desc: "Um eine gesunde Demokratie zu fördern, müssen wir die Entwicklung kleinerer Parteien und Organisationen unterstützen, die die vielfältigen Bedürfnisse des riesigen indischen Kontinents vertreten. Dies wird die Stabilität der indischen Politik und der Nation als Ganzes für die kommenden Jahrzehnte gewährleisten."
 ## AIHRP Tree
 RAJ_the_aihrp_triumphs: "Die Allindische Selbstverwaltungspartei triumphiert"
 RAJ_the_aihrp_triumphs_desc: "Die Allindische Selbstverwaltungspartei wurde von Muhammad Ali Jinnah als Abspaltungspartei gegründet, nachdem er von der Tendenz des INC zum Sozialismus und dessen radikalem Programm desillusioniert war. Sie beruft sich offiziell auf das Erbe der gleichnamigen Liga, die von Annie Besant gegründet wurde. Wir setzen uns für eine konföderale und fortschrittliche Agenda ein, die darauf abzielt, die indische Gesellschaft in eine positive Richtung zu verändern, und stehen nun vor der Aufgabe, diese Agenda konsequent umzusetzen."
 RAJ_social_justice: "Ein Engagement für soziale Gerechtigkeit"
 RAJ_social_justice_desc: "Unsere Regierung muss nach dem Grundsatz der unveräußerlichen und unantastbaren sozialen Gerechtigkeit geführt werden. Wir werden dies gegenüber der Bevölkerung betonen und uns dabei auf die besten Elemente der sozialen Gerechtigkeit nach islamischem Vorbild stützen, die auf dem gesamten Kontinent verbreitet werden sollen."
 RAJ_princely_patronage: "Fürstliche Schirmherrschaft"
 RAJ_princely_patronage_desc: "Die Vorrangstellung der Fürsten ist eine Tatsache, die wir leider akzeptieren müssen, wenn wir unsere ehrgeizigsten Reformen im Parlament durchsetzen wollen."
 RAJ_achieving_the_confederal_dominion: "Die Verwirklichung des Konföderalen Dominion"
 RAJ_achieving_the_confederal_dominion_desc: "Nachdem wir unsere Gesetzesreform verabschiedet haben, kann nun das ehrgeizigste Projekt unseres Wahlprogramms in Angriff genommen werden. Den Provinzen soll Autonomie gewährt werden, und das föderale System soll sich zu einem konföderalen System weiterentwickeln, wodurch eine neue Form des indischen Kontinents entsteht, die die Zeiten überdauern wird!"
 RAJ_reform_legislatures: "Reform der Gesetzgebenden Versammlungen"
 RAJ_reform_legislatures_desc: "Wir werden alle gewählten Gremien so gestalten, dass sie auf den Grundsätzen einer angemessenen Vertretung aller Minderheiten beruhen, und gleichzeitig sicherstellen, dass keine Mehrheit ungerechtfertigterweise zu einer Minderheit herabgestuft wird. Getrennte Wahlkreise bleiben bestehen, und es wird keine weitere Vorherrschaft einer Klasse, eines Stammes oder einer Gruppe über eine andere geben!"
 RAJ_recognise_the_role_of_women: "Frauen in die Politik einbinden"
 RAJ_recognise_the_role_of_women_desc: "Der Gründer unserer Partei, Muhammad Ali Jinnah, war stets davon überzeugt, dass Frauen über enorme Fähigkeiten in den Bereichen Regierungsführung und Führung verfügen. Wir werden ihren Stellenwert in der Gesellschaft stärken, indem wir ihr Wahlrecht ausweiten und ihnen Raum geben, sich Gehör zu verschaffen."
 RAJ_help_workers_help_themselves: "Den Arbeitern helfen, sich selbst zu helfen"
 RAJ_help_workers_help_themselves_desc: "Viele der Parteifunktionäre unterhielten Verbindungen zu gemäßigten und nicht-syndikalistischen Gewerkschaften, darunter auch Jinnah selbst. Die Tugend der Selbstständigkeit und die Entwicklung ihrer Gemeinschaften ist etwas, das alle indischen Arbeiter vorleben müssen. Wir werden die Arbeiterklasse zu einer wirksamen, patriotischen Organisation führen, damit sie ihren Gemeinschaften aus eigener Kraft eine bessere Zukunft bescheren können."
 RAJ_reject_deleterious_economics: "Ablehnung der schädlichen westlichen Wirtschaftstheorie"
 RAJ_reject_deleterious_economics_desc: "Die westliche Wirtschaftstheorie lässt sich nur selten auf die Kultur und Gesellschaft von Muslimen und Hindus anwenden. Wir müssen uns der Vision eines Wohlfahrtsstaates mit gemischter Wirtschaft annähern, da diese am besten geeignet ist, Indien aus dem Sumpf des 19. Jahrhunderts herauszuführen."
 RAJ_reverse_educational_backwardness: "Bildungsrückständigkeit überwinden"
 RAJ_reverse_educational_backwardness_desc: "Der Bildungsrückstand ist in Indien auf dem gesamten Kontinent allgegenwärtig. Wir müssen in unsere Zukunft investieren, indem wir neue Schulen finanzieren und die Zukunft des Bildungswesens in unserem Land stärken, damit wir in den kommenden Jahrzehnten nicht weit zurückfallen."
 RAJ_the_father_of_the_nation: "Der Vater der Nation"
 RAJ_the_father_of_the_nation_desc: "Muhammad Ali Jinnah hat seine Vision erfolgreich auf dem gesamten Kontinent verbreitet und die Nation nach seinen Vorstellungen neu gestaltet. Seine Vorrangstellung innerhalb der Partei steht nicht mehr zur Debatte, und die Inder im ganzen Land erkennen ihn nun als Vater der Nation an. Indien ist aus der Asche des Bürgerkriegs auferstanden und hat der Welt bewiesen, dass es sich nicht unterkriegen lässt!"
 ## Gemeinsam genutzt von AIHRP und Unionisten
 RAJ_uplifting_muslim_regions: "Förderung Muslimischer Regionen"
 RAJ_uplifting_muslim_regions_desc: "Muslimische Regionen gehören leider zu den ärmsten Gebieten im gesamten Dominion. Wir müssen unsere Anstrengungen darauf konzentrieren, diese Provinzen so zu fördern, dass sie mit ihren hinduistischen Pendants gleichziehen können, damit sie nicht benachteiligt werden."
 RAJ_against_hindu_rashtra: "Gegen Hindu Rashtra"
 RAJ_against_hindu_rashtra_desc: "Parteien wie die Nationalliberale Föderation Indiens streben lediglich danach, die Vorherrschaft der Mehrheit über die Minderheit durchzusetzen. Ein entschlossenes Vorgehen gegen ihre Reihen und die des chauvinistischen Hindu Mahasabha wird sicherstellen, dass unser Indien nicht der Tyrannei der Mehrheit zum Opfer fällt."
 ## Unionistischer Baum
 RAJ_the_unionists_hold_on: "Die Unionisten halten durch"
 RAJ_the_unionists_hold_on_desc: "Die Unionistenpartei wurde ursprünglich als auf den Punjab ausgerichtete Organisation gegründet, die die Interessen der Oberschicht vertreten sollte. Mit der Gründung des Dominion Indien entwickelte sie sich weiter und verfolgte fortan eine pluralistische, agrarische Agenda. Nachdem sie die heftigen Angriffe der NLFI und der AIHRP im Zuge der Rezession nach dem Schwarzen Montag überstanden hatte, konnten sich die Unionisten behaupten und ein beträchtliches Mandat erringen."
 RAJ_concessions_to_shiromani_akali_dal: "Zugeständnisse an die Shiromani Akali Dal"
 RAJ_concessions_to_shiromani_akali_dal_desc: "Die Shiromani Akali Dal ist eine auf die Sikhs ausgerichtete Organisation, die sich für mehr Autonomie für von Sikhs dominierte Regionen einsetzt und die Interessen der Sikhs in Indien vertritt. Aufgrund unserer pluralistischen Agenda sind sie unsere parlamentarischen Verbündeten, und wir müssen sicherstellen, dass wir unsere Versprechen einhalten, damit wir sie nicht im Stich lassen und unsere Glaubwürdigkeit nicht untergraben."
 RAJ_pluralism_without_compromise: "Pluralismus ohne Kompromisse"
 RAJ_pluralism_without_compromise_desc: "Der Pluralismus in Indien ist der einzige realistische Weg, um die konfessionellen Gräben zwischen den unglaublich vielfältigen Glaubensrichtungen, die Millionen von Indern vertreten, zu überbrücken. Es darf keine Kompromisse geben und niemand darf zurückgelassen werden; alle Glaubensrichtungen müssen gleichberechtigt vertreten sein und Gehör finden, damit sie nicht an der Notwendigkeit eines vereinten Dominions Indien desillusioniert werden."
 RAJ_reinforce_reserved_seats: "Festlegung der Rolle der Reservierten Plätze"
 RAJ_reinforce_reserved_seats_desc: "Reservierte Sitze im Parlament gewährleisten die Vertretung der Glaubensgemeinschaften und sorgen dafür, dass Grundbesitzer und Fürsten angemessen Gehör finden und nicht praktisch zum Schweigen gebracht werden. Viele politische Kräfte sind mit diesem Konzept nicht ganz einverstanden, weshalb wir deren Vorrang stärken und sicherstellen sollten, dass sie hier mitreden können."
 RAJ_reward_loyal_princes: "Belohnung treuer Fürsten"
 RAJ_reward_loyal_princes_desc: "Die treuen Fürsten im Nordwesten des indischen Kontinents, darunter unter anderem der Maharadscha von Jammu und Kaschmir, waren unverzichtbar, um das Überleben des Dominions gegen die verräterischen Kräfte Osmans und die sozialistische Hinterhältigkeit des INC zu sichern. Wir werden unsere Wertschätzung für ihre Treue zum Ausdruck bringen und ein starkes Beispiel dafür setzen, dass Treue immer die richtige Wahl ist."
 RAJ_propound_party_anglophilia: "Anglophilie der Partei betonen"
 RAJ_propound_party_anglophilia_desc: "Unser Engagement für die Sache der Entente muss durch deren Unterstützung für die Sache des Dominions ergänzt werden. Die Unionisten sind die anglophilste Partei Indiens, und das werden wir betonen, denn gute Beziehungen zur Krone können für uns nur von Vorteil sein."
 RAJ_empower_panchayati_raj: "Stärkung des Panchayati Raj"
 RAJ_empower_panchayati_raj_desc: "Das Panchayati Raj ist ein System lokaler Versammlungen älterer Gemeindevorsteher, die Streitigkeiten schlichten und die Gemeinden auf kommunaler Ebene leiten. Wir werden ihre administrativen, finanziellen und gesetzgeberischen Befugnisse ausbauen und die Vorrangstellung des Systems in der lokalen Verwaltung stärken."
 RAJ_institute_price_controls: "Einführung von Preisregulierungen in der Landwirtschaft"
 RAJ_institute_price_controls_desc: "Bestimmte Praktiken auf dem Agrarmarkt haben dazu geführt, dass Landwirte gezwungen sind, ihre Erzeugnisse unter Wert zu verkaufen, wodurch ihnen nicht mehr genügend Gewinn bleibt, um ihre eigenen Flächen zu bewirtschaften. Dies wird auf lange Sicht verheerende Folgen haben. Um die Stabilität der ländlichen Wirtschaft und unserer Nahrungsmittelversorgung zu gewährleisten, müssen wir daher Preisregulierungen einführen, damit Landwirte ihre Erzeugnisse ohne Sorgen gewinnbringend verkaufen können."
 RAJ_regrow_the_zamindar_system: "Wiederherstellung der verlorenen Zamindars"
 RAJ_regrow_the_zamindar_system_desc: "Das Zamindari-System in Ost- und Zentralindien wurde von der illegitimen ehemaligen Bharatiya-Volksrepublik weitgehend zerschlagen. Wir werden diese verlorenen Zamindars wiederherstellen und die zerstörerische \"Landreform\" rückgängig machen, die die Besatzer eingeführt haben, um ihre autokratische Herrschaft zu festigen."
 RAJ_peasant_educational_initiatives: "Bildungsinitiativen für Landbewohner"
 RAJ_peasant_educational_initiatives_desc: "Das Bildungsniveau der Landbevölkerung hat nie den erforderlichen Standard erreicht. Wir werden staatlich gelenkte Initiativen finanziell unterstützen, um sicherzustellen, dass arme Inder, ob jung oder alt, Zugang zu der Bildung erhalten, die notwendig ist, damit sie ihrem Land und ihren Gemeinden mit größtmöglicher Effizienz dienen können."
 RAJ_cemented_unionist_legacy: "Das Erbe der Unionisten fest verankert"
 RAJ_cemented_unionist_legacy_desc: "Wir haben Herausforderungen überstanden, angesichts derer die meisten zusammenbrechen und um Gnade flehen würden. Wir haben mit aller Kraft gekämpft und unsere Ziele und unser Vermächtnis zum Wohle Indiens durchgesetzt – und wir waren erfolgreich. Die Unionisten haben Parteizweigstellen in ganz Indien gegründet und sind nun die führende Organisation, die die konservativen Interessen Indiens vertritt!"

 RAJ_the_preemptive_strike: "Der Präventivschlag"
 RAJ_the_preemptive_strike_desc: "Es ist unvermeidlich, dass die Rebellen im Osten uns angreifen werden, ganz gleich, wie lange wir den Konflikt noch hinauszögern möchten. Sollte die Republik jedoch bei einem Invasionsplan ins Straucheln geraten, wäre es töricht, nicht zuerst zuzuschlagen, solange sie noch in einem Sumpf aus Verwirrung feststeckt; daher müssen wir bereit sein, einzumarschieren, falls es dazu kommen sollte."
 RAJ_bhutan: "Umgang mit Bhutan"
 RAJ_bhutan_desc: "Nachdem wir unsere Kontrolle über den indischen Subkontinent gefestigt haben, ist es an der Zeit, unseren Blick auf unsere nördliche Grenze zu richten. In China erheben sich neue Großmächte, und der Himalaya steht erneut im Mittelpunkt eines neuen Großen Spiels. Wir müssen unsere Kontrolle über unsere alten Verbündeten in Bhutan wiederherstellen, sei es durch Verträge oder mit Gewalt."
 RAJ_nepal: "Umgang mit Nepal"
 RAJ_nepal_desc: "Nepal dehnte sich in dem Chaos nach dem Weltkrieg bis in die indischen Tiefländer aus. Es ist an der Zeit, unseren Anspruch auf diese Gebiete erneut geltend zu machen."
 RAJ_siam: "Die Burmesischen Gebiete in Siam"
 RAJ_siam_desc: "Das Königreich Siam gehörte zu den opportunistischsten der 'Geierstaaten', die die Unruhen nach dem Zusammenbruch des Raj ausnutzten. Da die junge burmesische Nation durch die sozialistischen Aufstände in Assam und Bengalen stark unter Druck stand, besetzte die Regierung von Siam einfach mehrere Bezirke und Präfekturen, darunter auch die Stadt Moulmein – die in Kiplings berühmtem Gedicht erwähnt wird. Diese Gebiete müssen zurückgegeben werden!"
 RAJ_fate_of_the_frontier: "Das Schicksal der Grenzregion"
 RAJ_fate_of_the_frontier_desc: "Während des ersten Bürgerkriegs wurde die Nordwest-Grenzprovinz durch eine opportunistische Invasion Afghanistans fast vollständig erobert. Seitdem steht sie unter afghanischer Besatzung; doch nun, da das Land wieder vereint ist, ist es an der Zeit, diese Unverschämtheit zu ahnden und die Provinz zurückzuerobern."
 RAJ_goa: "Goa beanspruchen"
 RAJ_goa_desc: "Die Enklave Goa ist nichts weiter als ein Stachel im Fleisch unserer stolzen Nation. Sie gehört zu Recht zu unserem Hoheitsgebiet und muss zurückgegeben werden."
 RAJ_pondicherry: "Pondicherry beanspruchen."
 RAJ_pondicherry_desc: "Die Enklave Pondicherry ist nichts weiter als ein Stachel im Fleisch unserer stolzen Nation. Sie gehört zu Recht zu unserem Hoheitsgebiet und muss zurückgegeben werden."
 RAJ_ceylon: "Ceylon beanspruchen"
 RAJ_ceylon_desc: "Eigentlich gehören Ceylon, die Malediven und die anderen Inseln im Indischen Ozean zum rechtmäßigen Hoheitsgebiet unserer Nation. Ihr Kolonialismus muss ein Ende finden."
 RAJ_burma: "Burma eingliedern"
 RAJ_burma_desc: "Obwohl sich Burma in Geschichte und Kultur vom Rest des Raj unterschied, stand es einst unter dessen Herrschaft. Wie der Rest des Raj befanden sich Teile des Landes unter direkter britischer Herrschaft, während andere unter der Kontrolle lokaler Herrscher standen, vergleichbar mit den Fürstenstaaten, und unter der festen Autorität der britischen Krone standen. Nachdem wir mit den rebellischen sozialistischen und fürstlichen Regierungen fertig geworden sind, dürfen wir nicht zulassen, dass ein Teil des Raj als unabhängiges Vorbild für zukünftige Verräter und Rebellen bestehen bleibt."
 RAJ_tibet: "Die McMahon-Linie bekräftigen"
 RAJ_tibet_desc: "Während wir mit dem Kampf gegen die sozialistische Bedrohung und verräterische Fürsten beschäftigt waren, sind die Ansprüche, die wir durch sorgfältige Verhandlungen mit Tibet gesichert hatten, verfallen und wieder in lokale Hände übergegangen. Da wir durch unsere jüngsten Siege unsere Macht über den Subkontinent wiederhergestellt haben, bietet sich uns nun erneut die Gelegenheit, unseren Anspruch auf diese Regionen geltend zu machen, und wir haben neuen Schwung gewonnen, um das Raj vor äußeren Bedrohungen zu schützen."
 RAJ_aksai_chin: "Wiederherstellung der Ardagh-Johnson-Linie"
 RAJ_aksai_chin_desc: "Die Ardagh-Johnson-Linie, die ursprünglich errichtet wurde, um angesichts der damaligen Bedrohung durch das zaristische Russland eine starke Vorpostenpräsenz zu gewährleisten, gilt nach wie vor als der nördlichste Gebietsanspruch des Raj – ganz gleich, welche Gefahren heute jenseits ihrer Mauern lauern mögen. Ihre Sicherung wird uns erneut einen starken Puffer verschaffen, sollten wir erneut einer Bedrohung von jenseits der Berge ausgesetzt sein."

### Bookmark ###
 RAJ_KR_gathering_storm_desc: "Die Versuche, das Raj nach dem Weltkrieg zu reformieren, kamen zu spät und waren zu halbherzig, um das Juwel an das Empire zu binden. Als die Heimatinseln in die Strömungen der Revolution gerieten, folgten gleichgesinnte Aufstände in Indien. Was folgte, war ein blutiger Bürgerkrieg, der erst Anfang 1927 durch einen wackeligen Waffenstillstand beendet wurde. Selbst diejenigen, die Großbritannien während dieses Krieges die Treue gehalten hatten, konnten den Status quo nicht länger ertragen, und die Exilregierung gab bald ihren Forderungen nach dem Status eines Dominions nach. Diese Loyalisten befinden sich nun in einem Verteidigungspakt mit den Fürsten des Südens und bereiten sich darauf vor, dass die Rebellen den Konflikt schließlich wieder entfachen."

### Intro Screen ###
 RAJ_country_intro_background: "GFX_RAJ_intro"
 RAJ_country_intro_header: "Geschichte der Indischen Revolution"
 RAJ_country_intro_content: "Als der Weltkrieg begann, reagierte kein Ort im gesamten Britischen Empire loyaler als Indien. 'Die Schwerter der kriegerischen Fürsten sprangen aus ihren Scheiden', wie es ein Reporter formulierte. Von den Schützengräben der Westfront bis zu den Wüsten Arabiens kämpften die Truppen des British Raj unermüdlich für ihren König-Kaiser und den Ruhm der Schlacht. Die aufkeimende indische Nationalbewegung hoffte jedoch auch, dass ihre uneingeschränkte Unterstützung für die Kriegsanstrengungen nach Kriegsende zu politischen Reformen im eigenen Land führen würde.\n\nTrotz aller Bemühungen der Entente-Truppen war der Krieg bis 1919 praktisch verloren, wobei die Massenmeutereien nach der Schlacht von Saint-Mihiel den endgültigen Todesstoß bedeuteten. Es wurde ein Friedensvertrag unterzeichnet, der stark zugunsten der Deutschen ausfiel, obwohl Großbritannien – und damit auch Indien, von den schlimmsten Reparationszahlungen verschont blieben. Die Niederlage schreckte die indische Reformbewegung nicht ab, die nun lautstark die Umsetzung der Selbstverwaltung forderte. Als diese Forderungen stattdessen mit einer halbherzigen Dezentralisierung in Form des Diarchie-Systems sowie einer drastischen Ausweitung der Notstandsbefugnisse beantwortet wurden, schwoll die Wut im ganzen Land an und verbreitete die Idee des Swaraj in ganz Indien.\n\nAls der Mord an 41 streikenden Bergarbeitern in Wales die Britischen Inseln in den Strudel der Revolution riss, schlossen sich gleichgesinnte nationalistische Revolutionäre in Indien diesem Beispiel an. Zwar wurden diese ersten Aufstände schnell niedergeschlagen, doch die Brutalität, mit der sie bekämpft wurden, entfachte bald darauf Massenunruhen auf dem gesamten Subkontinent. Diese Unruhen gipfelten schließlich in der Verkündung des Purna Swaraj durch die Führung des Indischen Nationalkongresses und der Bildung einer provisorischen unabhängigen Regierung in Kalkutta. Die Folge dieser Erklärung war ein blutiger Bürgerkrieg zwischen den Anhängern des Empire und den Anhängern dieser neuen Regierung.\n\nDa die Metropole in einem Sumpf aus Chaos feststeckte, standen die britischen Truppen in Indien diesen Rebellen letztendlich weitgehend auf sich allein gestellt gegenüber, insbesondere nachdem eine Welle früher Überläufer sie daran gehindert hatte, den Aufstand im Keim zu ersticken. Den der Regierung in Kalkutta treu ergebene Rebellentruppen übernahmen rasch die Kontrolle über weite Teile des Landes, wobei der Fall der provisorischen britischen Hauptstadt in Delhi weithin als Zeichen des Sieges der Rebellen gefeiert wurde. Diese Überheblichkeit sollte ihnen jedoch letztendlich zum Verhängnis werden, als die Rebellen begannen, ihre Bemühungen auf die Eroberung des Südens zu verlagern.\n\nAus Angst vor ihrer Absetzung im Falle eines Sieges der Regierung in Kalkutta und in der Überzeugung, dass die Briten vollständig zerschlagen seien, schlossen sich die vielen unterschiedlichen Fürsten des Südens unter der Führung von Osman Ali Khan von Hyderabad zusammen, um ihre eigene Unabhängigkeit als \"All-Indische Föderation\" zu erklären, die umgangssprachlich als Fürstenbund bekannt wurde. Diese Erklärung wurde von Kalkutta nicht anerkannt, das Angriffe auf die fürstlichen Armeen der Föderation startete, zunächst mit großem Erfolg. Bedeutende Staaten wie Indore und der größte Teil von Baroda fielen an die Rebellen, doch diese Überdehnung führte zur Neuorganisation der britischen Truppen im Punjab.\n\nVon Lahore aus operierend führte der britische Gegenangriff zur Rückeroberung von Rajputana und des größten Teils des östlichen Punjab sowie zur Konsolidierung ihrer verbleibenden Gebiete in der Region. Die Unfähigkeit Kalkuttas, diesen Zweifrontenkrieg aufrechtzuerhalten, führte schnell dazu, dass sich beide Frontlinien verfestigten, wobei sich die Briten und die Föderation eingraben und ihre Stellungen festigen konnten. Da ein Ende des Krieges nicht in Sicht war, wurde Anfang 1927 ein angeblich vorübergehender Waffenstillstand zwischen allen Parteien ausgehandelt, der letztendlich für die meisten Beteiligten das de facto Ende des Bürgerkriegs bedeutete."

 RAJ_country_intro_header_1: "Die Zwischenkriegsjahre bis zur Gegenwart"
 RAJ_country_intro_content_1: "Auch wenn Frieden geschlossen wurde, sollte das durch den Bürgerkrieg verursachte Chaos alle Kriegsparteien tiefgreifend prägen. Im Westen wurden die verbleibenden Gebiete Britisch-Indiens und die noch unter britischer Oberhoheit stehenden Fürstenstaaten zu einem vereinigten Dominion umgestaltet, das von einer gewählten einheimischen Regierung geführt wurde. Die ersten Wahlen im Jahr 1929 brachten eine von den Liberalen geführte Regierung hervor, die jedoch 1934 den Unionisten unter Khizar Tiwana Platz machte. Parallel dazu wurde 1933 der Maharadscha und Kriegsheld Ganga Singh zum ersten einheimischen Generalgouverneur ernannt, was wesentlich zur Normalisierung der neuen Regierung beitrug.\n\nIm Osten hingegen verliefen die Jahre dazwischen weitaus turbulenter. Nach dem Waffenstillstand wurde eine Verfassung für die neue Republik ausgearbeitet, die sich in erster Linie an den Vorbildern ihrer Mitrevolutionäre in der Union von Großbritannien orientierte. Bald darauf trat der Kriegsführer Motilal Nehru von seinem Amt und aus der Politik zurück; die Partei wählte Lajpat Rai zu seinem Nachfolger, der als einigende Figur zwischen den verschiedenen Flügeln der Partei fungieren sollte. Unter Rai verfolgte die Republik eine versöhnlichere Politik gegenüber den rivalisierenden Regierungen, in der Überzeugung, dass sich beide mit der Zeit in die Republik integrieren würden.\n\nNach Rais Rücktritt im Jahr 1933 begann die Einheit innerhalb der Partei zu bröckeln. Zwar wurde Fazlul Huq zum Vorsitzenden gewählt, doch Subhas Chandra Bose unternahm einen bemerkenswerten, wenn auch erfolglosen Versuch, ihm den Vorsitz streitig zu machen, und Huqs Abkehr von Rais versöhnlichen Positionen sowie seine stärkere Annäherung an die Dritte Internationale führten zu erheblichen Meinungsverschiedenheiten innerhalb der Partei. Auch der verheerende Zusammenstoß an der Grenze bei Ajmer im Jahr 1935 schwächte Huqs Position erheblich und führte zum Rücktritt seines Stellvertreters; vorerst ist es Huq jedoch gelungen, seinen Posten als Vorsitzender zu behalten.\n\nUnterdessen gerät auch im Süden die Regierung der Föderation zunehmend unter Druck durch den Widerstand gegen ihren Anführer. Während sie ursprünglich als Föderation gleichberechtigter Mitglieder konzipiert war, in der die mächtigsten Führer im Fürstenrat zusammenarbeiten sollten, um gegenseitigen Nutzen zu gewährleisten, hat der zunehmende Missbrauch von Osmans vorbehaltenen Befugnissen zu einem Abgleiten in den Despotismus geführt. Trotz ihrer Differenzen haben sich die vier anderen Mitglieder des Rates im Laufe der Zeit im Widerstand gegen Osmans Autokratie zusammengeschlossen und sind vielen als die \"Großen Vier\" bekannt geworden. Zu Beginn des neuen Jahres erwarten viele, dass dieses scheinbar gescheiterte System endlich zusammenbrechen wird – auf die eine oder andere Weise."

 RAJ_guide: "§MDie Versprochenen Wahlen§!\n£white_dot Schließe den Schwerpunkt §YBeende den Indischen Albtraum§! ab, um die Mission Bevorstehende Wahl zu aktivieren.\n\n §MDie Unionisten halten durch§! ($social_conservative_coloured$)\n£white_dot Die §cUnionisten§! haben nach Abschluss der Mission Bevorstehende Wahlen eine höhere Beliebtheit als die §mLiberalen§! und die §lAIHRP§!.\n\n §MAufstieg der Liberalen Föderation§! ($market_liberal_coloured$)\n£white_dot Die §mLiberalen§! haben nach Abschluss der Mission Bevorstehende Wahlen eine höhere Beliebtheit als die §Unionisten§! und die §lAIHRP§!\n\n §MDie Allindische Selbstverwaltungspartei triumphiert§! ($social_liberal_coloured$)\n£white_dot Die §lAIHRP§! haben nach Abschluss der Mission Bevorstehende Wahlen eine größere Beliebtheit in der Bevölkerung als die §mLiberalen§! und die §cUnionisten§!"

### Events ###

 dominion_of_india_events.3.t: "Der Tod von König Georg V."
 dominion_of_india_events.3.d: "Der entthronte König von Großbritannien, Georg V., erlag schließlich der Krankheit, die ihn seit dem Ausbruch der Revolution auf den Britischen Inseln geplagt hatte. Als Staatsoberhaupt des Dominion Indien wird sein Tod sicherlich bis zur Krönung seines Sohnes Edward für Unruhe unter den rivalisierenden Fraktionen des ehemaligen Raj sorgen."
 dominion_of_india_events.3.a: "Die Entente verharrt in Trauer."

## Schwarzer Montag Ereignisse ##

 dominion_of_india_events.2.t: "Der Schwarze Montag erreicht Indien!"
 dominion_of_india_events.2.d: "Die Schockwellen des deutschen Wirtschaftszusammenbruchs haben nun endlich auch Indien erreicht. Zwar wird davon ausgegangen, dass wir nicht so stark darunter leiden werden wie Europa und andere Länder, die enger mit dem deutschen Wirtschaftsraum verbunden sind, doch haben die Störungen im Handel mit den umliegenden Regionen und die Probleme, mit denen die anderen Länder zu kämpfen haben, unweigerlich auch Auswirkungen auf uns gehabt. Ein Problem, das schnell zu beobachten war, ist die Paranoia unserer Bankinstitute und Gläubiger, die ihre Schuldner nun aggressiver verfolgen, aus Angst, dass die wirtschaftlichen Folgen dazu führen könnten, dass sie ihr Geld nicht zurückbekommen.\n\nEin weiterer – und vielleicht besonders besorgniserregender – Grund zur Sorge ist die Stadt Karachi, eine bedeutende Hafenstadt im Süden, deren Wirtschaft weitgehend vom internationalen Handel abhängt. Am beunruhigendsten ist der Rückgang der Weizen- und Baumwollausfuhren, die einen Großteil unserer Exporte ausmachen und uns angesichts der anhaltenden Krise auf dem größten Teil des indischen Subkontinents finanziell über Wasser gehalten haben. Sollte sich dies zu einem anhaltenden Problem entwickeln, wird nicht nur unsere Wirtschaft zusammenbrechen, sondern es könnte sich auch eine massive Agrarkrise entfalten, die unsere Feinde in Kalkutta zweifellos bei der ersten sich bietenden Gelegenheit ausnutzen werden. Der Mangel an ein- und auslaufenden Schiffen im Hafen von Karachi wird sicherlich zu großen Unruhen unter den dort beschäftigten Hafenarbeitern führen, da ihre ohnehin schon mageren Löhne noch weiter schrumpfen werden..."
 dominion_of_india_events.2.a: "Oh je."

 dominion_of_india_events.7.t: "Hafenarbeiter in Karatschi streiken!"
 dominion_of_india_events.7.d: "Tatsächlich hat der Einbruch des Handelsverkehrs von und nach Karatschi zu den jüngsten Folgewirkungen des Schwarzen Montags geführt. Heute Vormittag haben sich die im Hafen von Karachi beschäftigten Hafenarbeiter und Angestellten offiziell organisiert und befinden sich nun im Streik, wobei sie ausstehende Löhne und die Gefahr von Entlassungen als Gründe anführen. Infolgedessen sind wir von einem drastisch eingeschränkten Handelsverkehr zu einer Situation gelangt, in der Schiffe voll beladen im Hafen liegen und bei unseren noch verbleibenden zuverlässigen Handelspartnern erhebliche Unruhe herrscht, da Import und Export nun über wesentlich kleinere und weitaus weniger leistungsfähige Häfen in Belutschistan und Sindh abgewickelt werden.\n\nDie politischen Auswirkungen sind heftig, denn angesichts der Bedrohung durch die INC direkt jenseits unserer Grenze macht sich in den Parlamenten zunehmend Panik breit, dass eine sozialistische Bewegung im Inland weiter an Boden gewinnen könnte. Sowohl Grundbesitzer als auch Großindustrielle fordern von unserer Regierung eine Reaktion, um die Entstehung ähnlicher Bewegungen in den Städten im Norden zu verhindern, aus denen die Liberale Partei und die Allindische Selbstverwaltungspartei nun Kapital schlagen, um unsere politische Vorherrschaft zu stürzen. Eine rasche Reaktion scheint entscheidend, denn ohne direktes Eingreifen besteht kaum Hoffnung auf eine nennenswerte Verbesserung der Lage."
 dominion_of_india_events.7.a: "Verdammt noch mal!"

 dominion_of_india_events.8.t: "Ende des Streiks der Hafenarbeiter in Karatschi"
 dominion_of_india_events.8.d: "Auf Druck von Premierminister Tiwana beendeten die Behörden von Karatschi den Streik im Hafen von Karatschi gewaltsam, unterstützt durch das einschüchternde Erscheinungsbild der HMS Calcutta, die vor den Augen der Streikenden am Hafenufer auftauchte. Als sich abzeichnete, dass eine beträchtliche Gruppe von Streikenden sich weigern würde, nachzugeben, kam es zum Einsatz von Gewalt, was zu mehreren Verletzten auf beiden Seiten und insgesamt 121 Festnahmen führte. In den folgenden Tagen erschütterte eine Reihe von Razzien, die vom Roten Terror angeheizt wurden, die Stadt, und mehrere Personen, denen Sympathie für den INC und Mitarbeit in dessen Reihen vorgeworfen wurde, wurden zusätzlich inhaftiert. Ein Bericht des Büros des Polizeichefs von Karachi schätzt, dass in den nächsten Monaten möglicherweise eine verstärkte Präsenz der Behörden erforderlich sein wird, dass der Widerstand insgesamt jedoch voraussichtlich gering bleiben wird.\n\nDie Reaktionen der Öffentlichkeit auf das Debakel fielen leicht gemischt aus, wobei die meisten negativen Einschätzungen zum Vorgehen der Regierung während des Streiks aus Angst, als \"syndikalistischer Agitator\" gebrandmarkt zu werden, zurückgehalten wurden. Diejenigen, die sich mit der Haltung der Unionisten zu den Arbeitnehmerrechten beschäftigen, scheinen in Muhammad Ali Jinnah eine Persönlichkeit gefunden zu haben, hinter der sie sich vereinen können. Jinnah hat seine völlige Unzufriedenheit mit den harten Maßnahmen zur Zerschlagung des Streiks deutlich gemacht und argumentiert, dass solche Maßnahmen nur noch mehr Inder in den Bann des Sozialismus treiben und die Gefahr bergen, die ohnehin schon verarmte indische Arbeiterklasse weiter aufzuhetzen.\n\nJinnahs Allindische Selbstverwaltungspartei spricht eine Wählerschaft an, die größtenteils noch immer kein Wahlrecht besitzt; sein Vorstoß für eine vollständige Konföderalisierung des Dominions wird jedoch von einigen der eher unabhängig denkenden Fürstenstaaten unterstützt – darunter Jammu und Kaschmir. Ungeachtet dessen stellt er vorerst keine nennenswerte Bedrohung für unsere Regierungsführung dar und bleibt nicht viel mehr als ein lästiger Dorn im Auge."
 dominion_of_india_events.8.a: "Jinnah klammert sich weiterhin an seine politische Bedeutung."

 dominion_of_india_events.9.t: "Debatte über den Geltungsbereich des Gesetzes über die Lohnzahlung"
 dominion_of_india_events.9.d: "Um zu verhindern, dass sich Ereignisse wie der Streik der Hafenarbeiter in Karachi in Zukunft wiederholen, und um ärmere Inder nach dem wirtschaftlichen Abschwung zu unterstützen, hat die Unionistische Partei offiziell den \"Gesetzentwurf zur Lohnzahlung\" ausgearbeitet, der Lohnabzüge zulasten der Arbeitnehmer einschränken soll. Da der Entwurf von der Mehrheit der Partei unterstützt wird und sogar die Zustimmung einiger Funktionäre der Indischen Liberalen Partei gefunden hat, wird er ohne größere Turbulenzen eingebracht werden. Premierminister Tiwana hofft, dass dies das Ansehen der Unionistischen Partei bei den armen Indern verbessern und hoffentlich unseren Einfluss in den städtischen Zentren ausweiten wird – einem Bevölkerungssegment, in dem die Unionisten außerhalb von Lahore Schwierigkeiten haben. Wie üblich hat sich Muhammad Ali Jinnah als ewiger Gegenspieler der Unionisten positioniert und greift den Gesetzentwurf im Parlament scharf an, wobei er behauptet, er sei viel zu wenig und komme viel zu spät.\n\nJinnah und Mitglieder seiner Partei haben erklärt, dass ein Gesetz ohne die Festlegung eines erhöhten Mindestlohns einem Schlag ins Gesicht der indischen Arbeiter gleichkomme und die Inder weiter radikalisieren werde, sodass sie sich den Agitationen des All-Indian Trade Union Congress und den Machenschaften der Bharatiya People’s Republic an unserer Grenze anschließen würden. Die in der Kammer vertretenen Magnaten und Industriellen weisen jeden Versuch, so etwas durchzusetzen, vehement zurück und erklären, der Schock des Schwarzen Montags habe dazu geführt, dass sich die meisten Unternehmen eine Erhöhung des Mindestlohns einseitig nicht leisten könnten. Diese Ablehnung wird von den Liberalen geteilt, die nun erklären, die Partei werde sich hinter einer einseitigen Verurteilung des Gesetzes vereinen, sollten wir Jinnahs Unnachgiebigkeit nachgeben.\n\nDie Unterstützung der AIHRP zu gewinnen, würde bedeuten, dass die Unterstützung der Liberalen für die Verabschiedung des Gesetzes völlig optional wäre. Einige Unionisten weisen Tiwana darauf hin, dass die Umsetzung von Jinnahs Bestimmung lediglich dazu führen würde, unser Verhältnis zu einer entscheidenden Unterstützerbasis zu schädigen und die Unterstützung durch eine soziale Schicht zu erhöhen, die sich kaum an Wahlen beteiligt. Umgekehrt hat Chhottu Ram seine Zustimmung zu Jinnahs Bestimmung bekundet und die Ansicht geäußert, dass Indien und die indische Wirtschaft nur davon profitieren können, wenn ein Inder mehr Geld in seiner Gemeinschaft ausgeben kann. Letztendlich fällt Tiwanas Entscheidung so aus, dass..."
 dominion_of_india_events.9.a: "Hören Sie auf Jinnah und erweitern Sie den Geltungsbereich des Gesetzes."
 dominion_of_india_events.9.b: "Lehnen Sie diesen utopischen Vorschlag ab, der den Unternehmern nur schaden wird."

 dominion_of_india_events.10.t: "Mukund Ramrao Jayakar geißelt die Unionistische Partei"
 dominion_of_india_events.10.d: "Als Reaktion auf die Verschärfung der Zölle auf Lebensmittel- und Agrarimporte durch die amtierende Regierung ist im Parlament Aufruhr ausgebrochen. M.R. Jayakar, der wohl freimütigste Abgeordnete der Indischen Liberalen Partei, wetterte gegen unsere \"handelsfeindliche\" Politik, nachdem die Importe in Karachi fast zum Erliegen gekommen waren. \"Meine Fassungslosigkeit hat alle Grenzen überschritten, die ich mir jemals hätte vorstellen können, als ich in der Zeitung las, dass Tiwana an einer der schädlichsten Maßnahmen seiner Regierung festhält, obwohl jedem, der klar denken kann, völlig klar ist, dass Zölle derzeit gleichbedeutend damit sind, sich selbst in den Fuß zu schießen – und dann noch in beide Kniescheiben\", lautet ein Zitat, das in vielen Publikationen in Punjab und Karachi wiederholt wurde. Jinnah zögerte kaum, als sich ihm die Gelegenheit bot, einen weiteren Seitenhieb gegen die Unionisten auszuteilen. Er schloss sich Jayakars Äußerungen an und fügte hinzu, dass die Unionisten angesichts ihres rapide schwindenden Mandats offenbar darauf aus seien, das Schiff zum Sinken zu bringen.\n\nNatürlich reifen vor Ort die Früchte unserer Entscheidungen im erwarteten Tempo heran. Der Subsistenzsektor hat sich in dieser stürmischen Zeit über Wasser gehalten, und die Landwirte haben festgestellt, dass ihre Märkte weiterhin stark und aktiv sind. Angesichts des geringen ausländischen Wettbewerbs finden die Landwirte Trost darin, dass ihre Kunden in dieser Krisenzeit nicht auf billigere Importe ausweichen. Die städtische Bevölkerung von Karachi ist natürlich alles andere als begeistert von unserem Programm, und es scheint, als habe es sehr viele Menschen in der Region in die offenen Arme der Liberalen getrieben. Das ist zwar sicherlich bedauerlich, aber auch nicht überraschend. Karachi war schon immer die wichtigste Hochburg der Liberalen, und es war absehbar, dass die Stadt ihnen immer näher rücken würde. Dennoch ist Tiwana weiterhin zuversichtlich, dass die \"kleinen Zamindars\" seine Politik weiterhin gutheißen, denn ihre Loyalität ist weitaus wichtiger als die derjenigen, die ohnehin schon immer zur NLFI oder zur AIHRP geneigt waren."
 dominion_of_india_events.10.a: "Weine niemals über verschüttete Milch."

 dominion_of_india_events.11.t: "Das Schlimmste ist vorbei"
 dominion_of_india_events.11.d: "Während die Sonne erneut über Karachi und kurz darauf über Lahore aufgeht, sind die Auswirkungen der wirtschaftlichen Katastrophe des Schwarzen Montags langsam kaum noch zu spüren. Die Bauern verkaufen ihre Erzeugnisse auf den Märkten, der Handel mit exotischen Waren erwacht langsam aus seinem sprichwörtlichen Dornröschenschlaf, und die Räder der Industrie drehen sich mit ihrer gewohnten Geschwindigkeit. Die Fabriken stellen wieder Mitarbeiter ein, die Züge fahren pünktlich, und der Hafen von Karachi kehrt zu seinem gewohnten Rhythmus zurück. Tiwanas Führungsstärke wird in der Zeitung gewürdigt, und diejenigen, die von den Unionisten enttäuscht waren, finden nun ihren Weg zurück aus dem verführerischen Bann der Opposition. Das Schlimmste der wirtschaftlichen Folgen liegt weit hinter uns, und die Inder blicken nun optimistisch in die Zukunft – eine Einstellung, die sie vor wenigen Monaten noch kaum hatten.\n\nDas Treffen zwischen Generalgouverneur Ganga Singh und Tiwana bestärkte Singh in seiner Überzeugung, dass die amtierende Regierung in der Lage sein werde, das Dominion unter der Krone von Windsor wieder zu vereinen. Singh ist der Ansicht, dass Indien nach der Wiedervereinigung dank seiner Stärke enormen Einfluss im Commonwealth und damit auch im Bündnis der Entente gewinnen werde. Der wirtschaftliche Aufschwung hat diese Überzeugung nur noch bestärkt, denn zweifellos hat Indien nach seiner Vereinigung das Potenzial, zu einer Industriemacht zu werden, die es mit den Vereinigten Staaten und Deutschland aufnehmen kann. Vorerst bleiben die Unionisten der Liebling des königlichen Vertreters in Indien – ein Privileg, das hoffentlich den Test der Zeit bestehen wird. Jetzt gilt es nur noch, die Sozialisten im Osten mit Nachdruck wieder zu integrieren und die Hinterhältigkeit der Fürsten im Süden zu unterbinden."
 dominion_of_india_events.11.a: "Es ist ein beschwerlicher Weg, aber was am Ende darauf wartet, wird sich lohnen."

 ## Politische Ereignisse der Vorkriegszeit ##

 dominion_of_india_events.12.t: "Srinivasa Sastri tritt als Vorsitzender der Liberalen zurück"
 dominion_of_india_events.12.d: "Srinvasa Sastri ist seit langem Parteivorsitzender der Nationalliberalen Föderation Indiens; er übernahm die Macht nach dem Scheitern des Aufstands und bekräftigte die Loyalität der Partei gegenüber dem Dominion. Etwa ebenso lange fungiert er auch als eine der einflussreichsten Persönlichkeiten der „Servants of India Society“ und hat persönlich dafür gesorgt, dass diese dem Dominion treu blieb und eine nominell unpolitische Organisation blieb (obwohl viele Mitglieder der NLFI, die auch mit dieser Organisation in Verbindung stehen, sie nach wie vor als inoffizielles Sprachrohr nutzen).\n\nSastris politische Karriere erstreckt sich über Jahrzehnte, und zu Beginn des Jahres 1936 hat er sich nun endlich entschlossen, in den Ruhestand zu treten. Als er heute Morgen im Parlament seinen Rücktritt ankündigte, schloss er seine Rede mit einem Appell zur Zusammenarbeit zwischen den Parteien, da weitere Spaltungen nur von der existenziellen Bedrohung jenseits der Grenze ausgenutzt würden. Das ist ein schöner Gedanke, den jedoch jeder, der sowohl vernünftig als auch gut informiert ist, sofort als idealistisch und unrealistisch erkennt. Nun benötigt die Indische Liberale Partei einen neuen Vorsitzenden und einen neuen Kandidaten für die Wahl. Zwei Kandidaten sind in den Vordergrund getreten, beide verfügen über umfassende Qualifikationen und werden innerhalb der NLFI gleichermaßen in Betracht gezogen.\n\nDer erste Kandidat ist Mukund Ramrao Jayakar, der wohl schärfste Redner innerhalb der NLFI. Jayakars politische Verbindungen sind weitreichend und äußerst facettenreich: Er war einst Vorsitzender der inzwischen aufgelösten Swaraj-Partei, bevor er sich schließlich der NLFI anschloss. Zudem ist er ein bekanntes Mitglied und eine einflussreiche Persönlichkeit der Hindu Mahasabha, die sich nach dem Stillstand an den Fronten nominell in zwei Teile spaltete und sowohl im Dominion als auch in der Republik aktiv ist. Jayakar ist ein lautstarker Gegner der Union und steht derzeit in einer erbitterten politischen Rivalität mit Jinnah.\n\nDer zweite Kandidat, Tej Bahadur Sapru, ist weitaus moderater. Obwohl er nach wie vor die säkularistischen Ansichten der NLFI unterstützt, ist Sapru ein gemäßigter Parteimitglied, der an einer letztendlichen Abschaffung des Kastensystems interessiert ist. Er ist zwar ebenfalls Mitglied der Hindu Mahasabha, gilt jedoch (im Gegensatz zu Jayakar) nicht als Verfechter der Vorherrschaft der Hindus, und aufgrund seiner anerkannten Fachkompetenz und Beliebtheit (als Lieblingssohn von Sastri) ist er ein sehr starker Kandidat für die Nominierung.\n\nAm Ende kann nur einer ausgewählt werden. Die NLFI wird beschließen, ihre Führung zu übertragen an…"
 dominion_of_india_events.12.a: "Mukund Ramrao Jayakar, der Hitzkopf der Partei!"
 dominion_of_india_events.12.b: "Tej Bahadur Sapru, der Lieblingssohn!"

 dominion_of_india_events.13.t: "Der Stand des Wiederaufbaus in Quetta"
 dominion_of_india_events.13.d: "Vor fast einem ganzen Jahr, am 31. Mai 1935, erschütterte ein gewaltiges Erdbeben die Regionen Quetta und Belutschistan. Es war das schwerste Erdbeben, das jemals in der Region verzeichnet wurde, forderte Zehntausende Opfer und zerstörte mehrere Dörfer durch seine Nachbeben fast vollständig. Die mit Abstand schwersten Schäden gab es in der Stadt Quetta, die fast vollständig zerstört wurde und die meisten Opfer zu beklagen hatte. Tausende Dorfbewohner wurden vertrieben, und erst vor kurzem wurden die wichtigsten Verkehrswege von und nach Quetta wiederhergestellt. Nun grassiert inmitten der Trümmer anderer Dörfer, entlang der Bergpässe und sogar auf den Hauptstraßen das Banditentum. Es breitet sich wie eine Pandemie über das Land aus, und Wiederaufbauteams sowie Hilfsorganisationen haben Mühe, auch nur die Hälfte der Strecke bis zu ihrem Ziel zurückzulegen, ohne in einen Hinterhalt zu geraten.\n\nAus diesem Grund wurde vorgeschlagen, mehr Ressourcen auf den Wiederaufbau in der Region zu konzentrieren. Die für das Gebiet zuständigen Befehlshaber stimmen diesem Vorschlag zu und haben angemerkt, dass eine Finanzspritze sowie eine entschlossene Kampagne gegen Banditentum die Probleme der Wiederaufbaubehörden lindern und den Prozess erheblich beschleunigen würden. Finanzbewusste Regierungsmitglieder haben vorgeschlagen, keine weiteren lebenswichtigen staatlichen Mittel zu binden, sondern stattdessen einen öffentlichen Hilfsfonds einzurichten, in den Spenden von Unternehmen, Fürsten und Privatpersonen fließen, um das Wiederaufbaubudget aufzustocken. Angesichts der jüngsten wirtschaftlichen Einbrüche ist es jedoch höchst unwahrscheinlich, dass dieser Fonds die von den lokalen Behörden beantragten Ausgaben decken wird."
 dominion_of_india_events.13.a: "Wir werden so viel geben, wie wir können."
 dominion_of_india_events.13.b: "Die Kosten muss die Öffentlichkeit tragen."

 dominion_of_india_events.14.t: "Muhammad Ali Jinnah trifft in Srinagar ein"
 dominion_of_india_events.14.d: "Der Fürstenstaat Jammu und Kaschmir entstand im Zuge des Ersten Anglo-Sikh-Kriegs und setzte sich aus einer vielfältigen Region zusammen, in der Hindus, Sikhs, Muslime und sogar einige Tibeter lebten. Heute, nach fast einem Jahrhundert unter der Herrschaft der Dogra, gilt Jammu und Kaschmir in der öffentlichen Wahrnehmung als von einer hinduistischen Elite dominiert, obwohl die Mehrheit der Bevölkerung aus muslimischen Bauern besteht.\n\nDies zeigt sich am deutlichsten in der politischen Landschaft der Region, einem stark polarisierten Umfeld, das zwischen zwei Kräften gespalten ist. Der Maharaja, Hari Singh, ist der Inbegriff des Establishments und verteidigt eifrig die Autonomie seines Staates. Als einer der wichtigsten Stützen für das Überleben des Dominions während des Aufstands steht Hari Singh weiterhin auf unserer Seite; allerdings befürchten einige, er könnte Osmans Truppen willkommen heißen, sollten diese beschließen, die Grenze zu überqueren und dem Dominion ein für alle Mal ein Ende zu setzen. Der zweite Pol der kaschmirischen Politik wird von Scheich Abdullah angeführt, der die Partei Naya Kashmir gründete und sie kurz nach der Gründung des Dominions mit Muhammad Ali Jinnahs Allindischer Selbstverwaltungspartei verbündete. Abdullah und der kaschmirisch-panditische Politiker Prem Nath Bazaz sind die führenden Stimmen des Progressivismus und präsentieren sich als Verteidiger der Kashmiriyat-Philosophie gegen die eiserne Herrschaft der Dogra-Dynastie.\n\nAn einem sonnigen Tag ist Muhammad Ali Jinnah nun in Srinagar, der Hauptstadt von Jammu und Kaschmir, eingetroffen. Seine Mission besteht darin, seinen Einfluss in der Region auszubauen und die Position seiner Partei zu stärken, die gegen den enormen Einfluss und die Patronage der NLFI und der unionistischen Parteien ankämpft. Was eigentlich eine unkomplizierte Wahlkampftour durch das Kaschmir-Tal sein sollte, wird dadurch erschwert, dass Jinnah zwei widersprüchliche Einladungen zu prüfen hat. Scheich Abdullah hat angeboten, sich mit Jinnah zu treffen und gemeinsam eine mitreißende Rede zu halten, die die Stellung ihrer Parteien in der Region stärken soll. Die zweite Einladung stammt von Hari Singh selbst, der angeboten hat, ihn im Sher-Garhi-Palast zu empfangen, um Jinnahs Reformvorschlag für ein konföderales Indien im Gegensatz zu einem föderalen zu erörtern.\n\nAn seinem ursprünglichen Plan festzuhalten und sich zuerst mit Scheich Abdullah zu treffen, scheint im Hinblick auf die Wahrung von Jinnahs öffentlichem Ansehen die schlüssigste Vorgehensweise zu sein. Doch obwohl Scheich Abdullahs Einfluss zwar enorm ist, stellt die Gunst eines derart einflussreichen Fürstenstaates einen Vorteil dar, den man keinesfalls auf die leichte Schulter nehmen darf. So oder so wird ihn ein überaus begeisterter Empfang erwarten, was zumindest ein gewisser Trost ist. Jinnah beschließt dennoch…"
 dominion_of_india_events.14.a: "Sein Bündnis mit Naya Kashmir festigen und dabei den Maharadscha brüskieren."
 dominion_of_india_events.14.b: "Er zollte der Dogra-Dynastie seinen Respekt und brüskierte dabei Scheich Abdullah."

 dominion_of_india_events.15.t: "Die Udrasar-Kisan-Sammelan-Krise"
 dominion_of_india_events.15.d: "Der Staat Bikaner, Heimat des derzeitigen Generalgouverneurs Ganga Singh, ist zum Schauplatz großer Besorgnis für viele geworden, denen unsere nationale Sicherheit am Herzen liegt. Vor Jahren, während des Aufstands der Regierung von Kalkutta, schloss sich der ehemalige Polizist Vaidhya Magharam den Rebellen an und führte einen kleineren Aufstand in den ländlichen Vororten von Bikaner an. Dieser Aufstand wurde rasch niedergeschlagen, doch Magharam entging der Festnahme und hat sich unseren Quellen zufolge in Kalkutta niedergelassen, wo er den \"Bikaner Prajamandal\" gegründet hat. Diese städtische Bewegung unterhält Zellen in den Fürstenstaaten in und um Rajputana, die noch immer unter der Obhut unserer Regierung stehen, und agitiert gegen die \"feudalen und kolonialen Überreste, die die Dominion-Regierung befallen\". Dank der effizienten Arbeit von Charles Tegarts umfangreichem Informantennetzwerk konnten die meisten ihrer Aktivitäten genau überwacht werden, und viele Aktivisten mit Verbindungen zum INC, zu den Prajamandals und zur AITUC wurden verhaftet und daran gehindert, weitere unerwünschte Aufwiegelungen zu betreiben.\n\nTrotz unserer Bemühungen scheint es, als habe sein leidenschaftlicher Wahlkampf seinen Höhepunkt erreicht. Einige Tage zuvor hatte eine Konferenz der Kleinbauern, bekannt als „Udrasar Kisan Sammelan“, stattgefunden, mit dem Ziel, eine Bauernbewegung zu organisieren, um sich gegen die lokale Regierung zu wehren, da diese mit den feudalen Strukturen, die sie unterdrücken, kollaboriert und diese aufrechterhält. Am beunruhigendsten war die Anwesenheit von Vaidhya Magharam, der offenbar die Grenze überquert hatte, um das Bikaner Prajamandal mit der Bauernbewegung zu koordinieren. Nach einem raschen Eingreifen der Polizei kam es zu einer Schlägerei, die in heftige Gewalt ausartete und vier Tote sowie etwa siebenundsechzig Verletzte zur Folge hatte, während auf Seiten der Ordnungskräfte nur minimale Verluste gemeldet wurden. Magharam wurde am Tatort festgenommen und ins Gefängnis gebracht, wo er auf einen fairen Prozess wegen seiner aufrührerischen Aktivitäten wartet.\n\nHeute Vormittag ist es jedoch in Bikaner zu massiven Protesten gekommen. Magharams Verhaftung hat die lokale Bauerngemeinschaft um ihn herum nur noch mehr mobilisiert und seiner Botschaft noch mehr Gewicht verliehen. Vor dem Lalgarh-Palast, wo Ganga Singh derzeit seine Familie besucht, wurde ein großes Polizeiaufgebot entsandt, und die Lage spitzt sich zunehmend zu. Auch im Palast herrscht eine bedrückende Stimmung: Ganga Singh und seine Familie befürchten, dass dies der Beginn eines Aufstands sein könnte und dass ihre Köpfe auf dem Spiel stehen könnten.\n\nEs gibt zwei Möglichkeiten: Entweder beendet die Polizei den Protest gewaltsam und stellt die Ordnung wieder her – auf Kosten großer Unzufriedenheit unter der Bauernschaft des Fürstentums. Oder wir können die Spannungen abbauen, indem wir auf einige ihrer Anliegen eingehen und ein paar halbherzige Versprechungen für ernsthafte Reformen der Institutionen in Bikaner machen (auf Kosten der Verärgerung der Fürsten). Befehle werden erteilt an…"
 dominion_of_india_events.15.a: "Beendet diese Krise, bevor Ganga Singh das gleiche Schicksal ereilt wie die Romanows!"
 dominion_of_india_events.15.b: "Mit Samthandschuhen vorgehen ist der richtige Weg."

 dominion_of_india_events.16.t: "Restaurierung der Festung Lodhi abgeschlossen"
 dominion_of_india_events.16.d: "Die Provinz Punjab ist eines der wichtigsten Gebiete des Dominions, und nahe der Grenze zur Regierung von Kalkutta liegt die Stadt Ludhiana. Die jüngsten Bemühungen zur Restaurierung der Festung von Lodhi wurden durch ihre strategisch wichtige Lage erst recht beflügelt, und heute haben diese Bemühungen endlich Früchte getragen.\n\nAnlässlich der Fertigstellung der offiziellen Renovierungsarbeiten an der Festung leitete Premierminister Hayat Tiwana eine Feierstunde und hielt eine Rede, in der er den Auftrag des Dominions bekräftigte. Tiwana verurteilte die Regierung in Kalkutta als bloßes zweites britisches Raj – nur unter autoritären, militanten Sozialisten anstelle der Briten – und hob die Festung als Symbol für Lahores Engagement zur Verteidigung der Rechte aller Inder gegen die redegewandten Schlangen des INC hervor. Leider war Tiwanas Rede von Stottern und peinlichen Schweigepausen geprägt, was seine mangelnde Erfahrung als Redner deutlich machte und vor der Menge zu einer leichten Verlegenheit führte. Dennoch kam die Botschaft an, und die unter den Anwesenden befindlichen Soldaten zeigten sich erfreut darüber, dass Fragen der militärischen Sicherheit von ihrer Regierung tatsächlich sehr ernst genommen wurden."
 dominion_of_india_events.16.a: "An diesem glücklichen Tag tragen wir den Blick erhoben."

 dominion_of_india_events.17.t: "Die Shahidganj-Affäre"
 dominion_of_india_events.17.d: "Zwischen dem Bahnhof und dem historischen Delhi-Tor in Lahore befindet sich ein Komplex, der ein beträchtliches Grundstück einnimmt, von Sikhs verwaltet wird und seit dem Einsturz eines Mogul-Badehauses als Gurdwara dient. Im vergangenen Jahr entbrannte eine Kontroverse, als die Sikh-Gemeinde begann, den Abriss einer 250 Jahre alten Moschee zu planen, die schon seit langem nicht mehr ihrem ursprünglichen Zweck diente und von den Sikhs als Langar und Lagerraum genutzt wurde. Die Nachricht vom geplanten Abriss löste in der muslimischen Gemeinschaft heftige Empörung aus, doch trotz der Proteste fielen alle gerichtlichen Berufungen und Entscheidungen zugunsten der Sikhs aus.\n\nAuch diejenigen, die auf die Regierung hofften, die Moschee zu retten, hatten nicht die erhofften Antworten erhalten, denn Premierminister Tiwana vermied es, zugunsten der Moschee einzugreifen, aus Angst, die Meinung der Sikhs über die Unionistische Partei entscheidend zu beeinträchtigen. Dies ging teilweise nach hinten los, da Muhammad Ali Jinnah in Abwesenheit der Unionisten als Vermittler einschritt, insbesondere nach einem konfessionellen Aufstand, bei dem drei Muslime und zwei Sikhs ums Leben kamen. Jinnah unterstützte und brachte eine Reihe von Gesetzesentwürfen und Appellen ein, die den Abrissprozess bis mindestens 1936 ausreichend verzögerten, und er schwor, die Unruhen in der muslimischen Gemeinschaft zu besänftigen.\n\nIn der Zwischenzeit fanden mehrere Treffen zwischen einflussreichen Führern der Gemeinschaft statt, und mehrere weitere Demonstrationen führten zu Festnahmen und Chaos auf den Straßen von Lahore. Eine hitzige Debatte zwischen Muhammad Iqbal und Master Tara Singh führte zu einer Welle von Fällen sektiererischer Gewalt in der gesamten Provinz Punjab. Iqbal ist nun sogar so weit gegangen, Gedichte zu veröffentlichen, in denen er die Sikh-Gemeinden verunglimpft, und seine Forderungen zu verstärken, das Dominion solle seinen Anspruch auf Indien aufgeben und stattdessen eine islamische Republik errichten. Das Versäumnis der Regierung, entschlossen zu handeln, hat zu einem Mordfall nahe der afghanischen Grenze geführt, bei dem zwei hinduistische Reisende angeblich von islamischen Fundamentalisten ermordet wurden. Obwohl es sich um einen Fall mit begrenzter Glaubwürdigkeit handelt, der noch intensiv untersucht wird, hat er dennoch den Zorn der NLFI geweckt, die nun das Zögern der Regierung anprangert und sich der zunehmend entschlossenen Haltung der Sikhs angeschlossen hat.\n\nEin Eingreifen gegen die Sikhs würde einen tiefen Keil in unsere Beziehung zur Shiromani Akali Dal treiben und der NLFI eine vorteilhafte Position gegenüber dieser Partei verschaffen. Halten wir uns hingegen an die Gerichtsentscheidungen und lassen den Abriss zu, wird die muslimische Gemeinschaft weiter von uns weg und in die Arme Jinnahs getrieben."
 dominion_of_india_events.17.a: "Diese Gewalt muss ein Ende haben, die Shahidganj-Moschee wird nicht fallen."
 dominion_of_india_events.17.b: "Wir haben kein Recht, gegen die Entscheidungen der Gerichte vorzugehen."

 dominion_of_india_events.18.t: "Der Khan von Kalat vs. Die Shahi Jirga"
 dominion_of_india_events.18.d: "Mitten in Belutschistan gelegen, ist der Fürstenstaat Kalat eines der wichtigsten Zentren des belutschischen Nationalismus. Aus der Region sind mehrere Parteien hervorgegangen, darunter die Anjuman-e-Ittehad-e-Balochistan und ihr radikaler Ableger, die Kalat State National Party, eine revanchistische und ultranationalistische belutschische Partei, die diskrete Unterstützung vom sehr unabhängig denkenden Khan von Kalat, Ahmad Yar Khan, erhält. Ahmads Temperament und seine Unnachgiebigkeit werden nur durch den Mann gemildert, den er als seinen \"politischen Vater\" bezeichnet: Muhammad Ali Jinnah, dessen Programm einer weiteren Konföderalisierung den Zielen des Khans sehr entgegenkommt. Das soll nicht heißen, dass Jinnah irgendeine Art von Monopol auf die Region hat, da der Anjuman und die Shahi Jirga (ein Stammesverwaltungsgremium, das über reservierte Sitze im Parlament verfügt und zudem Exekutiv-, Justiz- und Gesetzgebungsbefugnisse über die paschtunischen und belutschischen Stämme ausübt) fest auf der Seite der Unionisten stehen.\n\nDie Shahi Jirga und Ahmad Yar Khan hatten ein sehr angespanntes Verhältnis zueinander. Viele der Modernisierungs- und Reformbemühungen des Khans wurden von der Jirga vereitelt, darunter die Abschaffung des Bijar (Feiersteuer), des Pursi (Todessteuer) und des Mali (Jahressteuer), die der Khan größtenteils für unnötig hält. Nun versucht der Khan von Kalat, die Shahi Jirga vollständig zu untergraben, indem er ihre Rolle als repräsentatives Gremium in Kalat durch ein mit weitreichenden Befugnissen ausgestattetes Kabinett und ein modernisiertes Gesetzgebungssystem auf der Grundlage eines eingeschränkten Wahlrechts ersetzt. Kritiker dieses Vorhabens beanstanden, dass diese Sitze dafür vorgesehen sind, mit Verbündeten des Khans und der KSNP besetzt zu werden, wodurch der Anjuman und die Jirga aus der Landespolitik ausgeschlossen und seine despotische Herrschaft gefestigt würden.\n\nZweifellos sind die Jirga und die sie unterstützenden lokalen Sardars in den letzten Jahren zunehmend korrupt geworden, haben Reichtümer angehäuft und wenig unternommen, um die Rückständigkeit der Region zu mildern. Dennoch stellt sie nach wie vor ein wichtiges Gegengewicht zu Khans Bestrebungen nach einem unabhängigen Belutschistan dar. Der Anjuman war ein großer Gewinn bei der Förderung unionistischer Programme in der Region; sein Machtverlust würde unsere Kontrolle erheblich schwächen. Durch den gezielten Einsatz von Patronage, um kommunale Unterstützung zu gewinnen und damit eine Exekutiventscheidung gegen den Khan zu untermauern, können wir sicherstellen, dass er seine angestrebte Umgestaltung des lokalen Systems nicht umsetzen kann. Wir müssen uns jedoch zwingend folgende Frage stellen: Lohnt es sich, Kapital zu investieren, um unseren Einfluss in einer so abgelegenen, unterentwickelten Region zu sichern?"
 dominion_of_india_events.18.a: "Wir werden ein paar Leuten einen Gefallen tun, die Shahi Jirga wird nicht auseinandergenommen."
 dominion_of_india_events.18.b: "Vielleicht wird der Khan sein neu gewonnenes Mandat für gute Zwecke nutzen?"

 dominion_of_india_events.19.t: "Gescheiterte Revolution in Port Blair!"
 dominion_of_india_events.19.d: "Die Andamanen und Nikobaren sind ein Territorium des Dominions in der Bucht von Bengalen und einer unserer wichtigsten Stützpunkte für die Seemacht. Die größte Siedlung, Port Blair, beherbergt das \"Cellular Jail\", einen riesigen Gefängniskomplex, in dem vor allem Revolutionäre und politische Gefangene untergebracht sind. Die Verteidigungsanlagen und die Sicherheitsvorkehrungen dieser Einrichtung sowie der Inseln wurden im letzten Jahrzehnt mehrfach verbessert, da das feindliche Regime in Kalkutta eine existenzielle Bedrohung für das Gefängnis darstellte. Es scheint jedoch, als habe dies nicht ausgereicht, denn eine Explosion im zweiten Flügel, gefolgt vom Auftreten mehrerer Aufständischer, die inzwischen als Mitglieder der Hindustanischen Sozialistischen Republikanischen Vereinigung identifiziert wurden, hätte beinahe dazu geführt, dass der gesamte Komplex in gewalttätige Unruhen versank. Die Sicherheitskräfte reagierten entsprechend, schalteten die Revolutionäre aus und nahmen die Flüchtigen innerhalb von dreißig Stunden nach dem Vorfall wieder fest.\n\nNachdem sich die Lage beruhigt hat, kam es in ganz Port Blair zu einer massiven Verhaftungswelle, darunter auch gegen einen beliebten lokalen Dichter namens Diwan Singh Dillon, der von der Polizei wegen angeblicher Verbindungen zu den Gandhisten-Sekten des INC sorgfältig überwacht wurde. Um zu zeigen, dass Handlungen Konsequenzen nach sich ziehen, wurde sowohl gegen die neu Inhaftierten (einschließlich Diwan Singh) als auch gegen einige der schlimmsten Straftäter im Gefängnis eine massive Welle von Todesurteilen verhängt."
 dominion_of_india_events.19.a: "Wer nach Konsequenzen sucht, wird sie auch bekommen."

 dominion_of_india_events.20.t: "Der Tod von Bhupinder Singh"
 dominion_of_india_events.20.d: "Der im Exil lebende Maharaja von Patiala, Bhupinder Singh, war seit langem ein Verfechter des Dominion of India und nach dem Aufstieg der unabhängig gesinnten Fürsten des Dekkan ein äußerst einflussreicher anglophiler Fürst. Es gelang ihm, sein enormes Vermögen während der Revolution in Sicherheit zu bringen; er übte großen Einfluss in fürstlichen Kreisen aus und setzte sich unermüdlich für den Aufbau herzlicher und kooperativer Beziehungen zwischen den Regierungen von Lahore und Hyderabad ein. Nachdem er jedoch nach einem üppigen Bankett in Cochin im Hafen von Karachi angekommen war, erlitt er einen Herzinfarkt und brach am Kai zusammen. Nach einem Tag der Ungewissheit wurde er für tot erklärt.\n\nDie Plötzlichkeit seines Todes hat zahlreiche Verschwörungstheorien angeheizt, wobei sein Sohn und Nachfolger Yadavindra Singh hinter verschlossenen Türen behauptete, die Fürsten aus dem Süden müssten ihn vergiftet haben. Als die Presse begann, über diese Theorien zu spekulieren, hielt Premierminister Tiwana bei der Beerdigung eine Rede und entschied sich, diese Theorien öffentlich zurückzuweisen; stattdessen schob er die Schuld auf Vertreter der AITUC und des INC, um diplomatische Spannungen zwischen dem Dominion und der Fürstenregierung zu vermeiden. Dies verärgerte Yadavindra, der daraufhin den Premierminister ignorierte und später einem Freund gegenüber seine Verärgerung darüber äußerte, dass Tiwana die Beerdigung seines Vaters \"politisiert\" habe. Ob es nun an Tiwanas umstrittener Grabrede lag oder eine natürliche Folge der Sympathien war, die der Prinz schon seit geraumer Zeit hegte – Yadavindra soll der Indischen Liberalen Partei eine beträchtliche Geldsumme gespendet haben und damit begonnen haben, sich in hinduistischen Fürstenkreisen für sie einzusetzen."
 dominion_of_india_events.20.a: "So oder so, Ganga Singh trauert tief um seinen alten Freund."

 dominion_of_india_events.21.t: "Kommunale Unruhen in Sindh"
 dominion_of_india_events.21.d: "In Sindh, wo die bedeutendste jüdische Gemeinde des Dominions ansässig war, wurde Abraham Reuben bei den Kommunalwahlen in Karatschi im Jahr 1936 zum ersten jüdischen Mandatsträger Indiens (als Stadtrat) gewählt. Stadtrat Reuben hat sich seitdem der Vertretung der marginalisierten jüdischen Gemeinde in der Lokalpolitik verschrieben und half bei der Finanzierung der Renovierung der Magain-Shalome-Synagoge, die vor zwei Wochen abgeschlossen wurde. Dies erregte jedoch den Zorn der örtlichen muslimischen Gemeinde, die seit über einem Jahrzehnt für die Restaurierung der vernachlässigten Manzilgah-Moschee in der nördlichen Stadt Sukkur petiert. Zafar Ali Khan, ein einflussreicher muslimischer Dichter, kritisierte scharf die Schnelligkeit, mit der die Magain-Shalome-Synagoge renoviert wurde, im Gegensatz zu dem schleppenden Fortschritt bei den Plänen für die Manzilgah-Moschee, und forderte die Muslime auf, die Restaurierung der Moschee um jeden Preis energisch voranzutreiben. Die Restaurierung wurde vor allem durch den hinduistischen Sadhu-Belo-Tempel auf einer Insel direkt gegenüber am Fluss verzögert, da die hinduistische Gemeinde der Stadt sich entschieden gegen eine aktive Moschee in unmittelbarer Nähe eines verehrten Tempels ausspricht.\n\nThe current governor of the Sindh province, Ghulam Hussain Hidayatullah, has maintained the status quo regarding the mosque as he fears alienating the Hindu population in the province. Zafar Ali Khan renewed a direct plea to Ghulam, who refused once again to propel any plans for restoration. In response, Ali Khan and his supporters have commenced a boycott of Hindu goods in the entire province and en masse occupied the site of the Manzilgah, leading to numerous arrests and an over-crowding crisis in the local jails. This instability actually led to Ghulam wavering on his position and making a half-empty promise to thoroughly explore the possibility of restoration, which prompted much jubilation from the Muslim community.\n\nOn the contrary, B.S. Moonje and the Hindu Mahasabha issued a threat to the governor that if any renovations were to take place at Manzilgah,a call would be made for the Hindus of Sindh to withdraw all of their support for his government. This caused Ghulam to backpedal on his statements and a further inflammation of the situation. The Hindu Mahasabha called a demonstration in the city which led not long after to a devastating riot between Muslims and Hindus, causing 198 deaths between the two groups and a full lockdown of the city. Ghulam has now appealed directly to our government for guidance on how to proceed, fearing the sectarian violence will spread outside of Sukkur into Sindhi Hyderabad and Karachi."
 dominion_of_india_events.21.a: "Empfehlung für die rasche Wiederherstellung der Masjid Manzilgah."
 dominion_of_india_events.21.b: "Den Status quo beibehalten und einen anderen Standort für den Bau einer neuen Moschee vorschlagen."

## Ereignisse der Armee ##

 dominion_of_india_events.22.t: "Unordnung im Oberkommando"
 dominion_of_india_events.22.d: "Die Armee des Dominion Indien leidet seit langem unter zahlreichen Mängeln, von denen viele aus dem Militärapparat des British Raj stammen. Da sie sich aus einer Mischung aus indischen und weißen Offizieren zusammensetzt, liegt ein Großteil des Einflusses in der Regel bei Generälen der alten Garde und konservativ gesinnten Generälen. Mit der Integration von Institutionen wie den Streitkräften der indischen Fürstentümer und der angemessenen Umstrukturierung der Armee wurde Philip Walhouse Chetwode betraut, ein Veteran des Zweiten Burenkriegs und des Ersten Weltkriegs. Chetwode spielte eine entscheidende Rolle bei der Überwachung der Indisierung der Armee und brachte sie auf \"moderne\" Standards, wobei Letzteres in letzter Zeit von einigen angefochten wurde.\n\nViele der jüngeren und ehrgeizigeren Generäle und Stabsoffiziere befürworten mittlerweile rasche Fortschritte bei der professionellen Mechanisierung der Armee, in Anlehnung an die Entwicklungen in der deutschen und der russischen Armee. Durch die konsequente Umsetzung dieser Reformen wird ein entscheidender Vorteil gegenüber den Armeen der Bharatiya-Volksrepublik und – im schlimmsten Fall – dem Fürstenbund im Süden erzielt. Philip Walhouse Chetwode hat einen weitaus bescheideneren Plan für die Zukunft der Armee und lehnt Panzer rundweg als unrealistisch ab, da das vom Dominion kontrollierte Gebiet nicht ausreichend erschlossen sei. Stattdessen befürwortet er die Förderung der persönlichen Standhaftigkeit der Soldaten und setzt darauf, dass die Kavallerie die Rolle der Panzer auf dem Schlachtfeld übernimmt. Er geht davon aus, dass die Republik zumindest in den nächsten fünf Jahren nicht in der Lage sein wird, Panzer angemessen einzusetzen.\n\nAus Angst, dass seine Sturheit die Armee nur behindern wird, haben diese Stabsoffiziere dem Ministerpräsidenten und dem Generalgouverneur ihre Meinung mehr als deutlich gemacht. Es gab mehrere informelle Aufforderungen an uns, den Rücktritt von Chetwode zu fordern, damit sich in der Armee neue Ideen entfalten können – Aufforderungen, auf die wir lieber früher als später eine endgültige Antwort geben sollten."
 dominion_of_india_events.22.a: "Ohne interne Konflikte wäre es doch keine Armee, oder?"

 dominion_of_india_events.23.t: "Philip Walhouse Chetwode tritt zurück"
 dominion_of_india_events.23.d: "Vor drei Tagen nahm Generalgouverneur [RAJ.GetLeader] den Chef der Armee beiseite, um ein ernstes Gespräch über die militärische Zukunft des Dominions zu führen. Er schloss sich der Meinung verschiedener verärgerter Generäle im Oberkommando an und schlug Chetwode angesichts seines fortgeschrittenen Alters vor, zugunsten einer anderen Person zurückzutreten. In einer defensiven Haltung versuchte Chetwode, seine Position zu verteidigen und an den \"Sinn für Rationalität\" zu appellieren, wirkte dabei auf den Generalgouverneur jedoch äußerst herablassend.\n\nTrotz dieses kurzen Fehltritts beugte sich Chetwode letztendlich seinem Rangbewusstsein und reichte seinen Rücktritt ein. Obwohl es innerhalb der Armee wegen seiner Vorgehensweise und Führungsstil zu erheblichen Meinungsverschiedenheiten gekommen war, wurde sein Rücktritt von der gesamten Truppe und dem Stab einstimmig mit Respekt aufgenommen. Auch wenn er als Chef der Armee zurücktritt, wird Chetwode auf absehbare Zeit Feldmarschall bleiben, was bedeutet, dass seine Karriere noch nicht ganz vorbei ist."
 dominion_of_india_events.23.a: "Auch wenn er sicherlich bedauert, dass es nicht mit mehr Glanz enden wird."

 dominion_of_india_events.24.t: "Philip Walhouse Chetwode bleibt im Amt"
 dominion_of_india_events.24.d: "Vor drei Tagen nahm Generalgouverneur [RAJ.GetLeader] den Chef der Armee beiseite, um ein ernsthaftes Gespräch über die militärische Zukunft des Dominions zu führen. Da er letztendlich zu dem Schluss kam, dass Chetwodes Vorschläge realistischer auf die aktuelle Lage der Rüstungsindustrie und die Modernisierung des Dominions ausgerichtet waren, versicherte er Chetwode, dass er seine volle Unterstützung für den Verbleib im Amt des Chefs der Armee habe.\n\n[RAJ.GetLeader] versandte ein Memo, das bei den Offizieren und dem Stab einging und in dem auf die Unzufriedenheit im Militär über Chetwodes Führung hingewiesen wurde; darin hieß es, dass zwar alle Bedenken sorgfältig angehört worden seien, Chetwode jedoch auf absehbare Zeit im Amt des Heereschefs verbleiben werde. Gerüchten zufolge soll er nach der Wiedervereinigung des Kontinents von seinem Amt zurücktreten, zufrieden damit, dass die Wiedervereinigung das Kronjuwel seiner Karriere darstellt. Trotz ihrer früheren lautstarken Proteste scheinen sich die Unnachgiebigen unter den hohen Offizieren ohne Widerstand anzupassen und die Realität der Situation so zu akzeptieren, wie sie ist."
 dominion_of_india_events.24.a: "Ein so erfahrener Mann wie Chetwode wird uns zum Sieg führen."

 dominion_of_india_events.25.t: "Philip Walhouse Chetwode tritt zurück"
 dominion_of_india_events.25.d: "Nach der erfolgreichen Wiedervereinigung Indiens ruht sich Philip Walhouse Chetwode zufrieden auf seinen Lorbeeren aus. Während er auf dem Balkon seines Hauses eine schöne, heiße Tasse Tee genießt, lässt er seine Karriere Revue passieren. Mehr als selbstzufrieden darüber, dass seine Armeeführung das Dominion trotz aller Widerstände zum Sieg über seine Gegner geführt hat, ist er nun von der unumstößlichen Erfolgsgeschichte seiner Karriere und seines Vermächtnisses überzeugt. Als er ins Haus zurückkehrt, um seine Rücktrittsrede zu verfassen und als Chef der Armee zurückzutreten, legt er Wert darauf zu betonen, dass er weiterhin dem Ruf der Pflicht folgen werde, sollte das Dominion beschließen, dass es ihn noch brauche."
 dominion_of_india_events.25.a: "Hoffen wir, dass er sein Vermächtnis nicht beschmutzt, falls er wieder in den Dienst zurückgerufen wird."

## Election Events

 dominion_of_india_events.30.t: "Wahlen nach der Wiedervereinigung angekündigt!"
 dominion_of_india_events.30.d: "Im Einklang mit den Versprechen unserer Regierung, nach der Wiedervereinigung Indiens wieder Wahlen abzuhalten, hat Premierminister Tiwana Wahlen in sechs Monaten angekündigt. Darüber hinaus hat er das Wahlrecht offiziell auf die zurückeroberten Gebiete ausgeweitet, um sicherzustellen, dass auf dem gesamten Kontinent gewählt werden kann – nicht nur im Nordwesten. Natürlich gilt nach wie vor das eingeschränkte Wahlrecht, was dazu führt, dass in der ehemaligen Bharatiya-Volksrepublik vergleichsweise weniger Menschen wählen dürfen als im ehemaligen Fürstenbund und in den loyalistischen Staaten im Nordwesten. Es wird erwartet, dass sich der Wahlkampf praktisch nur zwischen der Allindischen Selbstverwaltungspartei, der Nationalliberalen Föderation Indiens und der Unionistischen Partei abspielen wird, da alle anderen Parteien entweder zu klein sind oder eng mit einer der drei großen Parteien verbunden sind.\n\nDie Unionisten, die als Regierung für die letztendliche Rückeroberung des Kontinents verantwortlich sind, sahen sich in den letzten Jahren mit einer Vielzahl schwieriger innenpolitischer Probleme konfrontiert. Es wird erwartet, dass sie im Süden über eine verlässliche Basis verfügen, wo auch die AIHRP aufgrund ihres Programms zur konföderalen Neuordnung um Wähler werben dürfte. Auch in der ehemaligen Volksrepublik dürfte die AIHRP gut abschneiden, was auf Jinnahs Befürwortung einer gemischten Wirtschaft zurückzuführen ist. Schließlich scheinen die Liberalen bereit zu sein, in den städtischen Zentren zu punkten, indem sie ihre übliche Wählerschaft ansprechen, in der Hoffnung, die Wahl für sich zu entscheiden. Die Zeit wird zeigen, wer am Ende die Nase vorn hat."
 dominion_of_india_events.30.a: "Viel Glück an alle Beteiligten."

 dominion_of_india_events.31.t: "Shiromani Akali Dal sichert den Unionisten die Unterstützung der Sikhs"
 dominion_of_india_events.31.d: "Master Tara Singh, langjähriger Verbündeter der Unionistischen Partei und führender Vertreter der Shiromani Akali Dal sowie der Sikh-Gemeinschaft, hat öffentlich seine Unterstützung für die Unionisten bei den bevorstehenden Wahlen bekundet. Obwohl Jinnah versucht hatte, sie für sich zu gewinnen, indem er ihnen einen Sikh-Staat innerhalb des Dominions mit weitreichender Autonomie versprach, misstraute Singh ihm letztendlich und hielt an seinem bisherigen Bündnis fest.\n\nSinghs Unterstützung ist für die Unionisten seit langem von entscheidender Bedeutung, um ihr breites Netzwerk und ihren pluralistischen Charakter zu bewahren, und seine Unterstützung stärkt unseren Einfluss erheblich."
 dominion_of_india_events.31.a: "Excellente Neuigkeiten."

 dominion_of_india_events.32.t: "Die Bengalen-Kampagne"
 dominion_of_india_events.32.d: "Der politische Wahlkampf in Bengalen wurde weitgehend von der Allindischen Selbstverwaltungspartei und der Nationalliberalen Föderation Indiens dominiert. Da hier die ehemalige Hauptstadt der Bharatiya-Volksrepublik liegt, ist der Einfluss von Nationalisten und Sozialisten nach wie vor stark spürbar. Da die überwiegende Mehrheit der ehemaligen Führungskräfte verhaftet wurde, entstand nach Kriegsende in Kalkutta und im übrigen Bengalen eine große Lücke in der Machtverteilung. Insbesondere zwei Persönlichkeiten haben die Gelegenheit genutzt, politischen Einfluss zu gewinnen, wobei beide im Rennen um die Führung des Dominions auf gegensätzliche Pferde setzen.\n\nKhawaja Nazimuddin, ein Freund von Muhammad Ali Jinnah, ist ein treuer Verbündeter der AIHRP. Er hat eine heftige politische Kampagne gestartet, in der er den bengalischen Nationalismus in den Vordergrund stellt und sich direkt an die bengalischen Muslime wendet. Er verfügt über enormen Einfluss in der mehrheitlich muslimischen Stadt Dhaka und wird von einem Großteil der zurückkehrenden, wenn auch stark geschwächten Aristokratie Bengalens unterstützt.\n\nSyama Prasad Mukherjee ist der ehemalige Rektor der Universität Kalkutta und eine Persönlichkeit, die sich während der Herrschaft des „Roten Raj“ über Kalkutta kaum politisch engagiert hatte, sondern sich vor Ort als Unabhängiger betätigte. Vor kurzem schloss er sich jedoch der Hindu Mahasabha an und engagierte sich dort intensiv. Unter Nutzung des Einflusses, den er durch seine Verbindung zur Mahasabha erlangt hatte, baute er in Kalkutta selbst ein Netzwerk auf und führte eine intensive Kampagne gegen die AIHRP zugunsten der Liberalen, wobei er Panikmache gegen eine von Muslimen dominierte Regierung in Indien betrieb.\n\nBengalen ist zwischen diesen beiden gegensätzlichen Persönlichkeiten gespalten, doch nur eine von ihnen wird es schaffen, die neu wiedereingegliederte Provinz zugunsten ihrer bevorzugten Partei für sich zu gewinnen."
 dominion_of_india_events.32.a: "Nazimuddin bringt Bengalen erfolgreich mit der AIHRP in Einklang!"
 dominion_of_india_events.32.b: "Mukherjees Netzwerk verschafft Bengalen die Unterstützung der Liberalen!"

 dominion_of_india_events.33.t: "Jinnah bereist Hyderabad"
 dominion_of_india_events.33.d: "Hyderabad ist eine Region, die von gravierender Vermögensungleichheit und einer Geschichte bäuerlicher Unruhen geprägt ist, ganz zu schweigen von ihrer beträchtlichen muslimischen Minderheit. Dies macht sie zu einem idealen Schauplatz für die AIHRP, um dort Fuß zu fassen, was dazu führte, dass Jinnah die Region zum ersten Mal seit der Wiedervereinigung Indiens bereiste. Er hielt Reden vor mehreren armen muslimischen Bauern, traf sich mit lokalen Eliten und sicherte sich so viel Unterstützung für seine Bewegung wie möglich.\n\nAngesichts begrenzter Ressourcen hat die Unionistische Partei in der Region Fühler ausgestreckt und versucht, die einflussreichen Zamindars des Staates auf die Seite der Partei zu ziehen. Das Wirtschaftsprogramm der Unionisten, das Preiskontrollen für landwirtschaftliche Erzeugnisse vorsieht, findet bei den Zamindars großen Anklang und könnte uns bei den Wahlen den Sieg in Hyderabad sichern, wenn wir es ausreichend in den Vordergrund rücken. Nach unserem erbitterten Wettstreit mit Jinnah um Unterstützung und Einfluss wird sich Hyderabad letztendlich entscheiden für..."
 dominion_of_india_events.33.a: "Die Unionisten, basierend auf ihrer Wirtschaftspolitik und ihrer Unterstützung für die Zamindars!"
 dominion_of_india_events.33.b: "Die AIHRP stützt sich dabei auf ihre Anziehungskraft sowohl auf arme Muslime als auch auf die muslimischen Eliten!"

 dominion_of_india_events.34.t: "Die verbannten Fürsten kehren in ihre Länder zurück"
 dominion_of_india_events.34.d: "Die Fürsten der Regionen Orissa, Rajputana und Bengalen haben endlich damit begonnen, ihren Einfluss und ihre Macht über ihre ehemaligen Herrschaftsgebiete wiederherzustellen. In Orissa und Rajputana ist die Loyalität der Fürsten stark auf die drei großen Parteien des Dominions aufgeteilt. Während die Unionisten für jeden Fürsten in der Regel die naheliegende Wahl sind, bevorzugen einige der chauvinistischeren hinduistischen Fürsten das Programm der Liberalen, während andere in der starken Unterstützung der AIHRP für eine weitere Konföderalisierung vielversprechende Perspektiven sehen. Vertreter strömen nun in Scharen in ihre neu zurückgewonnenen Ländereien, in der Hoffnung, sich wertvolle fürstliche Gunst zu sichern, denn kaum etwas in der politischen Landschaft des Dominions zählt mehr als die Unterstützung des Fürsten einer Region.\n\nDie Lobbyisten der Unionisten haben immer wieder betont, wie erfolgreich die Partei bei der Vereinigung der Nation war, und betonen, dass ihre weitere Führung unerlässlich sei, um Indien zusammenzuhalten, nun, da es endlich wieder vereint ist. Die Unionisten sind zudem die Partei in der Politik, die sich am stärksten für die Fürsten einsetzt, sodass es natürlich kaum Überzeugungsarbeit erfordern dürfte, die Fürsten dazu zu bewegen, sich ihnen anzuschließen. Die liberalen Lobbyisten versprechen, dass sich den Fürsten dank ihrer wirtschaftlichen Unterstützung für eine umfassende freie Marktwirtschaft zahlreiche Investitionsmöglichkeiten bieten werden – zum Wohle ihres Landes und zu ihrem eigenen Vorteil. Schließlich behaupten die Lobbyisten der AIHRP, dass es den Fürsten ohne Jinnahs Konföderalisierungsprogramm schwerfallen werde, ihre Autonomie zu bewahren, und dass die Politik der Liberalen und Unionisten angesichts des erwachten politischen Bewusstseins des durchschnittlichen Inders nicht tragfähig sei. Ihre Bemühungen überzeugen erfolgreich eine Mehrheit der Fürsten, ihre Unterstützung hinter …"
 dominion_of_india_events.34.a: "Die Unionisten, für garantierten Wohlstand."
 dominion_of_india_events.34.b: "Die Liberalen, um vom explosiven Wirtschaftswachstum zu profitieren."
 dominion_of_india_events.34.c: "Die AIHRP, denn sie wissen am besten, wie man das Dominion aufrechterhält."

 dominion_of_india_events.35.t: "Antiliberale Werbung in Delhi"
 dominion_of_india_events.35.d: "Die Großstadtregion Delhi, eines der am dichtesten besiedelten Gebiete Indiens, ist Schauplatz heftiger Wahlkämpfe zwischen den Unionisten und den Liberalen. Als ehemaliger Sitz des British Raj und einstige Großstadt des Mogulreichs ist die Region äußerst vielfältig und beherbergt eine bedeutende Bevölkerung von Muslimen, Sikhs und Hindus, wobei Letztere die Mehrheit bilden. Während der Wiederaufbau weiter voranschreitet und die freie Marktwirtschaft wiederhergestellt wird, haben die Liberalen die Gelegenheit genutzt, um wohlhabende hinduistische Kaufleute um Unterstützung zu werben.\n\nDer Wahlkampf der Unionisten konzentrierte sich in erster Linie auf ihr pluralistisches Programm und darauf, in welchem enormen Maße die Stadt von einer Regierung profitieren wird, die Wert auf religiöse Harmonie legt. Im Rahmen ihres Wahlkampfs finanzierten die Unionisten stadtweit Anzeigen, in denen sie die Liberalen als Verfechter der Vorherrschaft der Hindus darstellten, die den Säkularismus durchsetzen würden, um arme Muslime, Sikhs und Angehörige der registrierten Kasten am unteren Rand der Gesellschaft zu halten. Zwar sehen einige wahlberechtigte Einwohner der Stadt darin tatsächlich einen Grund, für die Liberalen zu stimmen, doch hat dies dennoch deren Ruf als Partei geschädigt, die in der Lage ist, die Einheit des Dominions zu wahren, und den Zorn vieler prominenter Liberaler auf sich gezogen. Gegen die Unionisten wurde Klage eingereicht, in der ihnen vorgeworfen wird, eine \"verleumderische Hetzkampagne\" zu betreiben und hinterhältige Tricks anzuwenden, um ihre Macht zu erhalten. Es ist unwahrscheinlich, dass das Verfahren schnell genug voranschreitet, um vor der Wahl noch eine Rolle zu spielen, doch der Schaden für unsere Glaubwürdigkeit und unser allgemeines Ansehen wird zweifellos einen Makel in unserer Bilanz hinterlassen und die Integrität unserer noch jungen indischen Demokratie beeinträchtigen. Die Liberalen haben angeboten, die Klage zurückzuziehen, wenn wir die Anzeigen zurückziehen und eine Entschuldigung in den lokalen Zeitungen veröffentlichen."
 dominion_of_india_events.35.a: "Wir werden die Kampagne einstellen und uns entschuldigen, wenn auch nur widerwillig."
 dominion_of_india_events.35.b: "Naja, nein, das machen wir nicht."
 dominion_of_india_events.35.c: "Ehrlich gesagt? Lassen Sie uns noch einen draufsetzen und diese Anzeigen in Cawnpore und Lucknow drucken."

 dominion_of_india_events.36.t: "Liberale sichern sich Bombay"
 dominion_of_india_events.36.d: "Die Stadt Bombay, eine der am stärksten industrialisierten Städte des Dominions, gilt als das erfolgreichste Beispiel für den indischen Kapitalismus. Dies ist ihrer boomenden Textilindustrie und dem Hafen von Bombay zu verdanken, einem der ältesten Seehäfen Indiens, der der Stadt den populären Beinamen \"Tor zu Indien\" eingebracht hat. Jinnah hat persönlich mehrere Treffen in der Stadt abgehalten, um angesichts seiner Vergangenheit dort (als Absolvent der Universität Bombay) Unterstützung für seinen Wahlkampf zu gewinnen; es ist ihm jedoch nicht gelungen, den festen Griff der Liberalen zu erschüttern, den diese in der Stadt mühelos erlangt haben.\n\nDie große Zahl an Kaufleuten und der hohe Industrialisierungsgrad machen Bombay zu einer Vorzeigestadt für die Liberalen, die den Erfolg von Städten wie Bombay und Karachi auf die anderen dicht besiedelten Ballungsräume im Dominion übertragen möchten. Dabei darf nicht unerwähnt bleiben, dass die Wählerschaft, auf die sie sich am stärksten stützen, in Bombay vorherrscht, was bedeutet, dass Bombay trotz der Bemühungen der AIHRP und der Unionisten ein sicherer Gewinn für die Nationalliberale Föderation Indiens ist."
 dominion_of_india_events.36.a: "Da kann man nichts machen..."

 dominion_of_india_events.37.t: "Umwerben der Wählerschaft in Madras"
 dominion_of_india_events.37.d: "Madras, eine Region, die weitgehend von der regionalen Justice Party dominiert wird, gilt als eines der entscheidenden Gebiete für den Ausgang der bevorstehenden Wahlen. Die kompromisslose Anti-Brahmanen-Haltung der Justice Party hat den „Liberalen“ einen Strich durch die Rechnung gemacht, was ihre Versuche angeht, in der politischen Szene Fuß zu fassen (der ehemalige Parteivorsitzende V.S. Srinivasa Sastri war ein Brahmane, was ausreichte, um den Einfluss der Liberalen zu schwächen), obwohl der kastenreformerische Flügel der Partei ihr bei der Führung der Justice Party einiges an Ansehen verschafft hat.\n\nJinnahs Engagement für regionale Autonomie war ein wichtiges Argument für jene, die seine Partei in der Region unterstützt hat, und manche sind der Ansicht, dass eine von Jinnah geführte Regierung letztendlich zu einem Rückgang der Dominanz der Brahmanen in der Politik führen wird. Jinnahs sozial und wirtschaftlich fortschrittliche Ideen bereiten jedoch vielen einflussreichen Konservativen in Madras Sorge.\n\nWas die Unionisten betrifft, so gibt es in der Wirtschafts- und Sozialpolitik zahlreiche Überschneidungen, und die Wahlkampagne der Unionisten war in der Region sehr erfolgreich, was bedeutet, dass die Partei möglicherweise alle Hände voll zu tun haben wird. Trotz der vielfältigen Anziehungskraft der drei großen Parteien wird Madras letztendlich seine Stimmen…"
 dominion_of_india_events.37.a: "Die Allindische Selbstverwaltungspartei, da sie die Interessen von Justice am besten vertreten kann."
 dominion_of_india_events.37.b: "Die Unionisten, aufgrund ihrer politischen Gemeinsamkeiten."
 dominion_of_india_events.37.c: "Die Liberalen unter Sapru sorgen für eine Überraschung!"

 dominion_of_india_events.38.t: "Fürsten aus dem Süden schließen sich den Unionisten an"
 dominion_of_india_events.38.d: "Nach der erfolgreichen Wiedervereinigung unserer Regierung mit den Fürsten des Südens sagten viele voraus, dass diese im Falle einer Wahl letztendlich ihre Stimme der Unionistischen Partei geben würden. Diese Annahme hat sich als richtig erwiesen, da die konservativen Fürsten in den letzten Monaten einen großen Beitrag zum Wahlkampf der Unionisten geleistet haben.\n\nZwar hatte Jinnah große Anstrengungen unternommen, um insbesondere Osman und die Fürsten für sich zu gewinnen, doch wurden seine wichtigsten Argumente de facto von den Unionisten vorweggenommen, da die Fürsten im Süden weitreichende Autonomie erhielten. Dies führte dazu, dass die Unionisten in Südindien erhebliche Gewinne verzeichnen konnten und die Wahlkampfspenden eine neue Dynamik im Wahlkampf im übrigen Nord- und Zentralindien ermöglichten, während die Wahlkampfkassen der beiden anderen Parteien von Tag zu Tag leerer wurden."
 dominion_of_india_events.38.a: "Unsere erfolgreiche Diplomatie hat sich ausgezahlt!"

## NLFI Events
 dominion_of_india_events.40.t: "Sieg der Liberalen!" # Jayakar
 dominion_of_india_events.40.d: "Nach einem heftigen sechsmonatigen Wahlkampf zwischen den drei großen Parteien des Dominions hat die Nationale Befreiungsföderation Indiens den Unionisten und der AIHRP den Sieg aus den Händen gerissen. Mukund Ramrao Jayakar, seit 1936 Parteivorsitzender, wird zugeschrieben, einen erbitterten Wahlkampf geführt und die städtischen Hindu-Eliten im gesamten wahlberechtigten Dominion erfolgreich für sich gewonnen zu haben.\n\nMit dem Versprechen, der schädlichen konfessionellen Politik der Unionisten ein Ende zu setzen und eine \"Regierung des gesunden Menschenverstands für alle Inder, unabhängig von ihrem Glauben\" zu bilden, verfügt Jayakar nun über ein beeindruckendes Mandat, die Regierung nach seinen Vorstellungen umzugestalten."
 dominion_of_india_events.40.a: "Der Sieg ist unser!"

 dominion_of_india_events.41.t: "Sieg der Liberalen!" # Sapru
 dominion_of_india_events.41.d: "Nach einem heftigen sechsmonatigen Wahlkampf zwischen den drei großen Parteien des Dominions hat die Nationale Befreiungsföderation Indiens den Unionisten und der AIHRP den Sieg aus den Händen gerissen. Tej Bahadur Sapru, seit 1936 Parteivorsitzender, wird zugeschrieben, einen erbitterten Wahlkampf geführt und die städtischen Hindu-Eliten im gesamten wahlberechtigten Dominion erfolgreich für sich gewonnen zu haben.\n\nMit dem Versprechen, die Freiheiten aller Inder zu schützen und eine \"vernünftige Regierung für alle Inder, unabhängig von ihrem Glauben\" zu etablieren, verfügt Sapru nun über ein beeindruckendes Mandat, die Regierung nach seinen Vorstellungen zu reformieren."
 dominion_of_india_events.41.a: "Der Sieg ist unser!"

 dominion_of_india_events.42.t: "Zunehmende Vorherrschaft der Hindus"
 dominion_of_india_events.42.d: "Nach der erzwungenen Säkularisierung der Regierung, einschließlich Reformen der Vertretungs- und Wahlpolitik, hat sich die politische Landschaft des Dominions seit dem Ende der Herrschaft der Unionisten erheblich verändert. Da immer wieder Reformen verabschiedet werden, hat die hinduistische Mehrheit begonnen, de facto immer mehr Macht auszuüben, da sie die Muslime und Sikhs zahlenmäßig deutlich übertrifft, was zu einem von manchen als ungesundes Machtungleichgewicht kritisierten Zustand geführt hat.\n\nScharfe Kritik kam von Muhammad Ali Jinnah, der behauptet, unsere Regierung habe \"auf hinterhältige Weise die Vorherrschaft der Hindus über die muslimischen Inder durchgesetzt und damit eine Tyrannei der Mehrheit geschaffen\". Dies hat leider dazu geführt, dass sich unter der muslimischen Bevölkerung zunehmend Einfluss zugunsten von Jinnah gebündelt hat und eine gestärkte Opposition entstanden ist. Das soll nicht heißen, dass diese Politik von jedem Hindu unterstützt wird, denn einige äußern Unzufriedenheit über Maßnahmen, die ihrer Meinung nach nur Unzufriedenheit und potenziellen Sezessionismus schüren. Nichtsdestotrotz genießen wir nach wie vor die Unterstützung der Mehrheit für das Programm unserer Partei und werden ungeachtet dessen weitermachen – Jinnahs Unterstützerbasis sei verdammt."
 dominion_of_india_events.42.a: "Wir haben im Wahlkampf dafür geworben, also werden wir es auch umsetzen."

 dominion_of_india_events.43.t: "Wiederaufleben der Hindu Mahasabha"
 dominion_of_india_events.43.d: "Die Hindu Mahasabha, die seit ihrer Spaltung während der indischen Revolution an den Rand der Politik gedrängt worden war, hat in den letzten Monaten nach dem Sieg der Liberalen ein Wiederaufleben erlebt. Stillschweigend unterstützt von Premierminister Jayakar hat sich die Mahasabha weitgehend in das Kabinett integriert und bildet nun offiziell eine Koalition mit der Partei. Infolgedessen haben ihre Ideologien begonnen, in den Mainstream einzudringen, wobei sie die \"natürliche Vorherrschaft\" der Hindus über den \"rechtmäßigen hinduistischen Boden\" vertreten.\n\nObwohl Premierminister Jayakar den hinduistischen Nationalismus nicht ausdrücklich befürwortet, hat er den Säkularismus als Mittel genutzt, um die Vorrangstellung der Hindus in politischen Angelegenheiten zu festigen, da diese zahlenmäßig die von Muslimen dominierten Wahlkreise bei weitem übertreffen. Die Kundgebungen werden immer größer und die Rhetorik radikaler als je zuvor, was auf internationaler Ebene und bei der indischen Bevölkerung Besorgnis darüber auslöst, welche Richtung die Zukunft Indiens nehmen wird."
 dominion_of_india_events.43.a: "Eine politische Verbindung, die viele tatsächlich vorausgesehen hatten."

 dominion_of_india_events.44.t: "Die Sapru-Erklärung"
 dominion_of_india_events.44.d: "In einer Rede, die sowohl im Fernsehen als auch im Radio auf dem gesamten Kontinent übertragen wurde, forderte Premierminister Sapru eine schrittweise Reform in Bezug auf die Frage der registrierten Kasten. Er bezeichnete deren Existenz als bloße Beeinträchtigung der Einheit der Inder und als eine Institution, die die Nation in den kommenden Jahrzehnten nur zurückhalten werde, und versprach offiziell, sich für die letztendliche Befreiung der unterdrückten Kasten einzusetzen. Während diese Erklärung bei fortschrittlich gesinnten Indern auf großen Beifall stieß, hat sie jedoch den Zorn einiger konservativer Hindus auf sich gezogen.\n\nTrotz dieses Rückschlags für die Wählerbasis der Nationalliberalen Föderation Indiens wurde dieser durch die wachsende Unterstützung seitens der Dalits und anderer Inder zunichte gemacht – und das, obwohl nur sehr wenige von ihnen tatsächlich Einfluss auf das Wahlergebnis haben."
 dominion_of_india_events.44.a: "Ist eine egalitäre Zukunft in Indien wirklich möglich?"

 dominion_of_india_events.45.t: "Großangelegter Ausbau der Universität Bombay"
 dominion_of_india_events.45.d: "Seitdem das Dominion die Kontrolle über Bombay zurückerlangt hat, wurde die gleichnamige Universität zugunsten dringenderer Wiederaufbaumaßnahmen auf dem gesamten Subkontinent vernachlässigt. Doch wer sind wir, dass wir die Zukunft der jungen Inder vernachlässigen? Jede stolze Nation verfügt über eine renommierte Forschungs- und Hochschuleinrichtung, die sie von verarmten, feudalen Staatsgebilden unterscheidet, die ihre eigene Regierungsfähigkeit kaum rechtfertigen können. Aus diesem Grund wurden Sondermittel umgeschichtet, um die Universität von Bombay endlich zu sanieren und zu erweitern. Neben einer Formalisierung der Aufgaben und Befugnisse umfassen die umfangreichen Campus-Erweiterungen Sportplätze, einen neuen Flügel für medizinische Forschung sowie offizielle Forschungszuschüsse, um Hungersnöte zu verstehen, vorherzusagen und zu bekämpfen, bevor sie ausbrechen können.\n\nBei einer Feier zur Einweihung der Erweiterung hielt Generalgouverneur [RAJ.GetLeader] eine Rede, in der er die Verdienste indischer Absolventen um ihr Heimatland würdigte. Er betonte zudem, dass die Universität ohne das Empire unter der sozialistischen Bharatiya-Volksregierung ideologischen Einmischungen und Demagogie ausgesetzt wäre."
 dominion_of_india_events.45.a: "Eine großartige Wiedereröffnung für eine großartige Einrichtung!"

 dominion_of_india_events.46.t: "Ein modernes Zivilgesetzbuch"
 dominion_of_india_events.46.d: "Nach dem jüngsten Erlass der Nationalliberalen Föderation Indiens hat eine umfassende Reform das Zivilgesetzbuch des Dominions grundlegend neu gestaltet. Nun unterliegen alle Inder, unabhängig von ihrem Glauben, gleichermaßen den Gesetzen in Bezug auf Ehe, Scheidung, Erbschaft, das Verbot der Polygamie und alle anderen Personenstandsangelegenheiten.\n\nAls Reaktion darauf sind scharfe Kritik und Kontroversen entbrannt, vor allem seitens prominenter Unionisten und am deutlichsten durch Muhammad Ali Jinnah, und sogar eine Reihe von Hindus ist zutiefst besorgt über die möglichen Auswirkungen dieser Reformen auf die Gesellschaft. Jinnahs Kritik konzentriert sich vor allem auf die Voreingenommenheit, die das \"gleichberechtigte\" Gesetz gegenüber dem traditionellen hinduistischen Zivilrecht an den Tag legt. Er hat wütend die Bildung eines Ausschusses gefordert, der die Politik unserer Regierung untersuchen und deren offensichtlichen hinduistischen Chauvinismus aufdecken soll – eine Forderung, der wir unter der Bedingung zugestimmt haben, dass V.S. Srinivasa Sastri den Vorsitz dieser Kommission übernimmt."
 dominion_of_india_events.46.a: "Wir haben nichts anderes zu verantworten, als dass wir unser Land modernisiert haben."

 dominion_of_india_events.47.t: "Ergebnisse des Sastri-Berichts"
 dominion_of_india_events.47.d: "Ergebnisse des Sastri-Berichts
Obwohl dem Ausschuss zahlreiche Intellektuelle und Juristen angehörten, die mit den Unionisten und der Allindischen Selbstverwaltungspartei verbunden waren, wäre das Urteil ohnehin immer dasselbe ausgefallen. Es kam zu Verzögerungen aufgrund von Verwaltungsaufwand, der sich häufte, nachdem festgestellt wurde, dass Mitglieder \"zu voreingenommen\" seien – aufgrund ihrer Verbindungen zu Organisationen wie der All-Indian Muslim League und verschiedenen anderen politischen Gruppierungen, denen starke Vorurteile gegenüber Hindus und der liberalen Regierung nachgesagt wurden (wobei in einigen Vorwürfen sogar Bestechung erwähnt wurde).\n\nNach mehrmonatigen Untersuchungen hat der Sastri-Bericht nun nur geringfügige Verfehlungen seitens der amtierenden Regierung festgestellt und lediglich empfohlen, einen Beratungsausschuss einzurichten, um die Politik gegenüber den verschiedenen indischen Minderheiten besser auszuarbeiten. Dies hat weder Jinnah noch Tiwana noch irgendeinen unserer Gegner zufrieden gestellt … doch die Angelegenheit ist für den Rest unserer Amtszeit zweifellos ad acta gelegt worden."
 dominion_of_india_events.47.a: "Wir haben eigene Ermittlungen angestellt … und kein Fehlverhalten festgestellt."

 dominion_of_india_events.48.t: "Das Vermächtnis von Gokhale"
 dominion_of_india_events.48.d: "Obwohl V.S. Srinivasa Sastri bereits seit einiger Zeit im Ruhestand ist, verfolgt er weiterhin das politische Geschehen und ist Mitglied verschiedener Organisationen, unter anderem als derzeitiger amtierender Vorsitzender der „Servants of India Society“. Nun, da Inder ihre Landsleute nicht mehr auf dem Schlachtfeld niedermetzeln und die Liberalen die Nation lenken – anstelle des schädlichen Jinnah oder der landbesitzerfreundlichen Unionisten –, hat er viel Zeit, über das Vermächtnis der Partei und den Kurs der Zukunft nachzudenken. Sein bevorzugter Nachfolger, Premierminister Sapru, führt die Partei auf einen versöhnlicheren Kurs und lenkt die Nation in Richtung Einheit statt in Richtung Eroberung und Bestrafung. Sastri, ein Anhänger des großen und tief vermissten Gopal Krishna Gokhale, ist fest davon überzeugt, dass dieser stolz auf das Indien wäre, das sie aufgebaut haben. Der Erfolg der Versöhnung und Zusammenarbeit gegenüber den Anhängern Gandhis, Tilaks und Boses und ihrer blutigen Revolution, die die Nation lediglich ein Jahrzehnt lang gespalten und Katastrophen und Unglück verursacht hat, ist für Sastri eine enorme Erleichterung.\n\nNun, da eine gute und ordentliche hinduistische Regierung das Ruder übernommen hat, um die Herde in eine strahlende Zukunft zu führen, ist Indien zu allem fähig."
 dominion_of_india_events.48.a: "Denn Indien hat endlich die Kräfte gebündelt und den Blick auf eine harmonische Gleichberechtigung gerichtet."

 dominion_of_india_events.49.t: "Aufruhr in Dhaka"
 dominion_of_india_events.49.d: "Seit sich die Hindu Mahasabha in das nationale Gefüge integriert hat, nehmen die Unruhen in Gebieten mit einem beträchtlichen muslimischen Bevölkerungsanteil von Monat zu Monat zu. Ein Streit zwischen einem Hindu und einem Muslim auf einem Markt in Dhaka führte dazu, dass Letzterer die Fäuste hob und Ersterer sich ein Messer besorgte und auf den anderen einstach. Der Hindu, der vor Gericht stand, wurde aufgrund von Notwehr für nicht schuldig befunden, nachdem seine Anwälte vor einem hinduistischen Richter erfolgreich argumentiert hatten, dass der Mann, den er niedergestochen hatte, eine begründete Bedrohung für sein Leben darstellte. Das Urteil stieß in der muslimischen Gemeinschaft auf heftige Empörung, insbesondere in der Stadt, in der sich der Vorfall ereignete, und es kam wöchentlich zu Ausschreitungen, obwohl die Unterdrückung immer brutaler wurde.\n\nHinduistische Geschäfte in der Stadt sind in letzter Zeit zunehmend zur Zielscheibe von Vandalen geworden, wobei die interreligiösen Ausschreitungen ein Allzeithoch erreicht haben. Die Hindus in der Region radikalisieren sich in immer schnellerem Tempo, wobei die Hindu Mahasabha einen erheblichen Anstieg der Mitgliederzahlen in ganz Bengalen verzeichnet. Der ehemalige Vorsitzende der Liberalen, V.S. Srinivasa Sastri, hat versucht, eine Mission der „Servants of India“ zur Förderung friedlicher Beziehungen zu leiten, doch seine Rede gestern Vormittag wurde durch einen Messerangriff (ironischerweise begangen von einem Hindu) unterbrochen, der ihn in einen kritischen Zustand versetzte, obwohl er voraussichtlich überleben wird. Die heutigen Unruhen wurden durch ein brutales Durchgreifen und eine unbefristete Militärpräsenz in der Stadt endgültig beendet, um weitere Unruhen seitens der Muslime in der Stadt zu verhindern, denn innerhalb der Partei wächst die Sorge, dass ein zu zögerliches Vorgehen gegen die interkommunalen Gewalttaten uns die Gunst unserer wahlberechtigten Wählerschaft kosten könnte."
 dominion_of_india_events.49.a: "Um ein so großes Land wie Indien zu regieren, braucht es eine starke Führung."

 ## AIHRP Events
 dominion_of_india_events.50.t: "Allindische Selbstverwaltungspartei hat gewonnen!"
 dominion_of_india_events.50.d: "Nach einem lebhaften sechsmonatigen Wahlkampf zwischen den drei großen Parteien des Dominions hat sich die Allindische Selbstverwaltungspartei gegen die Unionisten und die Nationalliberale Föderation Indiens durchgesetzt. Der Wahlkampf des Parteigründers und Vorsitzenden Muhammad Ali Jinnah für autonomere Verwaltungseinheiten und eine \"gerechtere\" Wirtschaft sowie das unermüdliche Engagement von ihm und seinen Mitstreitern haben die Herzen der indischen Bevölkerung erobert.\n\nWährend Jinnah in seiner Heimatstadt Karatschi seine Siegesrede hält, verspotten ihn Kritiker aus den Reihen der Unionisten und der NLFI als nichts weiter als einen muslimischen Chauvinisten im Schafspelz. Dennoch ist Jinnahs Mandat zur Reform des Dominions gewaltig, und viele verfolgen mit angehaltenem Atem, wie sich die Nation in den folgenden Jahren wandeln wird."
 dominion_of_india_events.50.a: "Der Sieg gehört uns!"

 dominion_of_india_events.51.t: "Kontamination der Bewegung"
 dominion_of_india_events.51.d: "Premierminister Jinnah, der stets ein Idealist war, ist im Herzen doch nach wie vor der Pragmatiker Jinnah. Die Neuordnung Indiens lässt sich nicht ohne die ausdrückliche Unterstützung der Fürstenstaaten bewerkstelligen. Der jüngste Entwurf der neuen konföderalen Verfassung enthält Bestimmungen, die den Fürsten Autonomie in den Angelegenheiten ihrer Herrschaftsgebiete einräumen – sehr zum Missfallen fortschrittlicher Verbündeter wie Scheich Abdullah.\n\nAutoritäre Fürstenstaaten wie das Dogra-Raj von Jammu und Kaschmir können nun ihre Regierungen aufrechterhalten, ohne Einmischungen der Exekutive in ihre Angelegenheiten befürchten zu müssen. Dies bedeutet, dass weiterhin direkt ernannte Minister anstelle von vom Volk gewählten im Amt bleiben und dass Kritik an einem indischen Fürsten in seinem Heimatstaat rechtswidrig ist. Scheich Abdullah hat nun die Lesesaalpartei gegen seinen ehemaligen Verbündeten mobilisiert und ist in die vollständige Opposition gegangen, wobei er versucht, in die nationale Politik vorzudringen, anstatt eine regionale Kraft zu bleiben."
 dominion_of_india_events.51.a: "Aber ein so ausgegrenzter Mann wie er dürfte kaum Erfolg haben."

 dominion_of_india_events.52.t: "Die Neue Konföderation"
 dominion_of_india_events.52.d: "Mit der Verabschiedung des letzten Antrags ist Premierminister Jinnahs Konföderationsprojekt nun endlich Wirklichkeit geworden. Durch die Einschränkung der Exekutivgewalt über die Bundesstaaten und Provinzen des Dominions (mit zusätzlichen Bestimmungen, die sicherstellen, dass seine Wirtschaftspolitik relativ ungehindert umgesetzt werden kann) verfügt das vollständig wiedervereinigte Dominion nun über mehrere einzelne Provinzen und Fürstenstaaten, von denen jede weitreichende Autonomie bei der Verwaltung ihrer eigenen Angelegenheiten besitzt. Da die neue Gewaltenteilung nun in der Verfassung verankert ist, sind Provinzen mit muslimischer Minderheit oder Mehrheit nun vor der Gefahr befreit, von einer potenziell hindu-dominierten Exekutive unterdrückt zu werden.\n\nDies stieß auf heftige Kritik seitens der Nationalliberalen Föderation Indiens, die behauptet, Jinnah habe nun die Einheit des Dominions unwiderruflich zerrissen und eine Kultur der konfessionellen Feindseligkeit und des Misstrauens zwischen Hindus und Muslimen gefestigt. Auch der ehemalige Ministerpräsident Khizar Hayat Tiwana verurteilte die neue Verfassung, obwohl eine Reihe von Abgeordneten seiner eigenen Partei die Seiten gewechselt hatte, um sie zu unterstützen. Er argumentierte, dass solche Maßnahmen nichts zur Bekämpfung der grassierenden interkommunalen Gewalt beitrügen, sondern es der Exekutive lediglich erschwerten, künftige Konflikte zu schlichten."
 dominion_of_india_events.52.a: "Vielleicht sollten sie sich weniger aufs Jammern konzentrieren und sich stattdessen mehr damit beschäftigen, warum sie die Wahl verloren haben."

 dominion_of_india_events.53.t: "Muhammad und Fatima"
 dominion_of_india_events.53.d: "Seit dem Tod der zweiten Ehefrau von Muhammad Ali Jinnah, Rattanbai \"Ruttie\" Petit, kommt seiner Schwester die entscheidende Rolle als engste Vertraute und stärkste Unterstützerin des Premierministers zu. Sie half dabei, seine Tochter Dina großzuziehen, und unterstützte ihn im Wahlkampf für seine Vision eines konföderalen Indiens. Ihr Bruder revanchiert sich nun dafür, indem er zügig verbesserte Rechte für Frauen und die Ausweitung des Frauenwahlrechts umsetzt, das Land modernisiert und die Zukunft von Millionen indischer Frauen auf dem gesamten Subkontinent fördert.\n\nEinige Mitglieder der AIHRP nehmen Fatimas Einfluss auf den Parteivorsitzenden übel, und es hat sich das weit verbreitete Gefühl breitgemacht, dass die Partei für die Jinnahs kaum mehr als ein Mittel zur Verbreitung ihrer eigenen Vision ist. Doch trotz all ihres Gemurmels werden kaum Maßnahmen ergriffen, um die Geschwister zu kritisieren. Selbst wenn ein starker Wunsch bestünde, sie zu verdrängen, wäre der nächstwichtigste Führer Liaquat Ali Khan, ein treuer Verbündeter Muhammads, der keinerlei Absicht hegt, seinen Freund zu verraten. Fatimas politische Stellung bleibt somit vorerst unantastbar. Trotz des Neids der Partei auf sie (und ihres eigenen Bewusstseins darüber) ist sie derzeit in ganz Indien unterwegs, um Stimmen von Frauen für die Allindische Selbstverwaltungspartei zu werben, denn es waren die Jinnahs, die ihnen zu mehr Einfluss verhalfen, nicht die chauvinistischen Liberalen oder die konservativen Unionisten."
 dominion_of_india_events.53.a: "Wenn es jedoch darum geht, einen Nachfolger für Muhammad zu finden, werden sie sicherlich Liaquat ihr vorziehen."

 dominion_of_india_events.54.t: "Der [GetYear]-Mahasabha-Aufstand"
 dominion_of_india_events.54.d: "Premierminister Jinnah als Person und insbesondere seine Politik sorgen in der indischen Politiklandschaft für große Spaltungen. Vor allem Hindus haben eine zwiespältige Sicht auf ihn und sehen sein Engagement in der All-India Muslim League als Beweis dafür, dass es sein Ideal sei, Indien in die Zeit der Moguln zurückzuversetzen, als Muslime die Vorherrschaft über Hindus hatten. Diese Behauptungen sind offensichtlich absurd, ein Produkt politischer Unhöflichkeit, das eher eine Karikatur als ein zutreffendes Porträt des Mannes zeichnet, doch sie halten sich dennoch hartnäckig in der radikalen hinduistischen Rechten. Die Hindu Mahasabha macht Jinnah zum Ziel ihrer Kundgebungen und Diskussionen und behindert ihn bei jeder sich bietenden Gelegenheit.\n\nNeben Stimmen wie der von B.S. Moonje, die sorgfältig darauf geachtet haben, die Grenze zwischen geschützter Meinungsäußerung und aufrührerischer Illegalität nicht zu überschreiten, sticht die aufwieglerische Präsenz von Bhai Parmanand hervor. Der Sturz der Bharatiya-Volksrepublik und die darauf folgende Welle von Verhaftungen und Gerichtsverfahren gipfelten in der Inhaftierung von V.D. Savarkar, einem geistlichen Führer der Hindu Mahasabha, der sich den Rebellen angeschlossen hatte. Parmanand, der sich unermüdlich – wenn auch ohne nennenswerten Erfolg – für dessen Freilassung eingesetzt hat, hat eine riesige Menge hinduistischer Nationalisten zu einer Demonstration in Delhi mobilisiert.\n\nPremierminister Jinnah ordnete unverzüglich ein hartes Durchgreifen der Polizei an, sobald Berichte über Schäden an muslimischen Gewerbebauten eingingen und sich der Protest zu Ausschreitungen entwickelte. In den darauf folgenden Auseinandersetzungen wurden mehrere Straßen abgeriegelt, und es kam zu einem zweitägigen Konflikt, woraufhin in der Stadt kurz darauf das Kriegsrecht verhängt wurde. Nach einer Bilanz von 367 Todesopfern wurden landesweit Führungskräfte der Hindu Mahasabha festgenommen, und die Organisation selbst wurde als terroristische Vereinigung eingestuft und verboten."
 dominion_of_india_events.54.a: "Ein unbedeutender Aufruhr, aber ein guter Vorwand, um sie loszuwerden."

 dominion_of_india_events.55.t: "Attentatsversuch auf Premierminister Jinnah!"
 dominion_of_india_events.55.d: "Das Indien von heute unterscheidet sich grundlegend von dem Indien, das man noch vor einem Jahr vorfand. Premierminister Jinnahs Programm, das darauf abzielte, den Status quo zu kippen und das Dominion zu einem Staat der Gleichberechtigung und des sozialen Aufstiegs zu machen, hat die Institutionen verändert und die Nation entschlossen modernisiert. Eine solche Entwicklung hat jedoch nicht verhindert, dass er sich viele, viele Feinde gemacht hat. Premierminister Jinnah hat sich vom Feind der hinduistischen Nationalisten zu deren Erzfeind gewandelt, nachdem er die Hindu Mahasabha aufgelöst und bei seinen Entwicklungsinvestitionen arme muslimische Regionen unverhältnismäßig begünstigt hat. Dennoch ist der Personenkult unter den Muslimen (deren Unterstützung er den Unionisten in großem Maße entzogen hat) immens, und Premierminister Jinnah wird heute im Volksmund als \"Vater der Nation\" bezeichnet, sogar unter einer Mehrheit der Hindus, die seine Politik unterstützen.\n\nWährend einer öffentlichen Rede in der Stadt Lucknow, in der er sein wirtschaftliches Programm erläuterte, wurde Premierminister Jinnah von zwei Kugeln getroffen, die seinen Unterleib und seine linke Schulter trafen. Während er umgehend ins Krankenhaus gebracht wurde, entzog sich der Attentäter 36 Stunden lang der Festnahme, bevor er versteckt in einem Lagerhaus am südlichen Ende der Stadt aufgefunden wurde. Der als Nathuram Godse identifizierte Mann wird voraussichtlich so schnell wie möglich verurteilt und gehängt werden. Premierminister Jinnah hat den Anschlag überlebt, wird sich jedoch voraussichtlich erst in einigen Wochen von seinen Verletzungen erholt haben. Er scheint von dem Vorfall nicht erschüttert zu sein; vielmehr hat dieser seine Entschlossenheit, sich für Indien und sein Volk einzusetzen, nur noch gestärkt."
 dominion_of_india_events.55.a: "Kugeln allein können die Hoffnung nicht zerstören."

 ## Unionist Events

 dominion_of_india_events.60.t: "Sieg für die Unionisten!"
 dominion_of_india_events.60.d: "Nach einem hart umkämpften sechsmonatigen Wahlkampf zwischen den drei großen Parteien des Dominions haben die Unionisten einen Sieg über die Nationalliberale Föderation Indiens und die Allindische Selbstverwaltungspartei errungen! Premierminister Tiwana wird zugeschrieben, die Partei durch den wirtschaftlichen Abschwung des Schwarzen Montags, den verheerenden Streik der Hafenarbeiter in Karachi und schließlich die Wiedervereinigung Indiens geführt zu haben. Diese Erfolge sowie ein wirkungsvoller Wahlkampf haben ihm sicherlich die Wiederwahl gesichert. Es wird erwartet, dass Premierminister Tiwana das Programm der Unionisten fortsetzen wird, das die Allianz zwischen Bauern und Landadel bewahrt, den pluralistischen Regierungsansatz stärkt sowie Preiskontrollen einführt und das Panchayat-System stärkt.\n\nNach ihrer Niederlage haben die NLFI und die AIHRP seine Regierung scharf kritisiert und ihr vorgeworfen, lediglich ein Instrument für Fürsten und Großgrundbesitzer zu sein, um deren Macht zu sichern und die krassen Vermögensunterschiede in der indischen Gesellschaft zu verfestigen. Trotz ihrer lautstarken Proteste hat die erfolgreiche Führung von Premierminister Tiwana sein immenses Mandat gestärkt, Indien in die Zukunft zu führen."
 dominion_of_india_events.60.a: "Der Sieg ist unser!"

 dominion_of_india_events.61.t: "Die Autonomie von Sikhistan"
 dominion_of_india_events.61.d: "Seit vielen Jahren ist die auf die Sikhs ausgerichtete Partei Shiromani Akali Dal ein treuer Verbündeter unserer Partei, der die Stimmen der Sikhs sichert und unsere Glaubwürdigkeit als Partei der Inder aller Glaubensrichtungen erheblich stärkt. Tara Singh, der Parteivorsitzende, setzt sich seit langem für die Gründung eines \"autonomen Sikhistan\" in den Regionen des Ost-Punjab und unter Einbeziehung der Sikh-Fürstenstaaten rund um Patiala ein.\n\nAngesichts der Unterstützung, die er während der Unruhen des Jahres 1936 und im jüngsten Wahlkampf erfahren hat, sowie angesichts des enormen Mutes, den die Sikhs an den Fronten des Krieges bewiesen haben, hat Premierminister Tiwana nun offiziell die \"Autonome Provinz Sikhistan\" ausgerufen.\n\nDie Gründung dieser Provinz stieß bei der NLFI auf großen Spott, wurde jedoch von der AIHRP und insbesondere von Jinnah mit sarkastischem Beifall bedacht, der erklärte, dass zwar mehr Autonomie der richtige Schritt nach vorne sei, es jedoch höchst fragwürdig sei, dass ausschließlich Sikhs belohnt worden seien und nicht die muslimischen Gemeinschaften in ganz Indien. Nichtsdestotrotz werden sich die Sikhs in ganz Indien auf absehbare Zeit daran erinnern, welche Partei es war, die ihnen endgültig ihre Heimat zugesprochen hat."
 dominion_of_india_events.61.a: "Aus diesem Grund erwarten wir von ihnen Loyalität."

 dominion_of_india_events.62.t: "Sieg der Unionisten-Strategie"
 dominion_of_india_events.62.d: "Die Loyalitäten der indischen Muslime sind seit langem gespalten – dank der hinterhältigen Machenschaften von Muhammad Ali Jinnah und seiner beiden Machtinstrumente, der All-India Muslim League und der Allindischen Selbstverwaltungspartei (auf die er den Großteil seiner Bemühungen konzentriert). Doch tatsächlich, während sich die Welt weiterdreht und angesichts unseres Sieges bei den jüngsten Wahlen, haben viele Muslime begonnen, sich zu fragen, ob Jinnah sie wirklich vor den chauvinistischen Liberalen und vor dem grassierenden konfessionellen Hass im ganzen Land schützen kann. Immer wieder haben sich die Wohlwollen der Unionisten und die pluralistische Strategie als die wichtigsten Bollwerke zur Verteidigung der Rechte der Muslime erwiesen.\n\nDie Zeiten der Vorherrschaft der Hindus über die Muslime, der Muslime über die Sikhs oder ähnlicher Aufregungen sind dank einer effektiven pluralistischen Regierungsführung und Reformen vorbei. Heute betrachten die Muslime Indiens Jinnah immer weniger als ihren Vertreter, da seine wiederholten Versäumnisse, seine Pläne umzusetzen, seinem Ruf endgültig geschadet haben."
 dominion_of_india_events.62.a: "Eine solche Enthüllung war einfach unvermeidlich!"

 dominion_of_india_events.63.t: "Sapru schießt scharf zurück"
 dominion_of_india_events.63.d: "Als Reaktion darauf, dass Premierminister Tiwana seine Verteidigung der reservierten Sitze in den Kammern noch einmal bekräftigt hat, hat der einflussreiche Liberale Tej Bahadur Sapru eine bissige Streitschrift verfasst, in der er den Unionisten ungeheuren Illiberalismus und weitreichende Korruption vorwirft. Er wirft Premierminister Tiwana vor allem vor, sich dem Willen der Maharadschas und Zamindars zu beugen und auf Reformen nach westlichem Vorbild zu verzichten, zugunsten derselben rückständigen Regierungsführung, die bereits seit den Tagen des Mogulreichs in Kraft ist.\n\nSaprus Äußerungen fanden bei vielen reformorientierten Indern breite Unterstützung (auch wenn sie die ohnehin schon spärliche Unterstützung der Liberalen durch die Fürsten erschüttert haben, sehr zum Leidwesen anderer Parteimitglieder), doch die meisten, die bei klarem Verstand sind, führen sein großspuriges Auftreten auf Heuchelei und politischen Opportunismus zurück."
 dominion_of_india_events.63.a: "Sind sie nicht auch gegen eine Ausweitung des Wahlrechts?"

 dominion_of_india_events.64.t: "Zamindars Return to Chhattisgarh"
 dominion_of_india_events.64.d: "The regime of the INC saw many landowners driven from their estates, instead instantiating radical measures of land-reform and leaving many Zamindars destitute and destroyed. While other parties prefer to waffle on the question of restoring Indians to their rightful properties, PM Tiwana has an effective and resolute commitment to undoing the damage of the Red Raj. Now, thousands of landowners have been returned to their home provinces and have been endowed once more with their land.\n\nMany former Zamindars have been taken over by cooperatives and former tenants, and such returns have been stymied in Chhattisgarh by their current occupiers, particularly around Jagdalpur. Unwilling to cede their lands or accept the buyouts offered, Indians opposed to the return of the Zamindari have taken up arms and sprung a revolt, one that was quickly crushed by the army. Zamindars now return aided by the force of the army, ensuring their estates are properly secured and that peasant unrest is met with hard reality."
 dominion_of_india_events.64.a: "You'd think these \"Cooperatives\" would be more cooperative."

 dominion_of_india_events.65.t: "The [GetYear] Mahasabha Mutiny"
 dominion_of_india_events.65.d: "Ever since the government cracked down on the Hindu Mahasabha's inflammatory activities, agitation from their ranks has grown more and more severe. The outspoken voices of B.S. Moonje and Bhai Parmanand, figures which have narrowly skirted legal charges partially due to their connections with the Liberale, have only amplified tensions. The fall of the Bharatiya People's Republic and the slew of arrests and trials which followed came the imprisonment of V.D. Savarkar, a spiritual leader of the Hindu Mahasabha who threw in with the rebels. Parmanand, who has tirelessly campaigned for his release to a dearth of success, has mobilised a massive crowd of Hindu nationalists for a demonstration in Delhi.\n\nPM Tiwana directly authorised a police crackdown once reports came through of damage to Muslim commercial properties, and the protest transformed into a riot. The battles which ensued saw several streets locked down and a conflict lasting two days, with the city coming under martial law soon after. Following a death toll of 367, arrests have been made on leaders of the Hindu Mahasabha nation-wide, and the organisation itself declared a terrorist entity and banned."
 dominion_of_india_events.65.a: "A terrible riot, but now we can easily be rid of their lot."

 dominion_of_india_events.66.t: "Tiwana at the Gala"
 dominion_of_india_events.66.d: "PM Tiwana has held a gala at his expansive estate in Lahore, inviting several princes, industrialists, Unionist politicians and other influential Indians for a night of relaxation and enjoyment. One such goal of this meeting is to show off the results of the speech training he has undergone for several months, attempting to combat his stutter and improve his public speaking skills from their prior abysmal status. After much festivities, PM Tiwana called attention to the gazebo he stood at, illuminated by warm gas lamps against the dark night. Proclaiming that, despite great challenges, those who built India and have led it for years have been protected from the vicious assaults of the INC, as well as the Liberale and the Home Rule Party, and that it was through their support that they may all celebrate on such a fine night as then. Displaying a mastery of vocabulary and a flow as smooth as butter, the end of his speech was met with raucous applause, most loudly by members of his own family who took a keen interest in him improving his oratory.\n\nDescending from the gazebo as the gala continued and making his way to the kitchen to ensure that his chefs were making haste in preparing a most bountiful supper, a lone tear descended from his eye knowing that his family was proud of him, and that he has thus far carried out his immensely stressful job to incredible success."
 dominion_of_india_events.66.a: "A happy ending for everyone at the party."

 ## Extra Events

 dominion_of_india_events.70.t: "Tea Tourism in Simla"
 dominion_of_india_events.70.d: "Owing to our investment in tea plantations in the Kangra Valley, Simla's local commerce has blossomed considerably. With its strong flavor making an equally strong impression at tea festivals and competitions worldwide, many eclectic tourists travel to the north of the Dominion to tour plantations and try Kangra tea brewed fresh from the source.\n\nImports for the tea have steadily increased, and so long as the world economy remains stabilised, we can expect a steady income from the crop."
 dominion_of_india_events.70.a: "Our investments are paying off nicely."

 dominion_of_india_events.71.t: "Kashmir Silk Exported Worldwide"
 dominion_of_india_events.71.d: "Owing to our investment in the burgeoning Kashmir silk industry, the Dominion has become one of the largest silk exporters in the world. The material had seen diminished exports in the wake of Black Monday, but as the global economy stands back on its two feet we have found ample markets eager for the coveted material.\n\nBeing an exotic good, the revenue from such exports and our effective monopoly on the worldwide silk market has brought our government significant income; not to mention benefiting the lives of hard-working Indians in Kashmir greatly."
 dominion_of_india_events.71.a: "We're serious about sericulture."

 dominion_of_india_events.72.t: "The Allindischer Verband der Registrierten Kasten"
 dominion_of_india_events.72.d: "In the wake of the post-war political structure accommodating the expansion of minor parties, both new and old, few are more noteworthy than the Allindischer Verband der Registrierten Kasten. Led by Namasivayam Sivaraj, an associate of B.R. Ambedkar, it has sworn itself to a platform of uplifting the downtrodden, protecting Dalits and dissolving the caste system which yet still affects Indian society day to day, hour to hour. While Ambedkar's reputation among the Dominion's political society was tremendously tarnished after he sided with the INC in the Indian Revolution, Sivaraj's rise to prominence comes as an olive branch to his erstwhile political comrade, and there are a plurality of rumours floating about that Ambedkar controls the AISCF behind the scenes.\n\nIrregardless, Sivaraj remains as the party's flagbearer, and has already made inroads at reaching out to the Nationalliberale Föderation Indiens and the Allindische Selbstverwaltungspartei. Depending on how receptive either party is to adopting Sivaraj's progressive, egalitarian agenda, the Scheduled Castes of India may yet see a political force which could both give half a damn about them and also actually affect their place in society."
 dominion_of_india_events.72.a: "Perhaps the two Federations could join forces?"
 dominion_of_india_events.72.b: "We both have \"All-India\" in the name, so why not join forces?"

 dominion_of_india_events.110.t: "British Officers Arrive from India"
 dominion_of_india_events.110.d: "With the collapse of the Dominion of India, there has been a mass exodus of British officers, fleeing from the horrors that their conquerors would surely inflict upon them if they stayed.\n\nThere are many of these men fit to still serve, with plenty eager to be sent back into action, with hopes of one day avenging their great defeat."
 dominion_of_india_events.110.a: "One day we shall rescue the jewel..."

 dominion_of_india_events.115.t: "Results of the [GetYear] National Elections"
 dominion_of_india_events.115.d: "It has been four years since the last democratic elections took place in our fair state. From the mouth of the Indus to the peaks of the Himalayas our trusted officials and commissioners are busy erecting voting booths for those enfranchised Indians ready to cast their vote and decide what government shall lead the nation in the years to come. The provinces of India have counted their ballots, and at last the result is..."
 dominion_of_india_events.115.a: "The Unionisten triumph at the ballot!"
 dominion_of_india_events.115.b: "The Liberale seize the day!"
 dominion_of_india_events.115.c: "The AIHRP achieve victory!"

 dominion_of_india_events.152.t: "The Passing of Ganga Singh"
 dominion_of_india_events.152.d: "Maybe the greatest Indian to have lived since the birth of the Raj, Maharaja Ganga Singh passed away at his royal palace in Bikaner State late last night. Having led a distinguished career within the British and Indian armies, Singh was the man who forged a stable legal government in the mad current of socialist rebellion and princely treachery.\n\nNow, with India stronger than ever, his place will be incredibly hard to fill."
 dominion_of_india_events.152.a: "The people of India enter a state of mourning."
 dominion_of_india_events.152.b: "J.R.D. Tata, the brilliant magnate, succeeds him as Viceroy."
 dominion_of_india_events.152.c: "A.C. Chatterjee, the stern diplomat, succeeds him as Viceroy."

 dominion_of_india_events.155.t: "Death of Khengarji III of Kutch"
 dominion_of_india_events.155.d: "A progressive and venerable prince, Khengarji III of Cutch passed away this evening at his residence in Bhuj, Gujarat. Having ruled his state wisely for 67 years, the late prince will be mourned by many."
 dominion_of_india_events.155.a: "Fare thee well."

 dominion_of_india_events.156.t: "Passing of Sir Mian Fazl-i-Husain"
 dominion_of_india_events.156.d: "The architect of the gentry/peasant (kisan) political alliance that laid the groundwork for the powerful Unionistische Partei, Sir Mian Fazl-i-Husain has passed away after a prolonged period of illness.\n\nHaving been absent from the day to day running of the party for a prolonged period of time owing to his illness, Fazl-i-Husain will nevertheless be sorely missed within conservative circles."
 dominion_of_india_events.156.a: "The Unionistische Partei soldiers on!"

 dominion_of_india_events.162.t: "Aiding the New Indian Navy"
 dominion_of_india_events.162.d: "With cross-Empire trade picking up, the Indian government has decided to expand its naval assets to help protect the increased shipping.\n\nThe Indian ambassador to [Root.GetNameDef] has approached our government with a request for development aid regarding both engineers and naval officers. This could be a great way of strengthening the Empire's position in the Far East!"
 dominion_of_india_events.162.a: "Dispatch technical and development assistance!"
 dominion_of_india_events.162.b: "They're on their own."

 dominion_of_india_events.163.t: "Arrival of the [From.GetAdjective] Naval Mission"
 dominion_of_india_events.163.d: "After a vigorous sea journey the [From.GetAdjective] naval attachés and ship construction experts have debarked in Karachi. Should we set them up in Karachi itself or maybe expand the existing civilian naval hub in Bombay?"
 dominion_of_india_events.163.d.aust: "The naval delegates from the [From.GetAdjective] government have just arrived in Bombay. With their great experience of conducting operations in the Pacific the new Indian navy shall become a truly imposing sight on the high seas!"
 dominion_of_india_events.163.a: "Use them to expand the Karachi naval base!"
 dominion_of_india_events.163.b: "Set them up in Bombay, the beating heart of Indian commerce!"
 dominion_of_india_events.163.c: "We should name a ship HMIS Bruce!"

 dominion_of_india_events.300.t: "Fate of the Rebel Officers"
 dominion_of_india_events.300.d: "With any remaining rebel remnants being swiftly rooted out, the rightful government's control over the nation has been fully restored. At last fully recognising their defeat, the defeated officers of the rebels have petitioned for amnesty in exchange for serving the Dominion.\n\nWhile more men would certainly be a benefit, especially with the experience the most skilled amongst them may have picked up in both stages of the civil war, accepting them in would certainly ruffle a few feathers, and potentially allow seditious influence to fester. A decision must be made on whether we should even accept these offers, instead of simply imprisoning them alongside the other traitors, and also who we should even consider letting in if we do."
 dominion_of_india_events.300.a: "Only let in the few skilled officers of the Republic."
 dominion_of_india_events.300.b: "Allow in some of those who fought against the socialists."
 dominion_of_india_events.300.c: "Let in the neutral officers from both rebel governments."
 dominion_of_india_events.300.e: "These men are beyond redemption, lock them away for ever!"

 dominion_of_india_events.311.t: "Status of the Former French Colonies"
 dominion_of_india_events.311.d: "France had been the only major rival to Britain's colonial ambition in India and despite the latter's ultimate triumph, the French remained entrenched in several small enclaves. With the inclusion of the late Madras Republic's territory we now control the largest of these former French possessions, Pondicherry.\n\nIt has been suggested that we restore some sort of autonomy to the city as a gesture of goodwill to our French allies, although this could be mistaken for tacit approval of foreign colonialism."
 dominion_of_india_events.311.a: "We can afford our French friends some special rights."
 dominion_of_india_events.311.b: "Merge the concessions into proper Indian states."
 dominion_of_india_events.311.c: "Ban all French institutions and enforce Indian values!"

 dominion_of_india_events.99.t: "Future of the Bombay-Pakt"
 dominion_of_india_events.99.d.start: "With the socialist armies completely routed, the Bombay-Pakt has effectively now dissolved, having served its purpose to defend against Calcutta's marauders. The pressing question on everyone's mind now however is: What happens next?"
 dominion_of_india_events.99.d.raj: "$dominion_of_india_events.99.d.start$ Despite the Federation's rival claim to being the true government of India, our mutual cooperation against Calcutta has shown that we do not necessarily need to continue to be at odds. While negotiations will almost certainly need to happen to attempt to figure out what the future holds, an agreement has been reached for now with Hyderabad to hold off on any talks for at least a month, to give us both time to recover and reorganise ourselves."
 dominion_of_india_events.99.d.prf: "$dominion_of_india_events.99.d.start$ The Dominion has of course always refused to recognise the Federation's independence, even standing steadfast over the issue as the Bombay-Pakt was first negotiated. It seems unlikely that they will concede the issue at this stage, with it being widely expected that Lahore will soon demand our submission, absorbing our states into their regime. While for now an agreement has been reached to hold off on any talks for at least a month, to give us both time to recover and reorganise ourselves, we must begin preparing for what comes after this truce."
 dominion_of_india_events.99.a: "They should begin preparing for their accession already."
 dominion_of_india_events.99.b: "If they think we'll join willingly, we have plenty of bridges to sell..."

 dominion_of_india_events.100.t: "Negotiators Arrive in Hyderabad"
 dominion_of_india_events.100.d: "It has been over a month now since the eastern rebellion was at last put down, enough time for the initial chaos in both our territories and those in the south to subside. Not willing to wait a moment longer to at last reunify the nation, negotiators have been sent to Hyderabad, with the explicit aim of demanding their accession to the Dominion.\n\nWhile of course we are willing to grant great concessions if it means avoiding a second phase of the war, we must be ready for what may happen if they fail to act reasonably."
 dominion_of_india_events.100.a: "Let's hope they see sense."

 dominion_of_india_events.101.t: "The Dominion Demands Our Accession"
 dominion_of_india_events.101.d.default: "With the month's grace period having elapsed, the Dominion has immediately turned its eyes south towards the Federation, and have sent a team of negotiators to demand the abandonment of our claim to national government and accession to the Dominion.\n\nWhile surrendering back to the British crown after years of freedom is a tough pill to swallow, [RAJ.Capital.GetCapitalVictoryPointName] has made it clear that they will not accept \"No\" for an answer, and there are those within the government who believe reintegration is better than another war; provided of course that the Federation's government is granted a place in the Dominion's administration and a degree of autonomy is maintained in the south."
 dominion_of_india_events.101.d.osman: "With the month's grace period having elapsed, the Dominion has immediately turned its eyes south towards the Federation, and have sent a team of negotiators to demand the abandonment of our claim to national government and accession to the Dominion.\n\nUpon the diplomats presenting their demands to Osman, he ordered their immediate arrest and at once began to prepare a new firman declaring the Federation's rule over the entire subcontinent and giving [RAJ.Capital.GetCapitalVictoryPointName]'s troops 24 hours to step down before they will be dealt with like an occupying force. The Dominion, unsurprisingly, has yet to agree to this counter demand."
 dominion_of_india_events.101.a: "Over our dead bodies!"
 dominion_of_india_events.101.b: "The Asafia banner shall fly high over Lahore!"
 dominion_of_india_events.101.c: "Demand autonomy and a place in government"

 dominion_of_india_events.102.t: "Hyderabad Refuses Accession Demands"
 dominion_of_india_events.102.d.default: "Somewhat unsurprisingly, the southern Federation have refused to peacefully reunify the nation despite our past cooperation, and have made clear that they will never accept the Dominion's rule over them for as long as they live.\n\nIt seems clear then what our next action must be."
 dominion_of_india_events.102.d.osman: "Despite our peaceful intentions, the traitorous Nizam has ordered the arrest of our diplomats and has gone so far as to declare that we have 24 hours to stand down and accept his rule over all of India, or face war.\n\nIt seems clear then that we have been given no other choice."
 dominion_of_india_events.102.a: "It is time to show these traitors their place!"

 dominion_of_india_events.103.t: "The Federation Demands Concessions"
 dominion_of_india_events.103.d: "As expected, while the Federation has tentatively agreed to accede to the Dominion, their leadership have demanded a place in the nation's governance and a great degree of autonomy for their lands in the south.\n\nSuch extortionate demands are hard to stomach, but it seems if we wish to at last reunify the nation accepting them is our best option."
 dominion_of_india_events.103.a: "We accept their terms."
 dominion_of_india_events.103.b: "Who do they think they are to make such demands?"

 dominion_of_india_events.104.t: "The Dominion Agrees to Our Terms"
 dominion_of_india_events.104.d: "[RAJ.Capital.GetCapitalVictoryPointName] has agreed to grant us the concessions we have demanded, and as a result Osman, as head of state of the Federation, has signed his final firman ordering the dissolution of the Federation and the accession of all of its members into the Dominion."
 dominion_of_india_events.104.a: "Hopefully we won't have to secede a second time..."

