### Characters ###

 #Leaders

 RAJ_ganga_singh: "Ganga Singh"
 RAJ_ganga_singh_leader_desc: "§YBorn:§! §LApril 6th, 1886, in Bikaner, Bikaner State, Rajputana Agency, India§!\n§YBackground:§! §LGanga Singh's military and aristocratic career is among the most prestigious of any Indian prince on the continent. Privately educated at Mayo College and additionally tutored by a British civil servant, the British Raj took care to cultivate loyalty in Singh. After serving with the 42nd Deoli Regiment, fighting in the Chinese Boxer Rebellion, he served as Aide-de-camp to George V in 1902 for the coronation of Edward VIII and later for George's own coronation. Fighting in the Weltkrieg, he was a member of the Imperial War Cabinet and was party to the Treaty of Hanover.\n\nAs the sovereign ruler of Bikaner, his reforms became known as some of the most progressive in any Princely State. Ganga Singh's service in the Indian Civil War and his persistent support for Dominion status have made him a tremendously respected figure across the spectrum of the Dominion of India's politics. As such, Singh's selection as the first Indian Governor-General was met with wide acceptance. Singh now faces the task of reuniting the subcontinent under the British Crown, an unenviably and difficult quest for certain.§!"
 RAJ_jehangir_ratanji_dadabhoy_tata: "Jehangir Ratanji Dadabhoy Tata"
 RAJ_jehangir_ratanji_dadabhoy_tata_advisor_desc: "§YBorn:§! §LJuly 29th, 1904, in Paris, Seine, French Republic§!\n§YBackground:§! §LScion of the prestigious industrialist Tata family, J.R.D. Tata's life began in France, unusual for most Indians. As a result, French became his first language and he was educated in a French Lycée where he was commonly mistaken as an Egyptian. He attended some private schooling in Bombay before briefly moving to Yokohama, Japan, and then moved again to England in 1923 to enroll in Cambridge University to study Engineering. Upon the British Revolution, Tata returned to India and formally renounced his French citizenship for Indian citizenship once the Dominion of India came into being.\n\nSince then, much of his time has been spent expanding the Tata Company to encompass the aviation industry. While the aftermath of the Indian Civil War left the Indian economy in a sluggish state, he hopes that reunification will allow for India to reach it's true economic potential.§!"
 RAJ_atul_chandra_chatterjee: "Atul Chandra Chatterjee"
 RAJ_atul_chandra_chatterjee_leader_desc: "§YBorn:§! §LNovember 24th, 1874, in Calcutta, Presidency of Fort William in Bengal, British India§!\n§YBackground:§! §LChatterjee spent his younger years educating himself at the Presidency College in Calcutta, later transferring to a constituent college of Cambridge University where he graduated with honours. After passing his civil service examination in 1896, he worked in the United Provinces where he would later rise to become District Collector.\n\nChatterjee spent much of the immediate post-Weltkrieg period interested in labour issues, but rebuking the serpent of Syndicalism in all its forms. During the formulation of the Dominion's constitution, he contributed to the implementation of its labour codes, though not all of his suggestions made it into the final product. Though the Unionist government's failure to consult him during the 1936 Karachi Dockworker's Strike frustrated him, Chatterjee is committed to his role as an apolitical Governor-General.§!"

