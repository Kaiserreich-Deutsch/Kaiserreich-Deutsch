### Bookmark ###
 PRF_KR_gathering_storm_desc: "When rebellion swept across India, it struck great fear into many of the nation's princes, who believed that the rebels would oust them as they had the British. Viewing the Raj as entirely shattered, they would declare their own independence as the \"All-India Federation\" under the leadership of Osman Ali Khan, colloquially known as the Princely Federation. Despite initial setbacks, the Federation would survive until the ceasefire in 1927, and soon after enter a defensive pact with the new Dominion. The Federation's survival still however remains in a state of flux, with opposition against Osman's authoritarian rule growing stronger every day."

