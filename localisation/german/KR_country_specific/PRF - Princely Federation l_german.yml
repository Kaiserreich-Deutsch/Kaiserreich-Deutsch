 PRF_guide: "§MDeclare the Kaisar-i-Hind§! / §MFather of the Federation§! ($paternal_autocrat_coloured$)\n£white_dot Have the Balance of power be at §MPartial Control by the Nizam§!, §MSignificant Control by the Nizam§! or §MComplete Dominance of the Nizam§! by January of 1937.\n£white_dot After unifying India you will be able to declare the Federal Empire of India with Osman as Kaiser-i-Hind.\n\n§MFederal Elections§! ($authoritarian_democrat_coloured$ / $market_liberal_coloured$)\n£white_dot Have the Balance of power be at §MDisputed Dominance§! by January of 1937.\n£white_dot In the national elections, appoint Madapati Rao to have the §mAndhra Mahasabha§! take power or appoint Ramaswami Iyer to lead a §aBundesregierung§! and contain the radicals.\n\n§MReign of the Princes§! ($authoritarian_democrat_coloured$)\n£white_dot Have the Balance of power be at §MPartial Princely Control§!, §MSignificant Princely Control§! or §MComplete Princely Dominance§! by January of 1937."

### Events ###
 princely_federation_events.1.t: "An Uneasy Anniversary"
 princely_federation_events.1.d: "With its winter recess nearing its conclusion and the Federation now entering its tenth year, the members of the great Fürstenrat have departed once again for Hyderabad for the upcoming session. While these sessions have never exactly been the most cordial, especially in recent years, rumours have begun swirling about what may happen this time round; owing to the growing resentment between the Nizam, the Council's leader, and its other four members. While these princes, who have colloquially become known as the \"Big Four\", do not agree upon every issue, they have become an almost homogeneous unit in their opposition to Osman's authoritarianism.\n\nThe heart of their issues with him begins with the special status Osman was granted as part of the Federation's founding constitution, through which he was given the ability to exercise special powers, originally intended to be reserved only for emergency situations. Every year since the Federation's founding has however seen the Nizam's use of these powers grow more and more frequent, with even some mundane proposals being vetoed under them for seemingly the pettiest of reasons.\n\nAs one of the last actions before the winter recess, the Nizam vetoed a proposal that had received the backing of all four other princes to fund an expansion of the University of Bombay, seemingly entirely on the grounds of a minor squabble with one of the faculty, leading to an angry argument erupting. With gossip about this argument quickly spreading to the general public, and whispers of secret meetings between the Big Four in its aftermath, it is no surprise that people are expecting something significant to occur in the coming days."
 princely_federation_events.1.a: "Hard to say if the Federation will survive another decade if this keeps up..."

 princely_federation_events.2.t: "Convening of the Council"
 princely_federation_events.2.d: "With the Winter recess now concluded, and the Council's members having safely arrived to Hyderabad, the first few days of this session have so far been surprisingly calm despite the thick tension in the air.\n\nWhile the issues that have been discussed over these first few days have hardly been controversial, the Nizam has not yet taken the opportunity to veto any of them, and discussions have generally been progressing at a steady pace. Throughout Hyderabad it seems many have begun to discount the rumours of the previous weeks, although perhaps it is too early to tell..."
 princely_federation_events.2.a: "Off to a decent enough start, I suppose."

 princely_federation_events.3.t: "The National Diwan Proposal"
 princely_federation_events.3.d: "In a rather unsurprising turn of events, things within the Council have not remained harmonious for long, and at last a major new dispute has arisen between the Big Four and the Nizam. Almost immediately after the Nizam chose to veto a proposal regarding railway expansion in Calicut, on grounds of the price, a new proposal was suddenly presented. It seems that during the recess time was taken to draft up a plan, spearheaded by Maharaja Chithira Thirunal of Travancore, to resolve the issue of the Nizam's overuse of reserved powers. Under this proposal many of Osman's present powers would find themselves transferred to a national Diwan, who would be chosen from amongst the Council's members via an election held by the Chamber of Princes, an institution inherited from the former British administration of which the minor princes of the federation make up the membership.\n\nWhat followed was perhaps an even less surprising turn of events, with the Nizam immediately interpreting this proposal as a direct attack upon his character, leading to not only his immediately vetoing of the proposal but also the further step of using his powers to temporarily prorogue the Council for the remainder of the session. Not giving time for an argument to break out, Osman immediately vacated the building. According to the current round of rumours, Osman's prorogation has left the Big Four even more outraged, and even Paramasivan Subbarayan, the observer from Madras, is said to have privately expressed his support for the members despite disagreeing with much of their proposal. Whatever happens next, it is clear that this crisis is only the beginning, and that the Council will not make it another year without some kind of radical change."
 princely_federation_events.3.a: "Surviving another year, let alone a decade, is starting to seem generous at this point."

 princely_federation_events.4.t: "Shocks of Black Monday Hit the Federation"
 princely_federation_events.4.d: "Despite chaos sweeping across the globe as a result of the German crash, many within the Federation were still confident in the belief that it would not reach as far as India, with these people potentially being wilfully ignorant in hopes of a new crisis arriving just days after the last. Unfortunately for the nation, these hopes have been for naught, and the Federation has too succumb to the aftershocks, owing greatly to German economic interests in both India and their wider Asian sphere.\n\nHowever, in what many are considering a silver lining, it seems that the crisis in the Council may for now have been put on the back bench, as the Nizam has made the extraordinary move of reversing his prorogation of the Council in an attempt to weather the storm. While the Big Four clearly have not discarded their hatred for Osman in the span of a few days, they have at least agreed to put their differences aside and have begun to return to Hyderabad for the reconvening of the session."
 princely_federation_events.4.a: "Nothing like a good crisis to bring people together."

 princely_federation_events.5.t: "The Bombay Mills Strike"
 princely_federation_events.5.d: "While everyone has been hit hard by the impacts of Black Monday, few have been hit harder than the poor mill workers in the nation's industrial heart of Bombay. As an expression of their anger at the system, workers at multiple of the mills in Girangaon took part in a walkout, which would soon escalate upon many of these strikers being arrested following an appeal to police by the owners of the mills. Soon after thousands would take to the streets of Bombay in protest, with fights breaking out between the police and protestors, resulting in multiple injuries and significant damage to local property. In the aftermath even more protestors were arrested, most notably Bhalchandra Trimbak Ranadive, a known socialist agitator almost certainly backed by Calcutta.\n\nAlthough this unrest has seemingly been put down for now, there are fears that any small spark in the mood of Bombay could still easily result in a renewed wave of violence. With the arrest of Ranadive however, an opportunity has emerged to attempt to quell the workers somewhat. By placing the blame upon Calcutta's spies, and pardoning those who were simply misled by them, things may begin to cool back down and earn the government much needed favour."
 princely_federation_events.5.a: "Pardon the strikers, only Calcutta's spies shall face punishment."
 princely_federation_events.5.b: "These vandals are lucky to have only been arrested!"

 princely_federation_events.6.t: "Andhra Mahasabha Sweep Madras"
 princely_federation_events.6.d: "Even with the multiple crises that have hit the nation, the autonomous region of Madras has not let that stop them from holding elections, and their results have begun to arrive over the past few days, providing results that few by now have been shocked by. The Justice Party, who have ruled Madras since the region's first elections in 1920, have found themselves wiped out in the face of the rise of the Andhra Mahasabha, now the largest party in the Legislative Council.\n\nNear the end of the previous decade, the Mahasabha itself could hardly even be considered a political party, having been primarily formed as a pressure group for the Telugu language. Under the leadership of Madapati Hanumantha Rao they however began attempts to reform into a proper party in order to contest the 1929 and 1933 elections. While they initially saw significant successes in the northern Telugu speaking parts of Madras, they ended up seeing little success elsewhere, especially amongst the primarily Tamil south.\n\nSince 1933 the mood in Madras has rather dramatically shifted, owing in large part to the perceived stagnation of Madras under the Justice Party's rule and their poor localised response to the Black Monday crisis, but more importantly the Mahasabha's much more vocal opposition against supplanting Tamil's usage with any kind of \"northern\" language. It is generally now believed that Suravaram Pratapa Reddy, the party's head in Madras, will be appointed First Minister by the Provincial President, while Paramasivan Subbarayan will once again be reappointed as the state's neutral observer on the Fürstenrat."
 princely_federation_events.6.a: "Madras enters a new era, hopefully for the better."

 princely_federation_events.7.t: "The Salt Tax Debate"
 princely_federation_events.7.d: "Although so far there has been mostly universal agreement amongst the Council on policies to tackle the economic crisis, it would be hard to not eventually reach an issue to which the Nizam and the Big Four would end up butting heads on, with today's being the issue of the Salt Tax. Salt has long been taxed in India, but under British rule this taxation reached inordinate levels with many citing its doubling in 1923 as one of the primary inciting forces for the revolution that erupted soon after. When the Federation first came into existence, the Nizam and the Big Four collectively agreed to repeal the 1923 increase, but even still the Salt Tax has remained one of the chief sources of federal income to this day.\n\nWith the ongoing economic crisis however, even the current levels of Salt Tax have slowly become seen as nearly as extortionate as under the British, seemingly made especially worse by socialist agitators from north of the border where such a tax no longer exists. To the Big Four, the lowering of the tax seems like the obvious solution, even if it may result in a significant reduction of income to the Federation.\n\nSuch a proposal has been met with strong opposition from the Nizam, a man whose often notoriously miserly nature would not even see him pay three annas for a dab of ice cream if he thought it wasn't high enough quality. Passing this proposal is not however seen as completely impossible, as the Nizam has often been known to be won around with a suitably moral argument, and so only time will tell if the Princes will be successful with such an approach."
 princely_federation_events.7.a: "The people cannot continue to suffer, lower the tax."
 princely_federation_events.7.b: "We cannot afford to give in to the greed of peasants."

 princely_federation_events.8.t: "State of Maharashtra Proposed"
 princely_federation_events.8.d: "Although southern India may now be free from British rule, it has yet to fully free itself from the administrative scars such rule has left upon it, and many territories still find themselves left in an awkward internal limbo. While the former Madras Presidency may have found itself joining the Federation peacefully as a constituent state, the same did not hold true for the Bombay Presidency whose lack of a strong council led it to quickly being picked apart by local princes. In the south of the presidency, Kolhapur especially made use of the opportunity to greatly enlarge itself, further reinforcing its status on the Council. This all ended upon the Nizam issuing a proclamation that all lands north of Pune would be administered by Hyderabad until a proper agreement could be reached as to its division, owing to skirmishes amongst the princes over the land.\n\nDespite some official adjustments being made in subsequent years, most notably seeing Nasik and the surrounding area being ceded to Baroda to serve as a new capital while Baroda itself remained under socialist occupation, the situation has remained mostly unchanged since the revolution. In an attempt to rectify things however, an idea that has been floating around the Chamber of Princes has at last made its way up to the Council. Under this motion, the remaining lands in Bombay would be combined with those still held by Baroda into the state of Maharashtra led by Sayajirao Gaekwad, with Baroda being handed over to another member of the dynasty if it were to ever be restored.\n\nAlthough this motion is clearly a popular one, and regarded as just compensation for a Council member, Osman has remained reluctant about giving up control over the territory, especially the city of Bombay itself. While inclined to keep it, the Nizam has also considered adopting an alternative proposal suggested by Akbar Hydari to partition the remaining region amongst all of the local princes, with Bombay remaining under Osman's direct control. With the territory being under the Nizam's control, the choice on its future is entirely his to make."
 princely_federation_events.8.a: "It is only fair for Gaekwad to be compensated."
 princely_federation_events.8.b: "Bombay shall be partitioned between the local princes."
 princely_federation_events.8.c: "This land is the Nizam's by right, tighten the grip!"

 princely_federation_events.9.t: "Foundation of the Deccan Football Federation"
 princely_federation_events.9.d: "For half a century or so now football has been played regularly in India, one of the few things imported from Britain that is still held in high regard in the Federation, and supporting its growth is perhaps the only common policy you'll find between the Federation and the Calcutta regime. While the sport has historically been most popular in Bengal, its popularity in Cochin and Travancore cannot be discounted, and since India's fracturing it has spread rather rapidly throughout the rest of the Federation, with a team now even sponsored by Maharaja Wadiyar in Mysore.\n\nOwing to the growing popularity of football within the Federation and an expanding number of teams, there has been talk for the past few years of a merger between the Mysore and Madras Football Associations into one singular entity responsible for governing the sport for the entire country, and as of last week it seems these talks have finally borne fruit. In the coming months the formation of the \"Deccan Football Federation\" is set to occur, with the organisation being expected to be based in Bangalore. Attempts are also already being made to organise an all-Federation league, with both the Ferguson Club and Madras Sporting Club having agreed to sign up to such a venture. While things may remain tense both at home and on the border, advancements like this in the sporting world should at least help the average person more easily get through it."
 princely_federation_events.9.a: "Nothing like a good old game to take your mind off things."

 princely_federation_events.10.t: "Appointment of a New Chief Justice"
 princely_federation_events.10.d: "With the nation slowly emerging from the ashes of Black Monday, the Council has now fully returned to proper non-emergency sessions, although proceedings are still expectedly tense. Today's disagreement is rather textbook, aside from the Nizam seemingly holding back on the misuse of his powers for once. The previous Chief Justice of the Supreme Court, Pazhamaneri Iyer, announced his retirement a few months ago on account of his advanced age. The appointment of a new Chief Justice is generally supposed to be handled by the Council, which has for the past few months been rather distracted. Now that it is finally being addressed, the Big Four and the Nizam remain staunchly divided on who should be his replacement.\n\nThe chosen candidate of the Big Four is Srinivas Varadachariar, a notable judge from Madras and the protégé of Pazhamaneri. Varadachariar is seen as the natural successor for the position, and his neutrality in regards to ongoing Federal politics is seen as a major positive of his selection. The Nizam on the other hand favours Alam Ali Khan for the opposite reasons, with Ali Khan being from Hyderabad itself and someone whose family has had ties to both Osman as well as his father, making it likely that he would side with the Nizam on key issues. Still, Ali Khan isn't a purely nepotistic pick, with his own strong record to boot, and the rest of the Council could still decide to back his candidacy if Osman refuses to budge; although with it being unlikely for him to veto Varadachariar the princes could simply stand their ground and vote him in."
 princely_federation_events.10.a: "The job will go to Varadachariar."
 princely_federation_events.10.b: "The Nizam trusts that Ali Khan will rule more fairly."

 princely_federation_events.11.t: "The Silver Jubilee"
 princely_federation_events.11.d: "Today marks the Nizam's Silver Jubilee, the twenty fifth anniversary of his ascent to the throne following his father's unfortunately early demise. While there have of course been festivities held to celebrate this great milestone, especially with those in Hyderabad itself being granted a day off from work to celebrate, Osman has announced an even greater celebration durbar to be held in February.\n\nThe Nizam's announcement has generally been well received even with recent events, although some have taken note of a seemingly suspicious undertone regarding his claims of \"great change\" that will coincide with the event, however many have simply dismissed this as unfounded speculation."
 princely_federation_events.11.a: "A good Durbar is always a fantastic time."

 princely_federation_events.12.t: "Majlis-e-Ittehadul Muslimeen Denounce the Council"
 princely_federation_events.12.d: "Since its founding during the early days of the Federation, the Majlis-e-Ittehadul Muslimeen has been one of the loudest voices in support for the Nizam's rule over the nation, breaking with many to back his constant use of vetoes and other such powers. Today, however, they have gone a step further than they ever have before, with their leader Muhammad Bahadur Khan openly calling for the abolishment of the Fürstenrat and his support for the Nizam's direct rule over the Federation. He has made clear his belief that the council has done nothing but hold India back, stating that it was the Nizam who saved the south from destruction by the socialist bandits who marched upon it. Khan has further argued that the Federation should further be reformed to protect the interests of Muslims, and that the Federation's laws should be modelled upon Sharia lines, although also giving the reassurance that Hindus would be exempt from certain aspects.\n\nWhile the Nizam is rumoured to privately support Khan's statements, he has quickly faced immense pressure to publicly distance himself from these radical statements, by not only the Big Four but also many of his close advisors. They have made clear to him that even if he does think Khan is right, it would be foolish to not at least placate the other princes through a public statement. They can however do little but hope that the Nizam listens to their reasoning on this matter."
 princely_federation_events.12.a: "Such divisive radicalism cannot be supported."
 princely_federation_events.12.b: "He has a point, you know that?"

 princely_federation_events.13.t: "Push to Reform the Chamber of Princes"
 princely_federation_events.13.d: "Originally founded by the British to allow the voices of Indian princes to be heard, the Chamber of Princes has remained rather unchanged in its continued form in the Federation, save for words going to the Council rather than the Viceroy. While on occasion proposals find their way up from the Chamber to the Council, officially introduced by one of the Council members, the Chamber has so far remained little more than a forum for grievances to be heard. Today's proposal, sponsored by Rajaram III, aims to change that, through giving the Chamber an advisory role in the law making process. As part of this, proposals would be first submitted to the Chamber for review before they reach the Council at all, with the princes of the Chamber providing feedback and requesting changes where needed. The proposal would then be returned to the Council member, at which point they could choose to revise it further and resubmit it to the Chamber, or submit it directly to the Council.\n\nAs expected, the Nizam has made quite clear his opposition to the idea, and in spite of his restraint in recent months he has at least signalled that he may simply move to veto the proposal outright as he has done so many times before. So far the only thing that has stopped him acting is the advice of his trusted advisor Akbar Hydari, who has instead proposed to Osman that he back the proposal, arguing that it ultimately gives little power to the Chamber but with his backing he could easily frame it as a major gift to the princes. Such a gift would of course greatly improve the Nizam's standing amongst the lesser members of the Federation, something that may prove useful in the event of him needing allies against the Big Four, while vetoing it may drive people into their hands instead. Whether Osman chooses to listen to this advice is anyone's guess."
 princely_federation_events.13.a: "Know that the Nizam has granted them these privileges."
 princely_federation_events.13.b: "These jumped up zamindars will ask for the Nizam's own palaces next at this rate!"

 princely_federation_events.14.t: "Temple Entry Proclamation"
 princely_federation_events.14.d: "While caste permeates all aspects of Hindu life within the Federation, how the law chooses to interact with it has always been a devolved issue for every state to handle in their own way. In the Kingdom of Travancore, under the rule of Senior Maharani and Regent Sethu Lakshmi Bayi, this manifested as a strong opposition by the government when it came to any legal protections for Dalits and a rigid enforcement of the taboo on sea travel. Bayi's rule as regent was however highly controversial, owing to both her authoritarianism and her original disputed appointment by the British, and when Chithira Thirunal came of age he immediately set out to reverse many of her policies.\n\nIt is no surprise then that today, a new proclamation has been given by the Maharaja, promoted to the wider public by his Diwan Chetput Pattabhiraman Ramaswami Iyer. Within this proclamation the young Maharaja has declared that \"none of his Hindu subjects shall be denied the peace and comfort of the Hindu faith by reason of his birth, caste, or community.\", and by extension that none of his subjects shall ever be denied the right to enter or worship at temples within Travancore. While this proclamation has already caused controversy amongst some of the nation's elites, especially with the Raja of neighbouring Cochin, it has on the whole been very well received, with other states now beginning to consider whether they too should make a similar move.\n\nIn Hyderabad however, the reaction from Osman has been rather different, with the Nizam caring little about the details of how Hindus wish to police each other. Instead, his eye has been drawn to Iyer, the man who many have regarded as the power behind the throne since the Maharaja's ascendency to the role. Despite struggles in the rest of the Federation, Travancore under Iyer has disproportionally flourished, and although Osman has previously been aware of the man, his mind now cannot help but wonder if Iyer is the solution he needs."
 princely_federation_events.14.a: "The Nizam could use a man like this Iyer..."

 princely_federation_events.15.t: "A Meeting with Iyer"
 princely_federation_events.15.d: "Unable to get the thought out of his head, the Nizam recently issued a private request to Iyer, requesting a meeting with him in Hyderabad. Upon Iyer's arrival, Osman immediately began to lay out the details of his conflict with the Big Four, something that Iyer had already intimately familiarised himself with. Coming prepared, within moments of the Nizam requesting his aid in resolving the conflict Iyer began to present a plan of his own. Making clear that the Big Four will never back down as long as the Nizam's power remains unchecked, Iyer instead suggested that there are ways to place checks upon the Nizam without further empowering the rest of the Council. To do this, his plan suggests that instead of having a member of the Council serve as national Diwan, an elected national assembly should be established from which Osman would appoint a Diwan to carry out most of the Federation's daily operations.\n\nIyer also made clear that while this plan would of course limit the Nizam's power, it would limit the power of his rivals even more so as Osman would still maintain authority over who he chooses to appoint as Diwan, as well as the ability to veto laws passed by the assembly. While the Nizam was not initially convinced of this idea, his ears began to perk up at this explanation. His opinion was further cemented when Iyer explained that he knows for certain from his relationship with Varma that the Big Four will be placated by such a scenario, as it would both in their eyes limit the Nizam and strengthen their own position, as they have begun to privately worry how long the Federation can last without democratisation. While not going as far to immediately commit to the idea as presented, it is clear that the Nizam has been won over by Iyer's arguments, and that he will certainly keep this plan in mind if the time comes."
 princely_federation_events.15.a: "Iyer's proposal should certainly be considered."
 princely_federation_events.15.b: "Such a plan hardly seems needed but it shall be kept in mind."

 princely_federation_events.16.t: "Razvi and the Razakars"
 princely_federation_events.16.d: "Despite the exact details of the Nizam's meeting with Iyer not being shared with a single soul except the two men present, it did not take long for some to correctly guess that the Nizam was seeking aid to resolve the crisis in the Council. One of those who managed to do so is Qasim Razvi, a general in the Federal army as well as leader of the Razakar paramilitaries, a radical group linked to the Majlis-e-Ittehadul Muslimeen, who trace their origins to defensive militias formed during the revolution. Using his position in the army, he was able to quickly arrange a meeting with the Nizam under the guise of official business, and it is from here that he too began to present his plan on how to resolve the conflict with the Big Four.\n\nIn stark contrast to the tactful and subtle approach championed by Iyer, Razvi once again echoed the calls by Bahadur Khan to dissolve the Fürstenrat, and for Osman to assert his rule over the Federation. His arguments stressed his belief that it is the Nizam's right as a great Muslim ruler to be the sole leader of the Federation. In his opinion, continued cooperation with the Hindu princes of the Council will leave the Federation too weak to fend off invasion from the Republic, who will hand all of Hyderabad over to \"Hindu rabble.\"\n\nWhile the Nizam remained unconvinced of the viability of this plan, Razvi gave his promise that if the call is given, he and his Razakars will immediately spring into action to defend the Nizam, and that while he has not yet approved any action, when the time comes Razvi will throw his weight behind Osman."
 princely_federation_events.16.a: "If the time comes, the Nizam knows who to call."
 princely_federation_events.16.b: "Consorting with radicals hardly seems wise..."

 princely_federation_events.17.t: "Rumblings in Hyderabad"
 princely_federation_events.17.d: "Within the next few weeks the Nizam's great Silver Jubilee Durbar is set to begin, overshadowed by the great backdrop of the Nizam's private plotting against the Council.\n\nWhile no one but Osman truly knows what he is plotting, it seems that others have slowly begun to cottoned on to his scheming, and despite the general public being none the wiser, those involved in planning this durbar have slowly come to expect it not to proceed as planned..."
 princely_federation_events.17.a: "It seems that the conflict may finally see its climax."

 princely_federation_events.18.t: "The Jubilee Coup" #Princes
 princely_federation_events.18.d: "Intending to begin the Durbar with a bang, through ordering the Razakars to seize the Big Four and begin his dismantling of the Council, Osman was rather surprised when the armed men who burst into his office had their guns aimed at him rather than the princes accompanying them. Having caught wind of Osman's plan, troops loyal to the Big Four had arrested Razvi and his loyalists almost immediately upon the Nizam issuing the order to them. They then began their march to the King Kothi Palace, bringing things back up to the present.\n\nNot even giving Osman the chance to speak, Sayajirao Gaekwad made clear that they had caught the Nizam in his plotting, and that they would not tolerate his attempted self coup. Informing Osman of Razvi's arrest, and falsely claiming that they had further support from their allies in the Dominion as well as the German Empire if he refused to comply, they began laying out what exactly would happen next.\n\nOsman would soon after be forced to sign into law a revised version of the National Diwan proposal, completely stripping Osman of all his powers within the Federation, although still willing to grant him the symbolic concession of his ceremonial leadership role in order to maintain national stability. He was then informed that instead of announcing the dissolution of the Council at the Durbar, his big announcement would be the implementation of this law and the immediate preparations for an election under it."
 princely_federation_events.18.a: "Thus ends the ambitions of Osman..."

 princely_federation_events.19.t: "The Jubilee Coup" #Nizam
 princely_federation_events.19.d: "Having finally been given the opportunity to rid himself of the turbulent princes once and for all, the Nizam last night issued the order to Razvi to seize the Big Four, who were on their way to Hyderabad to take part in the upcoming Durbar. Being brought to Osman in the early hours of the morning under armed guard, the Nizam laid out in simple terms to them that he would be disbanding the Council, and that all four of them would be standing with him in support as he announces it at the upcoming durbar. Such a bold statement prompted immediately angry outbursts from the princes, although a quick punch to Varma's stomach by a Razakar quickly put them into their place.\n\nDemanding to know what will happen to them, even if they surrender to Osman's threats, they were informed that he does not wish to see them come to any further harm, and that they will simply be allowed to continue ruling their own states within the Federation for as long as they submit to Osman's leadership. Making clear that the Razakars would be posted in their states to ensure compliance with these \"reasonable\" demands, the Big Four soon realised that they had no other choice left but to comply."
 princely_federation_events.19.a: "The Federation shall no longer be held back by these petulant princes!"

 princely_federation_events.20.t: "The Nizam's Gambit"
 princely_federation_events.20.d: "With many, the Big Four especially, nervous regarding the rumours of plotting by the Nizam, their invitation to meet with Osman in Hyderabad prior to the durbar's commencing left them worried about what it would entail. To their surprise, upon arriving together into Osman's office they were greeted by not only the Nizam, but also representatives from the Andhra Mahasabha, the Justice Party, and even Iyer himself. With all of these people gathered together, Iyer was gestured forward by the Nizam to begin laying out the plans for a democratically elected national Diwan, as a replacement for the concept originally suggested by the Big Four. The shock of such a statement immediately left all of the guests dumbfounded, with no one present knowing how to truly react to both the idea itself and the concept of the Nizam being willing to surrender any of his power this willingly.\n\nRequesting a recess to privately compose their thoughts, the Big Four used this opportunity to discuss the idea presented amongst themselves. While initially believing that this was nothing but a cheap trick by Osman, Iyer's involvement suggested to them that this may indeed be genuine, and although such a proposal would not grant the level of power they were initially aiming for, accepting it would still address most of their immediate concerns with Osman's abuses. Ultimately agreeing upon accepting the proposal, the meeting would soon reconvene, and upon hearing of their acceptance the Nizam directly announced to them his intention to proclaim this change as part of the durbar, and to schedule an election in the weeks after. While everyone but Iyer left the meeting with an uneasy feeling that this compromise was too good to be true, they were at least reassured that for now the conflict had been resolved without violence."
 princely_federation_events.20.a: "A good compromise leaves everyone room to plot."

 princely_federation_events.21.t: "The Durbar Proclamation"
 princely_federation_events.21.d.princes: "After the first long day of celebration, the crowds of the great durbar were directed to gather in front of the large stage that had been assembled in the heart of Hyderabad. Soon the Nizam, flanked on both sides by the members of the Big Four, stepped up to the microphone set up on the stage. It was here that he would announce that a revised version of the National Diwan proposal had been both accepted and signed by him, and it would be effectively immediately from its announcement in this speech, with the full text of the law set to be published publicly as soon as possible.\n\nHe further announced that in six weeks time, an election would be held amongst the members of the Chamber of Princes to decide who would be the first National Diwan, declaring that both Wadiyar and Varna have put themselves forward as candidates for the position. His lack of enthusiasm and stilted delivery was quickly noticed, and although many simply brushed it off as a one off incident, Osman's quick departure from the stage upon finishing the speech has left many wondering what truly happened behind closed doors to make him change his mind."
 princely_federation_events.21.d.osman: "After the first long day of celebration, the crowds of the great durbar were directed to gather in front of the large stage that had been assembled in the heart of Hyderabad. Soon the Nizam, flanked on both sides by the members of the Big Four, stepped up to the microphone set up on the stage. It was here that he would announce that after much deliberation, the Fürstenrat would be dissolved, effective immediately, and that at least for the time being the Nizam would rule by himself with the aid of trusted advisors.\n\nShocked gasps from the crowd were quickly drowned out by cheers, seemingly originating from a large group of men dispersed through the crowd, to whom the Big Four had become intimately familiar with a few days ago. Departing from the stage to great shouts of Ya Osman and praises to Allah, the Nizam remained confident that his new reign was now safely cemented for as long as the Federation would endure."
 princely_federation_events.21.d.dem: "After the first long day of celebration, the crowds of the great durbar were directed to gather in front of the large stage that had been assembled in the heart of Hyderabad. Soon the Nizam, flanked on both sides by the members of the Big Four, stepped up to the microphone set up on the stage. It was here that he would announce that after a meeting with the Council and the Federation's largest political parties, an agreement had been reached to establish a national legislature, based upon the one in Madras, from whom a national Diwan would be selected to serve as the head of government for the Federation.\n\nWith the crowd immediately erupting into great cheers, there was quite a long pause before Osman was able to continue with his speech. After enough time he was able to further declare that the first election would be held in six weeks time, with seat allocations being published within the following days, and already provided to the major parties of the Federation. The five men would afterwards depart from the stage, to another round of cheers from the gathered masses."
 princely_federation_events.21.a: "Let the reign of the princes commence!"
 princely_federation_events.21.b: "The Federation shall at last remove its shackles."
 princely_federation_events.21.c: "The nation steps into the modern age."

 princely_federation_events.22.t: "Electing a National Diwan"
 princely_federation_events.22.d: "With the six week campaigning period now elapsed, and the Maharajas of Travancore and Mysore having called in as many favours as they could, it has now come down to time for the princes of the Chamber to vote for the nation's first National Diwan.\n\nIt is hard to say at this stage who will win, as although Varma's image as a great reformer and moderniser has found him many backers, his young age combined with fears he will just carry out the will of his own Diwan has lent the senior Wadiyar much support instead. Only the final tally will be able to answer this burning question."
 princely_federation_events.22.a: "The Young Maharaja of Travancore secures victory"
 princely_federation_events.22.b: "Wise Wadiyar wins over his fellow princes"

 princely_federation_events.23.t: "The First Federal Election"
 princely_federation_events.23.d: "With the six week campaigning period now elapsed, election results have slowly begun to trickle in from across the Federation. Although still not finalised, the results so far show a large plurality of seats having been won by the Mahasabha, although many of the remaining seats have been won by independents and minor parties, as well as a small resurgence of the Mahasabha's Justice Party rivals. While these results are generally in line with expectations, what it means for the selection of Diwan is currently not clear.\n\nThe Mahasabha's leader Madapati Hanumantha Rao seems like the obvious candidate, as his party did win the most seats, although their lack of a majority and their radical proposals have made the Nizam reluctant to give them power. Instead the Nizam has seemingly begun to consider the appointment of Iyer to the position instead, with Iyer having resigned as Travancore's Diwan to represent the Kingdom on a national level. If Iyer would be appointed, he would be expected to lead a non-partisan national government made up of multiple parties including the Mahasabha, hopefully keeping the most radical ideas at bay. Still such an action may be regarded as another overreach by the Nizam, and it may be simplest for him to let the radicals burn themselves out dealing with the realities of politics once Rao is appointed."
 princely_federation_events.23.a: "It is only fair to appoint Rao as Diwan."
 princely_federation_events.23.b: "Iyer shall be appointed to keep these radicals in check."

 princely_federation_events.24.t: "Aid arrives from the Dominion"
 princely_federation_events.24.d: "Even with the crisis in the Council now a thing of the past, it is important not to forget about the true enemy in the north. With intelligence in the Dominion beginning to believe that an invasion of both of us could begin within the next few months, they have identified weaknesses in the equipment used by our armed forces.\n\nAlthough they cannot completely solve this problem they have sent a large supply of weaponry to help us prepare for what seems like an inevitable confrontation, sooner than anyone would like."
 princely_federation_events.24.a: "It certainly seems the hour will soon be at hand..."

 princely_federation_events.50.t: "The Passing of Krishna Raja Wadiyar IV" #TODO maybe rewrite to improve
 princely_federation_events.50.d: "One of the most powerful (and richest) Hindu rulers of the nation, Krishna Raja Wadiyar IV passed away late last night at his royal palace in Mysore.\n\nHe is succeeded as ruler of Mysore State by his nephew, the portly and artistic Jaya Chamarajendra."
 princely_federation_events.50.a: "All of [Root.GetNameDef] mourns his passing!"

 princely_federation_events.51.t: "Death of Sayajirao Gaekwad III of Baroda" #TODO maybe rewrite to improve
 princely_federation_events.51.d: "An imposing and resolute ruler, Sayajirao Gaekwad passed away this morning in his palace in Baroda. Mourned by many, Sayajirao was an independent-minded ruler with little regard for the British or their Raj.\n\nHe is succeeded by his grandson and famous spend-thrift Pratap Singh Gaekwad who is known to share his grandfather's nationalist sentiments."
 princely_federation_events.51.a: "Fare thee well."

 princely_federation_events.52.t: "Death of Rajaram III"
 princely_federation_events.52.d: "A representative from the state of Kolhapur has informed the nation this morning of the passing of their great Maharaja, Rajaram III, at the age of only 43. A member of the Big Four and one of the key founders of the Federation, his legacy is one for the ages, a man respected by even his enemies.\n\nWith the Maharaja having only a daughter and no close adult relatives, his nephew Shahaji, the current Maharaja of Dewas Senior, was designated his heir. Having abdicated from Dewas in favour of his son, he now ascends to the throne of Kolhapur as Shahaji II."
 princely_federation_events.52.a: "Such a young death for a great man."

 princely_federation_events.150.t: "Dealing with the Enemy's Officers"
 princely_federation_events.150.d: "While many officers who fought for our enemies did so out of ideological convictions or personal loyalty, there are still many amongst them who simply did so out of circumstance. Many of Calcutta's former officers, including most chiefly Kodandera Cariappa, alongside the few natives in Lahore's ranks, have offered to join our armed forces and bring their expertise in exchange for clemency.\n\nSuch an offer is of course tempting, as there's always a need for good experienced men, but pardoning these men, especially those who served the socialists, is hardly a popular move, and so a difficult decision must now be made about their fates."
 princely_federation_events.150.a: "Accept them into the ranks, they can be forgiven through service."
 princely_federation_events.150.b: "Let in those from Lahore, but jail Calcutta's goons."
 princely_federation_events.150.c: "These men are beyond redemption, lock them away forever!"

 princely_federation_events.151.t: "The Fate of the Loyalist Princely States"
 princely_federation_events.151.d.default: "When Osman rallied the southern princes behind the Bundesregierung, not all of India's native royalty rose to support him. A great deal of the northern princely states decided to throw their lot in with the British remnants and willingly acceded to their failed Dominion. While it is easy to recognise that they were simply concerned with saving their own hides, it is hard to view their continued allegiance during the most recent stage of the war as anything but a betrayal.\n\nStill, the princes have played an incredibly vital role in maintaining order in the region, and their complete removal would be too hasty, although demanding their abdication in favour of more tolerable successors is certainly an option. Alternatively, while it may be a tough pill to swallow, it may be more prudent to integrate them as is into the current administration, adding them as members of the Federation and Chamber members. If desired, this could even go as far as allowing Hari Singh of Kashmir a place on the Council, a position he would deserve as a powerful and prestigious ruler, and it would likely go a long way to convincing these loyalists to fully cooperate with the Federation."
 princely_federation_events.151.d.osman: "When Osman rallied the southern princes behind the Bundesregierung, not all of India's native royalty rose to support him. A great deal of the northern princely states decided to throw their lot in with the British remnants and willingly acceded to their failed Dominion. While it is easy to recognise that they were simply concerned with saving their own hides, it is hard to view their continued allegiance during the most recent stage of the war as anything but a betrayal.\n\nIt has therefore been proposed that an example be made of them, by declaring their lands forfeit and seizing them for both Osman and the federal government's use, as after all is the doctrine of lapsation not part of the British rule they so crave? Such a measure is unlikely to win any support however, something the government will desperately need if it wishes to not see a second rebellion, and so it may be more prudent to leave them as is, for they have been so thoroughly neutered with their last defeat already."
 princely_federation_events.151.a: "Demand the abdication of the most pro-British princes, they cannot be trusted."
 princely_federation_events.151.b: "They shall be fully integrated, but Singh's not joining the Council."
 princely_federation_events.151.c: "Fully integrate them and allow Kashmir a seat on the Council."
 princely_federation_events.151.e: "Let them keep their positions, they pose no threat to us."
 princely_federation_events.151.f: "If they want British rule so badly, show them a new doctrine of lapsation!"

 princely_federation_events.250.t: "Appointing a Diwan for [PRF.GetNameDef]"
 princely_federation_events.250.d: "While Osman's rule over the nation may be all encompassing, even he can recognise that it is impossible for a single man to manage literally every aspect of running a country as large as India. He of course has his advisors, but having a proper right hand man to ensure his will filters down the ranks to those who will ultimately carry it out is sorely needed. To that end, he has reviewed over the potential candidates, and narrowed his final choice down to two men.\n\nThe first is Akbar Hydari, one of the [PRF_GetOsmanTitle]'s closest advisors, and a man Osman was already considering to appoint as the Diwan for just Hyderabad itself. The second is Mirza Ismail, a candidate who has much weaker ties to the [PRF_GetOsmanTitle] than Hydari, but one who has repeatedly proven his skill, having served most of the nation's major states at one point or another. Both men are equally good picks, and the [PRF_GetOsmanTitle] could easily end up choosing either once he has made up his mind."
 princely_federation_events.250.a: "Akbar Hydari, the Sadar-i-Azam of Hyderabad, shall head the government."
 princely_federation_events.250.b: "Mirza Ismail shall enfore Osman's will."

 princely_federation_events.251.t: "A New Man on the Peacock Throne"
 princely_federation_events.251.d: "Nobody has ever described the Nizam as a \"humble man\", except for maybe the man himself, yet now his great desire for pomp has potentially reached heights few could have previously fathomed. Even before Delhi was reclaimed by the Federal Army, Osman's grand desire to usurp the imperial mantle back from the British was so discussed it could hardly even be considered an open secret, instead it was simply public knowledge. Within days of the Dominion's surrender, he had already ordered an elaborate coronation to be held in Delhi, followed shortly by a proclamation which declared the formation of a new empire.\n\nThe start of the ceremonies began with Osman being transported through Delhi. The streets of the grand city were filled to the brim with large crowds made up of everyone ranging from the most ardent of the Nizam's supporters, to those there simply for the food, and even Osman's biggest detractors wishing to report on his arrogance. His destination being a large stage set up in front of the Red Fort, owing to damage sustained to the building itself making it unsuitable for the ceremony. Upon this platform sat potentially the grandest of the extravagances, a recreation of the Mughal Peacock Throne, where Osman would sit to be crowned as the new emperor.\n\nThe actual coronation itself was handled rather quickly, due to fears that the hastily assembled stage would not be able to hold all the weight upon it for long, and within a few minutes Osman stepped down to another platform to give a speech, aiming to further reinforce his image as the liberator of India. Not long after, he returned to his carriage, travelling back the way he came, returning home not as the Nizam, but as the grand Kaisar-i-Hind."
 princely_federation_events.251.a: "Ya Osman!"
 princely_federation_events.251.b: "You know, this may be a little bit too pretentious..."

 princely_federation_events.252.t: "[ROOT.Capital.GetCapitalVictoryPointName] Proclamation"
 princely_federation_events.252.d: "The reunification of India, and Osman's role in it, is something that he will likely never let anyone forget. While many expected the Nizam to capitalise on the fame to usurp the imperial mantle back from the British, he has today rebuke those suggestions with a grand proclamation in [ROOT.Capital.GetCapitalVictoryPointName]. Speaking to large crowd, filled with both the natives of the city, and those from all across the Federation who made the journey to [ROOT.Capital.GetCapitalVictoryPointName] to hear him speak, Osman would declare his commitment to restoring the nation to greatness.\n\nHarkening back to his vital role in the Federation's foundation, and the almost mythicised Battle of the Godavari, he made clear that from the beginning no one has been as committed to the Federation as he has been. Rejecting any claims to the throne, he chose to again reinforce his image as the grand \"Father of the Federation\", declaring further that his only two desires in life are to serve the Indian people, and to serve Allah, and that taking the imperial title would serve neither.\n\nSuch a speech was well received, especially by those who believed that Osman's consolidation of power would spell the death of the Federation. Many however quickly took note that the speech gave little reassurance that Osman would not rule as though he was emperor, with no mention of any plans to replace or reform the Fürstenrat, nor end his \"temporary\" unchecked rule over the nation. To these people, while Osman may have for now rejected the title, it remains clear that the Federation is still nothing more than the Nizam's domain, for him to rule solely as he sees fit."
 princely_federation_events.252.a: "Once again, the Nizam has saved the nation!"

 princely_federation_events.275.t: "Triumph of the Razakars"
 princely_federation_events.275.d: "The scenes in [ROOT.Capital.GetCapitalVictoryPointName] this morning can be described in many words, but none are more apt than simply \"chaos\". Clearly emboldened by the Nizam's overreliance upon them, the Razakars have seized control of the capital, with the Diwan and anyone close to him having been arrested. According to a speech given by Razvi, the justification for this action is alleged treason, with him stating that the Diwan was planning on ousting Osman and restoring the dissolved Fürstenrat to full power, and that they cannot allow such a surrender to happen.\n\nFor Osman himself, news of this coup first reached him upon waking up to armed Razakars storming his bedroom, followed an hour later by Razvi himself arriving to explain the situation. After enough arguing, and enough 'persuasion' from the Razakars, an agreement was reached which declared Razvi the new Diwan, granting him unchecked powers to root out any further alleged treason throughout the nation. Unrest has swept the nation, with most of its peoples, Hindus especially, fearing what new hell has been unleashed upon them."
 princely_federation_events.275.a: "We should have shot Razvi when we had the chance..."

 princely_federation_events.300.t: "Andhra Mahasabha Announce All-India platform"
 princely_federation_events.300.d: "Despite the nation's reunification, many of the northern territories still find themselves effectively isolated from the rest of the Federation, especially in the political field where the former ruling party of the Indischer Nationalkongress has been completely banned, alongside much of its leadership now being dead or imprisoned. Such a situation cannot last, especially as the reclaimed territories are slowly integrated into the National Assembly, and so as part of an outreach effort the Andhra Mahasabha have announced a new grand All-India platform.\n\nAs part of this platform, from this point forward the party has chosen to rebrand itself to the All-India Mahasabha, representing its final transformation from a local pressure group to the modern face of Indian politics. New offices for the Mahasabha will soon be opened up within the northern territories, with an office having already sprung up in Calcutta itself. Additionally, and rather controversially, many of the more moderate members of the INC and those who collaborated with the Calcutta regime have found themselves being welcomed with open arms into the party. While such an action has quickly given rise to pejoratives, describing the party as the Congress Revival Committee, people have generally accepted their actions, believing that this action is needed to truly represent all Indians on a national level."
 princely_federation_events.300.a: "A New Congress for a new age?"

 princely_federation_events.301.t: "The Fading Torch and the New Flame"
 princely_federation_events.301.d: "Despite their small resurgence during the first Federal Election, a few weeks ago the Justice Party's confirmed to its members that they will not seek to expand operations outside of the Federation's original lands, and will likely prioritise consolidating their remaining powerbase in Madras instead of contesting seats elsewhere. With this all but confirming that the Justice Party will never again rise to being rivals of the Mahasabha, a space has become vacant for a new opposition, and today said opposition has finally been revealed.\n\nIn a conference held in Lucknow, a collection of prominent politicians from not only the former Republic's lands, but also those from the Dominion, announced the formation of the \"Indische Demokratische Allianz\". This new party has been primarily formed by remnants of the Congress Nationalist Party, an organisation to whom many of the INC's anti-socialist members defected to as the leadership began to openly embrace that foul ideology of the west and its promoters in Paris and London.\n\nLed by the CNP's founder Madan Mohan Malaviya, the BDA has quickly seen an outreach of support throughout large swathes of India, especially in parts of the Punjab and Sind. Despite being primarily a conservative party, they have seen quite a few defections from the rump Liberal Party, with whom there is much common ground on issues of Hinduism and support for the middle classes. While they have yet to win any seats, owing to no elections being held yet in the north, it seems very likely that this party is destined to become the primary rival of the Mahasabha for the foreseeable future."
 princely_federation_events.301.a: "A strong opposition is always healthy"

 princely_federation_events.302.t: "Elections in the Liberated Lands"
 princely_federation_events.302.d: "It has roughly been a year since the nation was at last reunified, and great strides have been made to properly reabsorb all of the reclaimed lands, no matter how corrupted they had become from the years under their oppressive regimes. It is through these efforts that elections have finally been able to be held in the reclaimed lands, at last allowing them representation alongside the previously elected officials from the former core of the Federation.\n\nThe results that have arrived in so far have made clear that the current governance will likely not be disrupted, as the AIM have continued to perform well across the board, although they have once again only achieved a plurality of seats rather than extending their position to a full majority. As expected the BDA have also done rather well for themselves, although perhaps not the monumental heights that many were expecting, with many seats they chose to contest instead being won by independents.\n\nA rather notable set of results however have been those from Bengal, where it seems the grip of socialism has not yet been properly rooted out. Two parties, both claiming succession from the INC, have won an alarming number of seats in the region, and although they have expressed their allegiance to the Federation, few trust their words. By and large however, the election has generally gone off without a hitch, potentially signalling that India's worst years are now firmly behind it."
 princely_federation_events.302.a: "Ensure these new radicals are properly monitored, just to be safe"

 princely_federation_events.303.t: "The Man from Madras"
 princely_federation_events.303.d: "Madras's inclusion in the Federation, alongside the special status it was granted owing to its republican nature, was always a controversial choice. As part of the compromise that even allowed it to happen in the first place, Madras was not granted an equal place on the Council that its size and power would naturally entail, instead the local government was only allowed to send an observer to advocate for the state but not vote in its favour. Today however, this has at last changed, with the Council finally agreeing to elevate Madras to full membership, granting it equal rights to everyone except Osman.\n\nQuite a few favours had to be called in by the Diwan in order to secure this radical change to the status quo, with the Big Four especially being reluctant to consider empowering someone who is not one of their own, although with enough promises they were won over in the end. The Nizam on the other hand was won over rather easily, as to him further breaking up the Big Four's traditional power block could only improve the situation for him, although he is under no illusions that the representative chosen will likely not see eye to eye with him on most issues.\n\nAs for the man chosen to be Madras's first full representative on the Council, it should come as no surprise that their local government has once again recommended Subbarayan. Having served in the previous role for quite a few years now, especially during the crisis in the Council, and being regarded as a neutral candidate not likely to be swept up into party politics, his reappointment was practically routine. Now sitting as a full member, it is through him that the common people's voices will at last have a place on the great Council of the realm, allowing the nation to take another step forward into modernity."
 princely_federation_events.303.a: "Hopefully Subbarayan can keep both sides in check."

 princely_federation_events.304.t: "The Andhra Pradesh Problem"
 princely_federation_events.304.d: "Ever since the AIM were just the Andhra Mahasabha, uniting the Telegu people under one state within the federation has been arguably their primary goal. Even now in power, such a goal has been difficult to achieve, as the Telegu homelands are currently split between Madras and the Nizam's personal domain. The recent move to elevate Madras to a full council member has however won over their support in this issue, with their tentative agreement to hand over Andhra to be part of a future Telegu state. As with many things however, the final roadblock has once again come down to convincing the Nizam.\n\nWhile the Nizam may have lost a significant amount of his powers to the Diwan, as the head of state for one of the Federation's members he still retains complete authority over his state, and there is no option but to get his approval for any changes to it. One potential idea to get around this would be to annex Andhra into Hyderabad, with the Telegu territories within Hyderabad becoming an autonomy with Telegu as their official language. Such an expansion of Hyderabad would almost certainly be blocked by the other members of the Council however, who it would still have to go through.\n\nAs an attempted compromise, a different plan has been presented to merge Andhra into Hyderabad, while splitting off Berar and the other non-Telegu speaking parts of Hyderabad as a new state, headed by his son Moazzam Jah or another relative of the Nizam. This plan seems to be on much more solid ground, as private discussions with the other members of the Council has confirmed that they won't oppose it, even if some don't like the idea in general. The final decision however is of course down to the Nizam, and until the plan is presented to him it is impossible to know whether he will accept giving up land in this way."
 princely_federation_events.304.a: "After some consideration, Osman agrees to the proposal."
 princely_federation_events.304.b: "The Nizam refuses to give into such an extreme demand"

 princely_federation_events.305.t: "\"I am Your Slave, Master, I Bow At Your Feet\""
 princely_federation_events.305.d: "For years now the complete abolishment of the Vettichakiri system of forced labour has been one of the AIM's primary goals, second only to their fervent advocacy for the Telegu language. Such practice has been present in southern India for centuries, carried out by the doras serving zamindars and princes, with the rule of those upholding the Vettichakiri system being notoriously harsh. While the more progressively minded princes, and even those on the conservative side, have so far been convinced to abolishing the practice, seeing the economic benefits of abandoning such a feudal system, the Nizam is anything but \"progressively minded\". It is extremely unlikely he'll ever agree to fully banning the practice in his lands, even if the Federal government attempts to crack down upon it.\n\nOne avenue that has been considered by Rao and the government to work around this is to ban the practice on a federal level, but to allow the Nizam specifically an exception, provided he ensures the worst excesses of the system are limited to the full extent of his ability. While not a concession the AIM is exactly willing to make lightly, it may be a needed compromise to wipe out the practice in the long term. Whether the Nizam will be willing to go even that far is still up in the air however."
 princely_federation_events.305.a: "The Dora will be reined in, nothing more."
 princely_federation_events.305.b: "How dare Rao make such an absurd demand!"

# princely_federation_events.307.t: "A Master Builder at Work" #See event file
# princely_federation_events.307.d: "TODO Iyer arranges meetings with Rao, Malaviya, Khan etc and appeals to each of them with Iyer's history in Madras, his involvement in the independence movement etc to win them over into backing him"
# princely_federation_events.307.a: "The Nizam clearly picked the right man for the job"
#
# princely_federation_events.308.t: "Reshaping the Constitution"
# princely_federation_events.308.d: "TODO with the federation fully united and the new government kicking into gear, Iyer has laid out his plans to reexamine the constitution, arguing that the existing one was quickly thrown together in the chaos of the nation's collapse and that now is the perfect time to better tailor it to a nation that is once again whole.\n\nWhile there is some who speculate that Iyer may be using this as an opportunity to cement his power, he has so far convinced everyone relevant that doing so will be for everyone's benefit."
# princely_federation_events.308.a: "There is no doubt that Iyer has good intentions here."
#
# princely_federation_events.309.t: "Winning Over the Courts"
# princely_federation_events.309.d: "TODO For Iyer to make his constitutional changes, it must be approved by the courts, with the Supreme Court having the final say.\n\nFor Iyer however this is very easy to do, and after enough private meetings with the Justices the first round of Iyer's changes have passed through the court as swiftly as possible."
# princely_federation_events.309.a: "The Diwan has the home field advantage in the courts."
#
# princely_federation_events.310.t: "The Pawn's Checkmate"
# princely_federation_events.310.d: "TODO Iyer's constitutional changes have been approved by the Assembly, the Supreme Court, and even the Council. While the majority of changes are those that few see little issue with, hidden between the lines are many specifics that weaken the power of the Council, such as mechanisms to overrule attempts by the Nizam to dismiss the Diwan, or the ability for the courts to overrule any veto by the Council. Finally while the dissolution of the Assembly may still be decided by the Nizam, he cannot do so without the agreement of the Diwan and cannot refuse a request by the Diwan to do so, ultimately transferring the power of elections over to Iyer.\n\nWhile Iyer has legally cemented his dominance over the Council, he is unlikely to ever need to apply said dominance as he has cemented his position in other ways so solidly. He has however guaranteed that no matter what, as long as he wishes to be in power, he will be in power."
# princely_federation_events.310.a: "It has been Iyer's game all along."

 princely_federation_events.348.t: "Whispers of Treason"
 princely_federation_events.348.d: "To say that the Nizam is unpopular in the Federation at the moment would be like saying that the Russians were somewhat perturbed by Brest-Litovsk. His repeated vetoes of core government policy, a government backed and elected by most of the nation's voters, has seen his carefully promoted image as the nation's saviour eroded away faster than land around the Teesta.\n\nAs a result of this growing unpopularity, socialist remnants have reorganised themselves around the rump Kommunistische Partei Indiens, creating a sizable force aimed at toppling the Nizam and bringing in the reforms he has spent so much time blocking. While normally this group wouldn't have much sway, and would simply just be crushed along with other dissidents, rumours have begun to spread of cooperation between the AIM and these rebels over their mutual anger against the Nizam.\n\nWith fears that Rao himself may soon throw his lot behind this potential insurgency, Razvi and his Razakars have offered to attempt to arrest Rao and eliminate these socialists, as soon as the order is given. Whether the Nizam wishes to go that far is still up in the air..."
 princely_federation_events.348.a: "Rao should have never been trusted, order his arrest!"
 princely_federation_events.348.b: "Taking action will only provoke things further, stay out of it."

 princely_federation_events.349.t: "The Deccan Rebellion"
 princely_federation_events.349.d: "While Rao may have privately expressed his anger at the Nizam's overreach, until news was leaked to him of his ordered arrest he had not even begun to consider insurrection. Almost immediately however, the Nizam's actions drove him directly into the arms of the rebels, with mutual contacts between the AIM and the CPI quickly instigating a rebellion with the backing of the government. With Osman's now abysmal popularity, few were willing to come to his aid, with much of the army siding with the government against him. The Razakars themselves were quickly shattered, although Razvi himself has yet to be accounted for.\n\nSeeing the writing on the wall, the Nizam and his family have reported fled via plane, although no one seems to yet know or agree exactly where. Meanwhile at home, Rao and his new allies were quick to seize upon this momentum to declare a republic, with Rao being sworn in as president and CPI leader P. Krishna Pillai as the new Diwan. The Fürstenrat itself has also been dissolved, although negotiations between the Princes and the government have allowed the continued existence of their states as federal constituents, although with somewhat reduced authority than before.\n\nWhile things may have seemingly quickly stabilised with the fall of the Nizam, few can really say what the future holds for the new republic, and many of the princes still fear that their days are numbered if the communists gain enough leverage. For now though, most people are simply happy to be rid of the tyrant, rather than be distracted by future worries."
 princely_federation_events.349.a: "The tyranny of Osman has been brought to an end!"

 princely_federation_events.350.t: "Final Destruction of the Raj"
 princely_federation_events.350.d: "With a grand proclamation issued by the Council, rubber stamped by the Nizam, every remaining territory within the Federation, barring Madras of course, is now once again in the hands of an Indian ruler. Whether it is the districts liberated from the socialists or the provinces absorbed from the Dominion, it has now been properly divided and given to their rightful owners. Even in Delhi, the great House of Babur have been restored to the throne, as recognition of the Mughal house's role in the original war of independence that unfortunately led to their ousting by Britain.\n\nAlmost immediately, the Council has moved to celebrate this day as a public holiday, honouring what they describe as the \"final destruction of the British Raj.\" For the first time in centuries, the nation has at last become truly free of outside domination, and at last it is free to emerge as the great power it was always destined to be."
 princely_federation_events.350.a: "A return to the natural order of things."

 princely_federation_events.351.t: "The Sundering of Madras"
 princely_federation_events.351.d: "Allying with Madras was always controversial, with many wishing to see this failed remnant of British rule destroyed and replaced, rather than embraced as though it were an equal. It was however always seen as a necessary evil as long as the socialists were an active threat, much akin to the alliance that was similarly struck with the British Dominion. As too was the alliance with the Dominion discarded once the socialists were routed, so too must the alliance be with their Tamil scion.\n\nA new proclamation has been issued by the Council this morning to at last address this loose end. Arguing that their actions are necessary to finalise the nation's independence from Britain, the Council have ordered the Madras autonomy to be dissolved, with its lands set to be partitioned between the princes. The sole exception to this partition for now is the city of Madras itself for which a decision has not been made as to who shall receive it. Protests in Madras to this action have been quickly put down with Federal troops, and although the Madrasi government has strongly objected to this action, none have yet been brave enough to turn their words into actions."
 princely_federation_events.351.a: "The error has at last been corrected."

 princely_federation_events.352.t: "First Session of the House of Princes"
 princely_federation_events.352.d: "Following the passing of an act of Council, rubber stamped by Osman as is now the norm, what was once the Chamber of Princes has now been fully reformed into a proper legislative assembly. The new House of Princes was today inaugurated by the Diwan himself, with Osman sitting instead on the sidelines as it occurred. Being the first ever session, things of course began with a rather rocky start, as many of the princes were still struggling to understand what exactly the new situation would mean for them. Still, even if they did not yet truly understand it, the general mood in the House was rather positive, with many of the older members being happy to at last be part of an Indian nation that truly respects their role, unlike the bygone days of British rule."
 princely_federation_events.352.a: "Hear, Hear!"

 princely_federation_events.170.t: "Princely India Wants to Join [Root.GetFactionName]"
 princely_federation_events.170.d.japan: "The national government in Hyderabad has recently united the successor states of the subcontinent. The new Indian government has expressed its desire to join our alliance and help furthering the awakening of the people's of Asia.\n\n What is the opinion of the Imperial cabinet?"
 princely_federation_events.170.d.germany: "The national government in Hyderabad has recently united the successor states of the subcontinent. The new Indian government has expressed its desire to join the Reichspakt System and continue to fight Syndicalism in Asia.\n\nHowever, it is expected that the Indians will demand concessions regarding our colonies in the sub-continent."
 princely_federation_events.170.d.russia: "The national government in Hyderabad has recently united the successor states of the subcontinent. The new Indian government has expressed its desire to join our alliance to further stability and national harmony throughout Eurasia.\n\nWith such an alliance, the sepoy and Cossack will surely dominate the continent!"
 princely_federation_events.170.d.ottomans: "The national government in Hyderabad has recently united the successor states of the subcontinent. The new Indian government has expressed its desire to join our alliance."
 princely_federation_events.170.a: "Of course we welcome their alliance!"
 princely_federation_events.170.b: "No, I think not."

 princely_federation_events.171.t: "Princely India Joins [From.GetFactionName]"
 princely_federation_events.171.d.japan: "[FROM.GetNameDefCap] accepted our offer to secure Asia for nations of Asia and allowed us to join [From.GetFactionName]!"
 princely_federation_events.171.d.germany: "The Germans are happy to see us joining the common cause to destroy the evil Syndicalists. Now we are part of [From.GetFactionName]!"
 princely_federation_events.171.d.russia: "The Russians accepted our offer! Today a new global alliance has been born that will shape fate of the world!"
 princely_federation_events.171.d.ottomans: "The Sublime Porte has accepted our offer! Today a new alliance has been born between South and West Asia!"
 princely_federation_events.171.a: "Excellent!"

