### Characters ###
 PRF_osman_ali_khan_emperor: "Osman Ali Khan I"
 PRF_osman_ali_khan_leader_desc: "§YBorn:§! §LApril 6th, 1886, in Purani Haveli, Hyderabad, Hyderabad State, India§!\n§YBackground:§! §LOne of the richest men in the world and sometimes known by his regnal name Asaf Jah VII, Osman Ali Khan is one of the most powerful men in the entire Indian subcontinent. A polyglot in four different languages due to his prestigious childhood education, his and Ganga Singh's private tutor were one in the same, later enrolling in the same college as his counterpart while fated for a radically different future. He was coronated as Nizam on the 18th of September, inheriting Hyderabad's expansive diamond mines.\n\nWhile he greatly financially contributed to British efforts in the Weltkrieg, even earning the title \"Faithful Ally of the British Empire\" for these efforts, such allegiances would not last. Osman's traditionally independent streak would culminate in his rallying of the southern Princely States into the Princely Federation, taking over the Bombay and Madras Presidencies in the process.\n\nWhile he has not yet outright refuted the British, he is nominally independent of them entirely. He and his princes do not vie for a future under the jackboot of the Commonwealth, and having tasted the power of his new realm some wonder if he's willing to let any of it go so easily.§!"
 PRF_osman_ali_khan_emperor_leader_desc: "§YBorn:§! §LApril 6th, 1886, in Purani Haveli, Hyderabad, Hyderabad State, India§!\n§YBackground:§! §LOne of the richest men in the world and sometimes known by his regnal name Asaf Jah VII, Osman Ali Khan is one of the most powerful men in the entire Indian subcontinent. A polyglot in four different languages due to his prestigious childhood education, his and Ganga Singh's private tutor were one in the same, later enrolling in the same college as his counterpart while fated for a radically different future. He was coronated as Nizam on the 18th of September, inheriting Hyderabad's expansive diamond mines.\n\nWhile he greatly financially contributed to British efforts in the Weltkrieg, even earning the title \"Faithful Ally of the British Empire\" for these efforts, such allegiances would not last. Osman's traditionally independent streak would culminate in his rallying of the southern Princely States into the Princely Federation, taking over the Bombay and Madras Presidencies in the process.\n\nAfter successfully centralising his realm and proving to the people of the Indian subcontinent that only he is fit to lead them, he is now the ruler of a young but mighty empire, free of both the Windsorite and Syndicalist Raj.§!"
