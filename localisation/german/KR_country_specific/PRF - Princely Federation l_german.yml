### Ideen ###
 #Anfangsideen
 PRF_disorder_in_council: "Verordnung des Rates"
 PRF_disorder_in_council_desc: "Der Fürstenrat, der ursprünglich während der indischen Revolution gegründet wurde, war als Gremium gedacht, in dem die wichtigsten Herrscher Südindiens gemeinsam die neu unabhängige Nation regieren sollten. Im Laufe der Jahre hat jedoch die einzigartig privilegierte Stellung, die der Nizam innerhalb des Rates einnimmt, die Nation langsam in eine Situation geführt, in der sie ausschließlich von Osman geführt wird. Eine solche Situation wollen die anderen Ratsmitglieder nicht tatenlos hinnehmen, und nun wird nur die Zeit zeigen, ob der Rat noch lange bestehen bleibt."

 #Ökonomische Ideen
 PRF_black_monday: "Nachbeben des Schwarzen Montags"
 PRF_black_monday_desc: "Zwar war eine stärkere Ausrichtung auf die deutschen Märkte eine Notwendigkeit, um in einer Welt nach dem Ende des Britischen Empire zu überleben, doch hat der Zusammenbruch am Schwarzen Montag der indischen Wirtschaft, wie auch weiten Teilen der Welt, großen Schaden zugefügt."
 PRF_federal_railways: "Bundeseisenbahn Gesellschaft"
 PRF_federal_railways_desc: "In der Vergangenheit waren die Eisenbahnen in Indien auf eine Vielzahl unterschiedlicher Eigentümer verteilt, die von ausländischem Kapital bis hin zu Osman Ali Khan selbst reichten. Um dieses System zu verbessern, wurden diese unterschiedlichen Eisenbahnen nun alle unter die Leitung eines zentralen Bundesunternehmens gestellt."
 PRF_growth_of_indigenous_business_idea: "Wachstum Einheimischer Unternehmen"
 PRF_growth_of_indigenous_business_idea_desc: "Wie führende Unternehmer in [PRF.GetNameDef] argumentieren, muss das Land, wenn es in der Moderne bestehen will, das Wachstum einheimischer Unternehmen fördern, anstatt sich, wie in der Vergangenheit, so stark von ausländischen Importen abhängig zu machen. Zu diesem Zweck hat die Regierung von [PRF.GetNameDef] in großem Umfang in einheimische Unternehmen investiert, in der Hoffnung, eine sich selbst tragende Wirtschaft aufzubauen."

 #Ideen zu den Streitkräften
 PRF_new_federal_army_idea: "Die Neue Bundesarmee"
 PRF_new_federal_army_idea_desc: "Die Erste Bundesarmee der [PRF.GetName] konnte kaum als professionelle Streitmacht bezeichnet werden, da sie in den chaotischen Jahren der indischen Revolution hastig zusammengestellt worden war. Um die dadurch entstandenen Mängel zu beheben, hat die Regierung von [PRF_GetCountryTitle] weitreichende Reformen auf den Weg gebracht, um sie vollständig umzustrukturieren und zu einer Streitmacht zu machen, die in der Lage ist, jeden Feind des indischen Volkes zu besiegen."

 PRF_the_first_federal_navy: "Die Erste Bundesmarine"
 PRF_the_first_federal_navy_desc: "Zwar verfügte [PRF.GetNameDef] schon immer über einige Schiffe, doch konnte man sie kaum als Marine bezeichnen, da es sich dabei eher um das handelte, was nach dem Zusammenbruch Großbritanniens noch gerettet werden konnte. Eine solche Situation konnte jedoch nicht lange andauern, zumal [PRF_GetCountryTitle] beginnt, seine Flügel auszubreiten, und so hat die Regierung begonnen, den Aufbau einer richtigen Marine zu finanzieren, die der Nation dienen soll."
 PRF_divert_funding_to_the_navy_idea: "Umschichtung von Mitteln zugunsten der Marine"
 PRF_divert_funding_to_the_navy_idea_desc: "Um die Produktion von Kriegsschiffen massiv zu steigern, hat [PRF.GetNameDef] beschlossen, die Mittel für weniger wichtige Projekte zu kürzen und die eingesparten Mittel der Marine des Landes zuzuweisen."

 PRF_deccan_air_school_idea: "Die Deccan Flugschule"
 PRF_deccan_air_school_idea_desc: "Die Deccan Flugschule ist Hyderabads führende Pilotenschule. Dank staatlicher Investitionen werden wir die besten Piloten des Subkontinents ausbilden."

 #Osman-Ideen
 PRF_father_of_the_federation_idea: "Vater der Föderation"
 PRF_father_of_the_federation_idea_desc: "Auch wenn Osman mittlerweile der alleinige Herrscher der Indischen Föderation ist, hat der Nizam auf jegliche symbolische Statusverleihungen verzichtet und sich stattdessen dafür entschieden, sein Image als Gründer der Föderation zu stärken. Obwohl er in der Praxis über Befugnisse verfügt, die denen eines nationalen Monarchen entsprechen, hat sich der Nizam zum Ziel gesetzt, sich als bloßen \"Ersten unter Gleichen\" darzustellen, dessen wohlwollende Herrschaft Indien zu Größe führen soll."
 PRF_rule_by_firman_idea: "Herrschaft durch Firman"
 PRF_rule_by_firman_idea_desc: "Als Osman noch lediglich der Nizam von Hyderabad war, geschah in seinem Reich kaum etwas ohne einen direkten Erlass von ihm, der dies billigte. Nun, da er der mächtige Herrscher des Subkontinents ist, wurde diese Art der Regierungsführung auf die gesamte indische Nation ausgeweitet; von den lokalen Ministern und Räten wird erwartet, dass sie seinen durch Firman zum Ausdruck gebrachten Willen so schnell wie möglich umsetzen."
 PRF_one_nation_under_osman_idea: "Eine Nation unter Osman"
 PRF_one_nation_under_osman_idea_desc: "Osman mag zwar Muslim sein, doch er hat deutlich gemacht, dass er nicht die Absicht hat, die Nation als Eroberer zu regieren, anderen seinen Glauben aufzuzwingen und Angehörige anderer Glaubensrichtungen zu benachteiligen. Auch wenn nicht jeder in der Nation von solchen Versprechen überzeugt ist, hat seine groß angelegte Säuberungsaktion gegen die Razakars wesentlich dazu beigetragen, die Menschen von seinen Absichten zu überzeugen."
 PRF_right_of_conquest_idea: "Eroberungsrecht"
 PRF_right_of_conquest_idea_desc: "Wie der Razakar-Anführer Qasim Razvi erklärte, leitet sich Osmans Recht, über Indien zu herrschen, ausschließlich aus der Eroberung der dortigen Völker ab, und den Besiegten sollten keinerlei Zugeständnisse gemacht werden. Da Osman den Razakars uneingeschränkte Macht gewährt, um sicherzustellen, dass seine Herrschaft unangefochten bleibt, werden diejenigen unter den \"Besiegten\", die sich dieser Herrschaft widersetzen wollen, schnell Opfer der Gewalt der Razakar."
 PRF_fight_against_famine: "Kampf gegen die Hungersnot"
 PRF_fight_against_famine_desc: "Seit Jahrtausenden ist die Hungersnot eine der größten Bedrohungen für das Indische Volk und hat mehr Menschenleben gefordert als jeder Eroberer. Da in den letzten Jahrzehnten große Fortschritte im Bereich der künstlichen Stickstoffdünger erzielt wurden, rückt die Beseitigung der Hungersnot in greifbare Nähe, und zu diesem Zweck hat Osman beschlossen, diese Bemühungen massiv finanziell zu unterstützen, damit dieses große Übel das indische Volk nie wieder bedrohen wird."
 PRF_royal_sadaqah_idea: "Königliche Sadaqah"
 PRF_royal_sadaqah_idea_desc: "Osman regiert mit harter Hand, was das indische Volk nicht ohne Weiteres bereit ist zu akzeptieren, doch der reichste Mann der Welt zu sein, hat seine Vorteile – auch wenn es ihm schwerfällt, auch nur eine einzige Rupie auszugeben. Um sicherzustellen, dass Osman die Unterstützung möglichst vieler seiner Untertanen behält, hat er seine persönlichen Ausgaben für zahlreiche großartige Projekte im ganzen Reich zum Wohle des einfachen Volkes der Nation erhöht, wobei er diese Projekte natürlich nach sich selbst benannt hat, um das Volk an seinen großen Wohltäter zu erinnern."
 PRF_the_charitable_miser: "Der Wohltätige Geizhals"
 PRF_the_charitable_miser_desc: "$PRF_royal_sadaqah_idea_desc$"

 #Fürstliche Ideen
 PRF_image_of_rajarshi_idea: "Bild des Rajarshi"
 PRF_image_of_rajarshi_idea_desc: "Die Rajarshis, oder königlichen Weisen, sind jene unter den herrschenden Kasten des Hinduismus, die wahrhaft reine Hingabe und Fürsorge für ihr Volk zeigen und stets das Wohl der Nation über ihre eigenen Interessen stellen. Auch wenn sie sich selbst nicht direkt als solche bezeichnen, hat die Führung des Fürstenrats begonnen, inoffiziell die Vermittlung des Bildes zu fördern, dass jeder von ihnen ein Rajarshi sei, der die Nation edelmütig voranführt und alles gibt, was er hat, zum Wohle der niederen Kasten, über die er rechtmäßig herrscht."
 PRF_new_supreme_council_idea: "Der Oberste Rat Indiens"
 PRF_new_supreme_council_idea_desc: "Zu Zeiten der Ostindien-Kompanie fungierte der Oberste Rat von Bengalen als Indiens höchste Instanz; er bestand aus vier ordentlichen Mitgliedern, wobei ein fünfter Sitz vom Generalgouverneur als faktischem Vorsitzenden des Rates besetzt wurde, dem jedoch bemerkenswerterweise kein Vetorecht bei Entscheidungen zustand. Nun, über ein Jahrhundert später, ist ein ähnliches System wieder entstanden, das jedoch nicht mehr von Kolonialherren, sondern von den einheimischen Herrschern des Subkontinents geleitet wird. Durch diesen neuen \"Obersten Rat\" kommt der wahre Wille des indischen Volkes zum Ausdruck; zumindest nach Ansicht derer, die ihn leiten."
 PRF_royal_patronage_fund_idea: "Königlicher Förderfonds"
 PRF_royal_patronage_fund_idea_desc: "Es ist richtig, dass wohlhabende Menschen der Gesellschaft etwas zurückgeben, und da die Prinzen der Föderation nun sehr geschlossen auftreten, wurde ein gemeinsamer Fonds eingerichtet, der es jedem Prinzen ermöglicht, für ein gemeinsames Ziel zu spenden. Die Mittel dieses Fonds werden dann für Infrastruktur und Entwicklung im ganzen Land verwendet und jedem Prinzen gemeinsam zugeschrieben. So wird sichergestellt, dass jeder Inder die entscheidende Rolle anerkennt, die jeder Prinz bei der Förderung der Nation spielt, anstatt lediglich die Reichsten unter ihnen hervorzuheben."
 PRF_wall_street_of_asia: "Wall Street Asiens"
 PRF_wall_street_of_asia_desc: "Die Stadt Madras ist seit langem ein wichtiges Finanzzentrum Indiens, und nun, da die Regierung mit Nachdruck darauf hinarbeitet, sie als \"Wall Street Asiens\" zu etablieren, strömen immer mehr ausländische Unternehmen in die Stadt, was dem Land erhebliche wirtschaftliche Vorteile und neue Kontakte beschert."

 #Dem and Iyer Ideas
 PRF_cultivation_of_the_administration: "Aufbau einer funktionierenden Verwaltung"
 PRF_cultivation_of_the_administration_desc: "Angesichts der Machtverteilung zwischen dem Fürstenrat, der Nationalversammlung und sogar den Parteien innerhalb der Versammlung scheint der Aufbau einer effektiven und effizienten Verwaltung eine schier unmögliche Aufgabe zu sein. Wenn es jedoch jemanden gibt, der dies erfolgreich bewältigen kann, dann ist es Diwan Ramaswami Iyer, ein Mann, der solche Herausforderungen bislang äußerst erfolgreich gemeistert hat."
 PRF_revitalising_the_council: "Wiederbelebung des Rates"
 PRF_revitalising_the_council_desc: "Während der Fürstenrat in der Vergangenheit das Stimmrecht ausschließlich seinen königlichen Mitgliedern vorbehalten hatte, hatte ein Vertreter aus Madras stets einen Beobachterplatz im Rat inne. Nun wurde Madras im Bestreben, den Rat neu zu beleben und die Nation weiter in Richtung Modernität zu führen, zum Vollmitglied des Rates erhoben, wodurch endlich auch das einfache Volk der Nation stärker vertreten ist."
 PRF_building_a_mass_movement: "Aufbau einer Massenbewegung"
 PRF_building_a_mass_movement_desc: "Die Andhra Mahasabha mag vor wenigen Jahren noch kaum mehr als eine regionale Interessengruppe gewesen sein, doch nun, da sie die Nation anführt, hat die neue Mahasabha große Fortschritte dabei gemacht, Menschen aus ganz Indien einzubeziehen, und so sicherzustellen, dass sie die Massen des Landes wirklich vertritt."
 PRF_the_new_federation_dem: "Ein neuer Bund"
 PRF_the_new_federation_dem_desc: "Die indische Demokratie mag zwar noch nicht so weit entwickelt sein wie in anderen großen Nationen der Welt, doch unter der Führung der All-India Mahasabha hat die Föderation große Fortschritte auf dem Weg zu einem wahrhaft demokratischen System gemacht, das das gesamte Volk des Landes vertritt – ein großer Unterschied zu den von Fürsten beherrschten Staaten vergangener Zeiten."
 PRF_the_new_federation_iyer: "Ein neuer Bund"
 PRF_the_new_federation_iyer_desc: "Die indische Demokratie mag zwar noch nicht so weit entwickelt sein wie in anderen großen Nationen der Welt, doch unter der Führung von Iyer hat die Föderation große Fortschritte auf dem Weg zur Modernisierung und zur Verbesserung der Lebensbedingungen der Menschen im ganzen Land gemacht. Auch wenn die Macht des Diwan für manche Menschen unangenehm groß zu werden scheint, sind die meisten weiterhin davon überzeugt, dass Iyer nur das Beste für die Bevölkerung Indiens im Sinn hat."
 PRF_the_sovereign_statesman_idea: "Der Souveräne Staatsmann"
 PRF_the_sovereign_statesman_idea_desc: "Obwohl der Fürstenrat auf dem Papier nach wie vor über beträchtliche Autorität und Macht verfügt, hat der Diwan des Landes, C.P. Ramaswami Iyer, durch seine Reformen dafür gesorgt, dass er selbst der wahre Herrscher des Landes ist, wobei weder der Rat noch die Versammlung in der Lage sind, seine Position in Frage zu stellen. Auch wenn Iyers Macht nun praktisch absolut ist, bleibt er seinem Ziel treu, seine Vision für die Nation zu verwirklichen, anstatt sich lediglich persönlich zu bereichern. Er ist davon überzeugt, dass nur er allein das Land wirklich modernisieren und Indien als neue Großmacht voranbringen kann."
 PRF_defending_the_downtrodden: "Einsatz für die Unterdrückten"
 PRF_defending_the_downtrodden_desc: "Seit es in Indien Menschen gibt, gab es unter ihnen stets eine unterdrückte Gruppe, seien es Dalits, Frauen, ethnische oder religiöse Minderheiten. Diese Unterdrückung wird von der Regierung der Föderation als Relikt der Vergangenheit betrachtet, die es sich zur Aufgabe gemacht hat, dafür zu sorgen, dass diese unterdrückten Gruppen geschützt und gefördert werden, damit sie eine gleichberechtigte Rolle in der Gesellschaft spielen können."

 #Modifikatoren
 PRF_madras_autonomy_modifier: "Autonomie von Madras"
 PRF_madras_autonomy_modifier_desc: "Nach Vereinbarungen, die während der indischen Revolution zwischen der neu gegründeten All-India Federation und dem Legislativrat von Madras getroffen wurden, trat die ehemalige britische Präsidentschaft als eigenständiges Mitglied der Föderation bei. Im Rahmen dieser Vereinbarungen wurde der Staat Madras weitgehend so weitergeführt wie unter britischer Herrschaft und nahm innerhalb der Föderation die ungewöhnliche Stellung ein, als demokratisch gewählte Republik zu fungieren, anstatt wie seine Nachbarstaaten von einer absoluten oder exekutiven Monarchie regiert zu werden.\ n\nDarüber hinaus wurden im Rahmen der Vereinbarungen Angelegenheiten, die Madras selbst betreffen, fast vollständig an seinen Legislativrat übertragen, und ein von dessen Mitgliedern gewählter Vertreter hat einen Sitz im Fürstenrat, angeblich um sicherzustellen, dass Madras weiterhin ein Mitspracherecht bei nationalen Gesetzen hat, die auch den Bundesstaat betreffen könnten."

 PRF_southern_autonomy_modifier: "Autonomie des Südens"
 PRF_southern_autonomy_modifier_desc: "Im Rahmen des Wiedervereinigungsabkommens zwischen dem Dominion und der Föderation wurde dem Süden des Landes ein hohes Maß an Autonomie bei der Regelung seiner eigenen Angelegenheiten eingeräumt, wobei die Regierung in [RAJ.Capital.GetCapitalVictoryPointName] anerkannt wird."

 #Entscheidungen

 PRF_industrialising_the_nation_category: "Industrialisierung der Nation"

 PRF_begin_the_rajasthan_canal: "Beginn des Rajasthan-Kanals"
 PRF_begin_the_rajasthan_canal_desc: "Die Region Rajasthan benötigt schon seit langem ein geeignetes Bewässerungssystem, und ein interessanter Vorschlag des Chefingenieurs von Bikaner, Kanwar Sain, wurde vom Diwan genehmigt. Im Rahmen dieses Vorschlags sollen Arbeiten beginnen, um Wasser aus dem Harike-Staudamm, der von vielen großen Flüssen des Himalaya gespeist wird, zu entnehmen und es über einen Kanal in den größten Teil des westlichen Rajasthans zu leiten. Auch wenn die vollständige Fertigstellung wahrscheinlich Jahrzehnte dauern wird, ist es zweifellos ein Projekt, in das es sich zu investieren lohnt, und schon die kurzfristigen Vorteile können sich auszahlen."
 PRF_malwa_canal_network: "Malwa-Kanalnetz"
 PRF_malwa_canal_network_desc: "Die dürregefährdete Region Malwa in Zentralindien benötigt schon seit langem mehr Kanäle, und wie es der Zufall so will, eignet sich der durch das Gebiet fließende Narmada perfekt für diesen Zweck. In Kürze werden die Arbeiten an einem Kanalnetz entlang des Flusses sowie an anderen kleineren Gewässern in der Umgebung beginnen, um die schlimmsten Auswirkungen einer möglichen Dürre abzuwenden."
 PRF_expand_doab_irrigration_channels: "Ausbau der Bewässerungskanäle im Doab"
 PRF_expand_doab_irrigration_channels_desc: "Der Obere Doab im Norden Indiens ist eine der wichtigsten Regionen für die Nahrungsmittelproduktion im ganzen Land; dort wird nicht nur der größte Teil des Weizens des Landes angebaut, sondern die Region steht auch bei der Reisproduktion in nichts hinter Bengalen zurück. Die Unterstützung der Landwirte in der Region durch einen massiven Ausbau der Bewässerungskanäle wird die Erträge der Region mit ziemlicher Sicherheit auf ein noch höheres Niveau heben."

 PRF_dig_in_digboi: "Dig in Digboi (Grabe, Junge, grabe!)"
 PRF_dig_in_digboi_desc: "Der Legende nach erhielt Digboi seinen Namen, als der kanadische Ingenieur W. L. Lake seinen Männern beim Anblick der ersten Anzeichen von Öl zurief 'Dig boy dig!'. Obwohl das Öl bereits vor fast einem Jahrhundert entdeckt wurde, scheint die Quelle bislang kaum erschlossen worden zu sein. Wir sollten daher alles daran setzen, diesen Fehler zu beheben, um noch mehr aus diesem schwarzen Gold herauszuholen."
 PRF_orissa_bauxite_extraction: "Bauxitabbau in Orissa"
 PRF_orissa_bauxite_extraction_desc: "In Orissa befinden sich einige der reichsten Bauxitvorkommen in ganz Asien, doch bisher wurde nur wenig unternommen, um diesen zunehmend wertvollen Rohstoff abzubauen und zu verarbeiten. Dennoch gibt es keinen besseren Zeitpunkt als jetzt, um die Arbeit in Angriff zu nehmen, und daher sollte der Ausbau unserer Bergbauinfrastruktur in der Region Priorität haben."
 PRF_hematite_in_bailadila: "Hämatit in Bailadila"
 PRF_hematite_in_bailadila_desc: "Zwei Dinge scheinen im Leben sicher zu sein: Das erste ist der Tod, das zweite ist der ständige Bedarf der Menschen an mehr Eisen. In der Bailadila-Bergkette gibt es Hämatiterz von recht hoher Qualität, das dazu beitragen dürfte, diesen großen Bedarf zu decken."
 PRF_bridging_the_teesta: "Brücke über den Teesta"
 PRF_bridging_the_teesta_desc: "In den Regionen Darjeeling und Sikkim gibt es viele isolierte Gemeinden, die durch die mächtigen Schluchten des Teesta voneinander getrennt sind. Zwar gab es in der Vergangenheit bereits Pläne, den Fluss angemessen zu überbrücken, doch diese sind aufgrund der Revolution und ihrer Folgen stets auf der Strecke geblieben. Nun scheint sich jedoch eine perfekte Gelegenheit zu bieten, diese Pläne wieder aufzugreifen."
 PRF_rebuilding_the_dufferin_bridge: "Wiederaufbau der Dufferin-Brücke"
 PRF_rebuilding_the_dufferin_bridge_desc: "Die Dufferin-Brücke über den Ganges gehörte einst zu den großartigsten Brücken Indiens, wurde jedoch im Zuge der Schlacht um Varanasi weitgehend zerstört. Angesichts der Bedeutung der Brücke für die Stadt können wir nicht einfach zulassen, dass sie in diesem zerstörten Zustand verbleibt, sondern sollten alle Anstrengungen unternehmen, um sie wieder voll funktionsfähig zu machen."
 PRF_paving_baluchistan: "Straßenbau in Belutschistan"
 PRF_paving_baluchistan_desc: "Die Grenzregionen Belutschistans mögen für die meisten Menschen kaum mehr als ein abgelegenes Hinterland sein, doch sie sind dennoch ein wichtiger Teil der Nation, der ebenso wie der Rest des Landes gefördert werden sollte. Zu diesem Zweck sollten wir uns darum bemühen, in der Region ein angemessenes, modernes Straßennetz aufzubauen, das eine einfache An- und Abreise zu und von den großen Städten in der Nähe wie Karachi und Quetta sowie den Verkehr innerhalb der Region zwischen Kalat und Kharan ermöglicht."
 PRF_expand_the_sukkur_barrage: "Ausbau des Sukkur-Staudamms"
 PRF_expand_the_sukkur_barrage_desc: "Der Sukkur-Staudamm versorgt die Landwirte in der trockenen Region Sindh mit Bewässerungswasser und leitet Wasser aus dem Indus in Gebiete, die sonst nur sehr wenig Wasser erhalten. Eine Verstärkung der Anlagen und der Ausbau der dazugehörigen Kanäle werden den lokalen Landwirten erhebliche Erleichterung verschaffen."
 PRF_central_travancore_jaggery: "Unterstützung des Jaggery-Anbaus in Zentral-Travancore"
 PRF_central_travancore_jaggery_desc: "Jaggery ist ein konzentriertes Süßungsmittel, das durch die Ernte von Zuckerrohr und dessen anschließendes Kochen bei extrem hohen Temperaturen hergestellt wird; danach wird es abgekühlt, bis eine feste, aber weiche Masse entsteht. Jaggery ist in ganz Südasien als Süßungsmittel sehr beliebt, und das in Travancore hergestellte Jaggery zeichnet sich aufgrund des kulturellen Erbes und der fruchtbaren Böden der Region durch eine außergewöhnliche Qualität aus. Durch die Förderung der Produktion und die Verbesserung der Infrastruktur zwischen ländlichen und städtischen Gebieten wird diese Branche sicherlich einen Aufschwung erleben."
 PRF_subsidise_the_chakhao_plantations: "Subventionierung der Chakhao-Plantagen"
 PRF_subsidise_the_chakhao_plantations_desc: "Chakhao, auch als Schwarzer Manipuri-Reis bekannt, ist eine äußerst nährstoffreiche Reissorte, die in der Region Manipur angebaut wird. Ihre leuchtend violette Farbe macht sie zudem zu einem exotischen Lebensmittel für Importländer im Ausland. Durch großzügige Subventionen dürfte die Region großen Wohlstand erlangen."
 PRF_uplift_delhi_to_modern_standards: "Delhi auf den Stand der Zeit bringen"
 PRF_uplift_delhi_to_modern_standards_desc: "Der Standort des ehemaligen Sultanats von Delhi, der ehemaligen Hauptstadt des British Raj und vielleicht der begehrtesten Stadt für jeden Eroberer, der die Kontrolle über den riesigen indischen Kontinent erlangen wollte. Die sozialistische Herrschaft hat der Stadt jedoch absolut nichts Gutes gebracht. Viele Straßen sind überfüllt, Inder leben wie Sardinen in schlecht gebauten Wohnungen, und Slums entstehen, kaum dass ein anderer geräumt wurde. Durch umfassende öffentliche Bauprojekte soll Delhi endlich seinen Platz als Stadt des Jahrhunderts einnehmen."
 PRF_invest_in_jubbulpore_armaments: "Investieren Sie in die Rüstungsindustrie von Jubbulpore"
 PRF_invest_in_jubbulpore_armaments_desc: "Die Stadt Jubbulpore verfügt über eine bedeutende Rüstungsindustrie, die während des Bürgerkriegs schwere Schäden erlitten hat. Wenn wir einen Teil des Kapitals in diesen Sektor lenken, werden wir mit einer stärkeren Rüstungsindustrie belohnt, als wir sie zuvor hatten."
 PRF_karachi_shipyard_project: "Das Karachi-Werftprojekt"
 PRF_karachi_shipyard_project_desc: "Der Hafen von Karachi blickt in jüngster Zeit auf eine äußerst turbulente Geschichte zurück: Er musste in der ersten Zeit nach dem Schwarzen Montag einen Streik verkraften und hatte als einziger großer Hafen des ehemaligen Dominions Mühe, der Nachfrage gerecht zu werden. Eine Reihe von Aus- und Umbaumaßnahmen wird etwaige künftige Kapazitätsprobleme beheben und unsere heimische Schiffbauindustrie weiter stärken."
 PRF_fund_kashmiri_carpet_exports: "Förderung der Exporte von Kaschmir-Teppichen"
 PRF_fund_kashmiri_carpet_exports_desc: "Kaschmir-Teppiche sind aufgrund ihrer filigranen Schönheit und ihrer außergewöhnlichen handwerklichen Qualität bei den Reichen und der Elite weltweit begehrt. Wir werden eine Werbekampagne finanzieren und lokale Teppichweber finanziell unterstützen, damit unsere großartige Nation von den Einnahmen aus diesem luxuriösen Exportgeschäft profitiert."

 PRF_issue_executive_firman: "Erlass eines Executive Firman"
 PRF_issue_executive_firman_desc: "Zwar werden die meisten Gesetze vom Rat verabschiedet, doch behält der Nizam weiterhin die Befugnis, diesen bei Bedarf zu umgehen, und der Erlass eines Firman, der dazu beiträgt, dass sich die Dinge zu seinem Vorteil entwickeln, ist sicherlich eine Situation, die er als gerechtfertigt ansieht."
 PRF_rely_on_the_razakars: "Verlassen Sie sich auf die Razakars"
 PRF_rely_on_the_razakars_desc: "Die Razakars mögen gefährliche, gewalttätige Schläger sein, aber sie sind die gefährlichen, gewalttätigen Schläger des Nizam und werden dafür sorgen, dass diejenigen, die sich in der Öffentlichkeit abfällig über ihn äußern, daran erinnert werden, warum solche Handlungen normalerweise hinter verschlossenen Türen stattfinden."
 PRF_buying_good_will: "Guten Willen kaufen"
 PRF_buying_good_will_desc: "Es ist die Pflicht derjenigen, die über Reichtum und Macht verfügen, dafür zu sorgen, dass ihre Untergebenen angemessen versorgt werden, und die „Big Four“ sind sicherlich keine Unbekannten darin, solche Fürsorge zu leisten. Im Gegenzug wird erwartet, dass diejenigen, für die gesorgt wird, wesentlich eher bereit sind, die Ziele ihrer Wohltäter zu unterstützen."
 PRF_combatting_the_nizams_propaganda: "Bekämpfung der Propaganda des Nizam"
 PRF_combatting_the_nizams_propaganda_desc: "Als sogenannter \"Vater der Föderation\" hat der Nizam erhebliche Anstrengungen unternommen, um sich selbst einen nationalen Mythos zu schaffen – angefangen bei einfachen, alltäglichen Gerüchten über seine guten Taten bis hin zu Behauptungen, er habe persönlich den Angriff angeführt, um die Sozialisten daran zu hindern, den Godavari zu überqueren. Mit ein wenig Aufwand lassen sich solche außergewöhnlichen Behauptungen leicht als die offensichtlichen Lügen entlarven, die sie sind."
 PRF_concessions_to_the_assemblies: "Zugeständnisse an die Versammlungen"
 PRF_concessions_to_the_assemblies_desc: "Zwar werden die meisten Gesetzentwürfe, die den Rat durchlaufen, von den Beratern der Mitglieder entworfen oder zunächst in der Kammer ausgearbeitet, doch ist es den beratenden Versammlungen in den einzelnen Teilstaaten in bestimmten Fällen gestattet, über ihren jeweiligen Fürsten eigene Gesetzentwürfe einzureichen. Falls erforderlich, könnte die Zulassung weiterer Gesetzentwürfe aus den Versammlungen den Einfluss dieser Versammlungen auf den Gesetzgebungsprozess stärken und so zu einem ausgewogeneren Verhältnis im Rat beitragen."

### Schwerpunkte ###

 #Ökonomische Schwerpunkte
 PRF_the_berar_road: "Die Berar-Straße"
 PRF_the_berar_road_desc: "Da mit jedem Tag deutlicher wird, dass der Krieg bald nach Indien zurückkehren wird, müssen unverzüglich Vorbereitungen für diesen Fall getroffen werden. Im Falle eines Angriffs aus dem Norden wird Berar mit ziemlicher Sicherheit zum aktivsten Abschnitt der Front werden, da es sich um den am schwersten zu verteidigenden Teil der Grenze handelt. Daher müssen wir ein funktionierendes Versorgungsnetz zwischen Hyderabad und der Berar-Front sicherstellen, wenn wir auch nur die geringste Hoffnung haben wollen, das Gebiet zu halten."
 PRF_merging_the_railways: "Zusammenlegung der Eisenbahnen"
 PRF_merging_the_railways_desc: "Trotz der entscheidenden Rolle, die die Eisenbahnen des Landes spielen, gibt es nach wie vor keine zentrale Behörde, die sie alle beaufsichtigt. Stattdessen ist die Kontrolle auf private Unternehmen, ausländische Eigentümer und viele der Fürsten selbst aufgeteilt. Um dieses Durcheinander ordnungsgemäß zu bereinigen, wäre es sinnvoll, diese unterschiedlichen Unternehmen zusammenzuführen und sie im Rahmen der bestehenden Verwaltung von Nizams garantierte Staatsbahn zu betreiben."
 PRF_hyderabad_madras_express: "Hyderabad-Madras Express"
 PRF_hyderabad_madras_express_desc: "Madras ist nach Bombay und Hyderabad selbst die drittwichtigste Stadt Südindiens, doch die Verbindungen zwischen dem Herzen von [PRF_GetCountryTitle] und Madras sind schon viel zu lange völlig unzureichend. Jetzt ist der perfekte Zeitpunkt, dieses Problem endlich anzugehen und eine angemessene Direktverbindung zwischen den beiden Städten zu schaffen."
 PRF_bombay_to_bangalore: "Von Bombay nach Bangalore"
 PRF_bombay_to_bangalore_desc: "Bangalore fungiert als wichtiger Knotenpunkt, der den äußersten Süden mit dem Rest des Landes verbindet. Viele der in diesen Gebieten produzierten Rohstoffe werden über diese Stadt in das industrielle Zentrum von Bombay transportiert. Ein Ausbau der Eisenbahninfrastruktur zwischen den beiden Städten dürfte künftige industrielle Expansionen erheblich begünstigen."
 PRF_importing_european_models: "Import Europäischer Modelle"
 PRF_importing_european_models_desc: "Wir können es uns nicht ohne Weiteres leisten, einen wesentlichen Teil unserer Schwerindustrie dafür einzusetzen, moderne Diesel- und Elektrozüge komplett von Grund auf neu zu produzieren, doch deren Anschaffung wäre ein großer Segen für die Nation. Um dem abzuhelfen, sollten wir darauf achten, eine beträchtliche Anzahl von Modellen aus Europa zu importieren und gleichzeitig schwer herzustellende Teile zu beschaffen, aus denen wir dann leichter eigene Züge zusammenbauen können."
 PRF_finish_the_nizam_sagar_dam: "Fertigstellung des Nizam-Sagar-Staudamms"
 PRF_finish_the_nizam_sagar_dam_desc: "Zwar wurde der Bau des Nizam-Sagar-Staudamms bereits vor vielen Jahren begonnen, doch konnte das Projekt aufgrund der Revolution nie vollständig abgeschlossen werden. Da der Staudamm bereits fast fertiggestellt ist, wäre es töricht, nicht einfach die erforderlichen Mittel bereitzustellen, um ihm den letzten Anstoß zur Fertigstellung zu geben, insbesondere wenn man die enormen Vorteile bedenkt, die er für die Stromversorgung und die Bewässerung mit sich bringt und die wir so dringend benötigen."
 PRF_shroff_development_plan: "Shroff-Entwicklungsplan"
 PRF_shroff_development_plan_desc: "Als Reaktion auf die Krise des Schwarzen Montags hat ein Team aus Ökonomen und Industriellen unter der Leitung von Ardeshir Shroff einen Entwicklungsplan ausgearbeitet, um eine rasche Erholung von diesem vorübergehenden wirtschaftlichen Schock zu gewährleisten. Der Plan sieht unter anderem stärkere Maßnahmen zugunsten der indischen Wirtschaft, die Einführung neuer Pflanzensorten zur Sicherung besserer Ernten sowie eine stärkere Einbindung einheimischer Unternehmen in die Nutzung unserer zahlreichen unerschlossenen Ressourcen vor."
 PRF_hope_wheat_trials: "Hope-Weizenversuche"
 PRF_hope_wheat_trials_desc: "Die Befürchtung, dass uns nur eine einzige schlechte Ernte von einer großen Hungersnot trennt, und der Zeitaufwand, der für die Landwirtschaft aufgewendet werden muss, um die Nation überhaupt zu ernähren, sind zwei der größten Herausforderungen für das Wachstumspotenzial von [PRF_GetCountryTitle], insbesondere im vom Weizen abhängigen Westen. Um diese beiden Probleme anzugehen, haben wir vereinbart, neue, aus Amerika stammende Weizensorten zu erproben, die angeblich resistent gegen häufige Krankheiten wie Rost sind und gleichzeitig den Ertrag deutlich steigern."
 PRF_andhra_irrigation_schemes: "Bewässerungsprojekte in Andhra"
 PRF_andhra_irrigation_schemes_desc: "Die Region Andhra ist eines der wichtigsten Reisanbaugebiete des gesamten Subkontinents, und wir sind noch weit davon entfernt, die Grenzen des Ertragspotenzials auszuschöpfen, das wir erreichen können. Mit ausreichenden Investitionen in die Verbesserung der Bewässerungsinfrastruktur in der Region können wir die nutzbare Anbaufläche erweitern und zudem eine zusätzliche Reisproduktion während der Rabi-Saison ermöglichen."
 PRF_prioritise_indigenous_business: "Inländische Unternehmen bevorzugen"
 PRF_prioritise_indigenous_business_desc: "In einem völlig freien System würden viele einheimische indische Unternehmen im Vergleich zu ihren weitaus besser etablierten ausländischen Konkurrenten schlichtweg den Kürzeren ziehen. Um zu verhindern, dass das Land erneut von ausländischen Unternehmen beherrscht wird, müssen wir wirtschaftliche Schutzmaßnahmen gewährleisten, damit unsere eigenen Unternehmen lange genug bestehen können, um mit diesen ausländischen Schwergewichten zu konkurrieren."
 PRF_favouring_a_private_approach: "Bevorzugung eines privaten Ansatzes"
 PRF_favouring_a_private_approach_desc: "Auch wenn wir indischen Unternehmen Schutz garantieren mögen, dürfen wir nicht riskieren, die Grundsätze des Kapitalismus einfach aufzugeben, damit wir nicht Gefahr laufen, ein zweites Kalkutta zu werden. Es ist daher wichtig, dafür zu sorgen, dass wir, wo immer möglich, private Unternehmen begünstigen und fördern, anstatt auf eine verstärkte Verstaatlichung zurückzugreifen, wie es manche gefordert haben."
 PRF_increased_federal_intervention: "Verstärkte Eingriffe des Bundes"
 PRF_increased_federal_intervention_desc: "Es gibt bestimmte Bereiche der Wirtschaft, in denen private Unternehmen, egal wie sehr sie sich auch bemühen, bei der Erbringung wichtiger Dienstleistungen niemals effektiver sein werden als der Staat. Wir sollten daher in diesen Schlüsselbereichen, wo es erforderlich ist, auf eine Verstaatlichung hinarbeiten, um eine möglichst effektive Nutzung der nationalen Ressourcen zu gewährleisten."
 PRF_exploiting_the_chandradrona_deposits: "Erschließung der Chandradrona-Lagerstätten"
 PRF_exploiting_the_chandradrona_deposits_desc: "Das Chandradrona-Gebirge ist eine reichhaltige und größtenteils unerschlossene Quelle für Eisenerz, das das Land dringend benötigt. Die angemessene Erschließung dieser Lagerstätten und der entsprechende Ausbau der Stahlverarbeitungsanlagen sollten zu unseren wichtigsten wirtschaftlichen Prioritäten gehören."
 PRF_strengthen_madrasi_heavy_industry: "Stärkung der Schwerindustrie in Madras"
 PRF_strengthen_madrasi_heavy_industry_desc: "Auch wenn Bombay das industrielle Zentrum Südindiens ist, darf die Bedeutung Madras’ in diesem Bereich nicht unterschätzt werden. Mit ausreichender staatlicher Unterstützung könnte die Industrie in der gesamten Region Madras leicht eine Position erreichen, in der sie mit Bombay konkurrieren und es vielleicht sogar überholen könnte, was für die Nation von großem Nutzen wäre."

 #Schwerpunkte der Armee

 PRF_phasing_out_british_equipment: "Auslauf britischer Ausrüstung"
 PRF_phasing_out_british_equipment_desc: "Das Land wird weitere Konflikte nicht überstehen, wenn es nur mit alten Gewehren aus Ishapore und dem, was die Garnison in Bombay zurückgelassen hat, bewaffnet ist. Es ist daher von entscheidender Bedeutung, dass wir mit der Produktion eigener neuer Gewehre beginnen – mit allen Mitteln, die uns zur Verfügung stehen."
 PRF_developing_the_poona_officers_academy: "Aufbau der Offiziersakademie in Poona"
 PRF_developing_the_poona_officers_academy_desc: "Dem indischen Volk mangelt es seit langem an fähigen einheimischen Offizieren, was auf eine ganz bewusste Politik der Briten zurückzuführen ist, die damit vergeblich versuchten, eine Wiederholung der Ereignisse von 1857 zu verhindern; etwas, das für sie offensichtlich so gut funktioniert hat. Um diesen Mangel zu beheben, wurde vor einigen Jahren in Poona eine Akademie gegründet, um mehr Offiziere auszubilden, und wir sollten dazu beitragen, dass diese Akademie so gut wie möglich ausgebaut wird."
 PRF_streamlining_the_command_structure: "Straffung der Kommandostruktur"
 PRF_streamlining_the_command_structure_desc: "Die ursprüngliche Besetzung der Bundesarmee wurde in den chaotischen Tagen der Revolution hastig zusammengestellt und setzte sich aus den Privatarmeen der Fürstenstaaten, britischen Überläufern und allen zusammen, die bereit waren, gegen die Sozialisten zu den Waffen zu greifen. Zwar gab es in den letzten Jahren langsame Bemühungen, das Wirrwarr der Einheiten zu entwirren, doch müssen wir diese Anstrengungen beschleunigen, um wettbewerbsfähig zu bleiben."
 PRF_the_new_federal_army: "Die Neue Bundesarmee"
 PRF_the_new_federal_army_desc: "Auch wenn unsere Reformbemühungen vielleicht erst am Anfang stehen, ist die Bundesarmee nun zum ersten Mal in ihrer kurzen Geschichte diesem Namen tatsächlich würdig; sie ist nicht mehr nur eine zusammengewürfelte Truppe begeisterter Soldaten. Hoffentlich wird sie, wenn es darauf ankommt, ausreichen, um die Nation nicht nur zu verteidigen, sondern ihr auch wieder zu ihrer früheren Größe zu verhelfen."
 PRF_negotiating_equipment_deliveries: "Verhandlungen über Ausrüstungslieferungen"
 PRF_negotiating_equipment_deliveries_desc: "Die Freundschaft eines Indischen Volkes zu gewinnen, das sich nicht einfach den Befehlen des Britischen Königs oder der neuen Roten Könige aus Kalkutta in London unterwirft, ist für viele der Großmächte der Welt eine äußerst verlockende Perspektive. Dieses Interesse können wir leicht ausnutzen, um die vielen Lücken zu schließen, die in den Beständen unserer Armee noch bestehen."
 PRF_support_the_bangalore_defence_industry: "Unterstützt die Rüstungsindustrie in Bangalore"
 PRF_support_the_bangalore_defence_industry_desc: "Kaum war die Revolution beendet, startete Maharaja Wadiyar IV. eine groß angelegte Kampagne zum Aufbau einer neuen Rüstungsindustrie im ehemaligen britischen Militärlager von Bangalore. Ein solches Vorhaben wird für [PRF_GetCountryTitle] mit Sicherheit große Früchte tragen, und wir sollten Bundesmittel umleiten, um Mysore bei der Förderung dieser Bemühungen im Interesse der nationalen Sicherheit zu unterstützen."
 PRF_updating_shivajis_tactics: "Shivajis Taktiken auf den neuesten Stand bringen"
 PRF_updating_shivajis_tactics_desc: "Das erste Maratha-Reich wurde vom großen Maharaja Shivaji gegründet, der erkannte, dass man keine große, hochentwickelte Armee benötigt, um Kriege zu gewinnen, wenn man das umliegende Gelände wirklich versteht und eine flexible, irreguläre Armee richtig einsetzt. Die von ihm entwickelten Taktiken haben auch in der heutigen Zeit noch Gültigkeit, natürlich ergänzt durch die technologischen Möglichkeiten unserer Zeit."
 PRF_prioritising_adaptability: "Anpassungsfähigkeit hat Vorrang"
 PRF_prioritising_adaptability_desc: "Wir werden unsere Feinde nicht besiegen, wenn wir einfach davon ausgehen, dass jedes Schlachtfeld zu unseren Gunsten verläuft. Stattdessen müssen wir dafür sorgen, dass unsere Männer unabhängig von der Situation nicht nur mit voller Kampfkraft kämpfen können, sondern auch dann weiterkämpfen können, wenn sie von unseren Nachschublinien abgeschnitten sind."
 PRF_learn_from_the_battle_of_ahmadabad: "Aus der Schlacht von Ahmadabad lernen"
 PRF_learn_from_the_battle_of_ahmadabad_desc: "Ahmadabad war nichts weniger als eine Katastrophe, bei der viele tapfere Männer in einem heldenhaften letzten Gefecht in der Stadt von den sozialistischen Plünderern getötet wurden. Die Fehler, die zu einem solchen Gemetzel geführt haben, dürfen sich nicht wiederholen, und wenn unsere Soldaten das nächste Mal auf den Straßen kämpfen müssen, werden sie darauf vorbereitet sein."
 PRF_a_new_generation_of_armoured_cars: "Eine neue Generation gepanzerter Fahrzeuge"
 PRF_a_new_generation_of_armoured_cars_desc: "Aufgrund britischer Importbeschränkungen waren viele unserer Soldaten in der Vergangenheit darauf angewiesen, Panzerwagen einzusetzen, anstatt die weitaus leistungsstärkeren Panzer, mit denen sie ihre treuen Handlanger ausstatteten. Die Erfahrungen, die wir dabei gesammelt haben, haben uns jedoch gelehrt, dass wir den Panzerwagen nicht unterschätzen sollten, denn er eignet sich hervorragend für unterstützende Aufklärungsaufgaben und lässt sich mit den richtigen Mitteln wesentlich kostengünstiger herstellen als jeder anständige Panzer, was ihn perfekt für eine flexible Armee wie die unsere macht."
 PRF_integrating_elephants_into_the_sappers: "Integration von Elefanten in die Pioniere"
 PRF_integrating_elephants_into_the_sappers_desc: "Kriegselefanten, die in die feindlichen Reihen stürmen, mögen zwar nur noch ein historisches Relikt sein, doch es wäre ein Irrtum zu glauben, dass Elefanten in einer modernen Armee nicht weiterhin eine wichtige Rolle spielen könnten. In Gelände, das für mechanisierte Einsatzmöglichkeiten ungeeignet ist, leisten Elefanten als Teil der Pioniertruppen hervorragende Dienste: Sie eignen sich perfekt zum Bau von Brücken über unwegsames Gelände und zum Transport großer Ausrüstung an Orte, die mit anderen Mitteln einfach nicht erreichbar sind."
 PRF_guerrillas_of_the_deccan: "Guerillas des Deccan"
 PRF_guerrillas_of_the_deccan_desc: "Ganimi Kava ist das Vorbild, auf dem viele Formen der asymmetrischen Kriegsführung basieren, ein Vorbild, das in den großen Bergen des Dekkan, die wir unsere Heimat nennen, zur Vollendung gebracht wurde. Wenn wir diese Art der Kriegsführung wieder in die Ghats und sogar darüber hinaus tragen, wird uns dies hoffentlich die Siege bescheren, die wir uns wünschen, so wie es damals bei Shivaji der Fall war."
 PRF_refine_mahadajis_legacy: "Mahadajis Vermächtnis weiterentwickeln"
 PRF_refine_mahadajis_legacy_desc: "Unter Mahadaji Scindia wurde den Herrschern Südindiens erstmals bewusst, dass man durch das bloße Verlassen auf Mut und Tapferkeit nichts anderes gewinnt als ein blumiges Vermächtnis, von dem nur die unterworfenen Söhne erzählen. Wenn wir ein solches Schicksal nicht erleiden wollen, muss die Armee nicht nur nach europäischen Standards modernisiert werden, sondern diese hoffentlich eines Tages sogar übertreffen!"
 PRF_modernising_ayurveda: "Modernisierung des Ayurveda"
 PRF_modernising_ayurveda_desc: "Ein kranker Soldat ist ohne die richtige Behandlung so gut wie tot, und seit Jahrhunderten wird Ayurveda eingesetzt, um sicherzustellen, dass sie wieder auf die Beine kommen. In der heutigen Zeit sind die mystischeren Aspekte des Systems langsam in den Hintergrund getreten, um Platz für einen neuen, wissenschaftlicheren Ansatz zu machen, und obwohl viele Skeptiker es immer noch für nichts weiter als Pseudowissenschaft halten, lässt sich kaum leugnen, dass es unsere Soldaten wieder auf die Beine bringt; selbst wenn es nur ein Placebo-Effekt ist."
 PRF_refitting_the_lancers: "Modernisierung der Lanzenträger"
 PRF_refitting_the_lancers_desc: "Unsere zahlreichen Lanzenträger-Einheiten sind seit langem der Stolz der Armeen aller südindischen Staaten, doch ohne kontinuierliche Weiterentwicklung wird dieser Stolz schnell zu nichts weiter als einem Relikt verkommen. Diese Männer müssen mit den modernsten Gewehren und einer Artillerie ausgestattet werden, die auf ihre große Mobilität abgestimmt ist, damit sie auch weiterhin der schnelle Hammer sein können, der unsere Feinde zerschmettert."
 PRF_encouraging_native_innovation: "Förderung einheimischer Innovationen"
 PRF_encouraging_native_innovation_desc: "'Das reicht schon' war viel zu lange das Motto vieler unserer Quartiermeister, denn es reicht immer nur so lange, bis man einem Feind gegenübersteht, der besser bewaffnet ist, während die eigene Waffe auseinanderfällt. Es ist von entscheidender Bedeutung, dass unsere Soldaten so schnell wie möglich mit der neuesten Technologie ausgerüstet werden, die im eigenen Land entwickelt wurde und nicht erst Jahre, nachdem unsere Feinde sie bereits in ihren Händen halten, aus dem Ausland importiert wird."
 PRF_reforming_the_deccan_invincibles: "Reform der Deccan Invincibles"
 PRF_reforming_the_deccan_invincibles_desc: "Die Deccan Invincibles waren einst eine großartige Elitetruppe, die für die Marathen so manche Schlacht gewann. Heutzutage werden solche Erfolge von spezialisierten Elitetruppen erzielt, die bei Bedarf weit über ihre Möglichkeiten hinauswachsen – wie beispielsweise die Marines, die Gebirgsjäger und sogar die Fallschirmjäger. Wenn wir an die Erfolge der Deccan Invincibles anknüpfen wollen, sollten wir unsere eigenen Spezialeinheiten aufstellen, um den Sieg zu erringen."
 PRF_strengthening_the_gardi_core: "Stärkung des Gardi-Kerns"
 PRF_strengthening_the_gardi_core_desc: "Das Herzstück jeder Armee ist ihre zentrale Infanterielinie, denn eine Vielzahl von Elitesoldaten, die bereit sind, die feindliche Armee zu vernichten, nützt wenig, wenn die eigenen Reihen zusammenbrechen, bevor sie dazu die Gelegenheit haben. Sicherzustellen, dass selbst der rangniedrigste Soldat ausgerüstet und bereit ist, so hart wie möglich zu kämpfen, wird der entscheidende Schritt beim Aufbau einer Weltklasse-Armee für die indische Nation sein."
 PRF_growing_the_iisc: "IISc weiter ausbauen"
 PRF_growing_the_iisc_desc: "Das Tata-Institut, oder formeller ausgedrückt das Indian Institute of Science, ist eine der wichtigsten Forschungseinrichtungen in ganz Indien, und die Förderung seines Wachstums ist ein Anliegen, bei dem sich selbst die streitlustigsten Fürsten leicht einigen können. Sicherzustellen, dass [PRF_GetCountryTitle] an der Spitze der Wissenschaft bleibt, wird nicht nur im Alltag von Nutzen sein, sondern auch zur Entwicklung modernster Technologien für unser Militär beitragen und uns hoffentlich einen großen Vorteil verschaffen."

 #Schwerpunkt Erholung
 PRF_india_united: "Indien vereint!"
 PRF_india_united_desc: "Die sozialistische Bedrohung wurde aus dem Norden vertrieben, und die Überreste des Raj wurden endlich niedergeschlagen. Nun ist es unsere Pflicht, der Nation ihren früheren Glanz zurückzugeben, die durch diesen verheerenden Krieg verursachten Schäden zu beheben und ganz Indien in eine strahlende neue Zukunft zu führen."

 PRF_reconstructing_the_nation: "Wiederaufbau der Nation"
 PRF_reconstructing_the_nation_desc: "Indien liegt in Trümmern, verwüstet durch zwei große Kriege innerhalb eines Jahrzehnts; doch es wird niemals besiegt werden. Die Beseitigung der Schäden sollte für die Regierung oberste Priorität haben, und hoffentlich können wir uns mit der Zeit nicht nur von der Zerstörung erholen, sondern eines Tages sogar die Jahre vor der Revolution übertreffen."
 PRF_fate_of_the_loyalist_rulers: "Schicksal der loyalistischen Herrscher"
 PRF_fate_of_the_loyalist_rulers_desc: "Als Osman die Unabhängigkeit erklärte, um Indien vor dem Sozialismus zu bewahren, weigerten sich viele feige Fürsten im Norden, sich hinter ihn zu stellen, da sie zu viel Angst hatten, für ihre Freiheit einzustehen. Diejenigen, die das Glück hatten, während der Revolution nicht überfallen zu werden, konnten ihre Stellung unter britischer Herrschaft behalten, und obwohl sie sich vielleicht dafür entschieden haben, unsere Feinde zu unterstützen, müssen wir dennoch abwägen, ob es ihnen gestattet sein sollte, ihre Positionen beizubehalten."
 PRF_restoring_the_ousted_princes: "Wiedereinsetzung der entthronten Prinzen"
 PRF_restoring_the_ousted_princes_desc: "Die Mitglieder der Föderation mögen zwar hart gegen die sozialistischen Plünderer gekämpft haben, doch reichte dies nicht aus, um sie alle zu retten. Viele ihrer Ländereien wurden überrannt, und so mancher gute Mann wurde niedergemetzelt; sogar das große Haus Scindia wurde aus seinen Ländereien in Gwalior vertrieben und lebt seitdem in Hyderabad. Es ist nun an der Zeit, dieses Unrecht zu korrigieren und diese Ländereien ihren rechtmäßigen Herrschern zurückzugeben."
 PRF_federal_reorganisation: "Reorganisation auf Bundesebene"
 PRF_federal_reorganisation_desc: "Zu glauben, wir könnten die Zeit einfach auf den Stand vor der Revolution zurückdrehen und alle Fürstentümer wieder so herstellen, wie sie damals waren, ist nichts anderes als eine Fantasievorstellung. Die Bevölkerung dieser Gebiete wurde vom Regime in Kalkutta gegen die Fürsten radikalisiert, und eine gewaltsame Wiedereinsetzung der Fürsten würde uns lediglich auf weitere Unruhen in ferner Zukunft vorbereiten. Die Gebiete sollten stattdessen als Bundesländer verwaltet und nach Bedarf neu organisiert werden, um sie in die Verwaltung zu integrieren."
 PRF_armed_forces_rehabilitation: "Rehabilitation der Streitkräfte"
 PRF_armed_forces_rehabilitation_desc: "Letztendlich kämpft der einfache Mann selten für seine ideologischen Überzeugungen; wäre er nur ein paar Meilen weiter geboren, würde er genauso gut unter einem anderen Banner kämpfen. Wir sollten daher den einfachen Soldaten unserer Feinde eine pauschale Amnestie gewähren – in der Hoffnung, uns damit etwas Goodwill zu verschaffen, und darüber beraten, wie mit ihren engagierteren Offizieren verfahren werden soll."
 PRF_reversing_socialist_destruction: "Umkehr der sozialistischen Zerstörung"
 PRF_reversing_socialist_destruction_desc: "Die Sozialisten des Nordens haben überall, wo sie ihre Tentakel ausstrecken konnten, Verwüstung angerichtet, unter dem falschen Vorwand, das indische Volk von der Unterdrückung zu befreien. Es wird Jahre, vielleicht sogar Jahrzehnte dauern, diesen Schaden vollständig zu beheben, aber vorerst können wir zumindest damit beginnen, einige Aspekte ihrer wirtschaftlichen Sabotage rückgängig zu machen."
 PRF_protecting_the_farmers: "Schutz der Landwirte"
 PRF_protecting_the_farmers_desc: "Die Landwirtschaft ist das Rückgrat des Landes, ohne das alles zusammenbrechen würde, und doch hat der Krieg unzählige Felder und Bauernhöfe durch Mörsergranaten und Panzerketten verwüstet. Es sollte eine unserer höchsten Prioritäten sein, dafür zu sorgen, dass diese Landwirte wieder auf die Beine kommen und weiterhin genügend Nahrungsmittel produzieren, um sowohl die Nation zu versorgen als auch angemessene Exporte aufrechtzuerhalten."
 PRF_bridge_and_road_project: "Brücken- und Straßenbauprojekt"
 PRF_bridge_and_road_project_desc: "Eine Stadt ist nichts weiter als eine isolierte Insel, wenn ihre Einwohner sie nicht problemlos verlassen können, und der Zustand der Straßen im Land ist derzeit schlichtweg katastrophal. Mit ausreichendem Einsatz könnten wir jedoch einen Großteil des Landes wieder miteinander verbinden und so weiteres Wachstum und den Wiederaufschwung fördern."
 PRF_increasing_agricultural_exports: "Steigerung der Agrarexporte"
 PRF_increasing_agricultural_exports_desc: "Ohne Kapital sind viele der für den Wiederaufbau des Landes notwendigen Projekte kaum mehr als fromme Wünsche, die weniger wert sind als das Papier, auf dem sie stehen. Trotz der Schäden bleibt die Landwirtschaft unser stärkster Exportzweig; um die für diese großangelegten Projekte benötigten Mittel aufzubringen, müssen wir daher unsere Exporte in diesem Bereich so weit wie vernünftigerweise möglich steigern."
 PRF_urban_restoration_projects: "Stadterneuerungsprojekte"
 PRF_urban_restoration_projects_desc: "Nirgendwo wurden die großen Städte des Landes im jüngsten Konflikt stärker getroffen; selbst Ortschaften wie Nagpur bestehen derzeit eher aus Trümmern und Gräbern als aus Wohnhäusern. Die Nation kann nicht darauf hoffen, voranzukommen, solange diese städtischen Zentren nicht ordnungsgemäß wieder aufgebaut sind, und daher sollte dies eines der ersten großen Projekte sein, die wir in Angriff nehmen."
 PRF_focus_on_capital_growth: "Schwerpunkt auf Kapitalwachstum"
 PRF_focus_on_capital_growth_desc: "Zwar würde bereits eine einfache Rückkehr zu den Niveaus vergangener Zeiten die Lebensumstände vieler unserer Bürger erheblich verbessern, doch wäre es töricht zu glauben, dass dies allein ausreichen würde, um die Nation tatsächlich wieder aufzubauen. Wir sollten unsere bisherige Unterstützung für indische Unternehmen fortsetzen und uns stark auf sie verlassen, damit sie ebenfalls zu den Wiederaufbaubemühungen beitragen, sodass wir uns nicht nur erholen, sondern auch weiterhin gedeihen und noch stärker wachsen können."
 PRF_competitive_industry: "Wettbewerbsfähige Industrie"
 PRF_competitive_industry_desc: "Unter britischer Herrschaft wurde die indische Industrie bewusst geschwächt, um ihr echtes Wachstum zu verhindern, wobei sich die Herrscher in Großbritannien voll und ganz bewusst waren, dass die indische Industrie ohne diese Beschränkungen jede britische Fabrik mühelos aus dem Geschäft drängen könnte. Nun, da wir nicht mehr zurückgehalten werden, ist es an der Zeit, zu beweisen, dass ihre Befürchtungen berechtigt waren, und den Weg einzuschlagen, die europäische Produktion zu übertrumpfen."
 PRF_tapping_indias_potential: "Indiens Potenzial ausschöpfen"
 PRF_tapping_indias_potential_desc: "Der natürliche Reichtum der Erde bietet seit Jahrhunderten die Möglichkeit, selbst den ärmsten Bettler in den reichsten Prinzen zu verwandeln, sofern er die Gaben der Natur richtig zu nutzen und zu verwerten weiß. Selbst wenn ein Großteil des Landes noch immer verwüstet ist, lässt sich dennoch großes Kapital beschaffen, indem man den Abbau von Rohstoffen wie Öl und Eisen in den Vordergrund stellt und diese an den Meistbietenden verkauft, insbesondere an die verzweifelten, vom Krieg heimgesuchten Nationen, die kaum andere Lieferanten zur Auswahl haben."
 PRF_using_our_natural_wealth: "Unsere Naturressourcen nutzen"
 PRF_using_our_natural_wealth_desc: "Zwar hat uns der Ausbau der vielen bestehenden Bergwerke, Steinbrüche und anderer ähnlicher Betriebe bislang gut dabei geholfen, unseren Ressourcenhunger zu stillen, doch reicht dies nicht aus, da viele dieser Standorte bald erschöpft sein werden. Wir müssen daher damit beginnen, neue Standorte zu erschließen – solche, die großes Potenzial bergen, große Mengen an Ressourcen zu liefern, wenn man ihnen genügend Zeit und Aufmerksamkeit widmet. Mit diesen können wir unseren Bedarf problemlos decken und unsere Exporte deutlich steigern."

 #Politische Schwerpunkte
 PRF_greatness_belongs_to_osman: "Größe gebührt Osman!"
 PRF_greatness_belongs_to_osman_desc: "Nachdem die tyrannischen Prinzen wieder an ihren rechtmäßigen Platz verwiesen wurden, steht es dem großen Nizam nun frei, Indien nach eigenem Ermessen zu regieren. Das Zeitalter Osmans wird dem indischen Volk eine strahlende neue Ära bescheren!"
 PRF_declare_the_kaisar_i_hind: "Den Kaisar-i-Hind ausrufen"
 PRF_declare_the_kaisar_i_hind_desc: "Da der Nizam nun fest im Sattel sitzt, ist es an der Zeit, einen Wandel zu verkünden: Der gestohlene Titel Kaisar-i-Hind soll endlich von den Briten zurückerobert werden, wobei Osman selbst als Kaiser der Nation fungieren wird. Alle Macht wird bei ihm liegen, und das Volk wird ihn als den großen Wiederhersteller der Nation bejubeln!"
 PRF_father_of_the_federation: "Vater des Bundes"
 PRF_father_of_the_federation_desc: "Auch wenn manche vielleicht angenommen haben mögen, der Nizam hege imperiale Ambitionen, so war es in Wahrheit doch sein einziges Anliegen, die Regierungsgewalt zum Wohle aller in seinen Händen zu zentralisieren. Da die Fürsten nun nicht mehr in der Lage sind, das Wachstum der Nation durch ihre internen Machtkämpfe zu bremsen, ist die Zeit gekommen, dass der Bund zu der Großmacht wird, zu der er schon immer bestimmt war."
 PRF_harness_the_razakars: "Die Razakars einsetzen"
 PRF_harness_the_razakars_desc: "Auch wenn die Fürsten beseitigt worden sein mögen, gibt es immer wieder Usurpatoren, die darauf aus sind, die Nation erneut ins Chaos stürzen zu lassen. Wir müssen uns daher verstärkt auf die Razakars verlassen, um potenziellen Bedrohungen gebührend Furcht einzuflößen und alle, die nicht klug genug sind, sich einschüchtern zu lassen, im Keim zu ersticken."
 PRF_ensure_muslim_supremacy: "Vorherrschaft der Muslime sichern"
 PRF_ensure_muslim_supremacy_desc: "Wie der Razakar-Führer Qasim Razvi betont, ist die muslimische Herrschaft über Indien allein durch das Recht der Eroberung gerechtfertigt, denn eine bessere Rechtfertigung ist nicht erforderlich. Den Besiegten dürfen keine Zugeständnisse gemacht werden, und so werden wir dafür sorgen, dass alle wichtigen Positionen von Muslimen besetzt werden, wie es ihnen zusteht."
 PRF_dissolve_the_razakars: "Razakars auflösen"
 PRF_dissolve_the_razakars_desc: "Qasim Razvis gewalttätigen Schlägern kann man nicht trauen, und sie haben ihren Nutzen bereits überlebt. Es ist an der Zeit, dafür zu sorgen, dass sie ordnungsgemäß aufgelöst werden und dass man sich rasch um Razvi selbst kümmert."
 PRF_protector_of_all_faiths: "Beschützer aller Glaubensrichtungen"
 PRF_protector_of_all_faiths_desc: "Der Versuch, über alle Völker Indiens zu herrschen, anstatt gemeinsam mit ihnen zu regieren, wird nur zu katastrophalen Folgen führen. Wir müssen daher allen Indern gleichen Rechtsschutz und gleiche Förderung gewährleisten, seien sie nun Hindus, Muslime, Christen, Buddhisten oder Angehörige anderer Glaubensrichtungen; und wir werden auch dafür sorgen, dass sie wissen, dass diese Vorteile ausschließlich der großen Güte Osmans selbst zu verdanken sind."
 PRF_appoint_a_national_diwan: "Ernennung eines nationalen Diwan"
 PRF_appoint_a_national_diwan_desc: "Osman mag zwar die höchste Autorität im Land sein, doch ist Autorität bedeutungslos, wenn es niemanden gibt, der dafür sorgt, dass sein Wille umgesetzt wird. Ein nationaler Diwan wird daher direkt von Osman ernannt, der als Hauptverantwortlicher für die Durchsetzung von Osmans Befehlen fungieren wird."
 PRF_establish_the_national_executive_council: "Einrichtung des Nationalen Exekutivrats"
 PRF_establish_the_national_executive_council_desc: "Als Herrscher von Hyderabad traf Osman die Entscheidung, einen Exekutivrat einzurichten, der ihn in wichtigen Angelegenheiten beraten und dazu beitragen sollte, dass sein Wille so effektiv wie möglich umgesetzt wurde. Da nun ganz Indien unter seiner Herrschaft steht, ist es nur logisch, dass ein ähnlicher Rat auf nationaler Ebene eingerichtet wird, der sich aus jenen zusammensetzt, die ihre Loyalität und Nützlichkeit wirklich unter Beweis gestellt haben."
 PRF_assert_authority_over_the_realm: "Herrschaft über das Reich behaupten"
 PRF_assert_authority_over_the_realm_desc: "Obwohl die Autonomie von Madras erst seit knapp über einem Jahrzehnt besteht, ist sie bereits zu einem überholten Relikt einer vergangenen Ära geworden. Es ist nun an der Zeit, diese nutzlose Autonomie aufzulösen und Osmans Autorität über das gesamte Reich uneingeschränkt durchzusetzen, anstatt weiterhin zuzulassen, dass sich ihre perverse demokratische Regierung weiter ausbreitet."
 PRF_royal_sadaqah: "Königliche Sadaqah"
 PRF_royal_sadaqah_desc: "Als guter Muslim und vor allem als reichster Mann der Welt ist es Osmans Pflicht, für seine Untertanen zu sorgen: für die heimatlosen Reisenden, für die von Schulden Belasteten und vor allem für die Ärmsten unter ihnen. Durch Osman wird all diesen Menschen die gebührende Fürsorge zuteil, und sie werden seinen Namen mit Wohltätigkeit in Verbindung bringen."
 PRF_expand_the_main_experimental_farm: "Ausbau des \"Hauptversuchsguts\""
 PRF_expand_the_main_experimental_farm_desc: "Seit Jahrtausenden ist die Hungersnot eine der größten Bedrohungen für die indische Bevölkerung und hat mehr Menschenleben gefordert als jeder Eroberer. Da in den letzten Jahrzehnten große Fortschritte im Bereich der künstlichen Stickstoffdünger erzielt wurden, rückt die Beseitigung der Hungersnot in greifbare Nähe. Zu diesem Zweck sollten wir den bestehenden Hauptversuchsbetrieb zu einer bedeutenden landwirtschaftlichen Hochschule ausbauen, um hoffentlich sicherzustellen, dass Indien an die Spitze der landwirtschaftlichen Entwicklung rückt und diesen Kampf gegen die Hungersnot anführt."
 PRF_begin_agricultural_reforms: "Beginn der Agrarreformen"
 PRF_begin_agricultural_reforms_desc: "Seit Jahrhunderten gab es in der Landwirtschaft aus Sicht des durchschnittlichen Bauern kaum technologischen Fortschritt, abgesehen vielleicht von der Sämaschine. Da mechanisierte Landmaschinen jedoch immer günstiger und einfacher herzustellen sind, stehen wir an der Schwelle zu einer großen neuen technologischen Revolution in der Landwirtschaft, und mit ausreichender Unterstützung können wir den Weg zur massiven Mechanisierung der indischen Landwirtschaft einschlagen."
 PRF_enshrine_compulsory_primary_education: "Verpflichtende Grundschulbildung verankern"
 PRF_enshrine_compulsory_primary_education_desc: "Damit sich Indien von dem kolonialen Hinterland, das es unter britischer Herrschaft war, zu einer modernen Großmacht entwickeln kann, dürfen wir nicht länger eine Gesellschaft bleiben, in der die überwiegende Mehrheit der Bevölkerung völlig analphabetisch ist. Es ist daher von entscheidender Bedeutung, dass wir die Grundschulbildung für alle Inder zur Pflicht machen und die staatlichen Bildungsausgaben erheblich aufstocken, um sicherzustellen, dass möglichst viele Kinder eine angemessene Bildung erhalten und so in die Lage versetzt werden, einen echten Beitrag zur Gesellschaft zu leisten."

 PRF_reign_of_the_princes: "Herrschaft der Fürsten"
 PRF_reign_of_the_princes_desc: "Nachdem Osmans Ambitionen endgültig zunichte gemacht wurden, ist es nun an der Zeit, dass die Großen Vier ihre eigenen Ziele verwirklichen. Die Zukunft der indischen Nation wird endlich von ihren eigenen einheimischen Herrschern bestimmt werden, die zweifellos am besten für die Herrschaft geeignet sind."
 PRF_the_image_of_the_rajarshi: "Das Bildnis des Rajarshi"
 PRF_the_image_of_the_rajarshi_desc: "Die Rajarshis, oder königlichen Weisen, sind jene unter den herrschenden Kasten des Hinduismus, die wahrhaft reine Hingabe und Fürsorge für ihr Volk zeigen und stets das Wohl der Nation über ihre eigenen Interessen stellen. Auch wenn sie sich selbst natürlich nicht direkt als solche bezeichnen, wäre es von großem Nutzen, die Öffentlichkeit dazu anzuregen, die Führung des Rates als solche Rajarshis zu betrachten, die die Nation edelmütig voranführen und alles geben, was sie haben, zum Wohle der unteren Kasten, über die sie rechtmäßig herrschen."
 PRF_royal_patronage_fund: "Königlicher Förderfonds"
 PRF_royal_patronage_fund_desc: "Es ist richtig, dass wohlhabende Menschen der Gesellschaft etwas zurückgeben, und da die Prinzen der Föderation nun sehr geschlossen auftreten, ist es nur logisch, einen gemeinsamen Fonds einzurichten, der es jedem Prinzen ermöglicht, für ein gemeinsames Ziel zu spenden. Dieser Fonds soll für Infrastruktur und Entwicklung im ganzen Land verwendet werden, wobei die Mittel jedem Prinzen gemeinsam zugeschrieben werden, um sicherzustellen, dass jeder Inder die entscheidende Rolle anerkennt, die jeder Prinz bei der Förderung des Landes spielt."
 PRF_a_path_for_every_village: "Ein Weg zu jedem Dorf"
 PRF_a_path_for_every_village_desc: "Viele der kleinen Dörfer im ganzen Land sind fast vollständig von der Außenwelt abgeschnitten; die wenigen Verbindungen, die sie haben, sind oft kaum mehr als Feldwege und verfallene Straßen, die vor Jahrhunderten angelegt wurden. Eine ideale Verwendung des neuen Fonds wäre es, diese Dörfer ordnungsgemäß an moderne Straßennetze anzubinden, was hoffentlich erheblich zu ihrer zukünftigen Entwicklung beitragen wird."
 PRF_redistribute_the_presidencies: "Neuverteilung der Fürstentümer"
 PRF_redistribute_the_presidencies_desc: "Die ehemaligen Fürstentümer des Britischen Empire stellen nichts anderes dar als Land, das von ausländischen Invasoren ihren rechtmäßigen Herrschern geraubt wurde. Nun, da sie zurückerobert wurden, stellt sich die Frage, was mit ihnen geschehen soll. Zu diesem Zweck wurde vorgeschlagen, sie unter den Fürsten, die sich auf die Seite der Föderation gestellt haben, sowie unter loyalen kleinen Zamindars und hochrangigen Soldaten, die für unseren Sieg von entscheidender Bedeutung waren, aufzuteilen."
 PRF_undermine_the_special_status: "Den Sonderstatus untergraben"
 PRF_undermine_the_special_status_desc: "Ein Vorgehen gegen Madras würde angesichts der damit verbundenen Instabilität letztlich kaum Vorteile bringen. Viel effizienter wäre es stattdessen, ihre Autonomie nach und nach zu untergraben, bis wir sie praktisch vollständig ausgehöhlt haben, sodass sie dann nicht mehr die Macht haben werden, uns aufzuhalten."
 PRF_control_the_opposition: "Die Opposition unter Kontrolle halten"
 PRF_control_the_opposition_desc: "Die Justice Party mag angesichts der Andhra Mahasabha zusammengebrochen sein, doch das macht sie für unsere Zwecke nur umso nützlicher. Durch staatliche Unterstützung über inoffizielle Kanäle lässt sich in Madras leicht ein großer Wiederaufschwung der Justizpartei herbeiführen, und im Gegenzug für diesen Wiederaufschwung wird sie sicherlich den Interessen ihrer Gönner entgegenkommen."
 PRF_partition_the_madras_autonomy: "Aufteilung der Autonomie von Madras"
 PRF_partition_the_madras_autonomy_desc: "Es war ein Fehler, die Schaffung der Autonomie von Madras zuzulassen – ein Fehler, der unverzüglich korrigiert werden sollte, nun da die Föderation dazu in der Lage ist. Zu diesem Zweck soll Madras selbst vollständig abgeschafft und sein Gebiet unter den benachbarten Fürsten aufgeteilt werden, denen es rechtmäßig zusteht."
 PRF_madras_financial_zone: "Finanzzone Madras"
 PRF_madras_financial_zone_desc: "Auch wenn die Autonomie von Madras nun vorbei ist und sein Gebiet aufgeteilt wurde, stehen wir aufgrund des immensen Werts der Stadt Madras selbst nun vor der Frage, wie mit ihr verfahren werden soll. Daher wurde vorgeschlagen, die Stadt nicht einfach an einen der Fürsten zu übergeben, sondern sie zu einem besonderen Verwaltungsbezirk zu machen, der im Vergleich zum Rest des Landes einen reduzierten Steuersatz aufweist, um so viel ausländisches Kapital wie möglich anzuziehen und sie zum Wall Street Asiens zu machen."
 PRF_house_of_princely_representatives: "Fürstliches Repräsentantenhaus"
 PRF_house_of_princely_representatives_desc: "Die Fürstenkammer mag den rangniedrigeren Mitgliedern unserer großen Föderation zwar eine Stimme verleihen, doch reicht dies bei weitem nicht aus, um ihnen eine aktive Rolle in der Staatsführung zu gewähren. Daher soll sie in ein ordentliches Repräsentantenhaus umgestaltet werden, in dem Gesetzentwürfe zunächst ausgearbeitet und zur Abstimmung gebracht werden, bevor sie vom Diwan dem Rat zur Genehmigung vorgelegt werden."
 PRF_the_new_supreme_council: "Der Neue Oberste Rat"
 PRF_the_new_supreme_council_desc: "Zu Zeiten der Ostindien-Kompanie fungierte der Oberste Rat von Bengalen als Indiens höchste Instanz; er bestand aus vier Mitgliedern, wobei ein fünfter Sitz vom Generalgouverneur als Vorsitzendem des Rates besetzt wurde, der jedoch bemerkenswerterweise kein Vetorecht bei Entscheidungen besaß. Nun, über ein Jahrhundert später, ist ein ähnliches System wieder entstanden, das jedoch nicht mehr von Kolonialherren, sondern von einheimischen Herrschern geleitet wird und durch das nun der wahre Wille des indischen Volkes zum Ausdruck kommen soll."

 PRF_iyers_national_government: "Iyers Bundesregierung"
 PRF_iyers_national_government_desc: "Auch wenn Iyer vom Nizam vielleicht damit beauftragt wurde, ein überparteiliches Kabinett zu führen, das von den großen Parteien der Föderation unterstützt wird, würde sich der Nizam täuschen, wenn er glaubt, dass dieses Kabinett lediglich als verlängerter Arm seiner Herrschaft fungieren wird. Bald wird der Diwan der Einzige im Land sein, der wirklich alle Trümpfe in der Hand hält, und weder der Nizam noch der Rat werden überhaupt bemerken, was geschehen ist."
 PRF_extend_the_temple_entry_proclamation: "Verlängerung der Erklärung zum Tempeleintritt"
 PRF_extend_the_temple_entry_proclamation_desc: "Trotz des Widerstands einiger hochmütiger Eliten, die jeglichen Fortschritt, egal in welchem Ausmaß, ablehnen, ist die von Varma erlassene Erklärung zum Tempeleintritt eine der beliebtesten Maßnahmen, die der Rat seit Jahren ergriffen hat. Da der Rat voll und ganz hinter dieser Maßnahme steht und der Nizam kaum noch in der Lage ist, Einwände zu erheben, sollte sie auf Bundesebene ausgeweitet werden, was der Regierung einen dringend benötigten Popularitätsschub verschaffen würde."
 PRF_finalise_kongunadu_dam_projects: "Fertigstellung der Kongunadu-Staudammprojekte"
 PRF_finalise_kongunadu_dam_projects_desc: "Vor der Revolution wurden in Südindien zahlreiche große Wasserkraftprojekte in Angriff genommen, darunter vor allem der Krishna-Raja-Sagara-Staudamm am Kaveri. Die Revolution und die darauf folgenden finanziellen Schwierigkeiten führten dazu, dass diese Projekte aufgegeben wurden. Da wir uns nun jedoch in einer deutlich besseren Lage befinden, wäre es ein Leichtes, sie fertigzustellen und so den Landwirten der Region Bewässerungswasser sowie den wachsenden städtischen Zentren in Mysore eine beträchtliche Menge an Strom zur Verfügung zu stellen."
 PRF_the_canal_campaign: "Die Kanal-Kampagne"
 PRF_the_canal_campaign_desc: "Indien ist reich an Gewässern, die vom kleinsten Gebirgsbach bis zum mächtigen Ganges reichen, doch große Teile des Landes leiden dennoch unter Dürren. Ein solches Problem lässt sich leicht durch eine Reihe umfangreicher öffentlicher Bauvorhaben angehen, die darauf abzielen, im ganzen Land Kanäle und Bewässerungsnetze anzulegen, was den Landwirten des Landes erheblich helfen dürfte."
 PRF_establish_the_fact_plant: "Errichtung des FACT-Werks"
 PRF_establish_the_fact_plant_desc: "Düngemittel und Chemikalien Travancore, oder wie viele der an der Planung Beteiligten sie inzwischen einfach \"FACT\" nennen, soll eine große Fabrik werden, die im Bundesstaat Travancore errichtet und von Varma selbst unterstützt wird. Mit dieser Fabrik werden wir in der Lage sein, große Mengen an Ammoniumsulfat und anderen modernen Düngemitteln zu produzieren, was hoffentlich sowohl die Ernteerträge deutlich steigern als auch uns vor Ernteausfällen und Hungersnöten schützen wird."
 PRF_sponsoring_education_institutions: "Förderung von Bildungseinrichtungen"
 PRF_sponsoring_education_institutions_desc: "Trotz der Revolution sind viele hervorragende Universitäten im ganzen Land weiterhin voll funktionsfähig, auch wenn vielen von ihnen die notwendigen finanziellen Mittel fehlen, um weiter zu expandieren oder auch nur die durch jahrelange Kämpfe entstandenen Sachschäden zu beheben. Eine Aufstockung der staatlichen Mittel für diese Einrichtungen zur Behebung dieser Mängel wird sich langfristig erheblich auszahlen, da Wissen zu den mächtigsten Dingen gehört, die wir besitzen können."
 PRF_cementing_the_diwanship: "Festigung des Diwan-Amtes"
 PRF_cementing_the_diwanship_desc: "Iyers Ernennung zum Diwan anstelle des Kandidaten der Mahasabha lässt sich mit vielen Worten beschreiben, aber \"unumstritten\" gehört sicherlich nicht dazu. Nicht nur diese, sondern auch die vielen kleineren Parteien, darunter die Justice Party von Madras oder die Unionisten aus dem Punjab, für sich zu gewinnen, wird sicherlich eine schwierige Aufgabe sein; dabei müssen viele Gefälligkeiten eingetauscht und persönliche Beziehungen voll ausgeschöpft werden. Wenn eine solche Aufgabe tatsächlich machbar ist, gibt es keinen Mann, der dafür besser geeignet wäre als Iyer."
 PRF_reforming_the_electorates: "Reform der Wahlkreise"
 PRF_reforming_the_electorates_desc: "Das in der Föderation hastig zusammengeschusterte Wahlsystem kann kaum als perfekt bezeichnet werden, da das von ihr übernommene Madrasi-System viele Mängel aufweist, die von den Briten zu ihrem eigenen Vorteil und dem ihrer Unterstützer eingebaut wurden. Es müssen große Anstrengungen unternommen werden, um dieses System zu reformieren und sicherzustellen, dass alle Bürger des Landes Gehör finden, ohne einfach von den Lautesten unter ihnen übertönt zu werden."
 PRF_subverting_the_council: "Den Rat untergraben"
 PRF_subverting_the_council_desc: "Die Vorstellung von den Vier Großen ist fest in der Opposition gegen Osman verwurzelt, und da seine Tyrannei nun weiter eingedämmt wurde, lässt sich ihre Fassade der Einheit leicht zum Einsturz bringen. Mit den richtigen Worten, vertraulichen Gesprächen und geheimen Absprachen dürfte es ein Leichtes sein, genügend Ratsmitglieder für sich zu gewinnen, um etwas zu erreichen."
 PRF_princely_patronage: "Fürstliche Schirmherrschaft"
 PRF_princely_patronage_desc: "Menschen handeln selten gegen ihre eigenen Interessen; selbst der verblendetste Fürst ändert oft seine Meinung, wenn sich die Dinge zu seinen Gunsten entwickeln. Mit genügend Schmiergeld lässt sich sogar der mächtige Nizam dazu bringen, alles zu tun, was man will, und da Iyer jeden einzelnen Mann im Rat so gut kennt, ist er in der perfekten Lage, diese Schwäche auszunutzen."
 PRF_reshaping_the_governorships: "Neugestaltung der Gouverneursämter"
 PRF_reshaping_the_governorships_desc: "Als eine Art Erbe der britischen Herrschaft – zumindest ein nützliches Erbe – wurden die kleineren Fürstentümer der Föderation oft zu Verwaltungseinheiten zusammengefasst, um ihre Belange leichter regeln zu können. Diese Regierungsbezirke sind zwar nach wie vor fest an die britische Verwaltungsstruktur angelehnt, lassen sich jedoch mit etwas Weitsicht leicht so umgestalten, dass sie den Interessen der Bundesregierung wesentlich stärker dienen."
 PRF_the_sovereign_statesman: "Der souveräne Staatsmann"
 PRF_the_sovereign_statesman_desc: "Während sowohl der Nizam als auch die Großen Vier sich selbst als Sieger in ihrem Konflikt gegeneinander sehen, ist der einzige Mann, der tatsächlich als Gewinner betrachtet werden kann, kein anderer als Iyer, ein Ergebnis, das von Anfang an so geplant war. Der Nizam mag glauben, er habe eine nützliche Marionette, und die Fürsten mögen denken, sie hätten noch immer das Sagen, doch letztendlich ist der einzige Souverän der Föderation ihr \"pflichtbewusster\" Diwan."

 PRF_the_spirit_of_andhrodyamam: "Der Geist von Andhrodyamam"
 PRF_the_spirit_of_andhrodyamam_desc: "Die Stimme des indischen Volkes ist endlich erhört worden, und sie hat nach Freiheit und Unabhängigkeit gerufen. Es hat den Mahasabha gewählt, um seinen Willen umzusetzen, und Diwan Rao wird mit aller Kraft dafür kämpfen, dies zu verwirklichen."
 PRF_elevate_the_status_of_madras: "Den Status von Madras anheben"
 PRF_elevate_the_status_of_madras_desc: "Dass Madras trotz seiner Größe und Bedeutung im Rat nicht vertreten ist, ist nichts weniger als eine Farce. Wenn man genügend Gefälligkeiten einfordert und die richtigen Worte findet, lässt sich der Rat hoffentlich davon überzeugen, Madras in die Vollmitgliedschaft aufzunehmen und damit endlich diese Ungerechtigkeit zu beseitigen."
 PRF_absorb_congress_remnants: "Überreste des Kongresses aufnehmen"
 PRF_absorb_congress_remnants_desc: "Der Indische Nationalkongress war keine wirklich sozialistische Organisation, sondern wurde lediglich vom Wind der Revolution mitgerissen und von einigen seiner lautstärksten Mitglieder in die Irre geführt. Es gibt nach wie vor unzählige Menschen, die ihre Werte teilen, nämlich ein unabhängiges und freies Indien, eine Nation, die sich selbst versorgen kann, anstatt von anderen abhängig zu sein, und diesen Menschen soll im Rahmen des Mahasabha eine neue Heimat gewährt werden."
 PRF_linguistical_reorganisation: "Sprachliche Neuordnung"
 PRF_linguistical_reorganisation_desc: "Auch wenn wir alle Inder sind, dürfen wir nicht vergessen, dass wir nach wie vor Telugu, Bengalen, Tamilen und vieles mehr sind. Die Provinzen und die übrigen Bundesstaaten des Landes sollten diese inneren Unterschiede widerspiegeln, anstatt sie zu übermalen, wie es die Briten taten, damit sie als gleichberechtigte Aspekte der indischen Kultur gedeihen können, anstatt durch die Vorherrschaft des Hindi unterdrückt zu werden."
 PRF_restrict_the_vettichakiri: "Einschränkung des Vettichakiri"
 PRF_restrict_the_vettichakiri_desc: "Das Vettichakiri-System der Zwangsarbeit ist eines der barbarischsten Überbleibsel einer vergangenen Ära in diesem Land, und die Doras, die es durchsetzen, sind nicht besser als die schlimmsten Kriminellen der Unterwelt. Seine vollständige Abschaffung muss so schnell wie möglich angestrebt werden, auch wenn kurzfristig Kompromisse mit denjenigen geschlossen werden müssen, die es praktizieren."
 PRF_prioritise_rural_growth: "Priorität für das Wachstum im ländlichen Raum"
 PRF_prioritise_rural_growth_desc: "Die ländlichen Gebiete des Landes sind wahrhaftig sein Herz und seine Seele, denn niemand ist wahrhaftiger Inder als ein bescheidener Landwirt, der sich und seine Familie selbst versorgt. Diese Menschen gehören jedoch nach wie vor zu den schutzbedürftigsten im Land und werden leicht zurückgelassen, während die großen städtischen Gebiete große Fortschritte machen. Wir müssen sicherstellen, dass dies nicht geschieht und dass unsere ländliche Bevölkerung genauso profitiert wie die Menschen in den Städten."
 PRF_protecting_the_rights_of_dalits: "Schutz der Rechte der Dalits"
 PRF_protecting_the_rights_of_dalits_desc: "Es ist barbarisch zu glauben, dass Menschen aufgrund ihrer Kastenzugehörigkeit nicht einmal gemeinsam mit anderen Menschen auf der Straße gehen oder in Gegenwart ihrer sogenannten Herrscher Schuhe tragen dürfen. Wir müssen umfassende Schutzmaßnahmen für diese Dalits, Adivasi und alle anderen benachteiligten Bevölkerungsgruppen einführen, um diese Diskriminierung zu bekämpfen."
 PRF_subsidise_indian_business: "Förderung indischer Unternehmen"
 PRF_subsidise_indian_business_desc: "Trotz früherer staatlicher Unterstützung hinken die Unternehmen der nun vereinigten Nation ihren Pendants weltweit immer noch hinterher. Das darf nicht so bleiben, und es sollten weitere Subventionen gewährt werden, um sicherzustellen, dass sie schließlich an die Weltspitze aufsteigen."
 PRF_strengthen_the_industrial_centres: "Stärkung der Industriezentren"
 PRF_strengthen_the_industrial_centres_desc: "Auch wenn sie im Laufe mehrerer Kriege Schaden genommen haben, sind die Industriezentren des Landes wie Ahmadabad nach wie vor unsere größte Chance auf langfristiges Wachstum. Sie nicht nur wieder auf ihren früheren Stand zu bringen, sondern sogar noch darüber hinaus zu heben, sollte eine der höchsten Prioritäten der Regierung sein."
 PRF_fund_local_language_libraries: "Finanzierung von Bibliotheken in lokalen Sprachen"
 PRF_fund_local_language_libraries_desc: "Fast alle, die Englisch oder Hindi sprechen, können sich nicht vorstellen, dass man eine Bibliothek betreten und kein einziges Buch in den Regalen verstehen könnte. Für Millionen Menschen im ganzen Land ist dies jedoch seit jeher eine Tatsache des Lebens, und sie wurden dazu gezwungen, stattdessen diese aufgezwungenen Sprachen zu lernen. Wir werden dies nicht länger hinnehmen und die Einrichtung neuer Bibliotheken in lokalen Sprachen im ganzen Land finanziell unterstützen, damit jeder die Möglichkeit zum Lesen erhält."
 PRF_support_the_navjeevan_mandali: "Unterstützen Sie das Navjeevan Mandali"
 PRF_support_the_navjeevan_mandali_desc: "Das Mahila Navjeevan Mandali ist seit Jahren der Frauenflügel der Mahasabha und hat dazu beigetragen, das Leben vieler Frauen in unserem Land erheblich zu verbessern. Ihre Bemühungen sind höchst lobenswert, und da die Partei nun die Regierung stellt, sollten ihren führenden Mitgliedern wichtige Positionen übertragen werden, die der Förderung der indischen Frauen dienen."

 PRF_controlling_the_rivers: "Kontrolle über die Flüsse"
 PRF_controlling_the_rivers_desc: "Die nördlichen Gebiete des Dekkan werden nicht nur durch gewaltige Gebirge, sondern auch durch die mächtigen Flüsse, die sich ihren Weg durch das Land bahnen, vor Eindringlingen von außen geschützt. Die Sicherung der Kontrolle über diese Flüsse durch regelmäßige Marinepatrouillen ist von entscheidender Bedeutung, um sicherzustellen, dass unsere Feinde sie nicht durchqueren können."
 PRF_strikes_from_the_sky: "Schläge aus der Luft"
 PRF_strikes_from_the_sky_desc: "Der Aufbau einer ordentlichen Marine ist eines der kostspieligsten Unterfangen, die ein Staat in Angriff nehmen kann. Ein gutes Schiff kann einen Staat Millionen kosten, nur um es einsatzbereit zu machen – und dabei sind die laufenden Betriebskosten noch nicht einmal mit eingerechnet. Für diese Schiffbauer ist es eine echte Schande, dass ein einfaches Flugzeug, das zu einem Bruchteil der Kosten hergestellt wird, selbst das größte Schlachtschiff mit einem präzise genug ausgeführten Angriff komplett zum Sinken bringen kann, und wir werden uns dies zunutze machen, um gleiche Wettbewerbsbedingungen zu schaffen."
 PRF_found_the_federal_marine_force: "Gründung der Bundesmarine"
 PRF_found_the_federal_marine_force_desc: "Es scheint fast sicher, dass [PRF_GetCountryTitle] eines Tages eine amphibische Kampftruppe benötigen wird, insbesondere angesichts der vielen Inseln im Indischen Ozean, die in unseren Einflussbereich fallen. Wir sollten der Entwicklung vorgreifen und die Aufstellung einer solchen Truppe so bald wie möglich anordnen."
 PRF_fund_mass_dockyard_expansions: "Finanzierung umfangreicher Werft-Erweiterungen"
 PRF_fund_mass_dockyard_expansions_desc: "Die Infrastruktur für den Schiffbau in Indien als erbärmlich zu bezeichnen, wäre noch zu milde ausgedrückt. In ganz [PRF_GetCountryTitle] gibt es nur wenige Einrichtungen, die in der Lage sind, etwas zu produzieren, das auch nur annähernd einem Kriegsschiff ähnelt, und die Behebung dieses Mangels muss oberste Priorität haben, wenn wir eine eigene Marine aufbauen wollen."
 PRF_conquest_of_the_beaches: "Eroberung der Strände"
 PRF_conquest_of_the_beaches_desc: "Die Landung an einer Küste ist mit der richtigen Ausrüstung eine relativ einfache Aufgabe, aber die Landung tatsächlich zu überleben und dann sogar noch daraus Kapital zu schlagen? Das ist der schwierige Teil. Wir müssen sicherstellen, dass unsere Männer mit Hilfe ausländischer Berater ordnungsgemäß ausgebildet werden, damit wir sie nicht einfach in den Tod schicken, sobald sie den Strand betreten."
 PRF_ambitious_navy: "Ehrgeizige Marine-Schwerpunkt"
 PRF_ambitious_navy_desc: "Was die Kritiker auch sagen mögen, selbst mit unserer begrenzten Infrastruktur werden wir die großartigste Marine aufbauen, die die Welt je gesehen hat! Bald wird kein Schiff mehr irgendwo im Indischen Ozean auslaufen, ohne dass die Bundesmarine dies genehmigt, und jeder, der anders denkt, wird die volle Macht unserer Flotte zu spüren bekommen."
 PRF_defend_coast: "Verteidigt unsere Gewässer"
 PRF_defend_coast_desc: "Auch wenn eine große Marine ein großer Grund zum Stolz für die Nation wäre, können wir nicht Millionen ausgeben, nur um unseren Hochmut zu befriedigen, sondern müssen logisch denken. Der Nation ist mit einer kleinen Streitmacht viel besser gedient, die der Verteidigung unserer Küsten Vorrang einräumt und unsere Verbindungen zur Außenwelt vor feindlichen Angreifern schützt."
 PRF_restoring_facilities_from_the_reclaimed_lands: "Wiederherstellung der Anlagen auf den zurückgewonnenen Gebieten"
 PRF_restoring_facilities_from_the_reclaimed_lands_desc: "Da der Rest Indiens nun vollständig unter unserer Kontrolle steht, bietet sich uns die perfekte Gelegenheit, unsere Marineinfrastruktur weiter auszubauen. Viele der Anlagen auf den zurückgewonnenen Gebieten wurden durch den Krieg beschädigt, sind jedoch nach wie vor bis zum Rand mit nützlichen Werkzeugen und Ausrüstung gefüllt, die sich leicht wiederherstellen oder umfunktionieren lassen und uns einen großen Vorsprung bei der weiteren Produktion verschaffen."
 PRF_commission_a_cruiser_fleet: "Kreuzerflotte in Auftrag geben"
 PRF_commission_a_cruiser_fleet_desc: "Kreuzer nehmen unter den Kriegsschiffen eine ideale Mittelposition ein: Es handelt sich um stattliche Schiffe, die selbst die bescheidenen Zerstörer in den Schatten stellen, deren Kosten jedoch bei weitem nicht an die von großen Schlachtschiffen oder Flugzeugträgern heranreichen. Der Auftrag zum Bau einer kompletten Flotte dieser Schiffe unter Einsatz moderner Fertigungstechniken wird der Bundesmarine große Vorteile bringen."
 PRF_divert_funding_to_the_navy: "Mittel für die Marine umschichten"
 PRF_divert_funding_to_the_navy_desc: "Auch wenn wir vielleicht nicht über das Budget verfügen, um alle Ausgaben zu decken und eine riesige Marine zu finanzieren, wer sagt denn, dass wir tatsächlich alle Ausgaben decken müssen? Es gibt viele Bereiche, die Bundesmittel erhalten, bei denen man einfach für ein Jahr oder so Kürzungen vornehmen kann, und diese Mittel können stattdessen in den weiteren Bau von Schlachtschiffen fließen."
 PRF_regular_fleet_exercises: "Regelmäßige Flottenübungen"
 PRF_regular_fleet_exercises_desc: "Es ist sinnlos, so viel Geld für eine große Marine auszugeben, wenn die Männer am Ruder nicht einmal die Grundlagen der Schiffsführung beherrschen. Die Flotte muss, sofern sie nicht im Einsatz ist, so oft wie möglich trainiert werden, um sicherzustellen, dass unsere Matrosen jeden Zentimeter ihres Schiffes kennen, wobei jeder, der hinter unseren Standards zurückbleibt, mit Strafen zu rechnen hat."
 PRF_furthering_destroyer_technology: "Weiterentwicklung der Zerstörer-Technologie"
 PRF_furthering_destroyer_technology_desc: "Heutzutage könnte jeder, der sich mit dem Bau von Schiffen auskennt, im Handumdrehen einen Zerstörer zusammenbasteln, und so wurde fast jedes U-Boot unter diesem 0,konstruiert. Wenn wir unsere Konvois gegen diese Unterwasserbedrohung verteidigen wollen, benötigen wir weitaus modernere und spezialisiertere Schiffe, die dieser Herausforderung gewachsen sind"
 PRF_furthering_maritime_exports: "Förderung der Seeexporte"
 PRF_furthering_maritime_exports_desc: "Wir können nicht so tun, als sei der Seehandel nicht von entscheidender Bedeutung für die Zukunft der Nation, auch wenn ein Großteil der Bevölkerung die Überquerung des Kala Pani als Tabu betrachtet. Diejenigen, die bereit sind, sich auf Seereisen zu begeben, sollten in unserer Handelsmarine beschäftigt werden, um so viele Import- und Exportgüter wie möglich zu befördern."
 PRF_improving_our_depth_charges: "Verbesserung unserer Wasserbomben"
 PRF_improving_our_depth_charges_desc: "Ein U-Boot mag zwar verwundbar sein, wenn es auftaucht, aber wir können nicht garantieren, dass wir es jedes Mal erwischen, wenn dies geschieht. Eine Verbesserung der Durchschlagskraft unserer Wasserbomben und eine Erhöhung ihrer Sinkgeschwindigkeit sollten dazu beitragen, dass mehr U-Boote zerstört werden und unsere Konvois sicherer unterwegs sind."

 PRF_deccan_air_school: "Die Deccan Flugschule"
 PRF_deccan_air_school_desc: "Die Deccan Flugschule wurde in Hyderabad gegründet, um unsere Luftwaffe in den kurzen Zwischenkriegsjahren auf den neuesten Stand zu bringen. Wir müssen weiterhin in unsere Piloten investieren, damit wir nicht den Anschluss verlieren."
 PRF_develop_air_industry: "Gründung des Deccan Luftfahrt-Konsortiums"
 PRF_develop_air_industry_desc: "Es fehlt uns jegliche inländische Luftfahrtindustrie. Um mit unseren Rivalen im Norden konkurrieren zu können, müssen wir die Interessen der Wirtschaft in einem koordinierten Konsortium bündeln, um die Produktion aufzunehmen."
 PRF_foreign_instructors: "Ausländische Fluglehrer"
 PRF_foreign_instructors_desc: "Zwar gibt es in der Luftwaffe von [PRF_GetCountryTitle] einige im Ausland ausgebildete Offiziere, doch werden wir mehr ausländische Ausbilder an der Deccan Air School benötigen, wenn wir eine ganze Generation neuer Piloten ausbilden wollen. Es ist an der Zeit, dass wir uns in Sachen Fachwissen an Deutschland und Japan orientieren."
 PRF_air_fields: "Frontstützpunkte der Luftwaffe"
 PRF_air_fields_desc: "Im unvermeidlichen Kampf um Indiens Schicksal wird es entscheidend sein, dass unsere Luftwaffe über Stützpunkte verfügt, die nah genug am Feind liegen, um ihn angreifen zu können."
 PRF_air_research_council: "Gründung des Luftfahrtforschungsrats"
 PRF_air_research_council_desc: "Es reicht nicht aus, die Luftwaffe von [PRF_GetCountryTitle] auf den neuesten Stand zu bringen. Um den Subkontinent zu beherrschen, müssen wir einen Expertenrat ins Leben rufen, der unsere Luftwaffe in die Zukunft führt."
 PRF_joint_officer_exercises: "Gemeinsame Offiziersübungen"
 PRF_joint_officer_exercises_desc: "Viele unserer Offiziere betonen, dass die Luftwaffe eine entscheidende unterstützende Rolle für unsere Bodentruppen spielen wird. Wir sollten einige gemeinsame Übungen von Heer und Luftwaffe durchführen, um die Zusammenarbeit zu verbessern."
 PRF_forward_air_defenses: "Luftabwehr aufbauen"
 PRF_forward_air_defenses_desc: "Wir sind nicht der einzige Staat auf dem Subkontinent, der in eine Luftwaffe investiert. Um uns auf den bedauerlichen Fall von Bombenangriffen auf unsere Großstädte vorzubereiten, müssen wir Luftabwehrsysteme entwickeln."
 PRF_bomber_focus: "Luftkanonen"
 PRF_bomber_focus_desc: "Um die großen Städte des Nordens zu belagern, benötigen wir neue Luftkanonen. Furchterregende neue Bomben haben bereits verheerende Auswirkungen gezeigt."
 PRF_flying_cavalry: "Fliegende Huzurat"
 PRF_flying_cavalry_desc: "Die Elite-Kavallerie der Huzurat der Maratha-Armee versetzte einst den gesamten Subkontinent in Angst und Schrecken. Unsere Piloten werden ihr Erbe wiederbeleben."
 PRF_princes_of_the_air: "Fürsten der Lüfte"
 PRF_princes_of_the_air_desc: "Im Zuge des Ausbaus unserer Luftwaffe haben sich viele Piloten als etwas Besonderes erwiesen. Mit waghalsigen Heldentaten und knappen Entkommen haben sich diese Fürsten der Lüfte als unverzichtbar für unsere Kriegsanstrengungen erwiesen. Wir sollten ihre Beförderung fördern und in sie investieren."
 PRF_aeronautics_council: "Das Deccan Luftfahrt-Konsortium"
 PRF_aeronautics_council_desc: "Das Deccan Luftfahrt-Konsortium ist ein Zusammenschluss von Luftfahrtunternehmen, der gegründet wurde, um den Aufbau der Bundesluftwaffe zu unterstützen."
 PRF_princes_of_the_air_idea: "Fürsten der Lüfte"
 PRF_princes_of_the_air_idea_desc: "Dank erstklassiger Anleitung hat [PRF.GetNameDef] die Ausbildungs-, Produktions- und Forschungskapazitäten der Bundesluftwaffe ausgebaut. Die neuen Fürsten der Lüfte werden den Himmel über dem gesamten Subkontinent beherrschen."

 PRF_our_own_sphere: "Unsere eigene Sphäre"
 PRF_our_own_sphere_desc: "Indien hat sich sowohl vom Joch Britanniens als auch vom Sozialismus befreit, warum sollte es sich also ein neues Joch suchen, unter das es sich beugen muss? Es ist an der Zeit, stattdessen unser eigenes Bündnis zu schmieden, eines, das einer Nation wie der unseren angemessen ist, die doch zu Großem bestimmt ist!"
 PRF_join_the_world_stage: "Auf die Weltbühne treten"
 PRF_join_the_world_stage_desc: "Auch wenn wir vielleicht den Ehrgeiz hegen, eines Tages einen eigenen großen Einflussbereich zu führen, müssen wir doch die Realität anerkennen, dass eine Isolierung von den Großmächten der übrigen Welt nichts anderes wäre als Sabotage, getarnt als Prahlerei. Stattdessen sollten wir uns einer der großen Weltmächte anschließen, die uns bei der Vereinigung des Subkontinents unterstützt haben, zumindest so lange, bis wir in ferner Zukunft unseren eigenen Weg gehen können."
 PRF_bhutan: "Deal with Bhutan"
 PRF_bhutan_desc: "With our control over the India Subcontinent secure, it is time to look to our northern border. New great powers are rising in China, and we must secure our control over the Bhutanese kingdom as a buffer state in the Himalayas. They will act as the shield against Chinese incursions, whether they like it or not."
 PRF_nepal_claims: "Deal with Nepal"
 PRF_nepal_claims_desc: "Nepal expanded into the Indian lowlands in the chaos following the Weltkrieg. It is time to reassert our domain over those territories."
 PRF_fate_of_the_frontier: "$RAJ_fate_of_the_frontier$"
 PRF_fate_of_the_frontier_desc: "$RAJ_fate_of_the_frontier_desc$"
 PRF_claim_ceylon: "Claim Ceylon"
 PRF_claim_ceylon_desc: "By rights, Ceylon, the Maldives, and the other Indian Ocean islands are part of our nation's rightful territory. Their colonialism must come to an end."
 PRF_incorporate_burma: "Incorporate Burma"
 PRF_incorporate_burma_desc: "Now that the colonial and socialist threat has been crushed we can look beyond our current borders with the future in mind. While distinct from the rest of India in history and culture, Burma, too was under British rule, and lies within our natural sphere of influence. The time has come to incorporate it into our expanding realm."
 PRF_claim_goa: "Claim Goa"
 PRF_claim_goa_desc: "The enclave of Goa is nothing more than a burr on the side of our proud nation. It is rightfully our territory, and must be returned."
 PRF_claim_pondicherry: "Claim Pondicherry"
 PRF_claim_pondicherry_desc: "The enclave of Pondicherry is nothing more than a burr on the side of our proud nation. It is rightfully our territory, and must be returned."
 PRF_incorporate_siam: "The Burmese Territories in Siam"
 PRF_incorporate_siam_desc: "The Siamese Kingdom was one of the more opportunistic of the 'Vulture States' that exploited the disorder of the Raj's demise. With the young Burmese nation hard-pressed by the socialist uprisings in Assam and Bengal, the government of Siam simply occupied several districts and prefectures, including the city of Moulmein - mentioned in Kipling's famous poem. These lands must be returned!"
 PRF_tibet: "$HND_liberating_the_frontier_tracts$"
 PRF_tibet_desc: "$HND_liberating_the_frontier_tracts_desc$"
 PRF_aksai_chin: "$HND_restoring_the_unity_of_kashmir$"
 PRF_aksai_chin_desc: "$HND_restoring_the_unity_of_kashmir_desc$"

