### World Tension ###
italian_wars_threat: "Italienischer Bürgerkrieg"

### Ideas ###
italy_balance_idea: "Das prekäre Gleichgewicht"
italy_balance_idea_desc: "Derzeit befindet sich Italien in einer unangenehmen Zwickmühle zwischen den Großmächten Europas. Jede der verschiedenen Regierungen hat ausländische Unterstützer, die potenziell in einen erneuten italienischen Bürgerkrieg eingreifen könnten – doch all diese Unterstützer sind sich bewusst, dass ein solches Vorgehen ihre Rivalen provozieren und die Gefahr bergen würde, den gesamten Kontinent in einen Konflikt hineinzuziehen. Ihre gegenseitige Zurückhaltung, dieses Risiko einzugehen, hat dazu beigetragen, dass die Spaltung der Halbinsel fortbesteht.\n\nDieses Kräftegleichgewicht besteht fort: Bislang wurde jede ausländische Hilfe für Italien auf Distanz gehalten und beschränkte sich auf materielle Unterstützung und Fachwissen. Solange kein Staat direkt in einen italienischen Konflikt eingreift, wird dies auch so bleiben. Sollte sich jedoch ein ausländisches Bündnis in einen solchen Krieg einmischen, sind alle Wetten ungültig – und es ist zu erwarten, dass alle anderen Unterstützer nachziehen werden."

