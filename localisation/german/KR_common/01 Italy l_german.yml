### Decisions ###
italy_foreign_policy_decisions: "Außenpolitik"
italy_foreign_policy_decisions_desc: "Es ist von entscheidender Bedeutung, dass wir unseren Blick nach außen richten und Bündnisse schließen und/oder Beziehungen zu anderen Nationen aufbauen, um unsere Position auf der Weltbühne zu festigen."
ITA_claim_libya: "Anspruch auf Libyen"
ITA_claim_libya_desc: "Bis zur Niederlage Italiens im Weltkrieg, durch die unsere libysche Kolonie wieder unter osmanische Herrschaft fiel, war sie unsere wichtigste Kolonie – eher eine Erweiterung Italiens selbst als ein weit entfernter Besitz. Wir hatten große Pläne für die Region. Nun, da unsere Nation wiederhergestellt ist, ist die Zeit gekommen, das einzufordern, was uns rechtmäßig zusteht."
ITA_war_for_libya: "[From.GetNameDef] den Krieg erklären"
ITA_war_for_libya_desc: "Es ist an der Zeit, Libyen zurückzuerobern, und das bedeutet einen Krieg gegen [From.GetNameDef], um dieses Ziel zu erreichen. Viva l'Italia!"
ITA_demand_libya: "Fordert Libyen"
ITA_demand_libya_desc: "[From.GetNameDefCap] ist der derzeitige Herrscher über unser libysches Territorium, und es ist an der Zeit, von ihm die Rückgabe an uns zu fordern... andernfalls bedeutet das Krieg, genau wie im Jahr 1912."

italy_risorgimento_decisions: "Risorgimento"
italy_risorgimento_decisions_desc: "Seit dem italienischen Bürgerkrieg von 1920 ist Italien gespalten. Monarchisten, Sozialisten, Republikaner und Exilanten starren sich hinter ihren Befestigungsanlagen feindselig an. Angesichts dieser Spaltung sind sich nur wenige sicher, dass Italien bald wieder vereint sein wird. So Gott will, werden wir jedoch bald alle Italiener in einem neuen Risorgimento vereinen, wie es Cavour und die Savoyer vor siebzig Jahren getan haben."
ITA_claim_ticino: "Irredentistischen Anspruch auf Tessin geltend machen"
ITA_claim_ticino_desc: "Tessin ist eine Region der Schweiz, die überwiegend von Italienern bewohnt wird, und es liegt in unserem Interesse, einen dauerhafteren Anspruch auf diese Region zu erheben."
ITA_claim_nice: "Irredentistische Anspruch auf Nizza geltend machen"
ITA_claim_nice_desc: "Nizza, das 1860 von Frankreich annektiert wurde, gehört eigentlich zum italienischen Hoheitsgebiet, und es liegt in unserem Interesse, einen dauerhafteren Anspruch auf diese Region geltend zu machen."
ITA_claim_savoy: "Irredentistische Anspruch auf Savoyen geltend machen"
ITA_claim_savoy_desc: "Das 1860 von Frankreich annektierte Savoyen gehört eigentlich zum italienischen Herrschaftsgebiet, und es liegt in unserem Interesse, einen dauerhafteren Anspruch auf diese Region zu erheben."
ITA_claim_upper_savoy: "Irredentistische Anspruch auf Ober-Savoyen geltend machen"
ITA_claim_upper_savoy_desc: "Ober-Savoyen, das 1860 von Frankreich annektiert wurde, gehört eigentlich zum italienischen Herrschaftsgebiet, und es liegt in unserem Interesse, einen dauerhafteren Anspruch auf diese Region zu erheben."
ITA_claim_trentino: "Irredentistische Anspruch auf Trentino geltend machen"
ITA_claim_trentino_desc: "Trentino, das einst zu Italien gehörte, ging nach den Napoleonischen Kriegen an die Österreicher über, und es liegt in unserem Interesse, einen dauerhafteren Anspruch auf diese Region zu erheben."
ITA_claim_southern_tyrol: "Irredentistische Anspruch auf Südtirol geltend machen"
ITA_claim_southern_tyrol_desc: "Auch wenn unser Anspruch auf dieses Gebiet nur schwach begründet ist, ist Südtirol doch eine Erweiterung von Trentino und gehörte einst zum Römischen Reich. Es liegt in unserem Interesse, einen dauerhafteren Anspruch auf diese Region zu begründen."
ITA_claim_trieste: "Irredentistische Anspruch auf Triest geltend machen"
ITA_claim_trieste_desc: "Triest, das lange Zeit unter der Herrschaft des Österreichischen Kaiserreichs stand, ist nach wie vor rechtmäßiges italienisches Hoheitsgebiet, und es liegt in unserem Interesse, einen dauerhafteren Anspruch auf diese Region zu erheben."
ITA_claim_gorizia: "Irredentistische Anspruch auf Gorizia geltend machen"
ITA_claim_gorizia_desc: "Gorizia, das einst zum Herrschaftsgebiet Venedigs gehörte, ist eindeutig italienisches Territorium, und es liegt in unserem Interesse, einen dauerhafteren Anspruch auf diese Region geltend zu machen."
ITA_claim_istria: "Irredentistische Anspruch auf Istrien geltend machen"
ITA_claim_istria_desc: "Istrien, das einst zum Herrschaftsgebiet Venedigs gehörte, ist eigentlich italienisches Territorium, und es liegt in unserem Interesse, einen dauerhafteren Anspruch auf diese Region geltend zu machen."
ITA_claim_dalmatia: "Irredentistische Anspruch auf die dalmatinische Küste geltend machen"
ITA_claim_dalmatia_desc: "Die dalmatinische Küste, die einst zum Herrschaftsgebiet Venedigs gehörte, ist eigentlich italienisches Territorium, und es liegt in unserem Interesse, einen dauerhafteren Anspruch auf diese Region geltend zu machen."
ITA_claim_cattaro: "Irredentistische Anspruch auf den Hafen von Cattaro geltend machen"
ITA_claim_cattaro_desc: "Der Hafen von Cattaro, der einst zum Herrschaftsgebiet Venedigs gehörte, ist rechtlich gesehen italienisches Territorium, und es liegt in unserem Interesse, einen dauerhafteren Anspruch auf diese Region geltend zu machen."
ITA_claim_fiume: "Irredentistische Anspruch auf Fiume geltend machen"
ITA_claim_fiume_desc: "Fiume, das einst zum Herrschaftsgebiet Venedigs gehörte, ist rechtlich gesehen italienisches Territorium, und es liegt in unserem Interesse, einen dauerhafteren Anspruch auf diese Region geltend zu machen."
ITA_claim_malta: "Irredentistische Anspruch auf Malta geltend machen"
ITA_claim_malta_desc: "Die Insel Malta ist ein fester Bestandteil Italiens, und es liegt in unserem Interesse, einen dauerhafteren Anspruch auf diese Region zu erlangen."
ITA_claim_corsica: "Irredentistische Anspruch auf Korsika geltend machen"
ITA_claim_corsica_desc: "Korsika, das einst zum Herrschaftsgebiet Genuas gehörte, ist eigentlich italienisches Territorium, und es liegt in unserem Interesse, einen dauerhafteren Anspruch auf diese Region geltend zu machen."

