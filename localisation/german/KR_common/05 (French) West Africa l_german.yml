 MRT_national_populist: "Imamat von Bilad Chinqit"
 MRT_national_populist_ADJ: "Chinguetti"
 MRT_national_populist_DEF: "das Imamat von Bilad Chinqit"

 ### Characters ###
 MRT_horma_ould_babana: "Horma Ould Babana"
 MRT_horma_ould_babana_leader_desc: "§YGeboren:§! §L1. März 1912, in Mederdra, Kolonie Mauretanien§!\n§YHintergrund:§! §LHorma Ould Babana wurde in Mederdra, im Herrschaftsgebiet von Trarza, geboren und erhielt eine klassische religiöse Ausbildung im Koran. Da er jedoch ehrgeizig war, strebte er eine französische Ausbildung an den Kolonialschulen der Kolonie Mauretanien an und besuchte die Schule für Söhne von Notabeln in Boutilimit. Nach Abschluss seines Studiums im Jahr 1934 wurde er Lehrer an seiner ehemaligen Schule und unterrichtete die Söhne der Adligen der Kolonie – darunter auch die Söhne des Emirs von Tagant und des Emirs von Trarza.\n\nAus einer Vielzahl von Gründen scheiterte seine Laufbahn jedoch, was ihn dazu veranlasste, berufswechseln und als Dolmetscher zu arbeiten, was er vor allem seinen Kenntnissen in Arabisch und Französisch zu verdanken hatte. Er zog jedoch sehr schnell den Zorn der französischen Kolonialbeamten auf sich, da er bereit war, sich mit ihnen anzulegen, um seine Landsleute vor französischen Schikanen zu schützen. Bald darauf wurde er entlassen, genoss jedoch im westlichen Teil der Kolonie einen fast heroischen Ruf. All dies weckte die Aufmerksamkeit der Kommunarden, die – in dem Bestreben, die Regierung in Algier zu schwächen – seinen lokalen Heldentum unterstützten und seine Bildung durch weitere sozialistische Literatur erweiterten.\n\nMit dem Zusammenbruch der französischen Herrschaft und der Kolonie Mauretanien hat Horma Ould Babana genügend Unterstützung in der Bevölkerung gewonnen, um seine Herrschaft über die ehemalige Kolonie zu sichern. Vorbei sind die Tage eines zersplitterten \"Bilad Chinqit\" – des Landes von Chinguetti. Heute erhebt sich Mauretanien zu einer roten Morgendämmerung.§!"
 MRT_sidi_el_mokhtar_n_diaye: "Sidi el-Mokhtar N'Diaye"
 MRT_sidi_el_mokhtar_n_diaye_leader_desc: "§YGeboren:§! §L13. September 1916 in Atar, Kolonie Mauretanien§!\n§YHintergrund:§! §LSidi el Moktar Ould Yahya N'Diaye wurde in den Stämmen der Oulad Bousbaa geboren und wuchs in den Marktstädten Tidjikja und Kiffa auf, wo er die Kulturen der Amazigh, der Araber und der Schwarzen des Landes kennenlernte. Während er in diesen Schmelztiegeln aufwuchs, arbeitete sein Vater, Yahya N'Diaye, als Chefdolmetscher in der französischen Kolonie Mauretanien. Zudem war er der Neffe der verstorbenen Königin Ndieumbeut des untergegangenen Königreichs Waalo am Unterlauf des Senegal.\n\nDa er Zugang sowohl zur lokalen als auch zur kolonialen Gesellschaft hatte, erhielt Sidi el-Mokhtar N'Diaye eine klassische religiöse Ausbildung im Koran und besuchte später die Schule für Söhne von Stammesführern in Saint-Louis, Senegal. Dank seiner außergewöhnlichen Bildung trat er in die Fußstapfen seines Vaters und wurde Dolmetscher – später Chefdolmetscher – für die Franzosen, wobei er in den westlichen Dörfern der Kolonie tätig war. Angesichts der ständig ins Wanken geratenen französischen Herrschaft war er sich seiner Bedeutung innerhalb des Staatsgefüges und des stetig wachsenden Nationalbewusstseins unter anderen Amazigh, Arabern und schwarzen \"Mauretaniern\" bewusst – und sei es auch nur, um den Franzosen Widerstand zu leisten.\n\nMit dem Zusammenbruch der französischen Herrschaft und der Kolonie Mauretanien hat sich Sidi el-Mokhtar N’Diaye als eine der führenden Persönlichkeiten im Kampf um die Vereinigung von \"Bilad Chinqit\" – dem Land von Chinguetti – zu Mauretanien herauskristallisiert. Er setzt sich dafür ein, seinem Volk die Demokratie zu bringen und damit das einzuführen, wofür sich die Franzosen einst so lange eingesetzt hatten.§!"
 MRT_ahmed_ould_deid: "Ahmed Ould Deïd"
 MRT_ahmed_ould_deid_leader_desc: "§YGeboren:§! §Lin Trarza, Kolonie Mauretanien§!\n§YHintergrund:§! §LAllein schon der Weg zum Emir von Trarza war für Ahmed Ould Deïd kein leichtes Unterfangen. Im Laufe seines Lebens lernte er sowohl imperialistische Unterdrückung als auch gewalttätige Konflikte zwischen den Stämmen nur allzu gut kennen. Widerstand und Krieg lagen seiner Familie praktisch im Blut, denn sein Bruder war nach jahrzehntelangen Kämpfen nach Marokko geflohen, um den immer weiter vordringenden französischen Behörden zu entkommen – nur um sich dort den unzähligen Reihen der marokkanischen Widerstandskämpfer im Süden anzuschließen.\n\nErst 1910 setzte sich die Realität für Ahmed Ould Deïd endgültig durch, als er sich bereit erklärte, mit den Franzosen Frieden zu schließen, im Austausch für Autonomie innerhalb der Kolonie Mauretanien. Es wurde vereinbart, mit der anfänglichen Bedingung, dass die Macht innerhalb des Emirats zwischen ihm und Ahmed Salem ould Brahim Salem aufgeteilt werden sollte. Nach dem Tod des Letzteren im Jahr 1930 wurde Ahmed Ould Deïd gemäß den Friedensbestimmungen zum alleinigen Emir von Trarza.\n\nUnd nun, mit dem Zusammenbruch der französischen Herrschaft und der Kolonie Mauretanien, ist Ahmed Ould Deïd zum herausragenden Herrscher von \"Bilad Chinqit\", dem Land von Chinguetti, aufgestiegen.§!"
 MRT_mrabih_rabou: "Mrabih Rabou"
 MRT_mrabih_rabou_leader_desc: "§YGeboren:§! §L13. Februar 1881 in Tiris, Rio do Ouro§!\n§YHintergrund:§! §LMohamed Mustafa Mrabih Rabou wurde in den Jahren vor der spanischen Kolonialisierung in den anarchischen Gebieten der Westsahara geboren und wuchs bei dem angesehenen Scheich Ma al-'Aynayn auf – einem Mann, der sich vehement gegen den kolonialen Einfluss Frankreichs und Spaniens wehrte und gleichzeitig mit Unterstützung Marokkos islamische Einrichtungen aufbaute. Nach dem Tod seines Vaters im Jahr 1910 gründete Mrabih Rabou seine erste Zawiya in Aït Baamrane, die als spirituelle Stütze für die Mudschaheddin und als Bastion des Widerstands für ihn und seinen Bruder Ahmed al-Hiba – den sogenannten \"Blauen Sultan\" von Marokko – diente.\n\nNach al-Hibas Tod im Jahr 1919 schworen seine Anhänger Mrabih Rabou die Treue und ernannten ihn zum Emir, Imam und Anführer der Mudschaheddin seines verstorbenen Bruders. Oft führte er sie in die Schlacht und setzte seinen Widerstand gegen die Deutschen bis 1934 fort. Wie so viele vor ihm erlitt auch er eine Niederlage und versuchte, in Tarfaya Zuflucht zu finden. Da die spanischen Behörden jedoch den Mujahideen in Marokko überdrüssig waren, wurde er aus seiner Heimat in der Westsahara vertrieben und gezwungen, weiter südlich, in der französischen Kolonie Mauretanien, Zuflucht zu suchen. Er gründete eine neue Zawiya und setzte seine islamischen Studien fort – wobei er sich exotischen, fast esoterischen Schriften zuwandte –, während er dem Zorn der Franzosen aus dem Weg ging.\n\nDie Spanier hatten seine Heimat erobert und ihn hinausgeworfen. Marokko, dieses schreckliche Land, hatte ihn zugunsten der Deutschen im Stich gelassen. Und die Franzosen, ob gottlos oder nicht, hatten diesen Ruin eingeleitet.\n\nDas ist nun vorbei.\n\nMit dem Zusammenbruch der französischen Herrschaft und der Kolonie Mauretanien wird Imam Mrabih Rabou dieses Land – \"Bilad Chinqit\", das Land von Chinguetti – als sein wahrer Beschützer regieren.§!"

